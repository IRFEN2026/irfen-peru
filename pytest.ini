[pytest]
# Pins test discovery explicitly rather than relying on pytest's defaults
# (which already happen to match, but future pytest versions are not
# obligated to keep matching). This repository's mandatory CI gate
# (.github/workflows/pr-validation.yml) and its deploy pipeline
# (.github/workflows/update-and-deploy.yml) both run `pytest tests/ -v` as
# the authoritative test runner -- see scripts/verify_phase2_test_collection.py
# for why `python -m unittest discover` alone was insufficient (it silently
# skips any tests/test_*.py file that isn't built from unittest.TestCase
# subclasses).
testpaths = tests
python_files = test_*.py
