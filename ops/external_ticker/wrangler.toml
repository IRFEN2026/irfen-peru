# IRFEN v0.9 external ticker (Cloudflare Workers Cron Trigger). See ops/external_ticker/README.md.
name = "irfen-v09-external-ticker"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["*/10 * * * *"]

[vars]
REPO = "IRFEN2026/irfen-peru"
WORKFLOW = "v08-scheduler-fallback.yml"
ENABLED = "false"  # stays "false" in the repo; the authorised 24 h trial uses `wrangler deploy --var ENABLED:true` (README §3)

[observability]
enabled = true
