name: IRFEN - Phase2 collector coupling

on:
  pull_request:
    paths:
      - config/phase2_collector_coupling_architecture_v0_1.json
      - config/phase2_local_activation_hierarchy_v0_1.json
      - config/phase2_rimac_static_coupling_extension_v0_1.json
      - site/data/phase2/spatial_observation_contracts_v0_1.json
      - site/data/phase2/sources/rimac_mml_2013_static_coupling_v0_1.json
      - site/data/phase2/geometries/rimac_static_coupling_nodes_v0_1.geojson
      - site/data/validation/phase2_collector_coupling/**
      - site/data/validation/phase2_zone_contracts/lima_este_santa_eulalia_rimac.json
      - scripts/validate_phase2_collector_coupling.py
      - scripts/validate_phase2_rimac_static_coupling.py
      - scripts/build_map_layer_catalog.py
      - scripts/build_map_layer_catalog_core.py
      - tests/test_phase2_collector_coupling.py
      - tests/test_phase2_rimac_static_coupling.py
      - .github/workflows/phase2-collector-coupling.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-collector-coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate fail-closed collector coupling architecture
        run: |
          mkdir -p artifacts
          python scripts/validate_phase2_collector_coupling.py \
            --output artifacts/phase2_collector_coupling_validation.json
      - name: Validate bounded Rímac static coupling extension
        run: |
          python scripts/validate_phase2_rimac_static_coupling.py \
            --output artifacts/phase2_rimac_static_coupling_validation.json
      - name: Run collector coupling guard tests
        run: |
          python -m unittest discover -s tests -p 'test_phase2_collector_coupling.py' -v
          python -m unittest discover -s tests -p 'test_phase2_rimac_static_coupling.py' -v
      - name: Build research map catalog and verify separate static node layer
        run: |
          python scripts/build_map_layer_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site/data/map_layers.json').read_text(encoding='utf-8'))
          layers={x['layer_id']:x for x in data.get('research_component_layers') or []}
          layer=layers['rimac_static_coupling_nodes_v0_1']
          assert layer['deployment_status']=='RESEARCH_ONLY'
          assert layer['production_use'] is False
          assert layer['production_ready'] is False
          assert layer['operational_alerting_enabled'] is False
          assert layer['activation_gate']=='BLOCKED'
          assert layer['map_eligible'] is True
          assert layer['default_visibility'] is False
          assert layer['carries_risk_classification'] is False
          assert layer['carries_alert_values'] is False
          assert layer['style']['color']=='#64748b'
          assert layer['source_metadata']['geometry_types']==['Point']
          PY
      - name: Sync generated map catalog to this bounded PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/phase2-rimac-static-coupling-20260923'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/site/data/map_layers.json"
          current_sha=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}?ref=${HEAD_BRANCH}" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          export MAP_CONTENT="$(base64 -w0 site/data/map_layers.json)"
          export MAP_SHA="${current_sha}"
          python - <<'PY' > /tmp/map-payload.json
          import json, os
          print(json.dumps({
              "message": "Regenerate map layer catalog for Rímac coupling nodes",
              "content": os.environ["MAP_CONTENT"],
              "sha": os.environ["MAP_SHA"],
              "branch": os.environ["HEAD_BRANCH"],
          }))
          PY
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/map-payload.json \
            "${api}" >/tmp/map-sync-response.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/map-sync-response.json',encoding='utf-8'))
          assert d.get('commit',{}).get('sha')
          print('MAP_CATALOG_SYNCED', d['commit']['sha'])
          PY
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-collector-coupling-validation
          path: |
            artifacts/phase2_collector_coupling_validation.json
            artifacts/phase2_rimac_static_coupling_validation.json
            site/data/map_layers.json
          if-no-files-found: warn
