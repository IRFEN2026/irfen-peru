# TEMPORARY (PR #362). Regenerates config/phase2_test_collection_manifest.json on
# the pinned interpreter with the project's own generator and publishes it as an
# artifact. Removed in the next commit of the same branch; never meant for main.
name: TMP PR362 - regenerar manifest de colección pytest

on:
  push:
    branches:
      - inventory/national-completeness-audit-v0-1
    paths:
      - .github/workflows/tmp-pr362-regenerate-test-collection-manifest.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: "pip"
      - name: Instalar dependencias fijadas
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci-test.txt
      - name: Regenerar manifest con el generador del proyecto
        run: |
          python --version
          python -m pytest --version
          python scripts/verify_phase2_test_collection.py --write-manifest
          python scripts/verify_phase2_test_collection.py
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          p = Path("config/phase2_test_collection_manifest.json")
          new = json.loads(p.read_text(encoding="utf-8"))
          base = json.loads(subprocess.run(["git", "show", "HEAD:" + str(p)], capture_output=True, text=True, check=True).stdout)
          meta = {k: v for k, v in new.items() if not isinstance(v, (list, dict))}
          meta["sha256"] = hashlib.sha256(p.read_bytes()).hexdigest()
          meta["added"] = sorted(set(new["all_node_ids"]) - set(base["all_node_ids"]))
          meta["removed"] = sorted(set(base["all_node_ids"]) - set(new["all_node_ids"]))
          meta["modules"] = len(new["phase2_test_modules"])
          print("::notice title=MANIFEST_META::" + json.dumps(meta, ensure_ascii=False).replace("%", "%25"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-test-collection-manifest
          path: config/phase2_test_collection_manifest.json
          if-no-files-found: error
