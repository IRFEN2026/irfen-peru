name: IRFEN research - Hybrid feasibility historical audit (TEST_ONLY)

# Research-only workflow in a non-default branch. Does not schedule jobs,
# alter data or deploy any site. Existing engines remain untouched.
on:
  push:
    branches:
      - research/v09-hybrid-feasibility-20261015
    paths:
      - scripts/v09_hybrid_feasibility_audit.py
      - .github/workflows/v09-hybrid-feasibility-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated research branch (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Self-test matched comparison
        run: python3 scripts/v09_hybrid_feasibility_audit.py --self-test
      - name: Fetch historical validation (read only)
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)" fetch --no-tags --depth=1 origin "refs/heads/v09/forecast-data:refs/remotes/origin/v09/forecast-data"
          echo "Validation source: $(git rev-parse refs/remotes/origin/v09/forecast-data)"
          git show refs/remotes/origin/v09/forecast-data:data/v09/model/modelo_propio_validacion_v0_1.json > "$RUNNER_TEMP/v09_validation.json"
      - name: Produce comparative report (not independent re-validation)
        run: |
          python3 scripts/v09_hybrid_feasibility_audit.py "$RUNNER_TEMP/v09_validation.json" | tee "$RUNNER_TEMP/v09_historical_audit.md"
          cat "$RUNNER_TEMP/v09_historical_audit.md" >> "$GITHUB_STEP_SUMMARY"
