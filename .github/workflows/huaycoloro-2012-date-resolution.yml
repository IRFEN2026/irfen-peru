name: IRFEN - Resolver fecha Huaycoloro 2012

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/resolve_huaycoloro_2012_date.py
      - .github/workflows/huaycoloro-2012-date-resolution.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python scripts/resolve_huaycoloro_2012_date.py
      - run: |
          test -s site/data/calibration/huaycoloro_2012_date_resolution.json
          python -m json.tool site/data/calibration/huaycoloro_2012_date_resolution.json >/dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/calibration/huaycoloro_2012_date_resolution.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: update Huaycoloro 2012 date resolution"
          git pull --rebase origin main
          git push
