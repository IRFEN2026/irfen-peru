name: IBVF - PRIMARY6 Sentinel-1 R1 pilot

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'site/data/validation/ibvf_primary6_sentinel1_r2_projection_amendment_v01.json'
      - 'scripts/ibvf_primary6_sentinel1_freeze_selected.py'
      - '.github/workflows/ibvf-primary6-sentinel1-r1-pilot.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-sentinel1-r1-pilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  huaycoloro-earliest-compatible:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install R1 dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2'
      - name: Compile pilot and existing frozen R1 implementation
        run: |
          python -m py_compile scripts/ibvf_primary6_sentinel1_freeze_selected.py scripts/ibvf_sentinel1_r1_radiometric.py
      - name: Freeze earliest already-selected compatible Huaycoloro pair
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_sentinel1_freeze_selected.py \
            --catalog site/data/validation/ibvf_primary6_selected_a1_catalog.json \
            --a4-contract site/data/validation/ibvf_primary6_sentinel1_a4_contract_v01.json \
            --unit huaycoloro \
            --output artifacts/ibvf/ibvf_primary6_huaycoloro_s1_pilot_freeze_v01.json
      - name: Execute unchanged R1 radiometric processor
        run: |
          python scripts/ibvf_sentinel1_r1_radiometric.py \
            --freeze artifacts/ibvf/ibvf_primary6_huaycoloro_s1_pilot_freeze_v01.json \
            --basin site/data/watersheds/huaycoloro_watershed.geojson \
            --output artifacts/ibvf/ibvf_primary6_huaycoloro_s1_r1_pilot_v01.json
      - name: Fail-closed blind guards
        run: |
          python - <<'PY'
          import json
          f=json.load(open('artifacts/ibvf/ibvf_primary6_huaycoloro_s1_pilot_freeze_v01.json',encoding='utf-8'))
          r=json.load(open('artifacts/ibvf/ibvf_primary6_huaycoloro_s1_r1_pilot_v01.json',encoding='utf-8'))
          for d in (f,r):
            assert d['deployment_status']=='RESEARCH_ONLY'
            assert d['test_only'] is True
            assert d['production_use'] is False and d['production_ready'] is False
            assert d['operational_alerting_enabled'] is False
            assert d['uses_operational_event_none_labels'] is False
            assert d['territorial_activation_evidence_blinded'] is True
          assert f['freeze_status']=='ALL_REQUESTED_ASSETS_SHA256_FROZEN'
          assert f['engineering_pilot_only'] is True
          assert f['engineering_pilot_selection_changes_scientific_window_set'] is False
          assert f['rainfall_values_read_for_pilot_selection'] is False
          assert f['sar_change_values_read_for_pilot_selection'] is False
          assert f['territorial_outcomes_read'] is False
          assert f['known_event_dates_read'] is False
          assert f['case_control_role_assigned'] is False
          assert r['r1_status']=='COMPLETE_BOTH_DATES_NO_COMPARISON'
          assert r['comparison_performed'] is False
          assert r['terrain_correction_performed'] is False
          assert r['common_support_established'] is False
          assert r['interpretation_forbidden'] is True
          print({'freeze_status':f['freeze_status'],'case_id':f['case_id'],'r1_status':r['r1_status']})
          PY
      - name: Freeze small pilot evidence and update scientific map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/ibvf_primary6_huaycoloro_s1_pilot_freeze_v01.json site/data/validation/ibvf_primary6_huaycoloro_s1_pilot_freeze_v01.json
          cp artifacts/ibvf/ibvf_primary6_huaycoloro_s1_r1_pilot_v01.json site/data/validation/ibvf_primary6_huaycoloro_s1_r1_pilot_v01.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          f=json.load(open('site/data/validation/ibvf_primary6_huaycoloro_s1_pilot_freeze_v01.json',encoding='utf-8'))
          r=json.load(open('site/data/validation/ibvf_primary6_huaycoloro_s1_r1_pilot_v01.json',encoding='utf-8'))
          p=Path('site/data/validation/independent_basin_validation_map.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          d['version']='irfen-independent-basin-validation-map-v3.8'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{})
          ac['primary6_sentinel1_r2_projection_amendment']='site/data/validation/ibvf_primary6_sentinel1_r2_projection_amendment_v01.json'
          ac['primary6_huaycoloro_s1_engineering_pilot_case_id']=f['case_id']
          ac['primary6_huaycoloro_s1_engineering_pilot_freeze_status']=f['freeze_status']
          ac['primary6_huaycoloro_s1_r1_pilot_status']=r['r1_status']
          ac['primary6_sentinel1_bulk_r2_r4_executed']=False
          for c in d.get('cases',[]):
            if c.get('unit_id')=='huaycoloro':
              c['remote_sensing_status']='S1_PRIMARY6_ENGINEERING_PILOT_R1_PASS_R2_R4_BULK_PENDING_NO_OUTCOME'
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add \
            site/data/validation/ibvf_primary6_huaycoloro_s1_pilot_freeze_v01.json \
            site/data/validation/ibvf_primary6_huaycoloro_s1_r1_pilot_v01.json \
            site/data/validation/independent_basin_validation_map.json
          if git diff --cached --quiet; then
            echo 'No scientific freeze change.'
          else
            git commit -m 'IBVF: freeze PRIMARY6 Huaycoloro Sentinel-1 R1 pilot'
            git push origin HEAD:agent/independent-basin-validation-map
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-s1-r1-pilot-${{ github.sha }}
          path: artifacts/ibvf/*
          if-no-files-found: warn
          retention-days: 30
