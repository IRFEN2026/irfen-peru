name: IRFEN - Chosica 2015 Landsat 7 multiscene QA

on:
  pull_request:
    paths:
      - config/chosica_2015_landsat7_multiscene_asset_inventory_freeze_record_v0_1.json
      - config/chosica_2015_landsat7_multiscene_qa_contract_v0_1.json
      - scripts/evaluate_chosica_2015_landsat7_multiscene_qa.py
      - .github/workflows/chosica-2015-landsat7-multiscene-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  all-scene-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_landsat7_multiscene_qa_contract_v0_1.json
            scripts/evaluate_chosica_2015_landsat7_multiscene_qa.py
            .github/workflows/chosica-2015-landsat7-multiscene-qa.yml
      - name: Assert forbidden paths absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09_b.json
      - name: Download exact frozen clean-room inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources/inventory sources/geometry artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10180569647/zip" > /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d sources/inventory
          test "$(sha256sum sources/inventory/chosica_2015_landsat7_multiscene_asset_inventory_v0_1.json | cut -d' ' -f1)" = "b0e96d0d4267de03771975edeeb56dee0e9ead4e6e25e60180734e6c693d465e"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10171108859/zip" > /tmp/geometry.zip
          unzip -q /tmp/geometry.zip -d sources/geometry
          test "$(sha256sum sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson | cut -d' ' -f1)" = "9a23644c191c88fb66722b368773251051b4098ddd74e4d5861c3a37dbfbb1ca"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2' 'planetary-computer>=1,<2'
      - name: Execute all-scene QA only
        run: |
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/evaluate_chosica_2015_landsat7_multiscene_qa.py \
            --contract config/chosica_2015_landsat7_multiscene_qa_contract_v0_1.json \
            --inventory sources/inventory/chosica_2015_landsat7_multiscene_asset_inventory_v0_1.json \
            --geometry sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson \
            --output artifacts/chosica_2015_landsat7_multiscene_qa_v0_1.json
      - name: Enforce clean-room QA-only guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_landsat7_multiscene_qa_v0_1.json'))
          assert d['status']=='PASS_LANDSAT7_ALL_SCENE_REDUNDANT_QA'
          assert d['candidate_count']==7 and d['usable_candidate_count']>=1
          assert d['all_fixed_scenes_used'] is True
          for k in ('scene_dropping_performed','scene_replacement_performed','slc_off_gap_imputation_used','reflectance_asset_bytes_read','surface_signal_observed','outcome_labels_assigned','target_names_or_ids_read','target_outcomes_read','a6680_read','contaminated_adjudication_used','candidate_selection_modified','candidate_ranking_modified','free_web_search_used','sealed_target_unblind_allowed'):
              assert d[k] is False, k
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chosica-2015-landsat7-multiscene-qa
          path: artifacts/chosica_2015_landsat7_multiscene_qa_v0_1.json
          if-no-files-found: warn
