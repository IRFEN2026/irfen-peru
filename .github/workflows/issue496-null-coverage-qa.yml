name: issue496-null-coverage-offline-qa
on:
  push:
    branches:
      - 'research/issue496-null-coverage-audit-*'
  pull_request:
    paths:
      - 'scripts/issue496_null_coverage_audit.py'
      - 'tests/test_issue496_null_coverage_audit.py'
      - '.github/workflows/issue496-null-coverage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unittest (no external data)
        run: python -m unittest discover -s tests -p 'test_issue496_null_coverage_audit.py' -v
