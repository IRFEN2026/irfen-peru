name: IRFEN - Phase2 local activation hierarchy

on:
  pull_request:
    paths:
      - config/phase2_local_activation_hierarchy_v0_1.json
      - config/phase2_candidate_inventory_v0_2.json
      - config/phase2_north_coast_discovery_inventory_v0_1.json
      - site/data/validation/phase2_zone_contracts/**
      - site/data/validation/phase2_discovery_contracts/**
      - site/data/phase2/geometries/**
      - scripts/validate_phase2_local_activation_hierarchy.py
      - tests/test_phase2_local_activation_hierarchy.py
      - .github/workflows/phase2-local-activation-hierarchy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-unit-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate universal fail-closed hierarchy
        run: python scripts/validate_phase2_local_activation_hierarchy.py
      - name: Run hierarchy guard tests
        run: python -m pytest -q tests/test_phase2_local_activation_hierarchy.py
