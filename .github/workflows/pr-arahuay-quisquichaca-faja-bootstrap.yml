name: PR Arahuay Quisquichaca faja context bootstrap

on:
  pull_request:
    paths:
      - .github/workflows/pr-arahuay-quisquichaca-faja-bootstrap.yml
      - scripts/build_arahuay_quisquichaca_faja_context.py
      - tests/test_phase2_arahuay_quisquichaca_faja_context.py
      - site/data/phase2/sources/arahuay_quisquichaca_faja_context/**
      - site/data/validation/phase2_zone_contracts/lima_norte_arahuay_chillon.json

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Synchronize current main before shared Phase-2 regeneration
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install scientific dependencies
        run: pip install -r requirements.txt
      - name: Generate deterministic Quisquichaca faja context geometry
        run: python scripts/build_arahuay_quisquichaca_faja_context.py
      - name: Normalize inventory and fail-closed spatial expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cid='lima_norte_arahuay_chillon'
          for raw in ('config/phase2_candidate_inventory_v0_1.json','config/phase2_candidate_inventory_v0_2.json'):
              p=Path(raw); d=json.loads(p.read_text(encoding='utf-8'))
              row=next(x for x in d['candidates'] if x['candidate_id']==cid)
              row['official_evidence_stage']='official_quisquichaca_faja_margin_geometry_normalized_research_context'
              canonical=['ANA-RD-0709-2025-AAACF','ANA-IT-024-2024-P_ALACHRL_39-JEAC']
              sources=list(row.get('official_sources') or [])
              sources=[x for x in sources if x!='ANA-RD-0709-2025-AAACO']
              for source in canonical:
                  if source not in sources: sources.append(source)
              row['official_sources']=sources
              row['unresolved_gates']=[
                  'derive Quisquichaca catchment and resolve other Arahuay ravines/Chillon reaches independently; faja margins are non-catchment context only' if x=='normalize official geometry' else x
                  for x in row['unresolved_gates']
              ]
              p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          p=Path('scripts/validate_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('HUERTA_ID = "lima_norte_huerta_vieja"\nLAMBAYEQUE_PARENT_ID', 'HUERTA_ID = "lima_norte_huerta_vieja"\nARAHUAY_ID = "lima_norte_arahuay_chillon"\nLAMBAYEQUE_PARENT_ID')
          s=s.replace('{SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID, ASIA_ID, HUERTA_ID}', '{SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID, ASIA_ID, HUERTA_ID, ARAHUAY_ID}')
          s=s.replace('for cid in (SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID, ASIA_ID, HUERTA_ID):', 'for cid in (SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID, ASIA_ID, HUERTA_ID, ARAHUAY_ID):')
          s=s.replace('HUERTA_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        LAMBAYEQUE_PARENT_ID', 'HUERTA_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        ARAHUAY_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        LAMBAYEQUE_PARENT_ID')
          s=s.replace('"non_catchment_geometry_only_count": 6,\n        "blocked_missing_geometry_count": 10,', '"non_catchment_geometry_only_count": 7,\n        "blocked_missing_geometry_count": 9,')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('self.assertEqual(summary["non_catchment_geometry_only_count"], 6)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 10)', 'self.assertEqual(summary["non_catchment_geometry_only_count"], 7)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 9)')
          marker='    def test_huerta_vieja_faja_is_non_catchment_context_only(self):\n'
          extra='''    def test_arahuay_quisquichaca_faja_is_non_catchment_context_only(self):\n        row = self.by_id["lima_norte_arahuay_chillon"]\n        self.assertEqual(row["geometry_asset_status"], "PARTIAL")\n        self.assertEqual(row["geometry_data_presence"], "PRESENT")\n        self.assertEqual(row["spatial_contract_status"], "NON_CATCHMENT_GEOMETRY_ONLY")\n        self.assertFalse(row["candidate_wide_sampling_ready"])\n        self.assertEqual(row["subunit_contracts"], [])\n\n'''
          if extra not in s:
              if marker not in s: raise SystemExit('spatial-test insertion point not found')
              s=s.replace(marker,extra+marker,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_map_layer_catalog.py')
          s=p.read_text(encoding='utf-8')
          needle='            "lima_norte_huerta_vieja",\n        }'
          replacement='            "lima_norte_huerta_vieja",\n            "lima_norte_arahuay_chillon",\n        }'
          if needle not in s: raise SystemExit('map eligible insertion point not found')
          s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate deterministic Phase-2 and map artifacts
        run: |
          python scripts/build_phase2_catalog.py
          python scripts/build_phase2_climate_matrix.py
          python scripts/build_phase2_spatial_observation_contracts.py
          python scripts/build_map_layer_catalog.py
      - name: Validate Quisquichaca and affected scientific contracts
        run: |
          python scripts/build_arahuay_quisquichaca_faja_context.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python scripts/validate_phase2_spatial_observation_contracts.py
          python -m unittest \
            tests.test_phase2_arahuay_quisquichaca_faja_context \
            tests.test_phase2_spatial_observation_contracts \
            tests.test_phase2_climate_matrix \
            tests.test_map_layer_catalog -v
      - name: Persist only validated Arahuay research artifacts
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            scripts/build_arahuay_quisquichaca_faja_context.py \
            scripts/validate_phase2_spatial_observation_contracts.py \
            tests/test_phase2_arahuay_quisquichaca_faja_context.py \
            tests/test_phase2_spatial_observation_contracts.py \
            tests/test_map_layer_catalog.py \
            config/phase2_candidate_inventory_v0_1.json \
            config/phase2_candidate_inventory_v0_2.json \
            site/data/phase2/sources/arahuay_quisquichaca_faja_context \
            site/data/phase2/geometries/lima_norte_arahuay_quisquichaca_faja_context.geojson \
            site/data/phase2/geometries/lima_norte_arahuay_quisquichaca_geometry_validation.json \
            site/data/validation/phase2_zone_contracts/lima_norte_arahuay_chillon.json \
            site/data/phase2/catalog.json \
            site/data/phase2/climate_conditioned_activation_matrix_v0_1.json \
            site/data/phase2/spatial_observation_contracts_v0_1.json \
            site/data/map_layers.json
          if git diff --cached --quiet; then
            echo "No validated Arahuay artifacts to persist."
          else
            git commit -m "Freeze official Quisquichaca faja context geometry"
          fi
          git push origin "HEAD:${BRANCH}"
