name: IRFEN - Pronóstico experimental NASA GEOS v0.8

on:
  workflow_dispatch:
  schedule:
    - cron: "32 18 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/fetch_geos_forecast.py
      - scripts/archive_geos_forecast.py
      - .github/workflows/geos-forecast.yml
      - site/data/watersheds/san_ildefonso_watershed.geojson
      - site/data/watersheds/huaycoloro_watershed.geojson
      - config/zones.json

permissions:
  contents: write
  actions: write

concurrency:
  group: geos-forecast-v08
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install xarray zarr s3fs fsspec numpy shapely

      - name: Calcular pronóstico experimental
        run: python scripts/fetch_geos_forecast.py

      - name: Archivar snapshot para validación futura
        run: python scripts/archive_geos_forecast.py

      - name: Validar reporte
        run: |
          test -s site/data/forecast/latest.json
          test -s site/data/forecast/archive.json
          python -m json.tool site/data/forecast/latest.json >/dev/null
          python -m json.tool site/data/forecast/archive.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('site/data/forecast/latest.json',encoding='utf-8'))
          a=json.load(open('site/data/forecast/archive.json',encoding='utf-8'))
          assert d.get('production_use') is False
          assert a.get('production_use') is False
          assert d.get('status') == 'experimental_forecast_available'
          assert len(d.get('zones',[])) >= 2
          assert len(a.get('snapshots',[])) >= 1
          print([(z['zone_id'],z['forecast24_mm'],z['forecast72_mm']) for z in d['zones']])
          print('snapshots:',len(a['snapshots']))
          PY

      - name: Guardar pronóstico experimental
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/forecast/latest.json site/data/forecast/archive.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "IRFEN v0.8: actualizar y archivar pronóstico NASA GEOS"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Ordenar publicación del pronóstico actualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          EXPECTED_SHA="$(git rev-parse origin/main)"
          gh workflow run publish-committed-data.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$EXPECTED_SHA"
