name: IRFEN - Preflight puerta pytest (temporal)
# TEMPORAL: la integración no puede abrir PRs; ejecuta por push lo mismo que
# pr-validation hace para la colección/ejecución pytest. Se retira después.
on:
  push:
    branches: [ci/pytest-collection-gate-v0-4]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-ci-test.txt
      - name: Verificar colección contra manifest
        run: |
          python scripts/verify_phase2_test_collection.py | tee /tmp/v.txt
          echo "::notice title=gate verify::$(tail -2 /tmp/v.txt | tr '\n' ' ')"
      - name: Ejecutar pytest completo
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q -rfE -p no:cacheprovider > /tmp/p.txt 2>&1; rc=$?
          echo "::notice title=pytest summary rc=$rc::$(tail -1 /tmp/p.txt)"
          grep -E '^(FAILED|ERROR) ' /tmp/p.txt | head -10 | while read -r l; do echo "::warning title=pytest failure::${l:0:300}"; done
          exit $rc
