name: IBVF - Cashahuacra ANA two-point snap

on:
  pull_request:
    paths:
      - 'scripts/ibvf_cashahuacra_dem_snap.py'
      - 'scripts/ibvf_cashahuacra_two_point_snap.py'
      - 'scripts/ibvf_cashahuacra_two_point_sensitivity.py'
      - '.github/workflows/ibvf-cashahuacra-two-point-snap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-point-snap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hydrologic dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'rasterio>=1.3,<2' 'requests>=2.31,<3' 'pysheds>=0.4,<0.5' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Compile contract
        run: python -m py_compile scripts/ibvf_cashahuacra_dem_snap.py scripts/ibvf_cashahuacra_two_point_snap.py scripts/ibvf_cashahuacra_two_point_sensitivity.py
      - name: Run predeclared ANA two-point snap
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_cashahuacra_two_point_snap.py \
            --output artifacts/ibvf/cashahuacra_two_point_snap.json \
            --basin-output artifacts/ibvf/cashahuacra_two_point_basin.geojson
      - name: Run positional and conditioning sensitivity
        run: |
          python scripts/ibvf_cashahuacra_two_point_sensitivity.py \
            --output artifacts/ibvf/cashahuacra_two_point_sensitivity.json
      - name: Scientific guardrails
        run: |
          python - <<'PY'
          import json
          snap=json.load(open('artifacts/ibvf/cashahuacra_two_point_snap.json',encoding='utf-8'))
          sens=json.load(open('artifacts/ibvf/cashahuacra_two_point_sensitivity.json',encoding='utf-8'))
          for d in (snap,sens):
              assert d['deployment_status']=='RESEARCH_ONLY'
              assert d['test_only'] is True
              assert d['production_use'] is False
              assert d['production_ready'] is False
              assert d['operational_alerting_enabled'] is False
              assert d['uses_operational_event_none_labels'] is False
              assert d['territorial_activation_evidence_blinded'] is True
              assert d['contract']['target_basin_area_used'] is False
              assert d['contract']['published_basin_length_used'] is False
              assert d['contract']['territorial_activation_evidence_used'] is False
              assert d['contract']['operational_threshold_used'] is False
          assert sens['contract']['event_none_label_used'] is False
          print({'snap_status': snap.get('snap_status'), 'morphometry_status': snap.get('morphometry_status'), 'sensitivity_status': sens.get('sensitivity_status')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-cashahuacra-two-point-${{ github.sha }}
          path: |
            artifacts/ibvf/cashahuacra_two_point_snap.json
            artifacts/ibvf/cashahuacra_two_point_basin.geojson
            artifacts/ibvf/cashahuacra_two_point_sensitivity.json
          if-no-files-found: warn
          retention-days: 30
