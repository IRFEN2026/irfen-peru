name: IRFEN - Respaldo controlado del planificador (v0.8 + v0.9)

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  actions: write

concurrency:
  group: v08-scheduler-fallback
  cancel-in-progress: false

jobs:
  dispatch-stale-collectors:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.actor == 'IRFEN2026' &&
          github.event.issue.title == '[automation] IRFEN v0.8 evidence sweep' &&
          startsWith(github.event.issue.body, 'IRFEN_V08_EVIDENCE_SWEEP')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verificar guardas científicas antes del respaldo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("config/v08_closeout_contract.json").read_text())
          assert contract.get("production_use") is False
          assert contract.get("pilot_zone_ids") == ["san_ildefonso", "chosica", "catacaos"]
          rules = contract.get("safety_rules") or []
          assert "all v0.8 recommendations remain TEST_ONLY" in rules
          assert "phase-2 candidates remain RESEARCH_ONLY until their validation contracts close" in rules
          PY

      - name: Verificar guardas v0.9 antes del respaldo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("config/v09_senamhi_avisos_contract_v0_1.json").read_text())
          for key, value in {"production_use": False, "production_ready": False, "operational_alerting_enabled": False,
                             "activation_gate": "BLOCKED", "decision_thresholds": None, "test_mode": "TEST_ONLY"}.items():
              assert contract.get(key) == value, key
          PY

      - name: Comprobar la inactividad de cada workflow y despachar solo los vencidos
        # Cada workflow se evalúa por separado: que otro se haya ejecutado hace poco no detiene este.
        # No se despacha si el workflow no existe en main, si tiene una ejecución en curso o en cola,
        # o si su última ejecución en main está dentro de su enfriamiento (scripts/scheduler_fallback.py).
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/scheduler_fallback.py
