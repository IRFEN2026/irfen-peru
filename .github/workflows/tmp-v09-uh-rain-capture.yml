name: TMP research IMERG Early per ANA hydrographic unit (uh_rain_context; removed after capture)
on:
  push:
    branches: [research/v09-uh-rain-context-20261031]
    paths: [.github/workflows/tmp-v09-uh-rain-capture.yml, scripts/v09_uh_rain_capture.py]
permissions:
  contents: write
concurrency: {group: tmp-v09-uh-rain, cancel-in-progress: false}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - name: Snapshot of the operational avisos registry and IMERG north archive from main (read only)
        run: |
          git fetch -q origin main
          d=data/v09/research/uh_rain
          git show origin/main:data/v09/senamhi_avisos/registry_v0_1.json > $d/avisos_registry_main_snapshot.json
          git show origin/main:data/v09/rain/imerg_early_north_v0_1.json > $d/imerg_north_archive_main_snapshot.json
          printf '{"main_commit":"%s","files":["avisos_registry_main_snapshot.json","imerg_north_archive_main_snapshot.json"]}\n' "$(git rev-parse origin/main)" > $d/main_snapshot_origin.json
      - name: IMERG Early per unit, last 120 h (bounded; missing granules are recorded, never zero)
        timeout-minutes: 42
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python scripts/v09_uh_rain_capture.py --hours 120 --budget-s 2100
      - name: Build uh_rain_context and the experimental view (offline)
        if: always()
        continue-on-error: true
        run: python scripts/v09_build_uh_rain_context.py
      - name: Commit whatever was produced
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/research/uh_rain data/v09/research/uh_rain_context_v0_1.json research/v09 || true
          git diff --cached --quiet && { echo "::warning::nothing produced"; exit 0; }
          git commit -q -m "Research snapshot: IMERG Early per ANA hydrographic unit (Piura, Tumbes) and uh_rain_context"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
