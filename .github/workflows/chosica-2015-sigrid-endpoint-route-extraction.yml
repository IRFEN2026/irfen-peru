name: IRFEN - Chosica 2015 SIGRID endpoint route extraction

on:
  pull_request:
    paths:
      - config/chosica_2015_sigrid_static_script_read_manifest_v0_1.json
      - scripts/extract_chosica_2015_sigrid_endpoint_routes.py
      - .github/workflows/chosica-2015-sigrid-endpoint-route-extraction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-routes-without-following:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_sigrid_static_script_read_manifest_v0_1.json
            scripts/extract_chosica_2015_sigrid_endpoint_routes.py
            .github/workflows/chosica-2015-sigrid-endpoint-route-extraction.yml
      - name: Assert forbidden files absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
      - name: Read only frozen application script and extract route-like strings
        run: |
          set -euo pipefail
          mkdir -p artifacts
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/extract_chosica_2015_sigrid_endpoint_routes.py \
            --manifest config/chosica_2015_sigrid_static_script_read_manifest_v0_1.json \
            --output artifacts/chosica_2015_sigrid_endpoint_routes_v0_1.json | tee artifacts/sigrid_route_extraction_summary.json
      - name: Enforce no route following and no evidence read
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/chosica_2015_sigrid_endpoint_routes_v0_1.json');d=json.loads(p.read_text(encoding='utf-8'))
          g={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          assert d['status']=='PASS_FROZEN_SCRIPT_ENDPOINT_ROUTE_EXTRACTION' and d['guards']==g
          assert d['raw_script_bytes_written'] is False and d['raw_script_bytes_logged'] is False
          assert d['discovered_routes_followed'] is False
          assert d['candidate_territorial_evidence_read'] is False and d['control_labels_assigned'] is False
          assert d['sealed_target_unblind_allowed'] is False
          assert len(d['scripts'])==1
          for x in d['scripts'][0]['endpoint_like_routes']:
              assert x.startswith('https://sigrid.cenepred.gob.pe/')
          text=p.read_text(encoding='utf-8').lower()
          for token in ('pedregal','quirio','carossio','carosio','rayos de sol','cashahuacra','la libertad','a6680','official_outcome_evidence'):
              assert token not in text, token
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-sigrid-endpoint-routes
          path: |
            artifacts/chosica_2015_sigrid_endpoint_routes_v0_1.json
            artifacts/sigrid_route_extraction_summary.json
          if-no-files-found: error
