name: IRFEN - Chosica 2015 SIGRID infrastructure HTML schema

on:
  pull_request:
    paths:
      - config/chosica_2015_sigrid_infrastructure_endpoint_manifest_v0_1.json
      - scripts/inspect_chosica_2015_sigrid_infrastructure_html.py
      - .github/workflows/chosica-2015-sigrid-infrastructure-html-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-structure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_sigrid_infrastructure_endpoint_manifest_v0_1.json
            scripts/inspect_chosica_2015_sigrid_infrastructure_html.py
            .github/workflows/chosica-2015-sigrid-infrastructure-html-schema.yml
      - name: Assert forbidden scientific files absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
      - name: Inspect frozen generic endpoints without retaining text
        run: |
          set -euo pipefail
          mkdir -p artifacts
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/inspect_chosica_2015_sigrid_infrastructure_html.py \
            --manifest config/chosica_2015_sigrid_infrastructure_endpoint_manifest_v0_1.json \
            --output artifacts/chosica_2015_sigrid_infrastructure_html_schema_v0_1.json | tee artifacts/sigrid_infrastructure_schema_summary.json
      - name: Enforce no evidence or linked-content read
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/chosica_2015_sigrid_infrastructure_html_schema_v0_1.json');d=json.loads(p.read_text(encoding='utf-8'))
          g={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          assert d['status']=='PASS_SIGRID_INFRASTRUCTURE_HTML_SCHEMA' and d['guards']==g
          assert d['classification']=='INFRASTRUCTURE_ONLY_NOT_TERRITORIAL_EVIDENCE'
          assert d['text_nodes_retained'] is False and d['input_values_retained'] is False
          assert d['linked_content_followed'] is False and d['scripts_read'] is False
          assert d['candidate_territorial_evidence_read'] is False and d['control_labels_assigned'] is False
          assert d['sealed_target_unblind_allowed'] is False
          assert len(d['endpoints'])==2
          for e in d['endpoints']:
              assert e['url'] in ('https://sigrid.cenepred.gob.pe/sigridv3/documento/biblioteca','https://sigrid.cenepred.gob.pe/sigridv3/mapa')
              for f in e['forms']:
                  assert f['action'].startswith('https://sigrid.cenepred.gob.pe/')
              assert all(x.startswith('https://sigrid.cenepred.gob.pe/') for x in e['same_host_script_urls'])
          text=p.read_text(encoding='utf-8').lower()
          for token in ('pedregal','quirio','carossio','carosio','rayos de sol','cashahuacra','la libertad','a6680','official_outcome_evidence'):
              assert token not in text,token
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-sigrid-infrastructure-html-schema
          path: |
            artifacts/chosica_2015_sigrid_infrastructure_html_schema_v0_1.json
            artifacts/sigrid_infrastructure_schema_summary.json
          if-no-files-found: error
