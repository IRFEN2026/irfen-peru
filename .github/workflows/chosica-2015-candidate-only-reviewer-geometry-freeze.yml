name: IRFEN - Chosica 2015 candidate-only reviewer geometry freeze

on:
  pull_request:
    paths:
      - config/chosica_2015_candidate_only_reviewer_geometry_contract_v0_1.json
      - config/chosica_2015_candidate_only_reviewer_geometry_freeze_record_v0_1.json
      - config/chosica_2015_candidate_only_geometry_fingerprint_freeze_v0_1.json
      - site/data/validation/chosica_2015_candidate_only_reviewer_bundle_v0_2.json
      - scripts/build_chosica_2015_candidate_only_reviewer_geometry.py
      - .github/workflows/chosica-2015-candidate-only-reviewer-geometry-freeze.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/chosica-2015-candidate-only-reviewer-geometry-freeze.yml
            config/chosica_2015_candidate_only_reviewer_geometry_contract_v0_1.json
            config/chosica_2015_candidate_only_reviewer_geometry_freeze_record_v0_1.json
            config/chosica_2015_candidate_only_geometry_fingerprint_freeze_v0_1.json
            site/data/validation/chosica_2015_candidate_only_reviewer_bundle_v0_2.json
            scripts/build_chosica_2015_candidate_only_reviewer_geometry.py
      - name: Prove sealed and contaminated sources are absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09_b.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
      - name: Download exact preincident geometry artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source replay
          gh run download 34375704757 -n chosica-2015-negative-control-shortlist-geometry -D source
          test -f source/chosica_2015_negative_control_shortlist.geojson
      - name: Rebuild anonymized geometry in stripped environment
        run: |
          set -euo pipefail
          env -i PATH="$PATH" PYTHONHASHSEED=0 python scripts/build_chosica_2015_candidate_only_reviewer_geometry.py \
            --contract config/chosica_2015_candidate_only_reviewer_geometry_contract_v0_1.json \
            --fingerprints config/chosica_2015_candidate_only_geometry_fingerprint_freeze_v0_1.json \
            --bundle site/data/validation/chosica_2015_candidate_only_reviewer_bundle_v0_2.json \
            --source-geojson source/chosica_2015_negative_control_shortlist.geojson \
            --output-geojson replay/chosica_2015_candidate_only_reviewer_geometry_v0_1.geojson \
            --manifest replay/chosica_2015_candidate_only_reviewer_geometry_manifest_v0_1.json
      - name: Enforce exact frozen SHA-256 replay and scientific guards
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          fr=json.load(open('config/chosica_2015_candidate_only_reviewer_geometry_freeze_record_v0_1.json',encoding='utf-8'))
          guards={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          assert fr['status']=='CANDIDATE_ONLY_REVIEWER_GEOMETRY_FROZEN_BY_EXACT_HASH'
          assert fr['guards']==guards
          assert fr['candidate_replacement_allowed'] is False
          assert fr['selection_feedback_allowed'] is False
          assert fr['matching_recalculation_allowed'] is False
          assert fr['target_unblind_allowed'] is False
          root=pathlib.Path('replay')
          def sha(name): return hashlib.sha256((root/name).read_bytes()).hexdigest()
          g=fr['frozen_outputs']['reviewer_geometry']; m=fr['frozen_outputs']['manifest']
          assert sha(g['file_name'])==g['sha256']
          assert sha(m['file_name'])==m['sha256']
          man=json.load(open(root/m['file_name'],encoding='utf-8'))
          assert man['guards']==guards
          assert man['candidate_count']==7
          assert man['target_identifiers_included'] is False
          assert man['target_outcomes_accessed'] is False
          assert man['candidate_outcomes_accessed'] is False
          assert man['a6680_accessed'] is False
          assert man['post_anchor_predictors_accessed'] is False
          assert man['selection_feedback_used'] is False
          assert man['candidate_replacement_performed'] is False
          assert man['target_unblind_allowed'] is False
          print('PASS_CANDIDATE_ONLY_REVIEWER_GEOMETRY_EXACT_FREEZE_REPLAY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-candidate-only-reviewer-geometry-replay
          path: replay/*
          if-no-files-found: error
