name: IRFEN v0.9 - Motor de pronóstico costa norte (TEST_ONLY)

# Aislamiento (ver docs/V09_FORECAST_AUTOMATION.md):
# * corre SOLO desde la rama v09/forecast-engine (el job se niega con cualquier otra ref);
# * el código se descarga SIN credenciales de escritura (persist-credentials: false);
# * los resultados se escriben SOLO en la rama huérfana v09/forecast-data, montada en ./_data;
# * antes de guardar se comprueba que nada cambió fuera de data/v09/forecast y data/v09/obs_imerg;
# * no publica en Pages, no toca site/ ni main, no activa alertas (guardas RESEARCH_ONLY / TEST_ONLY).
# Lo lanza el disparador mínimo de main (v09-forecast-trigger.yml) o una persona con workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches:
      - v09/forecast-engine
    paths:
      - scripts/v09_ecmwf_ens_north.py
      - scripts/v09_imerg_late_province_daily.py
      - scripts/v09_fc_evaluate.py
      - scripts/v09_own_model.py
      - .github/workflows/v09-forecast-engine.yml

permissions:
  contents: write

concurrency:
  group: v09-forecast-engine
  cancel-in-progress: false

env:
  DATA_BRANCH: v09/forecast-data
  IRFEN_FC_DATA: ${{ github.workspace }}/_data

jobs:
  engine:
    if: github.ref == 'refs/heads/v09/forecast-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Engine code (read-only checkout)
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Results branch (the only place this job may write)
        uses: actions/checkout@v6
        with:
          ref: v09/forecast-data
          path: _data
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install bounded dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<2" "h5py>=3.10" "earthaccess>=0.15,<1" \
            "shapely>=2.0,<3" "requests>=2.31,<3" "eccodes>=2.38,<3" "ecmwf-opendata>=0.3,<1"
          python -m eccodes selfcheck
      - name: Observed rain - IMERG Late by province and rain-day (independent of every forecast)
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: timeout --signal=TERM --kill-after=10s 1200s python scripts/v09_imerg_late_province_daily.py
      - name: Forecast - ECMWF ENS province probabilities (failure archived as UNAVAILABLE, never zero rain)
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 1260s python scripts/v09_ecmwf_ens_north.py --workdir "$RUNNER_TEMP"
      - name: Forecast - own statistical model (shadow)
        continue-on-error: true
        run: |
          if [ -f scripts/v09_own_model.py ]; then
            timeout --signal=TERM --kill-after=10s 600s python scripts/v09_own_model.py predict
          else
            echo "own model not present yet"
          fi
      - name: Evaluation (Brier, BSS, decomposition, ROC, POD/FAR/CSI, reliability; 10/25/50 mm)
        if: always()
        run: python scripts/v09_fc_evaluate.py
      - name: Guard - only results paths changed in the results branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd _data
          bad=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v -E '^data/v09/(forecast|obs_imerg)/' || true)
          if [ -n "$bad" ]; then echo "::error::unexpected paths: $bad"; exit 1; fi
          test "$(git rev-parse --abbrev-ref HEAD)" = "$DATA_BRANCH"
      - name: Persist results (bot commit to the results branch only, bounded retries)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd _data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/v09/forecast data/v09/obs_imerg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "IRFEN v0.9: motor de pronóstico costa norte, resultados en sombra (TEST_ONLY)"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$DATA_BRANCH"
            if ! git rebase -q "origin/$DATA_BRANCH"; then git rebase --abort || true; echo "Real conflict; not overwriting" >&2; exit 1; fi
            if git push -q origin "HEAD:refs/heads/$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
