name: IRFEN - Phase2 Casma exact ANA child geometries

on:
  pull_request:
    paths:
      - site/data/validation/phase2_discovery_packages/ancash_casma_sechin_yautan.json
      - site/data/validation/phase2_discovery_contracts/ancash_casma_sechin_yautan.json
      - site/data/phase2/sources/north_coast_discovery_geometry/ana_ancash_casma_*.geojson
      - site/data/phase2/geometries/ancash_casma_*.geojson
      - site/data/phase2/geometries/ancash_casma_*_validation.json
      - scripts/probe_phase2_casma_official_child_geometries.py
      - tests/test_phase2_casma_sechin_yautan_discovery_contract.py
      - site/data/map_layers.json
      - .github/workflows/phase2-casma-official-child-geometries.yml

permissions:
  contents: write

jobs:
  bootstrap-or-replay-exact-ana-children:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bootstrap exact ANA N7 sources only from a completely missing source set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(site/data/phase2/sources/north_coast_discovery_geometry/ana_ancash_casma_137596?.geojson)
          if (( ${#files[@]} == 0 )); then
            # The ANA/IDEP public service can be intermittently unreachable from hosted
            # runners. Retry the whole atomic bootstrap only on failure. The probe stages
            # all nine responses in memory and writes nothing until the complete exact
            # N7 set validates, so retries cannot create a partial scientific source set.
            for attempt in 1 2 3; do
              if python scripts/probe_phase2_casma_official_child_geometries.py --refresh-source; then
                break
              fi
              if (( attempt == 3 )); then
                echo "ANA exact-source bootstrap failed after ${attempt} bounded attempts" >&2
                exit 1
              fi
              sleep $((attempt * 10))
            done
          elif (( ${#files[@]} != 9 )); then
            echo "Partial frozen Casma source set: ${#files[@]}/9" >&2
            exit 1
          fi
      - name: Replay frozen Casma children offline and deterministically
        run: python scripts/probe_phase2_casma_official_child_geometries.py
      - name: Rebuild research/context map catalog deterministically
        run: python scripts/build_map_layer_catalog.py
      - name: Enforce Casma child-specific scientific guards
        run: python -m pytest -q tests/test_phase2_casma_sechin_yautan_discovery_contract.py
      - name: Persist only exact verified deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/validation/phase2_discovery_packages/ancash_casma_sechin_yautan.json \
            site/data/validation/phase2_discovery_contracts/ancash_casma_sechin_yautan.json \
            site/data/phase2/sources/north_coast_discovery_geometry/ana_ancash_casma_137596?.geojson \
            site/data/phase2/geometries/ancash_casma_*.geojson \
            site/data/phase2/geometries/ancash_casma_*_validation.json \
            site/data/map_layers.json
          if git diff --cached --quiet; then
            echo "Exact Casma child replay and map catalog are already deterministic"
          else
            git commit -m "Publish exact ANA Casma N7 research child layers"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
