name: IRFEN - Construir cuenca San Ildefonso v0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build_san_ildefonso_remote.py
      - .github/workflows/build-san-ildefonso-v08.yml

permissions:
  contents: write

jobs:
  build-watershed:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias cientificas
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy rasterio pysheds shapely pyproj

      - name: Construir microcuenca candidata
        run: |
          python scripts/build_san_ildefonso_remote.py

      - name: Mostrar validacion
        run: |
          cat site/data/watersheds/san_ildefonso_validation.json

      - name: Guardar resultados en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/data/watersheds/san_ildefonso_watershed.geojson
          git add site/data/watersheds/san_ildefonso_validation.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "IRFEN v0.8: microcuenca San Ildefonso con Copernicus DEM"
            git push
          fi
