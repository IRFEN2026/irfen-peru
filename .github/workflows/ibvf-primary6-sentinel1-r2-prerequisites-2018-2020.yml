name: IBVF - PRIMARY6 Sentinel-1 R2 prerequisites 2018-2020

on:
  push:
    branches: [agent/independent-basin-validation-map]
    paths:
      - '.github/workflows/ibvf-primary6-sentinel1-r2-prerequisites-2018-2020.yml'
      - 'site/data/validation/ibvf_primary6_sentinel1_r2_entry_2018_2019_v01.json'
      - 'site/data/validation/ibvf_primary6_sentinel1_r2_entry_2019_2020_v01.json'
      - 'scripts/ibvf_sentinel1_r2_orbit_resolver_v02.py'
      - 'site/data/validation/ibvf_primary6_sentinel1_poeorb_directory_scope_amendment_v01.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-season:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - season: '2018-2019'
            file: '2018_2019'
          - season: '2019-2020'
            file: '2019_2020'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata-only prerequisite runtime
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
          sudo apt-get update
          sudo apt-get install -y proj-bin proj-data
      - name: Verify blind adjacent-month inventory amendment
        run: |
          python - <<'PY'
          import json
          d=json.load(open('site/data/validation/ibvf_primary6_sentinel1_poeorb_directory_scope_amendment_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['decision_timing']['made_before_primary6_r2_science_pixels_read'] is True
          assert d['decision_timing']['territorial_outcomes_used'] is False
          assert d['frozen_inventory_rule']['directory_month_offsets_from_acquisition_month']==[-1,0,1]
          assert d['frozen_inventory_rule']['same_rule_for_all_primary6_units_seasons_and_windows'] is True
          PY
      - name: Freeze exact vertical and AUX_POEORB prerequisites
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_sentinel1_r2_prerequisites_v02.py \
            --r2-entry "site/data/validation/ibvf_primary6_sentinel1_r2_entry_${{ matrix.file }}_v01.json" \
            --base-prereq-contract site/data/validation/cashahuacra_sentinel1_r2_prerequisites_contract.json \
            --output "artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_${{ matrix.file }}_v01.json"
      - name: Enforce blind fail-closed guards
        run: |
          python - <<'PY'
          import json,os
          season=os.environ['SEASON']; file=os.environ['FILE']
          d=json.load(open(f'artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_{file}_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['season_id']==season
          assert d['compatible_windows_expected']==18 and d['compatible_windows_prerequisites_pass']==18
          assert d['missing_windows_expected']==0 and d['missing_windows_preserved']==0
          assert d['vertical_transform_resource']['status']=='PASS'
          assert d['same_orbit_quality_class']=='AUX_POEORB'
          assert d['automatic_unhashed_orbit_download_allowed'] is False
          assert all(x['status']=='PASS_EXACT_AUX_POEORB_BOTH_DATES_SHA256_FROZEN' for x in d['entries'])
          assert d['r2_execution_performed'] is False and d['r2_science_pixels_read'] is False
          assert d['r3_common_support_computed'] is False and d['r4_features_computed'] is False
          assert d['territorial_outcomes_read'] is False and d['known_event_dates_read'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['activation_inference_allowed'] is False and d['modeling_allowed'] is False
          assert d['status']=='PASS_ALL_R2_PREREQUISITES_FROZEN_NO_SCIENCE_VALUES'
          PY
        env:
          SEASON: ${{ matrix.season }}
          FILE: ${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-r2-prereq-${{ matrix.file }}-${{ github.sha }}
          path: artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_${{ matrix.file }}_v01.json
          if-no-files-found: error
          retention-days: 30

  archive:
    needs: freeze-season
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ibvf-primary6-r2-prereq-*-${{ github.sha }}
          path: artifacts/ibvf
          merge-multiple: true
      - name: Recheck both seasons before branch archive
        run: |
          python - <<'PY'
          import json
          for season,file in [('2018-2019','2018_2019'),('2019-2020','2019_2020')]:
              d=json.load(open(f'artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_{file}_v01.json',encoding='utf-8'))
              assert d['season_id']==season
              assert d['compatible_windows_prerequisites_pass']==18
              assert d['status']=='PASS_ALL_R2_PREREQUISITES_FROZEN_NO_SCIENCE_VALUES'
              assert d['territorial_outcomes_read'] is False and d['r2_science_pixels_read'] is False
          PY
      - name: Archive final prerequisite manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          for file in 2018_2019 2019_2020; do
            cp "artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_${file}_v01.json" site/data/validation/
          done
          git add site/data/validation/ibvf_primary6_sentinel1_r2_prerequisites_2018_2019_v01.json site/data/validation/ibvf_primary6_sentinel1_r2_prerequisites_2019_2020_v01.json
          git commit -m 'IBVF: archive final PRIMARY6 R2 prerequisites'
          git push origin HEAD:agent/independent-basin-validation-map
