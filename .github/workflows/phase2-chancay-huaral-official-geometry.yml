name: IRFEN - Phase2 Chancay-Huaral official geometry

on:
  pull_request:
    paths:
      - scripts/probe_chancay_huaral_official_geometry.py
      - .github/workflows/phase2-chancay-huaral-official-geometry.yml
      - site/data/phase2/sources/chancay_huaral_hydrologic_context/**
      - site/data/phase2/geometries/lima_norte_chancay_huaral_*
      - site/data/validation/phase2_zone_contracts/lima_norte_chancay_huaral.json
      - config/phase2_candidate_inventory_v0_1.json
      - config/phase2_candidate_inventory_v0_2.json
      - site/data/phase2/catalog.json
      - site/data/map_layers.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Freeze source once or replay frozen source
        run: |
          if [ -f site/data/phase2/sources/chancay_huaral_hydrologic_context/source_inventory.json ]; then
            python scripts/probe_chancay_huaral_official_geometry.py --check-only
          else
            python scripts/probe_chancay_huaral_official_geometry.py --refresh-source
            python scripts/build_phase2_catalog.py
            python scripts/build_map_layer_catalog.py
          fi
      - name: Enforce catalogs and scientific guards
        run: |
          python scripts/probe_chancay_huaral_official_geometry.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('site/data/validation/phase2_zone_contracts/lima_norte_chancay_huaral.json').read_text())
          assert c['deployment_status']=='RESEARCH_ONLY'
          assert c['test_mode']=='TEST_ONLY'
          assert c['production_use'] is False
          assert c['production_ready'] is False
          assert c['operational_alerting_enabled'] is False
          assert c['validation']['activation_gate']=='BLOCKED'
          assert c['missing_data_rule']=='UNKNOWN_NOT_LOW_RISK'
          assert c['decision_thresholds'] is None
          assert c['hydraulic_factors'] is None
          assert c['assets']['geometry']['status']=='PARTIAL'
          g=json.loads(Path(c['assets']['geometry']['path']).read_text())
          assert g['properties']['production_use'] is False
          assert g['properties']['production_ready'] is False
          assert g['properties']['operational_alerting_enabled'] is False
          assert g['properties']['activation_gate']=='BLOCKED'
          assert g['features'][0]['properties']['counts_as_complete_candidate_geometry'] is False
          assert g['features'][0]['properties']['event_footprint_resolved'] is False
          PY
      - name: Commit first frozen source and derived research artifacts
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo 'Frozen artifacts already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            site/data/phase2/sources/chancay_huaral_hydrologic_context \
            site/data/phase2/geometries/lima_norte_chancay_huaral_basin_context.geojson \
            site/data/phase2/geometries/lima_norte_chancay_huaral_geometry_validation.json \
            site/data/validation/phase2_zone_contracts/lima_norte_chancay_huaral.json \
            config/phase2_candidate_inventory_v0_1.json \
            config/phase2_candidate_inventory_v0_2.json \
            site/data/phase2/catalog.json \
            site/data/map_layers.json
          git commit -m 'Phase2: freeze ANA Chancay-Huaral basin context'
          git push origin HEAD:"${HEAD_REF}"
