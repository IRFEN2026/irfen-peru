name: IRFEN - Explorar hidrología GORE Piura v0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/discover_gore_piura_hydro.py
      - .github/workflows/gore-piura-hydro-discovery.yml

permissions:
  contents: write

concurrency:
  group: gore-piura-hydro-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Explorar fuentes GORE Piura y Datos Abiertos
        run: python scripts/discover_gore_piura_hydro.py

      - name: Validar reporte
        run: |
          test -s site/data/hydrology/gore_piura_discovery.json
          python -m json.tool site/data/hydrology/gore_piura_discovery.json >/dev/null
          cat site/data/hydrology/gore_piura_discovery.json | head -n 160

      - name: Guardar reporte
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/hydrology/gore_piura_discovery.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "IRFEN v0.8: descubrimiento hidrología GORE Piura"
          git pull --rebase origin main
          git push origin HEAD:main
