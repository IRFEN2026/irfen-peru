name: IBVF - Cashahuacra IMERG Final V07 inventory

on:
  pull_request:
    paths:
      - 'scripts/ibvf_imerg_inventory.py'
      - 'scripts/ibvf_imerg_auth_probe.py'
      - 'scripts/ibvf_imerg_hash_freeze.py'
      - '.github/workflows/ibvf-cashahuacra-imerg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Validate IMERG research scripts
        run: python -m py_compile scripts/ibvf_imerg_inventory.py scripts/ibvf_imerg_auth_probe.py scripts/ibvf_imerg_hash_freeze.py
      - name: Verify CMR granule slots
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_imerg_inventory.py \
            --start 2015-03-16 \
            --end 2015-03-24 \
            --event-date 2015-03-23 \
            --output artifacts/ibvf/cashahuacra_imerg_inventory.json \
            --raw-metadata-output artifacts/ibvf/cashahuacra_imerg_cmr_raw.json
      - name: Probe authenticated raw HDF5 transport without inferring missing data
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          python scripts/ibvf_imerg_auth_probe.py \
            --inventory artifacts/ibvf/cashahuacra_imerg_inventory.json \
            --event-date 2015-03-23 \
            --work-dir artifacts/ibvf/imerg-probe-raw \
            --output artifacts/ibvf/cashahuacra_imerg_auth_probe.json
      - name: Stream and SHA-256 freeze all 432 raw HDF5 granules
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          python scripts/ibvf_imerg_hash_freeze.py \
            --inventory artifacts/ibvf/cashahuacra_imerg_inventory.json \
            --event-date 2015-03-23 \
            --workers 8 \
            --output artifacts/ibvf/cashahuacra_imerg_raw_hash_freeze.json
      - name: Scientific guards and slot/hash contract
        run: |
          python - <<'PY'
          import json
          p='artifacts/ibvf/cashahuacra_imerg_inventory.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False
          assert d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['expected_total_slots']==432
          assert d['event_day_48_slots_verified'] is True
          assert d['window_all_slots_verified'] is True
          a=json.load(open('artifacts/ibvf/cashahuacra_imerg_auth_probe.json',encoding='utf-8'))
          assert a['deployment_status']=='RESEARCH_ONLY'
          assert a['test_only'] is True
          assert a['production_use'] is False
          assert a['production_ready'] is False
          assert a['operational_alerting_enabled'] is False
          assert a['uses_operational_event_none_labels'] is False
          if a.get('probe_status') != 'SUCCESS':
              assert a.get('scientific_data_status') != 'MISSING'
          f=json.load(open('artifacts/ibvf/cashahuacra_imerg_raw_hash_freeze.json',encoding='utf-8'))
          assert f['deployment_status']=='RESEARCH_ONLY'
          assert f['test_only'] is True
          assert f['production_use'] is False
          assert f['production_ready'] is False
          assert f['operational_alerting_enabled'] is False
          assert f['uses_operational_event_none_labels'] is False
          assert f['inventory_432_verified'] is True
          assert all(x.get('scientific_data_status') != 'MISSING' for x in f.get('failures',[]))
          print({'resolved':d['resolved_granule_count'],'event48_meta':d['event_day_48_slots_verified'],'window432_meta':d['window_all_slots_verified'],'cmr_sha256':d['source']['cmr_response_sha256'],'raw_probe_status':a.get('probe_status'),'raw_probe_sha256':(a.get('raw_byte_probe') or {}).get('sha256'),'event48_raw':f['event_48_raw_sha256_frozen'],'window432_raw':f['window_432_raw_sha256_frozen'],'successful_hashes':f['successful_hashes'],'failed_hashes':f['failed_or_blocked_hashes'],'raw_manifest_sha256':f.get('ordered_raw_manifest_sha256'),'event_manifest_sha256':f.get('event_ordered_raw_manifest_sha256'),'total_bytes_hashed':f.get('total_bytes_hashed')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-cashahuacra-imerg-${{ github.sha }}
          path: |
            artifacts/ibvf/cashahuacra_imerg_inventory.json
            artifacts/ibvf/cashahuacra_imerg_cmr_raw.json
            artifacts/ibvf/cashahuacra_imerg_auth_probe.json
            artifacts/ibvf/cashahuacra_imerg_raw_hash_freeze.json
          if-no-files-found: error
          retention-days: 30
