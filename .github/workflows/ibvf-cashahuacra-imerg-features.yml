name: IBVF - Cashahuacra IMERG basin features

on:
  pull_request:
    paths:
      - 'scripts/ibvf_imerg_basin_features.py'
      - '.github/workflows/ibvf-cashahuacra-imerg-features.yml'
      - 'site/data/watersheds/cashahuacra_ibvf_two_point_v03.geojson'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'h5py>=3.10' 'numpy>=1.26,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Compile research extractor
        run: python -m py_compile scripts/ibvf_imerg_inventory.py scripts/ibvf_imerg_auth_probe.py scripts/ibvf_imerg_basin_features.py
      - name: Resolve the exact 432-slot Final V07 inventory
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_imerg_inventory.py \
            --start 2015-03-16 \
            --end 2015-03-24 \
            --event-date 2015-03-23 \
            --output artifacts/ibvf/cashahuacra_imerg_inventory.json
      - name: Extract basin-weighted blind features and re-verify raw identity
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          python scripts/ibvf_imerg_basin_features.py \
            --inventory artifacts/ibvf/cashahuacra_imerg_inventory.json \
            --basin site/data/watersheds/cashahuacra_ibvf_two_point_v03.geojson \
            --event-date 2015-03-23 \
            --workers 8 \
            --expected-manifest 76d96e2af342d61b4406450a07a7b045cd053bcd6fa1322deff527f9e5e5772b \
            --output artifacts/ibvf/cashahuacra_imerg_basin_features.json
      - name: Scientific guardrails
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ibvf/cashahuacra_imerg_basin_features.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False
          assert d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['raw_identity']['match'] is True
          assert d['slots']['attempted']==432
          assert d['slots']['valid_basin_rates']==432
          assert d['temporal_contract']['event_time_used'] is False
          assert d['temporal_contract']['missing_values_imputed_as_zero'] is False
          assert d['feature_status']=='FROZEN_BLIND_OBSERVATIONAL_FEATURES'
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert 'activation' not in d.get('features',{})
          print(json.dumps({'raw_identity':d['raw_identity'],'slots':d['slots'],'features':d['features']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-cashahuacra-imerg-features-${{ github.sha }}
          path: artifacts/ibvf/cashahuacra_imerg_basin_features.json
          if-no-files-found: error
          retention-days: 30
      - name: Archive verified compact result on research branch
        if: github.event_name == 'pull_request'
        run: |
          cp artifacts/ibvf/cashahuacra_imerg_basin_features.json site/data/validation/cashahuacra_imerg_basin_features.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/validation/cashahuacra_imerg_basin_features.json
          if git diff --cached --quiet; then
            echo 'No result change to archive.'
          else
            git commit -m 'IBVF: archive Cashahuacra blind IMERG basin features'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
