name: IRFEN - Chosica 2015 candidate Landsat 7 descriptive change

on:
  pull_request:
    paths:
      - config/chosica_2015_candidate_landsat7_qa_freeze_record_v0_1.json
      - config/chosica_2015_candidate_landsat7_change_contract_v0_1.json
      - scripts/compute_chosica_2015_candidate_landsat7_change.py
      - .github/workflows/chosica-2015-candidate-landsat7-change.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  descriptive-change:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_candidate_landsat7_change_contract_v0_1.json
            scripts/compute_chosica_2015_candidate_landsat7_change.py
            .github/workflows/chosica-2015-candidate-landsat7-change.yml
      - name: Assert forbidden scientific paths absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09_b.json
      - name: Download exact frozen clean-room artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources/qa sources/inventory sources/geometry artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10180279058/zip" > /tmp/qa.zip
          unzip -q /tmp/qa.zip -d sources/qa
          test "$(sha256sum sources/qa/chosica_2015_candidate_landsat7_qa_v0_1.json | cut -d' ' -f1)" = "31719ba2ca44a33e71c8f57271ed6bc0d0478325f2053a17a7e3ee3dcb4f80d7"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10180217499/zip" > /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d sources/inventory
          test "$(sha256sum sources/inventory/chosica_2015_candidate_landsat7_asset_inventory_v0_1.json | cut -d' ' -f1)" = "f10c4442ffe6bb12992b342e78140eb89f0e5db95abd2ab05304d8f399952cda"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10171108859/zip" > /tmp/geometry.zip
          unzip -q /tmp/geometry.zip -d sources/geometry
          test "$(sha256sum sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson | cut -d' ' -f1)" = "9a23644c191c88fb66722b368773251051b4098ddd74e4d5861c3a37dbfbb1ca"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frozen descriptive-metric runtime
        run: pip install 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2' 'planetary-computer>=1,<2'
      - name: Compute precommitted descriptive metrics only
        run: |
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/compute_chosica_2015_candidate_landsat7_change.py \
            --contract config/chosica_2015_candidate_landsat7_change_contract_v0_1.json \
            --qa sources/qa/chosica_2015_candidate_landsat7_qa_v0_1.json \
            --inventory sources/inventory/chosica_2015_candidate_landsat7_asset_inventory_v0_1.json \
            --geometry sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson \
            --output artifacts/chosica_2015_candidate_landsat7_change_v0_1.json
      - name: Enforce supporting-evidence-only guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_candidate_landsat7_change_v0_1.json',encoding='utf-8'))
          assert d['status']=='PASS_LANDSAT7_DESCRIPTIVE_CHANGE_METRICS'
          assert d['qa_usable_candidate_count']==4
          assert len(d['computed_candidates'])==4
          assert len(d['qa_insufficient_candidates'])==3
          assert d['surface_signal_observed'] is True
          assert d['descriptive_metrics_only'] is True
          assert d['classification_thresholds_used'] is False
          for k in ('outcome_labels_assigned','no_change_interpreted_as_control','large_change_interpreted_as_activation','mirror_bytes_independently_matched_to_usgs_origin','target_names_or_ids_read','target_outcome_evidence_read','a6680_read','contaminated_adjudication_used','scene_selection_modified','candidate_selection_modified','candidate_ranking_modified','feedback_to_matching_performed','free_web_search_used','sealed_target_unblind_allowed'):
              assert d[k] is False, k
          assert d['guards']=={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-candidate-landsat7-descriptive-change
          path: artifacts/chosica_2015_candidate_landsat7_change_v0_1.json
          if-no-files-found: error
