name: IRFEN - bounded discovery map catalog refresh

on:
  pull_request:
    paths:
      - site/data/validation/phase2_discovery_contracts/tumbes_rio_tumbes.json
      - site/data/validation/phase2_discovery_packages/tumbes_rio_tumbes.json
      - site/data/phase2/sources/tumbes_rio_tumbes_official_evidence_v0_1.json
      - .github/workflows/phase2-refresh-map-catalog-bounded.yml

permissions:
  contents: write

jobs:
  refresh-map-catalog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild catalog strictly from repository sources
        run: |
          set -euo pipefail
          python scripts/build_map_layer_catalog.py
          python scripts/build_map_layer_catalog.py --check-only
      - name: Enforce Rio Tumbes remains unmapped pending exact ANA replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/data/map_layers.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=[r for r in d.get('research_discovery_units',[]) if r.get('discovery_id')=='tumbes_rio_tumbes']
          assert len(rows)==1
          row=rows[0]
          assert row['deployment_status']=='RESEARCH_ONLY'
          assert row['production_use'] is False
          assert row['production_ready'] is False
          assert row['operational_alerting_enabled'] is False
          assert row['activation_gate']=='BLOCKED'
          assert row['missing_data_rule']=='UNKNOWN_NOT_LOW_RISK'
          assert row['decision_thresholds'] is None
          assert row['hydraulic_factors'] is None
          g=row['geometry']
          assert g['map_eligible'] is False
          assert g['path'] is None
          assert g['status']=='MISSING_PENDING_EXACT_ANA_LAYER_REPLAY'
          assert row['contract_path']=='site/data/validation/phase2_discovery_contracts/tumbes_rio_tumbes.json'
          PY
      - name: Commit deterministic generated catalog if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/map_layers.json; then
            echo "catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/map_layers.json
          git commit -m "Phase2: refresh map inventory for Rio Tumbes contract"
          git push origin HEAD:${{ github.head_ref }}
