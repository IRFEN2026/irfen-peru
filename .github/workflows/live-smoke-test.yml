name: IRFEN - Verificar sitio publicado

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "IRFEN — Actualizar IMERG y publicar"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esperar propagación GitHub Pages
        run: sleep 8

      - name: Descargar activos publicados
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irfen2026.github.io/irfen-peru"
          mkdir -p /tmp/irfen-live
          files=(
            "index.html"
            "data/latest.json"
            "data/history.json"
            "data/scientific_status.json"
            "data/hydraulics/current_infrastructure.json"
            "data/forecast/latest.json"
            "data/forecast/verification.json"
            "data/calibration/historical_replay.json"
            "data/hydrology/piura_reference_model.json"
            "data/hydrology/senamhi_nacara_numeric_archive.json"
            "data/hydrology/catacaos_official_context.geojson"
            "data/hydrology/ana_catacaos_critical_segments_2026.geojson"
            "data/hydrology/ana_catacaos_critical_segments_2026_validation.json"
            "data/experimental_state.json"
            "data/test_report.json"
            "data/v08_scorecard.json"
            "v08-experimental.js"
            "v08-forecast.js"
            "v08-simulator.js"
            "v08-health.js"
            "v08-readiness.js"
          )
          for path in "${files[@]}"; do
            echo "GET $path"
            mkdir -p "/tmp/irfen-live/$(dirname "$path")"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 --max-time 35 "$BASE/$path?smoke=$(date +%s)" -o "/tmp/irfen-live/$path"
            test -s "/tmp/irfen-live/$path"
          done

      - name: Validar contrato publicado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/irfen-live')
          def load(path): return json.loads((root/path).read_text(encoding='utf-8'))

          latest=load('data/latest.json')
          assert latest.get('operational_status') in {'updated','stale'}, latest.get('operational_status')
          assert {z.get('id') for z in latest.get('zones',[])} == {'san_ildefonso','chosica','catacaos'}

          forecast=load('data/forecast/latest.json')
          assert forecast.get('production_use') is False
          verification=load('data/forecast/verification.json')
          assert verification.get('production_use') is False
          assert int(verification.get('total_pairs',0)) >= 0

          replay=load('data/calibration/historical_replay.json')
          assert replay.get('production_use') is False
          assert replay.get('interpretation_gate',{}).get('status') == 'CALIBRATION_REQUIRED'
          replay_ids={c.get('event_id') for c in replay.get('cases',[])}
          assert {'SI-2017-03-15','CH-2015-03-23','PI-2017-03-27'}.issubset(replay_ids)

          hydraulics=load('data/hydraulics/current_infrastructure.json')
          assert hydraulics.get('production_use') is False
          for z in hydraulics.get('zones',[]): assert z.get('production_modifier') is None

          state=load('data/experimental_state.json')
          assert state.get('production_use') is False
          cat=next(z for z in state['zones'] if z['zone_id']=='catacaos')
          if cat.get('river_state_available') is not True:
              assert 'numeric_river_state_required' in cat.get('blockers',[])

          ref=load('data/hydrology/piura_reference_model.json')
          assert ref.get('production_use') is False

          nacara=load('data/hydrology/senamhi_nacara_numeric_archive.json')
          assert nacara.get('production_use') is False
          assert nacara.get('production_ready') is False
          assert nacara.get('integration_mode') == 'TEST_ONLY'
          assert nacara.get('station',{}).get('id') == '47E0415A'
          assert nacara.get('scientific_gate',{}).get('hydraulic_transfer_to_catacaos_validated') is False
          assert nacara.get('scientific_gate',{}).get('official_threshold_promoted_to_irfen') is False
          assert 'never zero' in nacara.get('scientific_gate',{}).get('missing_data_rule','')

          context=load('data/hydrology/catacaos_official_context.geojson')
          for f in context.get('features',[]):
              p=f.get('properties',{})
              assert p.get('context_only') is True
              assert p.get('is_hazard_polygon') is False
              assert p.get('production_use') is False

          ana=load('data/hydrology/ana_catacaos_critical_segments_2026.geojson')
          ana_val=load('data/hydrology/ana_catacaos_critical_segments_2026_validation.json')
          assert ana.get('properties',{}).get('production_use') is False
          assert len(ana.get('features',[])) == int(ana_val.get('published_segment_count',-1))
          assert len(ana.get('features',[])) >= 4
          for f in ana.get('features',[]):
              p=f.get('properties',{})
              assert f.get('geometry',{}).get('type') == 'LineString'
              assert p.get('geometry_status') == 'PASS'
              assert p.get('is_flood_polygon') is False
              assert p.get('is_inundation_extent') is False

          tests=load('data/test_report.json')
          assert tests.get('status')=='PASS', tests

          score=load('data/v08_scorecard.json')
          assert score.get('production_use') is False
          assert score.get('production_ready') is False
          assert score.get('current_milestone_pct') in {25,50,75,100}
          assert [m.get('percentage') for m in score.get('milestones',[])] == [25,50,75,100]

          html=(root/'index.html').read_text(encoding='utf-8')
          for script in ('v08-experimental.js','v08-forecast.js','v08-simulator.js','v08-health.js','v08-readiness.js'):
              assert script in html, f'Falta {script} en index publicado'

          print('LIVE SMOKE TEST OK')
          print('operational_status:',latest.get('operational_status'))
          print('regression:',tests.get('passed'),'PASS /',tests.get('failed'),'FAIL')
          print('forecast verification pairs:',verification.get('total_pairs'))
          print('historical replay cases:',len(replay.get('cases',[])))
          print('ANA Catacaos segments:',len(ana.get('features',[])))
          PY
