name: IRFEN - Verificar sitio publicado

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "IRFEN — Actualizar IMERG y publicar"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar contrato de validación
        uses: actions/checkout@v4

      - name: Esperar propagación GitHub Pages
        run: sleep 8

      - name: Descargar activos publicados
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irfen2026.github.io/irfen-peru"
          mkdir -p /tmp/irfen-live
          files=(
            "index.html"
            "data/latest.json"
            "data/history.json"
            "data/scientific_status.json"
            "data/hydraulics/current_infrastructure.json"
            "data/forecast/latest.json"
            "data/forecast/verification.json"
            "data/forecast/observed_imerg_daily.json"
            "data/calibration/historical_replay.json"
            "data/calibration/goes19_rrqpe_probe.json"
            "data/calibration/goes19_rrqpe_archive.json"
            "data/hydrology/piura_reference_model.json"
            "data/hydrology/senamhi_nacara_numeric_archive.json"
            "data/hydrology/catacaos_official_context.geojson"
            "data/hydrology/ana_catacaos_critical_segments_2026.geojson"
            "data/hydrology/ana_catacaos_critical_segments_2026_validation.json"
            "data/hydrology/catacaos_pprrd_2026_discovery.json"
            "data/hydrology/piura_2026_field_evidence.json"
            "data/validation/official_outcome_evidence.json"
            "data/validation/shadow_runs.json"
            "data/stations/igp_cendehua_access_probe.json"
            "data/stations/igp_cendehua_huaycoloro_archive.json"
            "data/experimental_state.json"
            "data/phase2/event_reanalysis.json"
            "data/phase2/catalog.json"
            "data/map_layers.json"
            "data/test_report.json"
            "data/v08_scorecard.json"
            "data/v08_rc_status.json"
            "v08-experimental.js"
            "v08-forecast.js"
            "v08-simulator.js"
            "v08-health.js"
            "v08-readiness.js"
            "v08-expansion.js"
          )
          for path in "${files[@]}"; do
            echo "GET $path"
            mkdir -p "/tmp/irfen-live/$(dirname "$path")"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 --max-time 35 "$BASE/$path?smoke=$(date +%s)" -o "/tmp/irfen-live/$path"
            test -s "/tmp/irfen-live/$path"
          done

      - name: Validar contrato publicado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.archive_shadow_validation import validate_shadow_integrity
          root=Path('/tmp/irfen-live')
          def load(path): return json.loads((root/path).read_text(encoding='utf-8'))

          latest=load('data/latest.json')
          assert latest.get('operational_status') in {'updated','stale'}, latest.get('operational_status')
          assert {z.get('id') for z in latest.get('zones',[])} == {'san_ildefonso','chosica','catacaos'}

          forecast=load('data/forecast/latest.json')
          assert forecast.get('production_use') is False
          verification=load('data/forecast/verification.json')
          assert verification.get('production_use') is False
          assert int(verification.get('total_pairs',0)) >= 0
          observed=load('data/forecast/observed_imerg_daily.json')
          assert observed.get('production_use') is False
          assert observed.get('retention_contract') == 'append_only_by_zone_method_valid_date; first_audited_value_wins; conflicting_revisions_are_logged_without_overwrite'
          assert int(observed.get('record_count',-1)) == len(observed.get('records',[]))
          pinned=[row for row in observed.get('seed_provenance',[]) if row.get('artifact_sha256') == '88c0cd15ebbde7a9b789cacf4720c81e946e31d46f60546275fcac1dad851d9b']
          assert len(pinned) == 1
          assert pinned[0].get('verification_sha256') == 'f4a79332710e8531e588b1f56222933e710439f38627c28a988ee7d11970ae1b'
          observed_keys=[]
          for record in observed.get('records',[]):
              for row in record.get('series',[]):
                  observed_keys.append((record.get('zone_id'),record.get('sampling_method'),row.get('date')))
                  assert float(row.get('rain_mm',-1)) >= 0
          assert len(observed_keys) == len(set(observed_keys))
          for row in observed.get('revision_candidates',[]):
              assert row.get('production_use') is False
              assert row.get('disposition') == 'LOGGED_NOT_OVERWRITTEN_PENDING_SCIENTIFIC_REVIEW'

          replay=load('data/calibration/historical_replay.json')
          assert replay.get('production_use') is False
          assert replay.get('interpretation_gate',{}).get('status') == 'CALIBRATION_REQUIRED'
          replay_ids={c.get('event_id') for c in replay.get('cases',[])}
          assert {'SI-2017-03-15','CH-2015-03-23','PI-2017-03-27'}.issubset(replay_ids)

          goes_probe=load('data/calibration/goes19_rrqpe_probe.json')
          goes_archive=load('data/calibration/goes19_rrqpe_archive.json')
          for goes in (goes_probe, goes_archive):
              assert goes.get('production_use') is False
              assert goes.get('production_ready') is False
              assert goes.get('integration_mode') == 'GOES_TEST_ONLY'
              assert goes.get('counts_toward_v08_closeout') is False
              gate=goes.get('scientific_gate') or {}
              assert gate.get('automatic_event_or_none_classification') is False
              assert gate.get('threshold_promotion_allowed') is False
              assert gate.get('hydraulic_factor_promotion_allowed') is False
              assert gate.get('replaces_imerg') is False
              assert gate.get('human_review_required') is True
          if goes_probe.get('source_available'):
              assert goes_probe.get('product_metadata',{}).get('platform_id') == 'G19'
              assert goes_probe.get('coverage',{}).get('required_target_ids') == [
                  'catacaos', 'huaycoloro_main_channel', 'san_ildefonso'
              ]
          else:
              assert goes_probe.get('scientific_gate',{}).get('missing_data_interpretation') == 'UNKNOWN_NOT_ZERO_OR_LOW_RISK'
          goes_summary=goes_archive.get('summary') or {}
          goes_contract=goes_archive.get('discard_contract') or {}
          goes_decision=goes_archive.get('retention_decision') or {}
          assert 0 <= float(goes_summary.get('all_pilots_covered_pct', -1)) <= 100
          assert goes_contract.get('discard_if_all_pilots_coverage_below_pct') == 80
          assert goes_contract.get('minimum_distinct_source_objects_before_availability_review') == 72
          if goes_decision.get('technical_review_sample_complete'):
              assert int(goes_summary.get('probe_record_count', 0)) >= 72
              assert int(goes_summary.get('distinct_source_object_count', 0)) >= 72
          if goes_decision.get('technical_access_gate_pass'):
              assert goes_decision.get('technical_review_sample_complete') is True
              assert float(goes_summary.get('source_availability_pct', 0)) >= 80
              assert float(goes_summary.get('all_pilots_covered_pct', 0)) >= 80
              assert float(goes_summary.get('capture_delay_p90_minutes', 9999)) <= 30

          hydraulics=load('data/hydraulics/current_infrastructure.json')
          assert hydraulics.get('production_use') is False
          for z in hydraulics.get('zones',[]): assert z.get('production_modifier') is None

          state=load('data/experimental_state.json')
          assert state.get('production_use') is False
          cat=next(z for z in state['zones'] if z['zone_id']=='catacaos')
          if cat.get('river_state_available') is not True:
              assert 'numeric_river_state_required' in cat.get('blockers',[])

          event_reanalysis=load('data/phase2/event_reanalysis.json')
          assert event_reanalysis.get('production_use') is False
          assert event_reanalysis.get('deployment_status') == 'RESEARCH_ONLY'
          assert event_reanalysis.get('guardrails',{}).get('missing_data_is_not_low_risk') is True
          assert event_reanalysis.get('relationship_to_v08',{}).get('counts_toward_v08_closeout') is False
          assert int(event_reanalysis.get('summary',{}).get('operational_activations',-1)) == 0
          for item in event_reanalysis.get('items',[]):
              assert item.get('operational_zone_activation') is False
              for window in (item.get('windows') or {}).values():
                  if window.get('continuous') is not True:
                      assert window.get('accum_mm') is None

          phase2_catalog=load('data/phase2/catalog.json')
          map_layers=load('data/map_layers.json')
          assert phase2_catalog.get('production_use') is False
          assert phase2_catalog.get('deployment_status') == 'RESEARCH_ONLY'
          assert map_layers.get('production_use') is False
          assert map_layers.get('production_ready') is False
          assert map_layers.get('operational_alerting_enabled') is False
          assert map_layers.get('summary',{}).get('new_operational_zones') == 0
          assert map_layers.get('summary',{}).get('research_candidates_registered') == 18
          assert all(layer.get('deployment_status') in {'TEST_ONLY','RESEARCH_ONLY'} for layer in map_layers.get('technical_layers',[]))
          assert all(layer.get('loaded_into_operational_calculation') is False for layer in map_layers.get('technical_layers',[]))
          assert all(zone.get('deployment_status') == 'RESEARCH_ONLY' for zone in map_layers.get('research_zones',[]))
          assert all(zone.get('geometry',{}).get('map_eligible') is True or zone.get('geometry',{}).get('representation') == 'NOT_MAPPED_NO_REPRODUCIBLE_FILE' for zone in map_layers.get('research_zones',[]))

          ref=load('data/hydrology/piura_reference_model.json')
          assert ref.get('production_use') is False

          nacara=load('data/hydrology/senamhi_nacara_numeric_archive.json')
          assert nacara.get('production_use') is False
          assert nacara.get('production_ready') is False
          assert nacara.get('integration_mode') == 'TEST_ONLY'
          assert nacara.get('station',{}).get('id') == '47E0415A'
          assert nacara.get('scientific_gate',{}).get('hydraulic_transfer_to_catacaos_validated') is False
          assert nacara.get('scientific_gate',{}).get('official_threshold_promoted_to_irfen') is False
          assert 'never zero' in nacara.get('scientific_gate',{}).get('missing_data_rule','')

          context=load('data/hydrology/catacaos_official_context.geojson')
          for f in context.get('features',[]):
              p=f.get('properties',{})
              assert p.get('context_only') is True
              assert p.get('is_hazard_polygon') is False
              assert p.get('production_use') is False

          ana=load('data/hydrology/ana_catacaos_critical_segments_2026.geojson')
          ana_val=load('data/hydrology/ana_catacaos_critical_segments_2026_validation.json')
          assert ana.get('properties',{}).get('production_use') is False
          assert len(ana.get('features',[])) == int(ana_val.get('published_segment_count',-1))
          assert len(ana.get('features',[])) >= 4
          for f in ana.get('features',[]):
              p=f.get('properties',{})
              assert f.get('geometry',{}).get('type') == 'LineString'
              assert p.get('geometry_status') == 'PASS'
              assert p.get('is_flood_polygon') is False
              assert p.get('is_inundation_extent') is False

          pprrd=load('data/hydrology/catacaos_pprrd_2026_discovery.json')
          assert pprrd.get('production_use') is False
          assert pprrd.get('status') == 'indexed_for_scientific_review'
          assert pprrd.get('extraction_method') == 'OCR_IMAGE_ONLY_PDF'
          assert int(pprrd.get('ocr_pages_processed',0)) > 0
          assert pprrd.get('categories_found')
          assert all(
              candidate.get('validated_meaning') is False
              for candidate in pprrd.get('numeric_candidates',[])
          )

          field=load('data/hydrology/piura_2026_field_evidence.json')
          safety=field.get('safety') or {}
          assert field.get('production_use') is False
          assert field.get('production_ready') is False
          assert field.get('status') == 'OFFICIAL_FIELD_EVIDENCE_CANDIDATE_REVIEW'
          assert safety.get('counts_toward_closeout') is False
          assert safety.get('hydraulic_capacity_validated') is False
          assert safety.get('hydraulic_transfer_to_catacaos_validated') is False
          assert safety.get('absence_of_impact_validated') is False
          assert safety.get('threshold_promotion_allowed') is False
          assert safety.get('missing_data_is_low_risk') is False

          outcome=load('data/validation/official_outcome_evidence.json')
          assert outcome.get('production_use') is False
          assert outcome.get('production_ready') is False
          assert outcome.get('decision_use') == 'HUMAN_REVIEW_INPUT_ONLY'
          assert int(outcome.get('record_count',0)) == len(outcome.get('records',[]))
          assert outcome.get('records')
          for record in outcome.get('records',[]):
              assert record.get('snapshot_date_utc')
              assert record.get('captures')
              for capture in record.get('captures',[]):
                  assert capture.get('outcome_label') is None
                  assert capture.get('counts_toward_closeout') is False
                  assert capture.get('production_use') is False
                  assert len(capture.get('sources',[])) == 3
                  for source in capture.get('sources',[]):
                      if source.get('capture_status') != 'CAPTURED':
                          assert source.get('unknown_not_zero') is True
                  for source in capture.get('supplemental_sources',[]):
                      alignment=(source.get('summary') or {}).get('snapshot_date_alignment')
                      if alignment != 'TARGET_DATE_PRESENT':
                          assert source.get('unknown_not_zero') is True

          shadow=load('data/validation/shadow_runs.json')
          assert shadow.get('production_use') is False
          assert int(shadow.get('record_count',0)) == len(shadow.get('records',[]))
          shadow_integrity_contract=shadow.get('integrity_contract') or {}
          assert shadow_integrity_contract.get('effective_snapshot_date_utc') == '2026-08-21'
          shadow_integrity=validate_shadow_integrity(shadow.get('records') or [])
          assert shadow_integrity['valid'], shadow_integrity['errors']
          for record in shadow.get('records',[]):
              review=record.get('outcome_verification') or {}
              if review.get('label') == 'UNCERTAIN':
                  assert review.get('counts_toward_closeout') is False

          cendehua=load('data/stations/igp_cendehua_access_probe.json')
          assert cendehua.get('production_use') is False
          assert cendehua.get('production_ready') is False
          ground_signal=cendehua.get('huaycoloro_ground_signal') or {}
          assert ground_signal.get('automatic_outcome_label') is None
          assert ground_signal.get('human_review_required') is True

          cendehua_archive=load('data/stations/igp_cendehua_huaycoloro_archive.json')
          cendehua_gate=cendehua_archive.get('scientific_gate') or {}
          captures=cendehua_archive.get('captures') or []
          assert cendehua_archive.get('integration_mode') == 'TEST_ONLY'
          assert cendehua_archive.get('production_use') is False
          assert cendehua_archive.get('production_ready') is False
          assert int(cendehua_archive.get('capture_count',-1)) == len(captures)
          assert int(cendehua_archive.get('capture_count',0)) >= 1
          assert cendehua_gate.get('automatic_event_or_none_classification') is False
          assert cendehua_gate.get('absence_of_provider_activity_is_none') is False
          assert cendehua_gate.get('human_review_required') is True

          tests=load('data/test_report.json')
          assert tests.get('status')=='PASS', tests

          score=load('data/v08_scorecard.json')
          assert score.get('production_use') is False
          assert score.get('production_ready') is False
          assert score.get('current_milestone_pct') in {25,50,75,100}
          assert [m.get('percentage') for m in score.get('milestones',[])] == [25,50,75,100]
          review_workflows=score.get('human_review_workflows') or {}
          shadow_review_workflow=review_workflows.get('shadow_outcomes') or {}
          external_review_workflow=review_workflows.get('external_evidence') or {}
          assert shadow_review_workflow.get('automatic_classification_forbidden') is True
          assert external_review_workflow.get('automatic_acceptance_forbidden') is True
          assert shadow_review_workflow.get('url','').endswith('/actions/workflows/review-shadow-outcome.yml')
          assert external_review_workflow.get('url','').endswith('/actions/workflows/review-v08-external-evidence.yml')
          final_checks=next(m for m in score.get('milestones',[]) if m.get('percentage') == 100).get('checks',[])
          shadow_closeout=next(c for c in final_checks if c.get('id') == 'shadow_outcomes_sufficient_and_reviewed')
          for queued in (shadow_closeout.get('evidence') or {}).get('review_queue',[]):
              ground=queued.get('huaycoloro_ground_signal') or {}
              assert ground.get('automatic_outcome_label') is None
              assert ground.get('can_support_none_classification_by_itself') is False
              assert ground.get('human_review_required') is True
              assert queued.get('automatic_outcome_classification_forbidden') is True

          rc=load('data/v08_rc_status.json')
          assert rc.get('release_class') == 'RELEASE_CANDIDATE_TEST_ONLY'
          assert rc.get('production_use') is False
          assert rc.get('production_ready') is False
          assert rc.get('operational_alerting_enabled') is False
          assert (rc.get('phase2') or {}).get('operational_candidates') == 0
          assert (rc.get('formal_closeout') or {}).get('current_milestone_pct') == score.get('current_milestone_pct')
          if rc.get('status') == 'RC_AVAILABLE_TEST_ONLY':
              assert rc.get('available_for_controlled_testing') is True
              assert score.get('current_milestone_pct',0) >= 75
              assert tests.get('status') == 'PASS'

          html=(root/'index.html').read_text(encoding='utf-8')
          for script in ('v08-experimental.js','v08-forecast.js','v08-simulator.js','v08-health.js','v08-readiness.js','v08-expansion.js'):
              assert script in html, f'Falta {script} en index publicado'
          readiness=(root/'v08-readiness.js').read_text(encoding='utf-8')
          assert 'data/v08_scorecard.json' in readiness
          assert 'REVISIÓN HUMANA OBLIGATORIA' in readiness
          assert 'Falta de evidencia' in readiness

          print('LIVE SMOKE TEST OK')
          print('operational_status:',latest.get('operational_status'))
          print('regression:',tests.get('passed'),'PASS /',tests.get('failed'),'FAIL')
          print('forecast verification pairs:',verification.get('total_pairs'))
          print('historical replay cases:',len(replay.get('cases',[])))
          print('ANA Catacaos segments:',len(ana.get('features',[])))
          print('official outcome evidence days:',outcome.get('record_count'))
          print('shadow archive days:',shadow.get('record_count'))
          print('CENDEHUA captures:',cendehua_archive.get('capture_count'))
          print('release candidate:',rc.get('status'))
          PY
