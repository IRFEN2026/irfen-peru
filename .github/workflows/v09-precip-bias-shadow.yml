name: IRFEN precipitation shadow research tests
on:
  push:
    branches:
      - research/precip-bias-shadow-20261106
  pull_request:
    paths:
      - 'scripts/v09_precip_bias_shadow.py'
      - 'tests/test_v09_precip_bias_shadow.py'
      - 'scripts/v09_imerg_seven_day_inventory.py'
      - 'tests/test_v09_imerg_seven_day_inventory.py'
      - '.github/workflows/v09-precip-bias-shadow.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated fail-closed synthetic tests
        run: |
          python -m unittest discover -s tests -p 'test_v09_precip_bias_shadow.py' -v
          python -m unittest discover -s tests -p 'test_v09_imerg_seven_day_inventory.py' -v
