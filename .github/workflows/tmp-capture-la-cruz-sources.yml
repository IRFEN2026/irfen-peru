name: TEMPORARY capture La Cruz (Tumbes) sources A/B/C - removed after one run
on:
  push:
    branches: [inventory/tumbes-la-cruz-banchero-mariategui-v0-1]
    paths: [.github/workflows/tmp-capture-la-cruz-sources.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: command -v pdftotext || (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils) || true
      - name: Capture the three owner-cited sources (one attempt each + 1 retry), bytes, SHA-256, text layer
        run: |
          python3 - <<'PY'
          import hashlib, html, json, re, subprocess, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          d = Path("data/phase2/source_archive/tumbes_la_cruz_banchero_mariategui"); (d / "raw").mkdir(parents=True, exist_ok=True); (d / "text").mkdir(exist_ok=True)
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) IRFEN-research-archiver/0.1 (RESEARCH_ONLY)", "Accept-Language": "es-PE,es;q=0.9"}
          rec = {"captured_by": "GitHub runner (one-off)", "documents": []}
          def get(url):
              last = None
              for i in range(2):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                          return r.read(40_000_000), r.headers.get("Content-Type"), r.geturl(), r.status
                  except Exception as e:
                      last = f"{type(e).__name__}: {str(e)[:150]}"; time.sleep(5)
              raise RuntimeError(last)
          def save(doc_id, url, role):
              e = {"document_id": doc_id, "url": url, "role": role, "attempted_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds")}
              try:
                  b, ct, final, st = get(url)
                  ext = ".pdf" if b[:5] == b"%PDF-" else ".html"
                  p = d / "raw" / (doc_id + ext); p.write_bytes(b)
                  e.update(status="OK", http_status=st, content_type=ct, final_url=final, bytes=len(b), sha256=hashlib.sha256(b).hexdigest(), raw=str(p))
                  if ext == ".pdf":
                      n = int([l for l in subprocess.run(["pdfinfo", str(p)], capture_output=True, text=True).stdout.splitlines() if l.startswith("Pages:")][0].split()[1])
                      pages = [subprocess.run(["pdftotext", "-layout", "-f", str(i), "-l", str(i), str(p), "-"], capture_output=True, text=True).stdout for i in range(1, n + 1)]
                  else:
                      t = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", b.decode("utf-8", "replace"))
                      pages = [html.unescape(re.sub(r"\s+", " ", re.sub(r"(?s)<[^>]+>", " ", t)))]
                  (d / "text" / (doc_id + ".pages.json")).write_text(json.dumps({"document_id": doc_id, "sha256_of_raw": e["sha256"], "pages": pages}, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
                  e["text_chars"] = sum(len(x) for x in pages)
                  rec["documents"].append(e); return b
              except Exception as ex:
                  e.update(status=f"FAILED {ex}"); rec["documents"].append(e); return None
          save("indeci-rc-1951-2024-02-27-tumbes", "https://portal.indeci.gob.pe/wp-content/uploads/2024/01/REPORTE-COMPLEMENTARIO-N.%C2%BA-1951-27FEB2024-LLUVIAS-INTENSAS-EN-EL-DEPARTAMENTO-DE-TUMBES-3-1.pdf", "A")
          save("vivienda-noticia-569204-banchero-rossi", "https://www.gob.pe/institucion/vivienda/noticias/569204-tumbes-ministerio-de-vivienda-inicia-limpieza-y-descolmatacion-de-la-quebrada-banchero-rossi", "B")
          listing = save("munilacruz-resoluciones-alcaldia-sheet9", "https://www.gob.pe/institucion/munilacruz/normas-legales/tipos/89-resolucion-de-alcaldia?sheet=9", "C-listing")
          if listing:
              s = listing.decode("utf-8", "replace")
              links = sorted(set(re.findall(r'href="(/institucion/munilacruz/normas-legales/[^"]+)"', s)))
              rec["c_listing_links"] = links[:80]
              hits = [l for l in links if re.search(r"128[-_]2023", l)]
              rec["c_128_2023_links"] = hits
              for i, l in enumerate(hits[:2]):
                  page = save(f"munilacruz-ra-128-2023-page{i}", "https://www.gob.pe" + l, "C-norma")
                  if page:
                      pdfs = sorted(set(re.findall(r'href="(https://cdn\.www\.gob\.pe/uploads/document/file/[^"]+)"', page.decode("utf-8", "replace"))))
                      rec.setdefault("c_128_2023_pdfs", []).extend(pdfs)
                      for j, u in enumerate(pdfs[:2]):
                          save(f"munilacruz-ra-128-2023-doc{i}{j}", html.unescape(u), "C-document")
          (d / "capture_record_v0_1.json").write_text(json.dumps(rec, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
          print(json.dumps({k: v for k, v in rec.items()}, ensure_ascii=False, indent=1)[:6000])
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase2/source_archive/tumbes_la_cruz_banchero_mariategui
          git commit -q -m "Archive La Cruz (Tumbes) sources A/B/C captured on the runner (bytes, SHA-256, text layer; record of failures)" && git push -q || echo nothing
