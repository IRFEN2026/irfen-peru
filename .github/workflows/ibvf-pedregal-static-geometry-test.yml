name: IBVF - Pedregal static geometry test

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'site/data/validation/ibvf_ingemmet_static_geomorphic_contract_v01.json'
      - 'scripts/ibvf_pedregal_static_geometry_test.py'
      - '.github/workflows/ibvf-pedregal-static-geometry-test.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-pedregal-static-geometry-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constrained geospatial dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'requests>=2.31,<3' 'rasterio>=1.3,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'pysheds>=0.3,<0.5'
      - name: Compile blind/static test
        run: python -m py_compile scripts/ibvf_pedregal_static_geometry_test.py
      - name: Execute fixed-outlet Pedregal reconstruction
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_pedregal_static_geometry_test.py \
            --repo-root . \
            --output artifacts/ibvf/ibvf_pedregal_static_geometry_test_v01.json \
            --geojson-output artifacts/ibvf/pedregal_static_geometry_candidate_v01.geojson
      - name: Fail-closed scientific guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ibvf/ibvf_pedregal_static_geometry_test_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['rainfall_read'] is False
          assert d['known_event_dates_read'] is False
          assert d['territorial_outcomes_read'] is False
          assert d['damage_fields_read'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['outlet_optimized_against_reference_area'] is False
          assert d['candidate_id']=='pedregal_8_20'
          assert abs(d['preexisting_accumulation_area_approx_km2']-9.904)<1e-6
          assert d['source_outcome_section_read'] is False
          assert d['modeling_allowed'] is False
          print({k:d[k] for k in ['status','reconstructed_area_km2','static_reference_area_relative_error','internal_accumulation_consistency_pass','static_area_support_pass']})
          PY
      - name: Freeze report and research candidate without unblinding
        run: |
          cp artifacts/ibvf/ibvf_pedregal_static_geometry_test_v01.json site/data/validation/ibvf_pedregal_static_geometry_test_v01.json
          cp artifacts/ibvf/pedregal_static_geometry_candidate_v01.geojson site/data/watersheds/pedregal_static_geometry_candidate_v01.geojson
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          rp=Path('site/data/validation/ibvf_pedregal_static_geometry_test_v01.json')
          r=json.loads(rp.read_text(encoding='utf-8'))
          mp=Path('site/data/validation/independent_basin_validation_map.json')
          d=json.loads(mp.read_text(encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          d['version']='irfen-independent-basin-validation-map-v3.6'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{})
          ac['ingemmet_static_geomorphic_contract']='site/data/validation/ibvf_ingemmet_static_geomorphic_contract_v01.json'
          ac['pedregal_static_geometry_test']='site/data/validation/ibvf_pedregal_static_geometry_test_v01.json'
          ac['pedregal_static_geometry_test_status']=r['status']
          ac['pedregal_static_reference_area_km2']=r['static_reference_area_km2']
          ac['pedregal_reconstructed_area_km2']=r['reconstructed_area_km2']
          ac['pedregal_outcome_section_read']=False
          for c in d.get('cases',[]):
            if c.get('unit_id')=='pedregal':
              c['static_geomorphic_evidence_status']=r['status']
              c['static_geomorphic_evidence_source']='INGEMMET_HOSTED_RIIGEO_PEDREGAL_CHARACTERIZATION_SECTION_ONLY'
              c['static_geomorphic_reference_area_km2']=r['static_reference_area_km2']
              c['static_geomorphic_reconstructed_area_km2']=r['reconstructed_area_km2']
              c['static_geomorphic_candidate_geometry_path']='data/watersheds/pedregal_static_geometry_candidate_v01.geojson'
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
              if r['status'].startswith('PASS_'):
                c['geometry_status']='STATIC_GEOMORPHIC_SUPPORT_RESEARCH_CANDIDATE_REQUIRES_INDEPENDENT_REVIEW'
                c['geometry_semantics']='RESEARCH_CANDIDATE_STATIC_GEOMORPHIC_SUPPORT_NOT_OFFICIAL_VALIDATION_NOT_OPERATIONAL'
              else:
                c['geometry_status']='UNKNOWN_GEOMETRY_UNRESOLVED_STATIC_TEST_FAILED'
          mp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          git add site/data/validation/ibvf_pedregal_static_geometry_test_v01.json site/data/watersheds/pedregal_static_geometry_candidate_v01.geojson site/data/validation/independent_basin_validation_map.json
          if git diff --cached --quiet; then
            echo 'No scientific freeze change.'
          else
            git commit -m 'IBVF: freeze masked INGEMMET Pedregal static geometry test'
            git push origin HEAD:agent/independent-basin-validation-map
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibvf-pedregal-static-geometry-${{ github.sha }}
          path: artifacts/ibvf/*
          if-no-files-found: warn
          retention-days: 30
