name: IRFEN - Phase2 Moche official geometry freeze

on:
  pull_request:
    paths:
      - site/data/validation/phase2_discovery_contracts/lalibertad_moche.json
      - site/data/validation/phase2_discovery_packages/lalibertad_moche.json
      - site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_moche_137716.geojson
      - site/data/phase2/geometries/lalibertad_moche_basin_context.geojson
      - site/data/phase2/geometries/lalibertad_moche_geometry_validation.json
      - scripts/probe_phase2_moche_official_geometry.py
      - scripts/verify_phase2_moche_official_geometry.py
      - tests/test_phase2_moche_official_geometry.py
      - tests/test_phase2_moche_discovery_package.py
      - site/data/map_layers.json
      - .github/workflows/phase2-moche-official-geometry-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-official-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Replay frozen official ANA Moche geometry fail-closed
        run: python scripts/verify_phase2_moche_official_geometry.py
      - name: Enforce Moche scientific guards
        run: python -m pytest -q tests/test_phase2_moche_official_geometry.py tests/test_phase2_moche_discovery_package.py
      - name: Verify published research map catalog
        run: python scripts/build_map_layer_catalog.py --check-only
