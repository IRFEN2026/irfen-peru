name: IRFEN - Temporary regenerate map catalog Colan

on:
  push:
    branches:
      - phase2-colan-discovery-20260924
    paths:
      - '.github/workflows/regen-map-catalog-colan.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase2-colan-discovery-20260924
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate deterministic map catalog
        run: python scripts/build_map_layer_catalog.py
      - name: Commit generated catalog only
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/map_layers.json; then
            echo 'NO_MAP_CATALOG_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/map_layers.json
          git commit -m 'chore: regenerate map catalog for Colan discovery'
          git push origin HEAD:phase2-colan-discovery-20260924
