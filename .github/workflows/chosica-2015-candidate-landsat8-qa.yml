name: IRFEN - Chosica 2015 candidate Landsat 8 QA gate

on:
  pull_request:
    paths:
      - config/chosica_2015_candidate_landsat8_qa_contract_v0_1.json
      - scripts/evaluate_chosica_2015_candidate_landsat8_qa.py
      - .github/workflows/chosica-2015-candidate-landsat8-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_candidate_landsat8_qa_contract_v0_1.json
            scripts/evaluate_chosica_2015_candidate_landsat8_qa.py
            .github/workflows/chosica-2015-candidate-landsat8-qa.yml
      - name: Assert forbidden scientific paths absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09_b.json
      - name: Download exact frozen non-outcome inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10171108859/zip" > /tmp/geom.zip
          unzip -q /tmp/geom.zip -d sources
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10172288298/zip" > /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d sources
          test "$(sha256sum sources/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson | cut -d' ' -f1)" = "9a23644c191c88fb66722b368773251051b4098ddd74e4d5861c3a37dbfbb1ca"
          test "$(sha256sum sources/chosica_2015_candidate_landsat8_asset_inventory_v0_1.json | cut -d' ' -f1)" = "524e298aa313dffc0df2445e4f44cf7769c2fc0730d49bba7ff64cc8848b0659"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scientific dependencies
        run: pip install 'requests>=2.31,<3' 'numpy>=1.26,<2' 'rasterio>=1.3,<2'
      - name: Read only QA_PIXEL assets and enforce full-file checksums
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/evaluate_chosica_2015_candidate_landsat8_qa.py \
            --contract config/chosica_2015_candidate_landsat8_qa_contract_v0_1.json \
            --inventory sources/chosica_2015_candidate_landsat8_asset_inventory_v0_1.json \
            --geometry sources/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson \
            --output artifacts/chosica_2015_candidate_landsat8_qa_v0_1.json \
            | tee artifacts/summary.json
      - name: Enforce no-reflectance/no-outcome boundary
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_candidate_landsat8_qa_v0_1.json'))
          assert d['status']=='PASS_LANDSAT8_CANDIDATE_QA_GATE'
          assert d['candidate_count']==7 and d['usable_candidate_count']>=1
          assert d['qa_pixel_asset_bytes_read'] is True
          for k in ['reflectance_asset_bytes_read','outcome_evidence_read','target_names_or_ids_read','a6680_read','contaminated_adjudication_used','scene_selection_modified','candidate_selection_modified','candidate_ranking_modified','free_web_search_used','control_labels_assigned','sealed_target_unblind_allowed']:
            assert d[k] is False,(k,d[k])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chosica-2015-candidate-landsat8-qa
          path: artifacts/
          if-no-files-found: error
