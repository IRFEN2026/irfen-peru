name: Temporary Jicamarca map snapshot refresh

on:
  push:
    branches:
      - research/jicamarca-map-lines-v0-1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: research/jicamarca-map-lines-v0-1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate fail-closed map catalog
        run: python scripts/build_map_layer_catalog.py
      - name: Verify generated snapshot
        run: |
          python scripts/build_map_layer_catalog.py --check-only
          python -m unittest tests.test_phase2_jicamarca_map_catalog tests.test_map_layer_catalog -v
      - name: Commit generated snapshot only
        run: |
          if git diff --quiet -- site/data/map_layers.json; then
            echo 'No generated map diff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/map_layers.json
          git commit -m 'map: refresh generated Jicamarca catalog snapshot'
          git push origin HEAD:research/jicamarca-map-lines-v0-1
