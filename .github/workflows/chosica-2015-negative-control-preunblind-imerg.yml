name: IRFEN - Chosica 2015 negative-control pre-unblind IMERG

on:
  pull_request:
    paths:
      - config/chosica_2015_negative_control_preunblind_imerg_execution_v0_1.json
      - config/chosica_2015_negative_control_shortlist_geometry_freeze_record_v0_1.json
      - config/chosica_2015_negative_control_shortlist_geometry_contract_v0_1.json
      - config/chosica_2015_negative_control_matching_freeze_record_v0_1.json
      - config/chosica_2015_negative_control_candidate_generation_v0_1.json
      - config/chosica_2015_preunblind_imerg_execution_v0_2.json
      - config/chosica_2015_preunblind_predictor_time_plan_v0_1.json
      - site/data/validation/chosica_2015_negative_control_candidate_pool.json
      - scripts/generate_chosica_2015_negative_control_candidates.py
      - scripts/match_chosica_2015_negative_control_candidates.py
      - scripts/delineate_chosica_2015_negative_control_shortlist.py
      - scripts/extract_chosica_2015_preunblind_imerg.py
      - scripts/extract_chosica_2015_negative_control_preunblind_imerg.py
      - .github/workflows/chosica-2015-negative-control-preunblind-imerg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-control-imerg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scientific dependencies
        run: pip install -r requirements.txt
      - name: Regenerate exact frozen shortlist geometry
        run: |
          mkdir -p artifacts
          python scripts/delineate_chosica_2015_negative_control_shortlist.py \
            --contract config/chosica_2015_negative_control_shortlist_geometry_contract_v0_1.json \
            --report artifacts/chosica_2015_negative_control_shortlist_geometry_report.json \
            --geojson artifacts/chosica_2015_negative_control_shortlist.geojson
      - name: Enforce exact shortlist geometry freeze
        run: |
          python - <<'PY'
          import hashlib,json
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''): h.update(c)
              return h.hexdigest()
          fr=json.load(open('config/chosica_2015_negative_control_shortlist_geometry_freeze_record_v0_1.json',encoding='utf-8'))
          assert sha('artifacts/chosica_2015_negative_control_shortlist_geometry_report.json')==fr['frozen_outputs']['report_sha256']
          assert sha('artifacts/chosica_2015_negative_control_shortlist.geojson')==fr['frozen_outputs']['geojson_sha256']
          assert fr['anti_leakage']['outcome_evidence_read'] is False
          assert fr['anti_leakage']['candidate_outcome_evidence_read'] is False
          PY
      - name: Extract frozen pre-anchor IMERG for shortlisted controls
        run: |
          python scripts/extract_chosica_2015_negative_control_preunblind_imerg.py \
            --geojson artifacts/chosica_2015_negative_control_shortlist.geojson \
            --report artifacts/chosica_2015_negative_control_preunblind_imerg.json
      - name: Enforce complete blind predictor output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_negative_control_preunblind_imerg.json',encoding='utf-8'))
          assert d['status']=='PASS_CHOSICA_2015_NEGATIVE_CONTROL_PREUNBLIND_IMERG'
          assert d['candidate_count']==7
          assert d['outcome_evidence_read'] is False
          assert d['candidate_outcome_evidence_read'] is False
          assert d['a6680_numeric_reference_read'] is False
          assert d['post_anchor_predictor_read'] is False
          assert d['sealed_target_unblind_performed'] is False
          assert d['control_outcome_adjudication_performed'] is False
          assert d['geometry_or_pour_point_modified'] is False
          assert d['candidate_replaced'] is False
          assert d['window_shifted'] is False
          assert d['zero_imputation_used'] is False
          assert all(c['slot_count']==720 and c['valid_slot_count']==720 and c['coverage_fraction']==1.0 for c in d['candidates'])
          assert all(all(w['complete'] and w['valid_slot_count']==w['expected_slot_count'] for w in c['windows'].values()) for c in d['candidates'])
          assert d['guards']=={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-negative-control-preunblind-imerg
          path: artifacts/chosica_2015_negative_control_preunblind_imerg.json
          if-no-files-found: error
