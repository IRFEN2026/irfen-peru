name: IBVF Cashahuacra Sentinel-1 R2 execute frozen graph

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'scripts/ibvf_sentinel1_r2_execute.py'
      - '.github/workflows/ibvf-cashahuacra-s1-r2-execute.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-r2-pre-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'numpy>=1.26,<2' 'rasterio>=1.3,<2' 'pyproj>=3.6,<4' 'shapely>=2,<3'
          python -m py_compile scripts/ibvf_sentinel1_r2_execute.py scripts/ibvf_snap_runtime_install_freeze.py scripts/ibvf_cashahuacra_r2_ellipsoidal_dem.py scripts/ibvf_sentinel1_r2_compile_graph.py
      - name: Enforce frozen scientific prerequisites before reading SAR response
        run: |
          python - <<'PY'
          import json
          files=[
            'site/data/validation/cashahuacra_sentinel1_freeze.json',
            'site/data/validation/cashahuacra_sentinel1_r2_graph_compile.json',
            'site/data/validation/cashahuacra_sentinel1_r2_runtime_contract.json',
            'site/data/validation/cashahuacra_sentinel1_r2_runtime_bytes.json',
            'site/data/validation/cashahuacra_sentinel1_r2_prerequisites.json',
            'site/data/validation/cashahuacra_r2_ellipsoidal_dem_contract.json',
          ]
          for p in files:
              d=json.load(open(p,encoding='utf-8'))
              assert d['production_use'] is False and d['production_ready'] is False and d['operational_alerting_enabled'] is False
              assert d['uses_operational_event_none_labels'] is False and d['territorial_activation_evidence_blinded'] is True
          f=json.load(open(files[0],encoding='utf-8'))
          g=json.load(open(files[1],encoding='utf-8'))
          r=json.load(open(files[3],encoding='utf-8'))
          p=json.load(open(files[4],encoding='utf-8'))
          assert f['compatible_pair']=='YES'
          assert g['status']=='PASS_GRAPH_COMPILED_AND_EXACT_ORBITS_STAGED_EXECUTION_NOT_RUN'
          assert g['graph_sha256']=='529491a9e7e431788bda202e2e1f87a342835d6f1d3d3ec1dd88ec01f400b8e2'
          assert r['installer_byte_verified'] is True and r['sha256_match'] is True
          assert p['r2_prerequisite_gate']=='PASS'
          assert g['comparison_performed'] is False and g['r3_common_support_built'] is False and g['r4_difference_computed'] is False
          print('Frozen R2 execution prerequisites: PASS')
          PY
      - name: Recreate verified SNAP 14 runtime
        run: |
          rm -rf /tmp/ibvf-r2-exec
          mkdir -p /tmp/ibvf-r2-exec
          python scripts/ibvf_snap_runtime_install_freeze.py \
            --contract site/data/validation/cashahuacra_sentinel1_r2_runtime_contract.json \
            --byte-report site/data/validation/cashahuacra_sentinel1_r2_runtime_bytes.json \
            --work-dir /tmp/ibvf-r2-exec/runtime-work \
            --output /tmp/ibvf-r2-exec/runtime-install.json \
            | tee /tmp/ibvf-r2-exec/runtime-summary.log
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ibvf-r2-exec/runtime-install.json',encoding='utf-8'))
          assert d['status']=='SNAP_RUNTIME_METADATA_FROZEN_R2_EXECUTION_GATE_PASS'
          assert d['gpt_release_version']=='14.0.0'
          assert d['automatic_update_invoked'] is False
          print('SNAP runtime recreation: PASS')
          PY
      - name: Recreate exact ellipsoidal DEM
        run: |
          python scripts/ibvf_cashahuacra_r2_ellipsoidal_dem.py \
            --contract site/data/validation/cashahuacra_r2_ellipsoidal_dem_contract.json \
            --prerequisites site/data/validation/cashahuacra_sentinel1_r2_prerequisites.json \
            --output-dem /tmp/ibvf-r2-exec/cashahuacra_glo30_wgs84_ellipsoidal.tif \
            --output-report /tmp/ibvf-r2-exec/ellipsoidal-dem.json \
            | tee /tmp/ibvf-r2-exec/dem-summary.log
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ibvf-r2-exec/ellipsoidal-dem.json',encoding='utf-8'))
          assert d['ellipsoidal_dem_gate']=='PASS'
          assert d['output_dem']['sha256']=='00e3305219f0400ceca1fa39708de3e2ed31708e0a37c29b96a87d88e119aab2'
          print('Exact R2 DEM recreation: PASS')
          PY
      - name: Recompile identical graph and stage exact POEORB bytes
        run: |
          mkdir -p /tmp/ibvf-r2-exec/graph /tmp/ibvf-r2-exec/home/.snap/auxdata
          python scripts/ibvf_sentinel1_r2_compile_graph.py \
            --contract site/data/validation/cashahuacra_sentinel1_r2_contract.json \
            --prerequisites site/data/validation/cashahuacra_sentinel1_r2_prerequisites.json \
            --operator-schema site/data/validation/cashahuacra_sentinel1_r2_operator_schema.json \
            --orbit-schema site/data/validation/cashahuacra_sentinel1_r2_orbit_operator_schema.json \
            --runtime-report site/data/validation/cashahuacra_sentinel1_r2_runtime_install.json \
            --ellipsoidal-dem-report site/data/validation/cashahuacra_r2_ellipsoidal_dem.json \
            --output-dir /tmp/ibvf-r2-exec/graph \
            --stage-orbits-dir /tmp/ibvf-r2-exec/home/.snap/auxdata \
            | tee /tmp/ibvf-r2-exec/graph-summary.log
          python - <<'PY'
          import hashlib,pathlib
          new=pathlib.Path('/tmp/ibvf-r2-exec/graph/cashahuacra_sentinel1_r2_graph.xml')
          archived=pathlib.Path('site/data/validation/cashahuacra_sentinel1_r2_graph.xml')
          nh=hashlib.sha256(new.read_bytes()).hexdigest(); ah=hashlib.sha256(archived.read_bytes()).hexdigest()
          assert nh==ah=='529491a9e7e431788bda202e2e1f87a342835d6f1d3d3ec1dd88ec01f400b8e2'
          print('Identical graph recreation: PASS',nh)
          PY
      - name: Execute R2 independently for pre and post
        id: execute
        continue-on-error: true
        run: |
          python scripts/ibvf_sentinel1_r2_execute.py \
            --freeze site/data/validation/cashahuacra_sentinel1_freeze.json \
            --graph /tmp/ibvf-r2-exec/graph/cashahuacra_sentinel1_r2_graph.xml \
            --graph-report /tmp/ibvf-r2-exec/graph/cashahuacra_sentinel1_r2_graph_compile.json \
            --gpt /tmp/ibvf-r2-exec/runtime-work/snap14/bin/gpt \
            --dem /tmp/ibvf-r2-exec/cashahuacra_glo30_wgs84_ellipsoidal.tif \
            --user-home /tmp/ibvf-r2-exec/home \
            --work-dir /tmp/ibvf-r2-exec/execution \
            --output /tmp/ibvf-r2-exec/cashahuacra_sentinel1_r2_execution.json \
            | tee /tmp/ibvf-r2-exec/execution-summary.log
      - name: Archive R2 execution evidence and synchronize scientific map
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -f /tmp/ibvf-r2-exec/cashahuacra_sentinel1_r2_execution.json ]; then
            cp /tmp/ibvf-r2-exec/cashahuacra_sentinel1_r2_execution.json site/data/validation/cashahuacra_sentinel1_r2_execution.json
            python - <<'PY'
          import json
          from pathlib import Path
          rp=Path('site/data/validation/cashahuacra_sentinel1_r2_execution.json')
          mp=Path('site/data/validation/independent_basin_validation_map.json')
          r=json.loads(rp.read_text(encoding='utf-8')); m=json.loads(mp.read_text(encoding='utf-8'))
          c=next(x for x in m['cases'] if x['unit_id']=='cashahuacra')
          c['sentinel1_r2_execution_path']='data/validation/cashahuacra_sentinel1_r2_execution.json'
          c['sentinel1_r2_execution_status']=r['status']
          c['sentinel1_r2_processing_executed']=r['r2_processing_executed']
          c['sentinel1_r2_poeorb_consumption_verified']=r['poeorb_consumption_verified_both_dates']
          c['sentinel1_prepost_difference_computed']=False
          if r['status'].startswith('PASS_R2_'):
              c['framework_stage']='A4_R2_COMPLETE_POEORB_VERIFIED_R3_COMMON_SUPPORT_PENDING'
              c['remote_sensing_status']='S1_R2_PRE_POST_INDEPENDENT_PROCESSING_COMPLETE_POEORB_VERIFIED_NO_DIFFERENCE_R3_PENDING'
          elif r['r2_processing_executed']:
              c['framework_stage']='A4_R2_OUTPUTS_EXIST_POEORB_CONSUMPTION_UNVERIFIED_R3_BLOCKED'
              c['remote_sensing_status']='S1_R2_OUTPUTS_EXIST_POEORB_CONSUMPTION_UNVERIFIED_NO_DIFFERENCE_R3_BLOCKED'
          else:
              c['framework_stage']='A4_R2_EXECUTION_BLOCKED_UNKNOWN_NOT_MISSING'
              c['remote_sensing_status']='S1_R2_EXECUTION_BLOCKED_UNKNOWN_NOT_MISSING_NO_DIFFERENCE'
          m['serious_modeling_gate']='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data/validation/cashahuacra_sentinel1_r2_execution.json site/data/validation/independent_basin_validation_map.json
            if ! git diff --cached --quiet; then
              git commit -m 'IBVF: archive Cashahuacra Sentinel-1 R2 execution evidence'
              git fetch origin "$BRANCH"
              git rebase "origin/$BRANCH"
              git push origin HEAD:"$BRANCH"
            fi
          else
            echo 'No R2 execution report was produced; nothing scientific is imputed.'
          fi
      - name: Upload bounded R2 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashahuacra-sentinel1-r2-execution-${{ github.sha }}
          path: |
            /tmp/ibvf-r2-exec/cashahuacra_sentinel1_r2_execution.json
            /tmp/ibvf-r2-exec/execution-summary.log
            /tmp/ibvf-r2-exec/runtime-install.json
            /tmp/ibvf-r2-exec/ellipsoidal-dem.json
            /tmp/ibvf-r2-exec/graph/cashahuacra_sentinel1_r2_graph_compile.json
            /tmp/ibvf-r2-exec/execution/pre_gpt.log
            /tmp/ibvf-r2-exec/execution/post_gpt.log
            /tmp/ibvf-r2-exec/execution/cashahuacra_pre_r2_gamma0_tc.tif
            /tmp/ibvf-r2-exec/execution/cashahuacra_post_r2_gamma0_tc.tif
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed unless R2 and both precise-orbit consumptions are verified
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/ibvf-r2-exec/cashahuacra_sentinel1_r2_execution.json')
          if not p.exists():
              raise SystemExit('R2 report absent: UNKNOWN/BLOCKED, never MISSING')
          d=json.load(open(p,encoding='utf-8'))
          assert d['production_use'] is False and d['production_ready'] is False and d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False and d['territorial_activation_evidence_blinded'] is True
          assert d['comparison_performed'] is False and d['r3_common_support_built'] is False and d['r4_difference_computed'] is False
          assert d['activation_inference_allowed'] is False and d['case_control_role_assigned'] is False
          if d['status']!='PASS_R2_PRE_POST_EXECUTED_EXACT_GRAPH_AND_POEORB_CONSUMPTION_VERIFIED_R3_ALLOWED':
              raise SystemExit('R2 remains fail-closed: '+d['status'])
          print('R2 scientific execution gate: PASS; R3 may now be built, R4 remains prohibited.')
          PY
