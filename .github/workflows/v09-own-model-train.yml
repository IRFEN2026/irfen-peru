name: IRFEN v0.9 - Entrenar modelo estadístico propio (TEST_ONLY)

# Mismo aislamiento que el motor: solo desde v09/forecast-engine; el cálculo (Python, PyPI) corre con permiso de solo
# lectura; un segundo job, que solo usa git, aplica el resultado en v09/forecast-data (data/v09/model únicamente).
# Descarga insumos históricos (PISCO SENAMHI, OISST, índices CPC/IGP, NCEP/NCAR R1, ETOPO), reanudable por año, y
# ajusta el modelo con validación cruzada por temporada. Solo a pedido: no tiene disparo por push ni programado, para
# no competir con el motor por su grupo de concurrencia (no lanzar cerca de las 08:40 / 20:40 UTC).

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: v09-forecast-engine   # comparte grupo con el motor: nunca calculan sobre la misma base a la vez
  cancel-in-progress: false

env:
  DATA_BRANCH: v09/forecast-data

jobs:
  compute:
    if: github.ref == 'refs/heads/v09/forecast-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 210   # 9000 + 2700 s = 195 min de límites internos (PISCO: ~4-5 min por año)
    permissions:
      contents: read
    outputs:
      data_sha: ${{ steps.base.outputs.sha }}
    env:
      IRFEN_FC_DATA: ${{ github.workspace }}/_data
    steps:
      - name: Engine code (read-only, no stored credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Results branch as working state (read-only, no stored credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: v09/forecast-data
          path: _data
          fetch-depth: 1
          persist-credentials: false
      - name: Record the results-branch base commit
        id: base
        run: echo "sha=$(git -C _data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install bounded dependencies (this job cannot write to the repository)
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<2" "shapely>=2.0,<3" "requests>=2.31,<3" "netCDF4>=1.6,<2"
      - name: Build historical inputs (resumable; each source reported separately, never zero-filled)
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 9000s python scripts/v09_own_model.py build-inputs
      - name: Train with leave-one-season-out validation
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 2700s python scripts/v09_own_model.py train
      - name: Stage results (regular files only, data/v09/model only)
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/results"
          mkdir -p "$OUT"
          if [ -d _data/data/v09/model ]; then cp -a _data/data/v09/model "$OUT/model"; fi
          bad=$(find "$OUT" -mindepth 1 ! -type f ! -type d -print)
          if [ -n "$bad" ]; then echo "::error::symlinks or special files in results: $bad"; exit 1; fi
      - name: Hand results to the persist job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: model-results-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  persist:
    needs: compute
    if: ${{ !cancelled() && needs.compute.result == 'success' && github.ref == 'refs/heads/v09/forecast-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: v09-forecast-data-write
      cancel-in-progress: false
    env:
      BASE_SHA: ${{ needs.compute.outputs.data_sha }}
      ALLOWED_DELETIONS: ^$
      ALLOWED: ^data/v09/model/
    steps:
      - name: Results branch at the exact base the compute job used
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.compute.outputs.data_sha }}
          fetch-depth: 0
      - name: Receive results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: model-results-${{ github.run_id }}
          path: ${{ runner.temp }}/results
      - name: Guard - only regular files, only data/v09/model, base unchanged
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/results"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          # la base debe pertenecer a la rama de datos (QA BAJA-1), no solo coincidir con el checkout
          git fetch -q origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" "origin/$DATA_BRANCH"
          bad=$(find "$IN" -mindepth 1 ! -type f ! -type d -print)
          if [ -n "$bad" ]; then echo "::error::symlinks or special files: $bad"; exit 1; fi
          for entry in "$IN"/*; do
            case "$(basename "$entry")" in model) ;; *) echo "::error::unexpected top-level: $entry"; exit 1;; esac
          done
          mkdir -p data/v09/model
          rsync -a --delete --checksum "$IN/model/" "data/v09/model/"
          mkdir -p data/v09/model
          git add -A -- data/v09/model
          staged=$(git diff --cached --name-only --no-renames -z | tr '\0' '\n')
          outside=$(printf '%s\n' "$staged" | grep -v -E "$ALLOWED" | grep -v '^$' || true)
          if [ -n "$outside" ]; then echo "::error::staged paths outside data/v09/model: $outside"; exit 1; fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all -z -- . ':!data/v09/model')" ]; then
            echo "::error::unexpected working-tree changes outside data/v09/model"; exit 1
          fi
          # Solo agregar (QA MEDIA-2): nada se borra salvo lo permitido y los registros JSONL solo crecen (el contenido
          # de la base debe ser prefijo exacto del nuevo). Un script fallido o un paquete comprometido no puede truncar historia.
          deleted=$(git diff --cached --name-only --no-renames --diff-filter=D | grep -v -E "$ALLOWED_DELETIONS" || true)
          if [ -n "$deleted" ]; then echo "::error::deletions are not allowed: $deleted"; exit 1; fi
          while IFS= read -r f; do
            case "$f" in *.jsonl) ;; *) continue ;; esac
            n=$(git cat-file -s "$BASE_SHA:$f")
            if ! cmp -s -n "$n" <(git show "$BASE_SHA:$f") "$f"; then echo "::error::append-only ledger rewritten: $f"; exit 1; fi
          done < <(git diff --cached --name-only --no-renames --diff-filter=M)
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - name: Commit and push to the results branch only (bounded rebase, never --force)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "IRFEN v0.9: insumos y modelo estadístico propio (TEST_ONLY)"
          for attempt in 1 2 3 4; do
            git fetch -q origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            if ! git rebase -q "origin/$DATA_BRANCH"; then git rebase --abort || true; echo "Real conflict; not overwriting" >&2; exit 1; fi
            if git push -q origin "HEAD:refs/heads/$DATA_BRANCH"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
