name: IRFEN - Chosica 2015 Landsat 8 multiscene descriptive

on:
  pull_request:
    paths:
      - config/chosica_2015_landsat8_multiscene_mirror_freeze_record_v0_1.json
      - config/chosica_2015_landsat8_multiscene_descriptive_contract_v0_1.json
      - scripts/compute_chosica_2015_landsat8_multiscene_descriptive.py
      - .github/workflows/chosica-2015-landsat8-multiscene-descriptive.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  descriptive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_landsat8_multiscene_descriptive_contract_v0_1.json
            scripts/compute_chosica_2015_landsat8_multiscene_descriptive.py
            .github/workflows/chosica-2015-landsat8-multiscene-descriptive.yml
      - name: Assert forbidden paths absent
        run: |
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
      - name: Download exact frozen clean-room inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sources/inventory sources/geometry artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10180828990/zip" > /tmp/i.zip
          unzip -q /tmp/i.zip -d sources/inventory
          test "$(sha256sum sources/inventory/chosica_2015_landsat8_multiscene_mirror_v0_1.json | cut -d' ' -f1)" = "9530e2179171db8b6f9e1908ab2d33678a3d9340f92cfe0ae5097484ab1f3556"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10171108859/zip" > /tmp/g.zip
          unzip -q /tmp/g.zip -d sources/geometry
          test "$(sha256sum sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson | cut -d' ' -f1)" = "9a23644c191c88fb66722b368773251051b4098ddd74e4d5861c3a37dbfbb1ca"
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2' 'planetary-computer>=1,<2'
      - name: Compute threshold-free descriptive composite
        run: |
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/compute_chosica_2015_landsat8_multiscene_descriptive.py --contract config/chosica_2015_landsat8_multiscene_descriptive_contract_v0_1.json --inventory sources/inventory/chosica_2015_landsat8_multiscene_mirror_v0_1.json --geometry sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson --output artifacts/chosica_2015_landsat8_multiscene_descriptive_v0_1.json
      - name: Enforce descriptive-only guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_landsat8_multiscene_descriptive_v0_1.json'))
          assert d['status']=='PASS_LANDSAT8_ALL_SCENE_THRESHOLD_FREE_DESCRIPTIVE_COMPOSITE' and d['candidate_count']==7
          assert d['all_frozen_scenes_used'] is True and d['candidate_level_coverage_threshold_used'] is False and d['classification_thresholds_used'] is False
          for k in ('outcome_labels_assigned','no_change_interpreted_as_control','large_change_interpreted_as_activation','mirror_bytes_independently_matched_to_usgs_origin_for_all_items','target_names_or_ids_read','target_outcomes_read','a6680_read','contaminated_adjudication_used','scene_selection_modified','candidate_selection_modified','candidate_ranking_modified','feedback_to_matching_performed','free_web_search_used','sealed_target_unblind_allowed'): assert d[k] is False,k
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-landsat8-multiscene-descriptive
          path: artifacts/chosica_2015_landsat8_multiscene_descriptive_v0_1.json
          if-no-files-found: error
