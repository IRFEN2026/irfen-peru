name: IRFEN issue496 temporal audit (research only)
on:
  pull_request:
    paths:
      - 'research/issue496/temporal_window_audit.py'
      - 'tests/test_issue496_temporal_window_audit.py'
      - '.github/workflows/issue496-temporal-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated offline tests
        run: python -m unittest discover -s tests -p test_issue496_temporal_window_audit.py -v
