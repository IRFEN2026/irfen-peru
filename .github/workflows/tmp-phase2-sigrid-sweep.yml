name: TMP one-off SIGRID ANA 2016 record-page sweep (metadata only; removed next commit)
on:
  push:
    branches: [inventory/sigrid-ana2016-sweep-r8-20261022]
    paths: [.github/workflows/tmp-phase2-sigrid-sweep.yml]
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sweep SIGRID record pages (no document downloads, no redirects)
        run: |
          python scripts/phase2_sigrid_ana2016_sweep.py fetch --out data/phase2/source_archive/sigrid_ana2016_sweep_20261022
          python - <<'PY'
          import json, collections
          d = json.load(open("data/phase2/source_archive/sigrid_ana2016_sweep_20261022/sweep_ledger_v0_1.json"))
          print(f"::notice title=sweep outcomes::{json.dumps(d['outcomes'])}")
          errs = [(r['sigrid_id'], r['error'] or r['http_status']) for r in d['records'] if r['outcome'] == 'ERROR']
          print(f"::notice title=sweep errors::{errs[:40]}")
          q = [r for r in d['records'] if r['outcome'] == 'QUEBRADA_RECORD']
          print("::notice title=quebrada departments::" + json.dumps(collections.Counter((r['fields']['scope'] or '').split(',')[-1].strip() for r in q)))
          PY
      - name: Commit the frozen sweep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase2/source_archive/sigrid_ana2016_sweep_20261022
          git commit -q -m "SIGRID ANA 2016 record-page sweep 2026-10-22 (metadata only, SHA-256 per response)"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
