name: IRFEN — Construir histórico IMERG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install earthaccess h5py numpy
      - name: Descargar y procesar IMERG Final histórico
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python scripts/fetch_history.py
      - name: Guardar history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json
          git diff --cached --quiet || git commit -m "Actualizar histórico IMERG"
          git push
