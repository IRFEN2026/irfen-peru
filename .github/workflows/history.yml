name: IRFEN — Construir histórico IMERG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/history.yml
      - scripts/fetch_history.py
      - scripts/compare_san_ildefonso_history_polygon.py
      - config/historical_events.json
      - config/historical_zones.json
      - site/data/watersheds/san_ildefonso_watershed.geojson

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias históricas
        run: pip install earthaccess h5py numpy shapely

      - name: Descargar y procesar IMERG Final histórico
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python scripts/fetch_history.py

      - name: Comparar San Ildefonso 2017 con microcuenca DEM
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python scripts/compare_san_ildefonso_history_polygon.py

      - name: Validar histórico enriquecido
        run: |
          python -m json.tool site/data/history.json >/dev/null
          test -s site/data/watersheds/san_ildefonso_watershed.geojson

      - name: Guardar history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: histórico San Ildefonso con comparación por microcuenca"
          git push
