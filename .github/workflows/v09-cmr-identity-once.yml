# Retry with collection-scoped NASA producer_granule_id[] documented syntax.
name: IRFEN v0.9 - Auditoria puntual CMR identidad IMERG (SOLO METADATOS)
on:
  push:
    branches:
      - research/imerg34-cmr-identity-audit-20261020
    paths:
      - .github/workflows/v09-cmr-identity-once.yml
permissions:
  contents: write
concurrency:
  group: irfen-imerg34-cmr-identity-once
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/research/imerg34-cmr-identity-audit-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Consultar solamente NASA CMR sin descargar HDF5
        run: |
          set -euo pipefail
          python -m py_compile qa/replay_tools/v09_imerg34_cmr_metadata_audit.py
          python qa/replay_tools/v09_imerg34_cmr_metadata_audit.py
      - name: Conservar evidencia SOLO en rama de investigacion
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/imerg34-cmr-identity-audit-20261020
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/evidence/imerg34_cmr_identity_20261020_v2.json
          git diff --cached --quiet && exit 1
          git commit -m "research: preserve immutable CMR identity catalog evidence"
          git push origin HEAD:research/imerg34-cmr-identity-audit-20261020
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imerg34-cmr-metadata-only
          path: qa/evidence/imerg34_cmr_identity_20261020_v2.json
          retention-days: 30
          if-no-files-found: warn
