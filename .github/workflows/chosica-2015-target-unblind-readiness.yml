name: IRFEN - Chosica 2015 target unblind readiness

on:
  pull_request:
    paths:
      - config/chosica_2015_candidate_only_control_set_freeze_record_v0_1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-neutral-target-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fail closed if control-set freeze record is absent
        run: test -f config/chosica_2015_candidate_only_control_set_freeze_record_v0_1.json
      - name: Evaluate anonymous target-code readiness only
        run: |
          mkdir -p artifacts
          python scripts/evaluate_chosica_2015_target_unblind_readiness.py \
            --contract config/chosica_2015_target_unblind_readiness_contract_v0_1.json \
            --cleanroom-freeze config/chosica_2015_cleanroom_recovery_freeze_record_v0_1.json \
            --contamination config/chosica_2015_control_adjudication_contamination_registry_v0_1.json \
            --control-set-freeze config/chosica_2015_candidate_only_control_set_freeze_record_v0_1.json \
            --output artifacts/chosica_2015_target_unblind_readiness.json
      - name: Enforce no automatic or target-outcome unblind
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_target_unblind_readiness.json',encoding='utf-8'))
          assert d['status']=='PASS_TARGET_UNBLIND_READINESS_EVALUATION'
          assert d['guards']=={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          assert d['automatic_unblind_performed'] is False
          assert d['target_outcomes_read'] is False
          assert d['a6680_read'] is False
          assert d['target_code_count']==6
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-target-unblind-readiness
          path: artifacts/chosica_2015_target_unblind_readiness.json
          if-no-files-found: error
