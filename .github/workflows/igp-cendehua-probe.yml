name: IRFEN - Probar acceso IGP CENDEHUA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_igp_cendehua.py
      - .github/workflows/igp-cendehua-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/probe_igp_cendehua.py
      - run: |
          test -s site/data/stations/igp_cendehua_access_probe.json
          python -m json.tool site/data/stations/igp_cendehua_access_probe.json >/dev/null
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations/igp_cendehua_access_probe.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: registrar sondeo IGP CENDEHUA"
          git pull --rebase origin main
          git push
