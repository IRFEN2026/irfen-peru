name: IRFEN - Probar acceso IGP CENDEHUA

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"
  push:
    branches: [main]
    paths:
      - scripts/probe_igp_cendehua.py
      - .github/workflows/igp-cendehua-probe.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: "igp-cendehua-huaycoloro-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/probe_igp_cendehua.py
      - run: |
          test -s site/data/stations/igp_cendehua_access_probe.json
          python -m json.tool site/data/stations/igp_cendehua_access_probe.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/stations/igp_cendehua_access_probe.json').read_text())
          assert p.get('production_use') is False
          assert p.get('production_ready') is False
          signal=p.get('huaycoloro_ground_signal') or {}
          assert signal.get('automatic_outcome_label') is None
          assert signal.get('human_review_required') is True
          archive_path=Path('site/data/stations/igp_cendehua_huaycoloro_archive.json')
          if signal.get('station_count', 0) > 0:
              assert archive_path.is_file()
              a=json.loads(archive_path.read_text())
              assert a.get('integration_mode') == 'TEST_ONLY'
              summary=a.get('summary') or {}
              assert int(summary.get('capture_count',-1)) == int(a.get('capture_count',-2))
              assert summary.get('captures_with_any_provider_activity_true') is not None
              assert (a.get('scientific_gate') or {}).get('automatic_event_or_none_classification') is False
              assert (a.get('scientific_gate') or {}).get('absence_of_provider_activity_is_none') is False
              assert (a.get('scientific_gate') or {}).get('continuity_metrics_are_outcome_labels') is False
          PY
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations/igp_cendehua_access_probe.json
          if test -f site/data/stations/igp_cendehua_huaycoloro_archive.json; then
            git add site/data/stations/igp_cendehua_huaycoloro_archive.json
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "IRFEN v0.8: archivar señal CENDEHUA Huaycoloro"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflicto real al rebasar evidencia CENDEHUA; no se sobrescribe." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Colisión transitoria al publicar evidencia (intento $attempt/4)." >&2
            sleep $((attempt * 3))
          done
          echo "No fue posible publicar evidencia CENDEHUA tras 4 intentos." >&2
          exit 1

      - name: Ordenar publicación del archivo actualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          EXPECTED_SHA="$(git rev-parse origin/main)"
          gh workflow run publish-committed-data.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$EXPECTED_SHA"
