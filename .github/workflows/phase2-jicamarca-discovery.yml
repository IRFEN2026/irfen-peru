name: IRFEN - Phase2 Jicamarca discovery

on:
  pull_request:
    paths:
      - config/phase2_jicamarca_discovery_v0_1.json
      - config/phase2_jicamarca_cendehua_event_metadata_v0_1.json
      - config/phase2_jicamarca_sophy_access_assessment_v0_1.json
      - config/phase2_jicamarca_identity_source_assessment_v0_1.json
      - config/phase2_jicamarca_canto_grande_media_luna_assessment_v0_1.json
      - config/phase2_jicamarca_evidence_index_v0_1.json
      - config/phase2_expansion_scope.json
      - tests/test_phase2_jicamarca_discovery.py
      - tests/test_phase2_jicamarca_sophy_qa.py
      - .github/workflows/phase2-jicamarca-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-jicamarca-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Jicamarca fail-closed tests
        run: python -m pytest -q tests/test_phase2_jicamarca_discovery.py tests/test_phase2_jicamarca_sophy_qa.py
      - name: Revalidate universal local-unit hierarchy
        run: python scripts/validate_phase2_local_activation_hierarchy.py
