name: TMP capture (r2) SIGRID 5729/5733 ANA maps (Quitasol, Paracas) - one run, raw bytes only, removed next commit
on:
  push:
    branches: [probe/pisco-quitasol-paracas-sigrid-20261019]
    paths: [.github/workflows/tmp-sigrid-quitasol-paracas-capture.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Capture (fail-closed; public pages only; no parsing, nothing accepted)
        shell: bash
        run: |
          set +e +o pipefail
          OUT=data/phase2/source_archive/pisco_quitasol_paracas_sigrid_20261019
          mkdir -p "$OUT"
          UA="IRFEN-research-archive/0.1 (+https://github.com/IRFEN2026/irfen-peru; one-off documentary capture)"
          now() { date -u +%Y-%m-%dT%H:%M:%SZ; }
          # robots.txt: recorded; if it disallows the document paths for all agents, stop before any download.
          code=$(curl -sS -A "$UA" --proto '=https' --max-time 60 -o "$OUT/robots.txt" -w '%{http_code}' https://sigrid.cenepred.gob.pe/robots.txt || echo 000)
          echo -e "$(now)\trobots.txt\t$code" > "$OUT/capture_log.tsv"
          if [ "$code" = "200" ] && awk 'BEGIN{IGNORECASE=1} /^user-agent:[ \t]*\*/{a=1;next} /^user-agent:/{a=0} a && /^disallow:[ \t]*\/(sigridv3)?[ \t]*$|^disallow:[ \t]*\/sigridv3\/documento/{f=1} END{exit !f}' "$OUT/robots.txt"; then
            echo "robots.txt disallows document paths: stopping" | tee -a "$OUT/capture_log.tsv"; DISALLOWED=1
          else DISALLOWED=0; fi
          [ "$code" = "200" ] || rm -f "$OUT/robots.txt"
          for id in 5729 5733; do
            [ "$DISALLOWED" = "1" ] && break
            for kind in page file; do
              url="https://sigrid.cenepred.gob.pe/sigridv3/documento/$id"; [ "$kind" = file ] && url="$url/descargar"
              tmp=$(mktemp -d)
              meta=$(curl -sS -A "$UA" --proto '=https' --proto-redir '=https' -L --max-redirs 3 --max-time 120 \
                     -D "$tmp/headers" -o "$tmp/body" -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}' "$url" || echo -e "000\t-\t-\t0")
              status=$(cut -f1 <<<"$meta"); final=$(cut -f2 <<<"$meta")
              host=$(sed -E 's#^https://([^/]+)/.*#\1#' <<<"$final")
              if [ "$status" != "200" ] || [ "$host" != "sigrid.cenepred.gob.pe" ]; then
                echo -e "$(now)\t$id\t$kind\t$meta\tREJECTED(status_or_host)" >> "$OUT/capture_log.tsv"; rm -rf "$tmp"; continue
              fi
              cd_name=$(grep -i '^content-disposition:' "$tmp/headers" | tail -1 | sed -nE 's/.*filename\*?=("?)(UTF-8'"''"')?([^";]+)\1.*/\3/ip' | tr -d '\r' | tr -c 'A-Za-z0-9._-' '_' | cut -c1-120)
              [ -n "$cd_name" ] || cd_name="${kind}.bin"; [ "$kind" = page ] && cd_name="page.html"
              mkdir -p "$OUT/$id"; mv "$tmp/body" "$OUT/$id/$cd_name"; grep -iE '^(HTTP/|content-type|content-length|content-disposition|last-modified|etag|location):' "$tmp/headers" | tr -d '\r' > "$OUT/$id/${kind}_headers.txt"
              sha=$(sha256sum "$OUT/$id/$cd_name" | cut -d' ' -f1)
              echo -e "$(now)\t$id\t$kind\t$meta\t$cd_name\t$sha" >> "$OUT/capture_log.tsv"; rm -rf "$tmp"
            done
          done
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          while IFS= read -r line; do echo "::notice title=capture::$(echo "$line" | tr '\t' ' ' | sed 's/%/%25/g' | cut -c1-600)"; done < "$OUT/capture_log.tsv"
          ls -la "$OUT" "$OUT"/* 2>/dev/null | sed 's/^/::notice title=files::/' | head -20
          exit 0
      - name: Commit raw capture (github-actions[bot]); nothing is accepted or parsed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase2/source_archive/pisco_quitasol_paracas_sigrid_20261019
          git diff --cached --quiet && exit 0
          git commit -q -m "Raw capture: SIGRID 5729/5733 ANA 2016 maps (Quitasol, Paracas) with SHA-256; nothing accepted"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
