# TEMPORARY probe (removed in the next commit): which INDECI WordPress REST routes list aviso bulletins.
name: TMP v0.9 INDECI discovery probe
on:
  push:
    branches: [v09/senamhi-avisos-capture-v0-1]
    paths: [.github/workflows/tmp-v09-indeci-discovery-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: python
        run: |
          import json, urllib.request, urllib.parse
          UA={"User-Agent":"IRFEN-v0.9-research-aviso-archive/1.0 (+https://github.com/IRFEN2026/irfen-peru)"}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40) as r:
                      return r.status, r.headers.get("X-WP-Total"), r.read(3_000_000)
              except Exception as e:
                  return getattr(e,"code",None), None, str(e).encode()[:200]
          B="https://portal.indeci.gob.pe/wp-json/wp/v2/"
          tests=[("types",B+"types"),
                 ("media_aviso",B+"media?search=aviso&per_page=10&orderby=date&order=desc&_fields=id,date,modified,title,source_url"),
                 ("media_boletin",B+"media?search=boletin&per_page=10&orderby=date&order=desc&_fields=id,date,title,source_url"),
                 ("media_latest",B+"media?per_page=15&orderby=date&order=desc&_fields=id,date,title,source_url,mime_type"),
                 ("posts_aviso",B+"posts?search=aviso&per_page=10&_fields=id,date,title,link,type"),
                 ("emergencias_aviso",B+"emergencias?search=aviso&per_page=10&_fields=id,date,title,link"),
                 ("emergencias_latest",B+"emergencias?per_page=15&_fields=id,date,title,link")]
          for name,u in tests:
              st,tot,body=get(u)
              summ=""
              try:
                  j=json.loads(body)
                  if name=="types": summ=", ".join(f"{k}:{v.get('rest_base')}" for k,v in j.items())
                  elif isinstance(j,list): summ=" || ".join(f"{x.get('date','')[:16]} {(x.get('title') or {}).get('rendered','')[:90]} {x.get('source_url') or x.get('link') or ''}" for x in j)
                  else: summ=str(j)[:300]
              except Exception: summ=body[:200].decode('utf-8','replace')
              print(f"::notice title=PROBE_{name}::status={st} total={tot} {summ[:3500].replace('%','%25')}")
