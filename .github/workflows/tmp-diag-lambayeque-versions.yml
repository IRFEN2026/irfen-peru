name: TMP diag (r4) Lambayeque fix - tests on ubuntu-24.04 and ubuntu-latest, plus negative proof with main's script (read-only)
on:
  push:
    branches: [diag/lambayeque-version-matrix-20261019]
    paths: [.github/workflows/tmp-diag-lambayeque-versions.yml]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set +e
          pip install -q -r requirements.txt -r requirements-ci-test.txt >/dev/null 2>&1
          R=$(python -m pytest -q tests/test_lambayeque_check_only_integrity.py tests/test_lambayeque_hydrologic_migration.py -rs 2>&1 | tail -4 | tr '\n' ' ')
          echo "::warning title=${{ matrix.os }} FIX tests::$R"
          out=$(python scripts/build_lambayeque_hydrologic_units.py --check-only 2>&1 >/dev/null); rc=$?
          echo "::warning title=${{ matrix.os }} FIX check-only::rc=$rc writes=$(git status --porcelain --untracked-files=no | wc -l) $(echo "$out" | head -3 | tr '\n' ' ' | cut -c1-500)"
          python scripts/build_map_layer_catalog.py --check-only >/tmp/m 2>&1; echo "::warning title=${{ matrix.os }} FIX map catalog check::rc=$? $(tail -1 /tmp/m | cut -c1-150)"
          git checkout -q origin/main -- scripts/build_lambayeque_hydrologic_units.py tests/test_lambayeque_hydrologic_migration.py
          R=$(python -m pytest -q tests/test_lambayeque_check_only_integrity.py -rs 2>&1 | grep -E "passed|failed" | tail -1)
          echo "::warning title=${{ matrix.os }} NEGATIVE (main script)::$R ; files rewritten after: $(git status --porcelain --untracked-files=no -- site config | wc -l)"
