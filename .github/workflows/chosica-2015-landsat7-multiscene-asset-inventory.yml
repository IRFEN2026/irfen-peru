name: IRFEN - Chosica 2015 Landsat 7 multiscene asset inventory

on:
  pull_request:
    paths:
      - config/chosica_2015_landsat7_multiscene_asset_inventory_contract_v0_1.json
      - scripts/inventory_chosica_2015_landsat7_multiscene_assets.py
      - .github/workflows/chosica-2015-landsat7-multiscene-asset-inventory.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory-all-fixed-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_landsat7_multiscene_asset_inventory_contract_v0_1.json
            scripts/inventory_chosica_2015_landsat7_multiscene_assets.py
            .github/workflows/chosica-2015-landsat7-multiscene-asset-inventory.yml
      - name: Assert forbidden scientific paths absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09_b.json
      - name: Download exact frozen Landsat 7 availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources/availability artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10180090979/zip" > /tmp/availability.zip
          unzip -q /tmp/availability.zip -d sources/availability
          test "$(sha256sum sources/availability/chosica_2015_candidate_landsat7_availability_mirror_v0_2.json | cut -d' ' -f1)" = "32659a5d9201f793fb5fbb49af16d05580a8107124152b37cfe658ced1d6ea75"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install 'requests>=2.31,<3'
      - name: Inventory all fixed-window scene assets
        run: |
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/inventory_chosica_2015_landsat7_multiscene_assets.py \
            --contract config/chosica_2015_landsat7_multiscene_asset_inventory_contract_v0_1.json \
            --availability sources/availability/chosica_2015_candidate_landsat7_availability_mirror_v0_2.json \
            --output artifacts/chosica_2015_landsat7_multiscene_asset_inventory_v0_1.json
      - name: Enforce no-pixel guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_landsat7_multiscene_asset_inventory_v0_1.json'))
          assert d['status']=='FROZEN_LANDSAT7_ALL_FIXED_WINDOW_SCENE_ASSET_METADATA'
          assert d['pre_scene_count']==3 and d['post_scene_count']==4 and len(d['items'])==7
          for k in ('asset_href_requested','pixel_bytes_read','surface_signal_observed','outcome_evidence_read','target_names_or_ids_read','a6680_read','contaminated_adjudication_used','scene_selection_modified','candidate_selection_modified','candidate_ranking_modified','free_web_search_used','control_labels_assigned','sealed_target_unblind_allowed'):
              assert d[k] is False, k
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-landsat7-multiscene-asset-inventory
          path: artifacts/chosica_2015_landsat7_multiscene_asset_inventory_v0_1.json
          if-no-files-found: error
