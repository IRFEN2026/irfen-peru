name: IRFEN - Phase2 Chicama official geometry freeze

on:
  pull_request:
    paths:
      - site/data/validation/phase2_discovery_contracts/lalibertad_chicama.json
      - site/data/validation/phase2_discovery_packages/lalibertad_chicama.json
      - site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_chicama_13772.geojson
      - site/data/phase2/geometries/lalibertad_chicama_basin_context.geojson
      - site/data/phase2/geometries/lalibertad_chicama_geometry_validation.json
      - scripts/probe_phase2_chicama_official_geometry.py
      - scripts/verify_phase2_chicama_official_geometry.py
      - tests/test_phase2_chicama_discovery_package.py
      - site/data/map_layers.json
      - .github/workflows/phase2-chicama-official-geometry-freeze.yml

permissions:
  contents: write

jobs:
  bootstrap-or-replay-exact-ana-geometry:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bootstrap once or replay frozen exact ANA Chicama unit
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_chicama_13772.geojson
          if [[ ! -f "$SOURCE" ]]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            python scripts/probe_phase2_chicama_official_geometry.py --refresh-source
            python scripts/verify_phase2_chicama_official_geometry.py
            python scripts/build_map_layer_catalog.py
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            python scripts/verify_phase2_chicama_official_geometry.py
            python scripts/build_map_layer_catalog.py --check-only
          fi
      - name: Enforce Chicama scientific guards
        run: python -m pytest -q tests/test_phase2_chicama_discovery_package.py
      - name: Commit frozen official source and normalized research geometry once
        if: steps.mode.outputs.bootstrap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/validation/phase2_discovery_contracts/lalibertad_chicama.json \
            site/data/validation/phase2_discovery_packages/lalibertad_chicama.json \
            site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_chicama_13772.geojson \
            site/data/phase2/geometries/lalibertad_chicama_basin_context.geojson \
            site/data/phase2/geometries/lalibertad_chicama_geometry_validation.json \
            site/data/map_layers.json
          if git diff --cached --quiet; then
            echo "No bootstrap changes to persist"
          else
            git commit -m "Freeze exact ANA Chicama discovery geometry"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
