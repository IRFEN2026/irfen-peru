name: IBVF Cashahuacra Sentinel-1 R2 frozen graph

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'scripts/ibvf_sentinel1_r2_compile_graph.py'
      - 'site/data/validation/cashahuacra_sentinel1_r2_contract.json'
      - 'site/data/validation/cashahuacra_sentinel1_r2_prerequisites.json'
      - 'site/data/validation/cashahuacra_sentinel1_r2_operator_schema.json'
      - 'site/data/validation/cashahuacra_sentinel1_r2_orbit_operator_schema.json'
      - 'site/data/validation/cashahuacra_sentinel1_r2_runtime_install.json'
      - 'site/data/validation/cashahuacra_r2_ellipsoidal_dem.json'
      - '.github/workflows/ibvf-cashahuacra-s1-r2-graph.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-frozen-r2-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Compile exact preregistered graph and stage frozen POEORB bytes
        run: |
          python -m py_compile scripts/ibvf_sentinel1_r2_compile_graph.py
          rm -rf /tmp/ibvf-r2-graph
          mkdir -p /tmp/ibvf-r2-graph/output /tmp/ibvf-r2-graph/home/.snap/auxdata
          python scripts/ibvf_sentinel1_r2_compile_graph.py \
            --contract site/data/validation/cashahuacra_sentinel1_r2_contract.json \
            --prerequisites site/data/validation/cashahuacra_sentinel1_r2_prerequisites.json \
            --operator-schema site/data/validation/cashahuacra_sentinel1_r2_operator_schema.json \
            --orbit-schema site/data/validation/cashahuacra_sentinel1_r2_orbit_operator_schema.json \
            --runtime-report site/data/validation/cashahuacra_sentinel1_r2_runtime_install.json \
            --ellipsoidal-dem-report site/data/validation/cashahuacra_r2_ellipsoidal_dem.json \
            --output-dir /tmp/ibvf-r2-graph/output \
            --stage-orbits-dir /tmp/ibvf-r2-graph/home/.snap/auxdata \
            | tee /tmp/ibvf-r2-graph/summary.log
      - name: Fail-closed scientific and identity guards
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path('/tmp/ibvf-r2-graph/output')
          d=json.load(open(p/'cashahuacra_sentinel1_r2_graph_compile.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False and d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False and d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert d['pre_post_sar_values_read'] is False and d['comparison_performed'] is False
          assert d['r2_processing_executed'] is False and d['r3_common_support_built'] is False and d['r4_difference_computed'] is False
          assert d['activation_inference_allowed'] is False
          assert d['status']=='PASS_GRAPH_COMPILED_AND_EXACT_ORBITS_STAGED_EXECUTION_NOT_RUN'
          assert d['orbit_staging_gate']=='PASS_EXACT_FROZEN_BYTES_STAGED_CONSUMPTION_NOT_YET_VERIFIED'
          assert len(d['orbit_staging'])==2 and all(x['status']=='PASS_EXACT_AUX_POEORB_STAGED' for x in d['orbit_staging'])
          graph=p/'cashahuacra_sentinel1_r2_graph.xml'
          assert hashlib.sha256(graph.read_bytes()).hexdigest()==d['graph_sha256']
          root=ET.parse(graph).getroot()
          ops=[x.findtext('operator') for x in root.findall('node')]
          assert ops==['Read','ThermalNoiseRemoval','Apply-Orbit-File','Calibration','Terrain-Flattening','Terrain-Correction','Write']
          text=graph.read_text(encoding='utf-8')
          assert 'EPSG:32718' in text and '${externalDEMFile}' in text and 'Sentinel Precise (Auto Download)' in text
          assert 'Speckle' not in text
          print('Frozen R2 graph + exact POEORB staging: PASS; execution remains prohibited in this workflow.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cashahuacra-sentinel1-r2-frozen-graph-${{ github.sha }}
          path: |
            /tmp/ibvf-r2-graph/output/cashahuacra_sentinel1_r2_graph.xml
            /tmp/ibvf-r2-graph/output/cashahuacra_sentinel1_r2_graph_compile.json
            /tmp/ibvf-r2-graph/summary.log
          if-no-files-found: error
          retention-days: 30
      - name: Archive graph contract on research branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cp /tmp/ibvf-r2-graph/output/cashahuacra_sentinel1_r2_graph.xml site/data/validation/cashahuacra_sentinel1_r2_graph.xml
          cp /tmp/ibvf-r2-graph/output/cashahuacra_sentinel1_r2_graph_compile.json site/data/validation/cashahuacra_sentinel1_r2_graph_compile.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/validation/cashahuacra_sentinel1_r2_graph.xml site/data/validation/cashahuacra_sentinel1_r2_graph_compile.json
          if git diff --cached --quiet; then
            echo 'No frozen graph evidence change.'
          else
            git commit -m 'IBVF: freeze exact Cashahuacra Sentinel-1 R2 graph'
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
