name: IRFEN - Phase2 Supe discovery bootstrap

on:
  pull_request:
    paths:
      - config/phase2_north_coast_discovery_inventory_v0_1.json
      - site/data/validation/phase2_discovery_contracts/lima_norte_supe_caleta_vidal.json
      - site/data/validation/phase2_discovery_packages/lima_norte_supe_caleta_vidal.json
      - scripts/bootstrap_phase2_supe_discovery.py
      - tests/test_phase2_supe_inventory_geometry.py
      - tests/test_phase2_supe_caleta_vidal_discovery_package.py
      - .github/workflows/phase2-supe-inventory-geometry-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Register Supe discovery and freeze exact ANA source
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=site/data/phase2/sources/north_coast_discovery_geometry/ana_lima_norte_supe_137572.geojson
          if [[ -f "$SOURCE" ]]; then
            python scripts/bootstrap_phase2_supe_discovery.py
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            ok=false
            for attempt in 1 2 3; do
              if python scripts/bootstrap_phase2_supe_discovery.py --refresh-source; then
                ok=true
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 15)); fi
            done
            [[ "$ok" == "true" ]] || { echo "ANA Supe source fetch failed after 3 bounded attempts" >&2; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild research map catalog
        run: python scripts/build_map_layer_catalog.py
      - name: Enforce Supe scientific guards
        run: python -m pytest -q tests/test_phase2_supe_inventory_geometry.py tests/test_phase2_supe_caleta_vidal_discovery_package.py
      - name: Verify map catalog
        run: python scripts/build_map_layer_catalog.py --check-only
      - name: Commit frozen source, inventory registration and research geometry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/phase2_north_coast_discovery_inventory_v0_1.json \
            site/data/phase2/sources/north_coast_discovery_geometry/ana_lima_norte_supe_137572.geojson \
            site/data/phase2/geometries/lima_norte_supe_basin_context.geojson \
            site/data/phase2/geometries/lima_norte_supe_geometry_validation.json \
            site/data/validation/phase2_discovery_contracts/lima_norte_supe_caleta_vidal.json \
            site/data/validation/phase2_discovery_packages/lima_norte_supe_caleta_vidal.json \
            site/data/map_layers.json
          git diff --cached --quiet && exit 0
          git commit -m "Register Supe discovery and freeze official basin context"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
