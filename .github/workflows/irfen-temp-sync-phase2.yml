name: IRFEN - Temporary sync Phase 2 derived assets

on:
  push:
    branches:
      - agent/ingemmet-chosica-santa-eulalia-2015-v0.1

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-derived-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ingemmet-chosica-santa-eulalia-2015-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update fail-closed Santa Eulalia expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_phase2_onboarding.py')
          s = p.read_text(encoding='utf-8')
          old = '        self.assertEqual(contract["assets"]["observations"]["status"], "MISSING")\n'
          new = (
              '        self.assertEqual(contract["assets"]["observations"]["status"], "PARTIAL")\n'
              '        self.assertEqual(contract["assets"]["historical_events"]["status"], "READY")\n'
              '        self.assertEqual(contract["contract_status"], "DRAFT")\n'
              '        self.assertEqual(contract["hazard_model"]["mechanism_status"], "TO_BE_RESOLVED")\n'
          )
          if old not in s:
              raise SystemExit('expected legacy assertion not found; refusing broad edit')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate canonical Phase 2 catalogs
        run: |
          python scripts/build_phase2_catalog.py
          python scripts/build_map_layer_catalog.py
      - name: Run focused onboarding and map tests
        run: |
          python -m unittest tests.test_phase2_onboarding tests.test_map_layer_catalog -v
      - name: Commit canonical derived assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_phase2_onboarding.py site/data/phase2/catalog.json site/data/map_layers.json
          git rm .github/workflows/irfen-temp-sync-phase2.yml
          git commit -m "Synchronize Phase 2 catalogs for Santa Eulalia evidence"
          git push origin HEAD:agent/ingemmet-chosica-santa-eulalia-2015-v0.1
