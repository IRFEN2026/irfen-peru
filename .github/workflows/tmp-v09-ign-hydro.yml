name: TMP IGN Rios y Quebradas 1:500k coastal capture (removed after capture)
on:
  push:
    branches: [research/v09-coastal-hydrography-contrast-20261102]
    paths: [.github/workflows/tmp-v09-ign-hydro.yml]
permissions:
  contents: write
concurrency: {group: tmp-v09-ign, cancel-in-progress: false}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: IGN FeatureServer/1 paged capture (bounded) and WMS GetCapabilities
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/v09_ign_hydrography_capture.py
      - name: Commit whatever was captured
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/sources/ign_hidrografia_500k || true
          git diff --cached --quiet && { echo "::warning::nothing captured"; exit 0; }
          git commit -q -m "Research snapshot: IGN Rios y Quebradas 1:500.000 over the Peruvian coast"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
