name: IRFEN — Actualizar IMERG y publicar

on:
  workflow_dispatch:
  # Los commits creados con GITHUB_TOKEN no disparan otro workflow por `push`.
  # Reejecutar la publicación al terminar el enriquecimiento histórico evita
  # que history.json válido quede solamente en `main` y no llegue a Pages.
  workflow_run:
    workflows:
      - "IRFEN — Construir histórico IMERG"
    types:
      - completed
  schedule:
    - cron: "20 16 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-and-deploy.yml
      - requirements.txt
      - scripts/fetch_imerg.py
      - scripts/update_polygon_imerg.py
      - scripts/verify_geos_against_imerg.py
      - scripts/update_imerg_verification_history.py
      - scripts/restore_imerg_verification_history.py
      - scripts/build_historical_replay.py
      - scripts/build_lima_east_hazard_decomposition.py
      - scripts/build_ana_catacaos_segments.py
      - scripts/fetch_glofas_catacaos_current.py
      - scripts/build_experimental_state.py
      - scripts/build_piura_reference_model.py
      - scripts/validate_scientific_assets.py
      - scripts/run_v08_regression_tests.py
      - scripts/build_v08_scorecard.py
      - scripts/build_v08_rc_status.py
      - scripts/build_phase2_catalog.py
      - scripts/build_map_layer_catalog.py
      - scripts/build_phase2_event_reanalysis.py
      - tests/**
      - scripts/fetch_glofas_catacaos_current.py
      - config/v08_closeout_contract.json
      - config/phase2_*.json
      - config/historical_events.json
      - site/data/history.json
      - site/data/scientific_status.json
      - site/data/watersheds/**
      - site/data/forecast/**
      - site/data/hydrology/**
      - site/data/hydraulics/**
      - site/data/stations/**
      - site/data/validation/**
      - site/data/phase2/**
      - site/data/map_layers.json
      - site/data/calibration/**
      - site/data/v08_scorecard.json
      - site/data/v08_rc_status.json
      - site/data/hazard_models/**
      - site/v08-experimental.js
      - site/v08-forecast.js
      - site/v08-simulator.js
      - site/v08-health.js
      - site/v08-readiness.js
      - site/v08-expansion.js

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # El probe IMERG puede ordenar una publicación mientras esta validación corre.
  # Ambas deben esperar turno: cancelar aquí omitiría pruebas antes de desplegar.
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Guardar datasets válidos antes de actualizar
        shell: bash
        run: |
          set -e
          mkdir -p .fallback
          URL="https://irfen2026.github.io/irfen-peru/data/latest.json"
          echo "Intentando conservar último dataset publicado: $URL"
          if curl -fsSL --connect-timeout 15 --max-time 45 --retry 3 --retry-delay 5 "$URL" -o .fallback/latest.json
          then
            echo "Fallback público guardado."
          else
            echo "Usando latest.json del repositorio."
            cp site/data/latest.json .fallback/latest.json
          fi
          cp site/data/forecast/imerg_verification_history.json \
            .fallback/imerg_verification_history.git-versioned.json
          HISTORY_URL="https://irfen2026.github.io/irfen-peru/data/forecast/imerg_verification_history.json"
          echo "Consultando réplica opcional de Pages: $HISTORY_URL"
          curl -fsSL --connect-timeout 15 --max-time 45 --retry 3 --retry-delay 5 \
            "$HISTORY_URL" -o .fallback/imerg_verification_history.pages-candidate.json || true
          python scripts/restore_imerg_verification_history.py \
            --durable .fallback/imerg_verification_history.git-versioned.json \
            --pages-candidate .fallback/imerg_verification_history.pages-candidate.json \
            --destination site/data/forecast/imerg_verification_history.json \
            --receipt .fallback/imerg_verification_history.restore-receipt.json
          PREVIOUS_VERIFICATION_URL="https://irfen2026.github.io/irfen-peru/data/forecast/verification.json"
          curl -fsSL --connect-timeout 15 --max-time 45 --retry 3 --retry-delay 5 \
            "$PREVIOUS_VERIFICATION_URL" -o .fallback/verification.json
          python -m json.tool .fallback/verification.json >/dev/null
          if [ -s site/data/history.json ]; then
            cp site/data/history.json .fallback/history.json
            echo "Catálogo histórico protegido."
          fi

      - name: Actualizar datos NASA IMERG con reintentos
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        shell: bash
        run: |
          set +e
          success=0
          for i in 1 2 3 4
          do
            if [ "$i" = "2" ]; then sleep 15; fi
            if [ "$i" = "3" ]; then sleep 30; fi
            if [ "$i" = "4" ]; then sleep 60; fi
            echo "NASA / IMERG intento ${i}/4 (máximo 90s)"
            timeout --signal=TERM --kill-after=10s 90s python scripts/fetch_imerg.py --days 10
            rc=$?
            if [ "$rc" -eq 0 ]; then
              success=1
              echo "NASA IMERG actualizado correctamente."
              break
            fi
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "Intento ${i} agotó el tiempo máximo."
            else
              echo "Intento ${i} falló con código ${rc}."
            fi
          done
          if [ "$success" -eq 1 ]; then
            echo "IRFEN_NASA_OK=true" >> "$GITHUB_ENV"
          else
            echo "IRFEN_NASA_OK=false" >> "$GITHUB_ENV"
            cp .fallback/latest.json site/data/latest.json
          fi
          exit 0

      - name: Restaurar catálogo histórico protegido
        shell: bash
        run: |
          if [ -s .fallback/history.json ]; then
            cp .fallback/history.json site/data/history.json
            echo "history.json restaurado."
          fi

      - name: Calcular IMERG paralelo sobre polígonos v0.8
        if: env.IRFEN_NASA_OK == 'true'
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: timeout --signal=TERM --kill-after=10s 180s python scripts/update_polygon_imerg.py

      - name: Añadir adquisición directa al histórico científico IMERG
        if: env.IRFEN_NASA_OK == 'true'
        run: python scripts/update_imerg_verification_history.py

      - name: Marcar estado operativo del dataset
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          path=Path('site/data/latest.json'); data=json.loads(path.read_text(encoding='utf-8'))
          nasa_ok='${{ env.IRFEN_NASA_OK }}'
          if nasa_ok=='true':
              data['operational_status']='updated'; data['status_message']='NASA Earthdata respondió correctamente en esta ejecución.'
          else:
              data['operational_status']='stale'; data['status_message']='NASA Earthdata no estuvo disponible después de 4 intentos acotados. IRFEN conserva el último dataset válido publicado.'
          data['last_update_attempt']=datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Verificar forecast GEOS maduro contra IMERG
        run: python scripts/verify_geos_against_imerg.py --previous-verification .fallback/verification.json

      - name: Construir replay histórico de calibración
        run: python scripts/build_historical_replay.py

      - name: Construir reanálisis fail-closed de eventos Phase 2
        run: python scripts/build_phase2_event_reanalysis.py

      - name: Reconstruir catálogo territorial RESEARCH_ONLY
        run: python scripts/build_phase2_catalog.py

      - name: Reconstruir descomposición científica Lima Este
        run: python scripts/build_lima_east_hazard_decomposition.py

      - name: Construir referencias fluviales Piura v0.8
        run: python scripts/build_piura_reference_model.py

      - name: Construir tramos críticos ANA Catacaos 2026
        run: python scripts/build_ana_catacaos_segments.py

      - name: Construir catálogo trazable de capas
        run: python scripts/build_map_layer_catalog.py

      - name: Obtener proxy fluvial GloFAS Catacaos
        run: python scripts/fetch_glofas_catacaos_current.py

      - name: Construir estado experimental de pruebas v0.8
        run: python scripts/build_experimental_state.py

      - name: Activar paneles científicos v0.8
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('site/index.html')
          html=path.read_text(encoding='utf-8')
          tags=[
              '<script src="v08-experimental.js"></script>',
              '<script src="v08-forecast.js"></script>',
              '<script src="v08-simulator.js"></script>',
              '<script src="v08-health.js"></script>',
              '<script src="v08-readiness.js"></script>',
              '<script src="v08-expansion.js"></script>'
          ]
          for tag in tags:
              if tag not in html:
                  html=html.replace('</body>',tag+'\n</body>')
          path.write_text(html,encoding='utf-8')
          PY

      - name: Validar archivos mínimos
        shell: bash
        run: |
          test -s site/index.html
          test -s site/v08-experimental.js
          test -s site/v08-forecast.js
          test -s site/v08-simulator.js
          test -s site/v08-health.js
          test -s site/v08-readiness.js
          test -s site/v08-expansion.js
          test -s site/data/map_layers.json
          test -s site/data/phase2/catalog.json
          test -s site/data/latest.json
          test -s site/data/history.json
          test -s site/data/scientific_status.json
          test -s site/data/hazard_models/lima_east_decomposition.json
          test -s site/data/hydraulics/current_infrastructure.json
          test -s site/data/hydrology/piura_reference_model.json
          test -s site/data/hydrology/ana_catacaos_critical_segments_2026.geojson
          test -s site/data/hydrology/ana_catacaos_critical_segments_2026_validation.json
          test -s site/data/hydrology/glofas_catacaos_current.json
          test -s site/data/forecast/verification.json
          test -s site/data/forecast/imerg_verification_history.json
          test -s site/data/calibration/historical_replay.json
          test -s site/data/experimental_state.json
          test -s site/data/phase2/event_reanalysis.json
          python -m json.tool site/data/latest.json >/dev/null
          python -m json.tool site/data/history.json >/dev/null
          python -m json.tool site/data/forecast/imerg_verification_history.json >/dev/null
          python -m json.tool site/data/scientific_status.json >/dev/null
          python -m json.tool site/data/hazard_models/lima_east_decomposition.json >/dev/null
          python -m json.tool site/data/hydraulics/current_infrastructure.json >/dev/null
          python -m json.tool site/data/hydrology/piura_reference_model.json >/dev/null
          python -m json.tool site/data/hydrology/ana_catacaos_critical_segments_2026.geojson >/dev/null
          python -m json.tool site/data/hydrology/ana_catacaos_critical_segments_2026_validation.json >/dev/null
          python -m json.tool site/data/hydrology/glofas_catacaos_current.json >/dev/null
          python -m json.tool site/data/forecast/verification.json >/dev/null
          python -m json.tool site/data/calibration/historical_replay.json >/dev/null
          python -m json.tool site/data/experimental_state.json >/dev/null
          python -m json.tool site/data/phase2/event_reanalysis.json >/dev/null
          python -m json.tool site/data/phase2/catalog.json >/dev/null
          python -m json.tool site/data/map_layers.json >/dev/null
          if [ -s site/data/forecast/latest.json ]; then
            python -m json.tool site/data/forecast/latest.json >/dev/null
          fi

      - name: Ejecutar puertas científicas v0.8
        run: python scripts/validate_scientific_assets.py

      - name: Ejecutar pruebas unitarias v0.8
        run: python -m unittest discover -s tests -v

      - name: Ejecutar pruebas de regresión v0.8
        run: |
          python scripts/run_v08_regression_tests.py
          python -m json.tool site/data/test_report.json >/dev/null

      - name: Construir scorecard auditable de cierre v0.8
        run: |
          python scripts/build_v08_scorecard.py
          test -s site/data/v08_scorecard.json
          python -m json.tool site/data/v08_scorecard.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('site/data/v08_scorecard.json',encoding='utf-8'))
          assert d.get('production_use') is False
          assert d.get('production_ready') is False
          assert d.get('current_milestone_pct') in {0,25,50,75,100}
          assert [m.get('percentage') for m in d.get('milestones',[])] == [25,50,75,100]
          PY

      - name: Construir contrato de disponibilidad v0.8-RC1
        run: |
          python scripts/build_v08_rc_status.py
          test -s site/data/v08_rc_status.json
          python -m json.tool site/data/v08_rc_status.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('site/data/v08_rc_status.json',encoding='utf-8'))
          assert d.get('release_class') == 'RELEASE_CANDIDATE_TEST_ONLY'
          assert d.get('production_use') is False
          assert d.get('production_ready') is False
          assert d.get('operational_alerting_enabled') is False
          assert (d.get('phase2') or {}).get('operational_candidates') == 0
          if d.get('status') == 'RC_AVAILABLE_TEST_ONLY':
              assert d.get('available_for_controlled_testing') is True
              assert int((d.get('formal_closeout') or {}).get('current_milestone_pct',0)) >= 75
          PY

      - name: Persistir histórico científico en Git versionado
        if: env.IRFEN_NASA_OK == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          path="site/data/forecast/imerg_verification_history.json"
          candidate="$(mktemp)"
          retry_dir=""
          cleanup() {
            if [ -n "$retry_dir" ]; then
              git worktree remove --force "$retry_dir" >/dev/null 2>&1 || true
            fi
            rm -f -- "$candidate"
          }
          trap cleanup EXIT
          cp -- "$path" "$candidate"
          candidate_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          validated_main="$(git rev-parse HEAD)"
          commit_message="IRFEN v0.8: persistir histórico científico IMERG run ${GITHUB_RUN_ID}"

          if git diff --quiet "$validated_main" -- "$path"; then
            echo "El histórico durable ya coincide con la versión de main."
            exit 0
          fi

          # El commit se crea sobre el main remoto más reciente en un worktree
          # aislado. Se reintentan únicamente carreras con commits que no hayan
          # tocado el ledger validado; una modificación concurrente del ledger
          # detiene el despliegue para no sobrescribir evidencia científica.
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            if ! git diff --quiet "$validated_main" origin/main -- "$path"; then
              remote_sha="$(git show "origin/main:$path" | sha256sum | awk '{print $1}')"
              if [ "$remote_sha" = "$candidate_sha" ]; then
                echo "El ledger candidato ya fue persistido por otra ejecución."
                exit 0
              fi
              echo "ERROR: el ledger remoto cambió después de la validación; no se sobrescribe." >&2
              exit 1
            fi

            retry_dir="$(mktemp -d)"
            git worktree add --detach "$retry_dir" origin/main
            cp -- "$candidate" "$retry_dir/$path"
            if (
              cd "$retry_dir"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- "$path"
              if git diff --cached --quiet; then
                exit 0
              fi
              git commit -m "$commit_message"
              git push origin HEAD:main
            ); then
              git worktree remove --force "$retry_dir"
              retry_dir=""
              echo "Histórico IMERG persistido como commit Git independiente de Pages."
              exit 0
            fi

            git worktree remove --force "$retry_dir"
            retry_dir=""
            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: main siguió avanzando durante cuatro intentos acotados." >&2
              exit 1
            fi
            echo "Carrera de fast-forward en intento ${attempt}/4; se reintentará sin force-push."
            sleep "$((attempt * 2))"
          done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar sitio web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar IRFEN
        id: deployment
        uses: actions/deploy-pages@v5
