name: IRFEN — Actualizar IMERG y publicar

on:
  workflow_dispatch:
  schedule:
    - cron: "20 16 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-and-deploy.yml
      - requirements.txt
      - scripts/fetch_imerg.py
      - site/data/watersheds/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Guardar datasets válidos antes de actualizar
        shell: bash
        run: |
          set -e
          mkdir -p .fallback

          URL="https://irfen2026.github.io/irfen-peru/data/latest.json"

          echo "Intentando conservar último dataset publicado:"
          echo "$URL"

          if curl -fsSL \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 3 \
            --retry-delay 5 \
            "$URL" \
            -o .fallback/latest.json
          then
            echo "Fallback público guardado."
          else
            echo "No se pudo descargar el fallback público."
            echo "Usando latest.json del repositorio."
            cp site/data/latest.json .fallback/latest.json
          fi

          if [ -s site/data/history.json ]; then
            cp site/data/history.json .fallback/history.json
            echo "Catálogo histórico protegido."
          fi

      - name: Actualizar datos NASA IMERG con reintentos
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        shell: bash
        run: |
          set +e

          success=0

          for i in 1 2 3 4
          do

            if [ "$i" = "2" ]; then
              echo "Esperando 15 segundos..."
              sleep 15
            fi

            if [ "$i" = "3" ]; then
              echo "Esperando 30 segundos..."
              sleep 30
            fi

            if [ "$i" = "4" ]; then
              echo "Esperando 60 segundos..."
              sleep 60
            fi

            echo "NASA / IMERG intento ${i}/4"

            python scripts/fetch_imerg.py --days 10

            rc=$?

            if [ "$rc" -eq 0 ]; then
              success=1
              echo "NASA IMERG actualizado correctamente."
              break
            fi

            echo "Intento ${i} falló con código ${rc}."

          done

          if [ "$success" -eq 1 ]; then
            echo "IRFEN_NASA_OK=true" >> "$GITHUB_ENV"
          else
            echo "IRFEN_NASA_OK=false" >> "$GITHUB_ENV"
            echo "NASA/Earthdata no respondió después de 4 intentos."
            echo "Restaurando último dataset válido."
            cp .fallback/latest.json site/data/latest.json
          fi

          exit 0

      - name: Restaurar catálogo histórico protegido
        shell: bash
        run: |
          if [ -s .fallback/history.json ]; then
            cp .fallback/history.json site/data/history.json
            echo "history.json restaurado: el flujo diario no puede sobrescribir la calibración histórica."
          fi

      - name: Marcar estado operativo del dataset
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("site/data/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          nasa_ok = "${{ env.IRFEN_NASA_OK }}"

          if nasa_ok == "true":
              data["operational_status"] = "updated"
              data["status_message"] = "NASA Earthdata respondió correctamente en esta ejecución."
          else:
              data["operational_status"] = "stale"
              data["status_message"] = "NASA Earthdata no estuvo disponible después de 4 intentos. IRFEN conserva el último dataset válido publicado."

          data["last_update_attempt"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Validar archivos mínimos
        shell: bash
        run: |
          test -s site/index.html
          test -s site/data/latest.json
          test -s site/data/history.json

          python -m json.tool site/data/latest.json >/dev/null
          python -m json.tool site/data/history.json >/dev/null

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar sitio web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar IRFEN
        id: deployment
        uses: actions/deploy-pages@v5
