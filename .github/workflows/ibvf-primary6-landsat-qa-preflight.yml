name: IBVF - PRIMARY6 Landsat AOI QA preflight

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'site/data/validation/ibvf_primary6_selected_a1_catalog.json'
      - 'site/data/validation/ibvf_primary6_landsat_qa_contract.json'
      - 'scripts/ibvf_primary6_landsat_qa_preflight.py'
      - '.github/workflows/ibvf-primary6-landsat-qa-preflight.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-landsat-qa-preflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constrained scientific dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'rasterio>=1.3,<2'
      - name: Compile preflight implementation
        run: python -m py_compile scripts/ibvf_primary6_landsat_qa_preflight.py
      - name: Execute deterministic QA_PIXEL mechanics preflight
        run: |
          mkdir -p artifacts/ibvf/landsat-qa-preflight/downloads
          python scripts/ibvf_primary6_landsat_qa_preflight.py \
            --repo-root . \
            --download-dir artifacts/ibvf/landsat-qa-preflight/downloads \
            --output artifacts/ibvf/ibvf_primary6_landsat_qa_preflight.json
      - name: Scientific fail-closed guards
        run: |
          python - <<'PY'
          import json
          p='artifacts/ibvf/ibvf_primary6_landsat_qa_preflight.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert d['cohort_id']=='PRIMARY6_CHRONOLOGICAL'
          assert d['pair_choice_performed'] is False
          assert d['selected_window_replaced'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['territorial_outcome_fields_read'] is False
          assert d['known_event_dates_read'] is False
          assert d['activation_inference_allowed'] is False
          assert d['modeling_allowed'] is False
          assert d['transport_failure_is_missing_science'] is False
          assert d['status'] in {
            'PASS_QA_PIXEL_NATIVE_AOI_MECHANICS_PREFLIGHT_NO_PAIR_CHOICE',
            'TRANSPORT_BLOCKED_QA_PIXEL_PREFLIGHT_RETAIN_UNKNOWN_NOT_MISSING'
          }
          if d['status'].startswith('PASS_'):
            assert d['qa_pixel_acquisition']['transport_status']=='SUCCESS'
            assert d['metrics']['aoi_nonfill_valid_pixels']>0
            assert 0.0 <= d['metrics']['strict_clear_fraction'] <= 1.0
            assert d['metrics']['resampling_performed'] is False
            assert d['metrics']['interpolation_performed'] is False
          else:
            assert d['qa_pixel_acquisition']['transport_status']=='TRANSPORT_BLOCKED'
            assert d['metrics'] is None
          print({'status':d['status'],'unit_id':d['unit_id'],'scene':d['scene_identity']['item_id']})
          PY
      - name: Freeze preflight and synchronize scientific map
        run: |
          cp artifacts/ibvf/ibvf_primary6_landsat_qa_preflight.json site/data/validation/ibvf_primary6_landsat_qa_preflight.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/validation/ibvf_primary6_landsat_qa_preflight.json
          if ! git diff --cached --quiet; then git commit -m 'IBVF: freeze PRIMARY6 Landsat QA preflight'; fi
          git pull --rebase origin agent/independent-basin-validation-map
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          rp=Path('site/data/validation/ibvf_primary6_landsat_qa_preflight.json')
          r=json.loads(rp.read_text(encoding='utf-8'))
          mp=Path('site/data/validation/independent_basin_validation_map.json')
          d=json.loads(mp.read_text(encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          d['version']='irfen-independent-basin-validation-map-v3.0'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{})
          ac['primary6_landsat_qa_contract']='site/data/validation/ibvf_primary6_landsat_qa_contract.json'
          ac['primary6_landsat_qa_preflight']='site/data/validation/ibvf_primary6_landsat_qa_preflight.json'
          ac['primary6_landsat_qa_preflight_status']=r['status']
          ac['primary6_landsat_pair_choice_performed']=False
          ac['primary6_landsat_qa_bulk_complete']=False
          ac['primary6_selected_windows_replaced_for_sensor_availability']=False
          for c in d.get('cases',[]):
            if c.get('unit_id') in {'shingolay','huaycoloro','san_ildefonso'}:
              c['landsat_qa_stage']='PREFLIGHT_PASS_BULK_PENDING' if r['status'].startswith('PASS_') else 'PREFLIGHT_TRANSPORT_BLOCKED_UNKNOWN_NOT_MISSING'
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
          mp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add site/data/validation/independent_basin_validation_map.json
          if ! git diff --cached --quiet; then git commit -m 'IBVF: sync PRIMARY6 Landsat QA preflight to research map'; fi
          git push origin HEAD:agent/independent-basin-validation-map
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-landsat-qa-preflight-${{ github.sha }}
          path: |
            artifacts/ibvf/ibvf_primary6_landsat_qa_preflight.json
            artifacts/ibvf/landsat-qa-preflight/downloads/
          if-no-files-found: warn
          retention-days: 30
