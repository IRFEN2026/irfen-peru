# User-authored final replay after the exact frozen source and generated catalog were persisted.
# Scientific semantics are unchanged; this synchronize event verifies the stable state offline.
name: IRFEN - Phase2 Chepen Chaman official child geometry freeze

on:
  pull_request:
    paths:
      - site/data/validation/phase2_discovery_contracts/lalibertad_chepen_chaman_morana_avispero.json
      - site/data/validation/phase2_discovery_packages/lalibertad_chepen_chaman_morana_avispero.json
      - site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_chaman_137752.geojson
      - site/data/phase2/geometries/lalibertad_chaman_basin_context.geojson
      - site/data/phase2/geometries/lalibertad_chaman_basin_context_validation.json
      - scripts/probe_phase2_chepen_chaman_official_geometry.py
      - scripts/verify_phase2_chepen_chaman_official_geometry.py
      - tests/test_phase2_chepen_chaman_discovery_package.py
      - site/data/map_layers.json
      - .github/workflows/phase2-chepen-chaman-official-geometry-freeze.yml

permissions:
  contents: write

jobs:
  bootstrap-or-replay-exact-ana-child:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bootstrap only if no frozen source exists
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_chaman_137752.geojson
          if [[ ! -f "$SOURCE" ]]; then
            python scripts/probe_phase2_chepen_chaman_official_geometry.py --refresh-source
          fi
      - name: Replay frozen exact ANA Chaman child offline
        run: python scripts/verify_phase2_chepen_chaman_official_geometry.py
      - name: Rebuild research/context map catalog deterministically
        run: python scripts/build_map_layer_catalog.py
      - name: Enforce Chepen-Chaman scientific guards
        run: python -m pytest -q tests/test_phase2_chepen_chaman_discovery_package.py
      - name: Persist only verified deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/validation/phase2_discovery_contracts/lalibertad_chepen_chaman_morana_avispero.json \
            site/data/validation/phase2_discovery_packages/lalibertad_chepen_chaman_morana_avispero.json \
            site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_chaman_137752.geojson \
            site/data/phase2/geometries/lalibertad_chaman_basin_context.geojson \
            site/data/phase2/geometries/lalibertad_chaman_basin_context_validation.json \
            site/data/map_layers.json
          if git diff --cached --quiet; then
            echo "Frozen replay and catalog are already deterministic"
          else
            git commit -m "Publish exact ANA Chaman child context layer"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
