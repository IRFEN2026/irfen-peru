name: IRFEN - Phase2 Cañete Jacayita component sync

on:
  pull_request:
    paths:
      - site/data/phase2/sources/canete_jacayita_faja_context/**
      - site/data/phase2/geometries/lima_sur_canete_jacayita_faja_context*
      - site/data/validation/phase2_zone_contracts/lima_sur_canete.json
      - scripts/build_canete_jacayita_faja_context.py
      - scripts/patch_phase2_component_map_layers_tmp.py
      - .github/workflows/phase2-canete-jacayita-component-sync-tmp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific dependencies
        run: pip install -r requirements.txt
      - name: Patch generic component-layer support
        run: python scripts/patch_phase2_component_map_layers_tmp.py
      - name: Rebuild deterministic Jacayita geometry
        run: python scripts/build_canete_jacayita_faja_context.py
      - name: Rebuild map catalog
        run: python scripts/build_map_layer_catalog.py
      - name: Validate exact replay and map publication
        run: |
          python scripts/build_canete_jacayita_faja_context.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python tests/test_phase2_canete_jacayita_faja_context.py
      - name: Commit synchronized derived files
        run: |
          if git diff --quiet; then
            echo 'No synchronization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_map_layer_catalog.py site/v08-territorial.js site/data/map_layers.json \
            site/data/phase2/geometries/lima_sur_canete_jacayita_faja_context.geojson \
            site/data/phase2/geometries/lima_sur_canete_jacayita_faja_context_validation.json
          git commit -m 'Phase2: publish Jacayita as separate research component layer'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
