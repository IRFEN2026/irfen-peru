name: TEMP - semantic sync PR300 with main

on:
  push:
    branches:
      - phase2-north-coast-local-gaps-20260924

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: phase2-north-coast-local-gaps-20260924
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Merge latest main with semantic JSON reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          INVENTORY = Path("config/phase2_north_coast_discovery_inventory_v0_1.json")
          SCOPE = Path("config/phase2_expansion_scope.json")

          def stage_json(stage, path):
              raw = subprocess.check_output(["git", "show", f":{stage}:{path.as_posix()}"], text=True)
              return json.loads(raw)

          ours_inv = stage_json(2, INVENTORY)
          main_inv = stage_json(3, INVENTORY)
          ours_scope = stage_json(2, SCOPE)
          main_scope = stage_json(3, SCOPE)

          required = {
              "deployment_status": "RESEARCH_ONLY",
              "test_mode": "TEST_ONLY",
              "production_use": False,
              "production_ready": False,
              "operational_alerting_enabled": False,
              "activation_gate": "BLOCKED",
              "missing_data_rule": "UNKNOWN_NOT_LOW_RISK",
              "decision_thresholds": None,
              "hydraulic_factors": None,
          }
          for doc_name, doc in (("ours inventory", ours_inv), ("main inventory", main_inv)):
              for key, expected in required.items():
                  if doc.get(key) != expected:
                      raise SystemExit(f"fail-closed: {doc_name} {key}={doc.get(key)!r}, expected {expected!r}")

          def union(seq_a, seq_b):
              out = list(seq_a or [])
              for item in seq_b or []:
                  if item not in out:
                      out.append(item)
              return out

          merged_inv = dict(main_inv)
          main_units = {u["discovery_id"]: dict(u) for u in main_inv["discovery_units"]}
          ours_units = {u["discovery_id"]: dict(u) for u in ours_inv["discovery_units"]}

          # Add PR-only systems, but never replace unrelated main updates wholesale.
          for discovery_id, ours_unit in ours_units.items():
              if discovery_id not in main_units:
                  main_units[discovery_id] = ours_unit

          # Preserve only the bounded enrichments PR300 intentionally adds to existing systems.
          for discovery_id in ("piura_mancora_los_organos_coastal_ravines", "lalibertad_chicama"):
              if discovery_id not in main_units or discovery_id not in ours_units:
                  raise SystemExit(f"expected existing discovery unit missing: {discovery_id}")
              merged = dict(main_units[discovery_id])
              ours = ours_units[discovery_id]
              for key in ("first_work_package", "hydrologic_components", "must_not_merge_with", "official_source_ids"):
                  merged[key] = union(merged.get(key, []), ours.get(key, []))
              if discovery_id == "lalibertad_chicama" and "Cartavio" in ours.get("territorial_reference", ""):
                  merged["territorial_reference"] = ours["territorial_reference"]
              main_units[discovery_id] = merged

          # Main ordering first, then PR-only units. This keeps merged history stable and auditable.
          ordered_ids = [u["discovery_id"] for u in main_inv["discovery_units"]]
          ordered_ids += [u["discovery_id"] for u in ours_inv["discovery_units"] if u["discovery_id"] not in ordered_ids]
          merged_inv["discovery_units"] = [main_units[i] for i in ordered_ids]

          # Registered units: main is authoritative; add any PR-only registered entry without duplication.
          reg = {x["candidate_id"]: x for x in main_inv.get("registered_units_to_strengthen", [])}
          for x in ours_inv.get("registered_units_to_strengthen", []):
              reg.setdefault(x["candidate_id"], x)
          merged_inv["registered_units_to_strengthen"] = list(reg.values())

          # Source catalog: preserve main and add PR-only sources. Conflicting source IDs must agree exactly.
          sources = dict(main_inv.get("source_catalog", {}))
          for sid, url in ours_inv.get("source_catalog", {}).items():
              if sid in sources and sources[sid] != url:
                  raise SystemExit(f"source-id collision with different URL: {sid}")
              sources[sid] = url
          merged_inv["source_catalog"] = sources
          merged_inv["scientific_principles"] = union(main_inv.get("scientific_principles", []), ours_inv.get("scientific_principles", []))

          rel = dict(main_inv.get("relationship_to_phase2", {}))
          rel["discovery_units_count"] = len(merged_inv["discovery_units"])
          rel["discovery_units_count_as_operational_candidates"] = False
          rel["changes_operational_scope"] = False
          rel["changes_registered_candidate_count"] = False
          rel["registered_candidate_count_unchanged"] = 18
          merged_inv["relationship_to_phase2"] = rel
          for key, expected in required.items():
              merged_inv[key] = expected

          ids = [x["discovery_id"] for x in merged_inv["discovery_units"]]
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate discovery_id after semantic merge")
          for mandatory_id in (
              "piura_paita_urban_local_ravines",
              "piura_talara_parinas_local_ravines",
              "piura_colan_bajo_chira_local_ravines",
              "piura_mancora_los_organos_coastal_ravines",
              "lalibertad_chicama",
          ):
              if mandatory_id not in ids:
                  raise SystemExit(f"semantic merge lost required unit: {mandatory_id}")

          merged_scope = dict(main_scope)
          ours_ext = ours_scope["north_coast_discovery_extension"]
          ext = dict(main_scope["north_coast_discovery_extension"])
          ext["requested_corridors"] = union(ext.get("requested_corridors", []), ours_ext.get("requested_corridors", []))
          ext["existing_registered_units_to_strengthen"] = union(
              ext.get("existing_registered_units_to_strengthen", []),
              ours_ext.get("existing_registered_units_to_strengthen", []),
          )
          ext["discovery_units_count"] = len(merged_inv["discovery_units"])
          ext["registered_candidate_count_unchanged"] = 18
          merged_scope["north_coast_discovery_extension"] = ext

          INVENTORY.write_text(json.dumps(merged_inv, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          SCOPE.write_text(json.dumps(merged_scope, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"semantic discovery merge: {len(merged_inv['discovery_units'])} units")
          PY

          git add config/phase2_north_coast_discovery_inventory_v0_1.json config/phase2_expansion_scope.json

          # The map catalog is generated state: never hand-merge it.
          git checkout --theirs -- site/data/map_layers.json
          git add site/data/map_layers.json
          test -z "$(git diff --name-only --diff-filter=U)"

          python scripts/build_map_layer_catalog.py
          pytest -q tests/test_phase2_north_coast_local_gaps.py tests/test_phase2_colan_discovery.py
          python scripts/build_map_layer_catalog.py --check-only

          git rm .github/workflows/tmp-sync-pr300-with-main.yml
          git add site/data/map_layers.json
          git diff --cached --check
          git commit -m "phase2: reconcile north-coast local gaps with latest main"
          git push origin HEAD:phase2-north-coast-local-gaps-20260924
