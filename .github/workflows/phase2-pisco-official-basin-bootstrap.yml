name: IRFEN - Phase2 Pisco official basin bootstrap

on:
  pull_request:
    paths:
      - scripts/bootstrap_pisco_official_basin.py
      - .github/workflows/phase2-pisco-official-basin-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-official-pisco-basin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch official ANA Cuenca Pisco geometry
        run: |
          mkdir -p artifacts
          python scripts/bootstrap_pisco_official_basin.py \
            --source artifacts/ana_cuenca_pisco.geojson \
            --normalized artifacts/ica_pisco_basin_context.geojson \
            --manifest artifacts/ica_pisco_basin_manifest.json
      - name: Enforce Phase-2 fail-closed guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/ica_pisco_basin_manifest.json').read_text())
          g=json.loads(Path('artifacts/ica_pisco_basin_context.geojson').read_text())
          assert m['deployment_status']=='RESEARCH_ONLY'
          assert m['test_mode']=='TEST_ONLY'
          assert m['production_use'] is False
          assert m['production_ready'] is False
          assert m['operational_alerting_enabled'] is False
          assert m['activation_gate']=='BLOCKED'
          assert m['missing_data_rule']=='UNKNOWN_NOT_LOW_RISK'
          assert m['decision_thresholds'] is None
          assert m['hydraulic_factors'] is None
          assert m['counts_as_complete_candidate_geometry'] is False
          assert m['artificial_connector_used'] is False
          assert m['event_footprint_asserted'] is False
          assert m['hydraulic_capacity_inferred'] is False
          assert m['negative_control_inferred'] is False
          assert g['properties']['candidate_id']=='ica_pisco_san_andres'
          assert len(g['features'])==1
          p=g['features'][0]['properties']
          assert p['official_hydrologic_unit_name']=='Cuenca Pisco'
          assert p['san_andres_local_drainage_geometry_resolved'] is False
          assert p['tributary_ravines_geometry_resolved'] is False
          assert p['counts_as_complete_candidate_geometry'] is False
          assert p['carries_risk_classification'] is False
          assert p['operational_alerting_enabled'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-pisco-official-basin-bootstrap
          path: artifacts/
          if-no-files-found: error
