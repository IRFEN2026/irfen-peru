name: IBVF Cashahuacra R2 orbit operator schema

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - '.github/workflows/ibvf-cashahuacra-s1-r2-orbit-operator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-orbit-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Recreate the already-frozen SNAP 14 runtime
        run: |
          mkdir -p /tmp/ibvf-snap14-orbit
          python scripts/ibvf_snap_runtime_install_freeze.py \
            --contract site/data/validation/cashahuacra_sentinel1_r2_runtime_contract.json \
            --byte-report site/data/validation/cashahuacra_sentinel1_r2_runtime_bytes.json \
            --work-dir /tmp/ibvf-snap14-orbit/work \
            --output /tmp/ibvf-snap14-orbit/runtime.json
      - name: Freeze Apply-Orbit-File operator help without reading SAR response
        env:
          GPT: /tmp/ibvf-snap14-orbit/work/snap14/bin/gpt
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, re, subprocess
          runtime=json.load(open('/tmp/ibvf-snap14-orbit/runtime.json',encoding='utf-8'))
          if runtime.get('status')!='SNAP_RUNTIME_METADATA_FROZEN_R2_EXECUTION_GATE_PASS':
              report={
                  'schema_version':'irfen-ibvf-snap-r2-orbit-operator-schema-v0.1',
                  'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),
                  'case_id':'cashahuacra_2015-03-23','deployment_status':'RESEARCH_ONLY','test_only':True,
                  'production_use':False,'production_ready':False,'operational_alerting_enabled':False,
                  'uses_operational_event_none_labels':False,'territorial_activation_evidence_blinded':True,
                  'serious_modeling_gate':'CLOSED_MINIMUM_DATASET_NOT_REACHED','pre_post_sar_values_read':False,
                  'comparison_performed':False,'r2_processing_executed':False,'r3_common_support_built':False,
                  'r4_difference_computed':False,'activation_inference_allowed':False,
                  'runtime_status':runtime.get('status'),'operator':'Apply-Orbit-File',
                  'status':'TRANSPORT_OR_RUNTIME_BLOCKED_UNKNOWN_NOT_MISSING','r2_exact_graph_compile_allowed':False
              }
          else:
              p=subprocess.run([os.environ['GPT'],'Apply-Orbit-File','-h'],text=True,capture_output=True,timeout=120)
              text=(p.stdout or '') + ('\n'+p.stderr if p.stderr else '')
              pathlib.Path('/tmp/ibvf-snap14-orbit/apply-orbit-file-help.txt').write_text(text,encoding='utf-8')
              params=sorted(set(re.findall(r'-P([A-Za-z][A-Za-z0-9_]*)',text)))
              ok=p.returncode==0 and bool(text.strip())
              report={
                  'schema_version':'irfen-ibvf-snap-r2-orbit-operator-schema-v0.1',
                  'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),
                  'case_id':'cashahuacra_2015-03-23','deployment_status':'RESEARCH_ONLY','test_only':True,
                  'production_use':False,'production_ready':False,'operational_alerting_enabled':False,
                  'uses_operational_event_none_labels':False,'territorial_activation_evidence_blinded':True,
                  'serious_modeling_gate':'CLOSED_MINIMUM_DATASET_NOT_REACHED','pre_post_sar_values_read':False,
                  'comparison_performed':False,'r2_processing_executed':False,'r3_common_support_built':False,
                  'r4_difference_computed':False,'activation_inference_allowed':False,
                  'runtime_status':runtime.get('status'),'runtime_manifest_sha256':runtime.get('installed_jar_manifest_sha256'),
                  'operator':'Apply-Orbit-File','returncode':p.returncode,'help_bytes':len(text.encode('utf-8')),
                  'help_sha256':hashlib.sha256(text.encode('utf-8')).hexdigest(),'parameter_names':params,
                  'status':'PASS' if ok else 'BLOCKED_UNKNOWN_NOT_MISSING','r2_exact_graph_compile_allowed':ok,
                  'scientific_semantics':'Operator capability only; no Sentinel-1 pixel values were read or compared.',
                  'next_gate':'COMPILE_EXACT_FROZEN_R2_GRAPH' if ok else 'RESOLVE_ORBIT_OPERATOR_WITHOUT_IMPUTING_MISSING_SCIENCE'
              }
          json.dump(report,open('/tmp/ibvf-snap14-orbit/cashahuacra_sentinel1_r2_orbit_operator_schema.json','w',encoding='utf-8'),indent=2)
          print(json.dumps({'status':report['status'],'parameter_names':report.get('parameter_names',[])},indent=2))
          PY
      - name: Enforce fail-closed scientific semantics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ibvf-snap14-orbit/cashahuacra_sentinel1_r2_orbit_operator_schema.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False and d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False and d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert d['pre_post_sar_values_read'] is False and d['comparison_performed'] is False
          assert d['r2_processing_executed'] is False and d['r3_common_support_built'] is False and d['r4_difference_computed'] is False
          assert d['activation_inference_allowed'] is False
          assert d['status'] in {'PASS','BLOCKED_UNKNOWN_NOT_MISSING','TRANSPORT_OR_RUNTIME_BLOCKED_UNKNOWN_NOT_MISSING'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cashahuacra-r2-orbit-operator-schema-${{ github.sha }}
          path: |
            /tmp/ibvf-snap14-orbit/cashahuacra_sentinel1_r2_orbit_operator_schema.json
            /tmp/ibvf-snap14-orbit/apply-orbit-file-help.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Archive orbit operator schema on research branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cp /tmp/ibvf-snap14-orbit/cashahuacra_sentinel1_r2_orbit_operator_schema.json site/data/validation/cashahuacra_sentinel1_r2_orbit_operator_schema.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/validation/cashahuacra_sentinel1_r2_orbit_operator_schema.json
          if git diff --cached --quiet; then
            echo 'No orbit operator schema change.'
          else
            git commit -m 'IBVF: freeze SNAP Apply-Orbit-File operator schema'
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
