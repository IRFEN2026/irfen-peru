name: TMP catchments and history capture (HydroSHEDS, PECHP 2020-2023, station documents, IMERG Final 2019-2023; removed after capture)
on:
  push:
    branches: [research/v09-piura-catchments-robustness-20261031]
    paths: [.github/workflows/tmp-v09-catchments-capture.yml]
permissions:
  contents: write
concurrency: {group: tmp-v09-catch, cancel-in-progress: false}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt && pip install -q pypdf==6.19.0 rasterio geopandas pyogrio && sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Station documents (PNUD-CTAR Piura 2000 Apéndice D; Plan de gestión Chira-Piura)
        timeout-minutes: 8
        continue-on-error: true
        run: python scripts/v09_hist_sources_capture.py --stage docs
      - name: PECHP monthly reports 2016-2023 (already archived ones are not downloaded again)
        timeout-minutes: 12
        continue-on-error: true
        run: python scripts/v09_hist_sources_capture.py --stage pechp
      - name: Text layers of new PDFs (two extractors)
        if: always()
        continue-on-error: true
        run: |
          for f in data/v09/sources/historical_floods/pechp/*.pdf data/v09/sources/historical_floods/docs/*.pdf; do [ -f "$f" ] || continue
            [ -f "${f%.pdf}.pdftotext_layout.txt" ] && continue
            pdftotext -layout "$f" "${f%.pdf}.pdftotext_layout.txt"
            python -c "import sys,pypdf;r=pypdf.PdfReader(sys.argv[1]);open(sys.argv[2],'w').write('\n\f'.join((p.extract_text() or '') for p in r.pages))" "$f" "${f%.pdf}.pypdf.txt" || true
          done
      - name: HydroSHEDS v1 15s DIR/ACC, HydroBASINS lev12, HydroRIVERS (cropped to Piura)
        timeout-minutes: 25
        continue-on-error: true
        run: python scripts/v09_hydrosheds_capture.py
      - name: IMERG Final V07 daily, Dec-Apr 2018-19 .. 2022-23
        timeout-minutes: 30
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: >
          python scripts/v09_imerg_final_daily_capture.py --budget-s 1700
          --period 2018-12-01:2019-04-30 --period 2019-12-01:2020-04-30 --period 2020-12-01:2021-04-30
          --period 2021-12-01:2022-04-30 --period 2022-12-01:2023-04-30
      - name: Commit whatever was captured
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/sources/historical_floods data/v09/sources/hydrosheds_piura data/v09/research/historical || true
          git diff --cached --quiet && { echo "::warning::nothing captured"; exit 0; }
          echo "::notice title=captured::$(git diff --cached --stat | tail -1)"
          git commit -q -m "Research snapshot: HydroSHEDS crops, PECHP 2020-2023, station documents and IMERG Final 2019-2023 for the Piura catchment study"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
