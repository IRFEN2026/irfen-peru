name: IRFEN - Recuperacion puntual IMERG Early 34 intervalos (TEST_ONLY)
# One-time authorized recovery; ONLY the exact research branch can trigger this.
on:
  push:
    branches:
      - research/imerg-early-recovery-34-20261020
    paths:
      - .github/workflows/v09-imerg-recover34-once.yml
permissions:
  contents: read
concurrency:
  group: research-imerg-recover34-oneoff
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/research/imerg-early-recovery-34-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Comprobar alcance e integridad sin red
        run: |
          python -m py_compile scripts/v09_imerg_early_recover_34.py
          python -m unittest discover -s qa/replay_tools -p 'test_v09_imerg_recovery_scope.py' -v
      - name: Dependencias del mismo procesador cientifico
        run: pip install -r requirements.txt
      - name: Recuperar lote acotado IMERG Early v07, solo evidencia
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1500s python scripts/v09_imerg_early_recover_34.py --shard ${{ matrix.shard }} --out "$RUNNER_TEMP/imerg-recovery/shard-${{ matrix.shard }}.json"
      - name: Conservar evidencia aislada tambien si el lote es parcial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imerg-early-recovery-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/imerg-recovery/*.json
          if-no-files-found: warn
          retention-days: 30
