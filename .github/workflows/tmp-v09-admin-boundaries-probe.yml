name: TMP v0.9 probe official administrative boundary services (removed next commit)
on:
  push:
    branches: [v09/territorial-crossing-v0-1]
    paths: [.github/workflows/tmp-v09-admin-boundaries-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reachability of geosnirh.ana.gob.pe from the runner (read-only)
        run: |
          for u in https://geosnirh.ana.gob.pe/server/rest/services/DU0302023/Limite_Provincial_DU_N_030_2023/MapServer?f=json https://geosnirh.ana.gob.pe/ https://portal.indeci.gob.pe/robots.txt; do
            r=$(curl -sS -o /tmp/b -w "%{http_code} %{time_total}s ip=%{remote_ip}" --max-time 60 "$u" 2>&1 || true)
            echo "::notice title=reach::$u -> $r $(head -c 600 /tmp/b 2>/dev/null | tr '\n' ' ')"
          done
          getent hosts geosnirh.ana.gob.pe | sed 's/^/::notice title=dns::/' || echo "::notice title=dns::no resolution"
