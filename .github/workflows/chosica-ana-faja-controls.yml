name: IRFEN - Controles ANA Chosica

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/discover_chosica_ana_faja_controls.py
      - .github/workflows/chosica-ana-faja-controls.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - name: Descubrir geometría oficial ANA/SIGRID
        run: python scripts/discover_chosica_ana_faja_controls.py
      - name: Validar salida
        run: |
          test -s site/data/calibration/chosica_ana_faja_controls.json
          python -m json.tool site/data/calibration/chosica_ana_faja_controls.json >/dev/null
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/calibration/chosica_ana_faja_controls.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: update official ANA Chosica controls"
          git pull --rebase origin main
          git push
