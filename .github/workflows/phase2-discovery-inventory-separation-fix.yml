name: IRFEN - Phase2 discovery inventory separation fix

on:
  pull_request:
    paths:
      - scripts/fix_phase2_discovery_inventory_separation.py
      - .github/workflows/phase2-discovery-inventory-separation-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-anchor separation patch
        run: python scripts/fix_phase2_discovery_inventory_separation.py
      - name: Verify territorial inventory semantics
        run: |
          python -m unittest tests.test_v08_territorial_inventory -v
          python scripts/build_map_layer_catalog.py --check-only
      - name: Commit bounded UI fix
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/v08-territorial.js
          git diff --cached --quiet && exit 0
          git commit -m 'Keep discovery units separate from Phase-2 candidate count'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
