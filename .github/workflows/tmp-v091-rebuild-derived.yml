name: TMP v0.9.1 rebuild derived outputs + pytest manifest on the pinned runner (removed next commit)
on:
  push:
    branches: [research/v091-integration-main-20261110]
    paths: [.github/workflows/tmp-v091-rebuild-derived.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    env:
      IRFEN_REQUIRE_JSONSCHEMA: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-ci-test.txt
          python -c "import numpy, sys; print('python', sys.version.split()[0], 'numpy', numpy.__version__)"
          grep -m1 -o 'avx512[a-z]*' /proc/cpuinfo | head -1 || echo "no avx512"
      - name: Rebuild semáforo, bundle and demo (rules, thresholds and configs untouched)
        run: |
          set -euo pipefail
          python scripts/v09_build_semaforo.py
          python scripts/v09_build_surveillance_view.py > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/leaflet.css" https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
          python scripts/v09_build_surveillance_demo.py --leaflet-css "$RUNNER_TEMP/leaflet.css" --out research/v09/private_demo/irfen_vigilancia_privada_v091.html
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p = Path("research/v09/V091_CANDIDATE_MANIFEST.json"); m = json.loads(p.read_text())
          ch = [k for k in m["files"] if m["files"][k] != hashlib.sha256(Path(k).read_bytes()).hexdigest()]
          for k in ch:
              m["files"][k] = hashlib.sha256(Path(k).read_bytes()).hexdigest()
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + "\n"); print("rehashed:", ch)
          PY
      - name: Determinism (separate processes, different hash seeds)
        run: |
          set -euo pipefail
          for seed in 0 1 12345 random; do PYTHONHASHSEED=$seed python scripts/v09_build_semaforo.py --check; done
          python scripts/verify_phase2_test_collection.py --write-manifest
          python -m pytest tests/test_v09_surveillance_view.py -q -rs
          git status --short | grep -v __pycache__
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/research/semaforo/semaforo_v0_1.json site/data/v09/surveillance_view_v0_1.json research/v09/private_demo/irfen_vigilancia_privada_v091.html research/v09/V091_CANDIDATE_MANIFEST.json config/phase2_test_collection_manifest.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "Rebuild v0.9.1 derived outputs and pytest manifest on the pinned runner (deterministic flow_spearman)"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
