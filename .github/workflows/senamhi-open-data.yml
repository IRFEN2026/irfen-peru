name: IRFEN - Procesar datos abiertos SENAMHI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/senamhi-open-data.yml
      - scripts/discover_senamhi_open_data.py

permissions:
  contents: write

concurrency:
  group: senamhi-open-data
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests
      - name: Procesar catálogo/datos históricos abiertos SENAMHI
        run: python scripts/discover_senamhi_open_data.py
      - name: Validar resultado
        run: |
          test -s site/data/stations/senamhi_open_data_catalog.json
          python -m json.tool site/data/stations/senamhi_open_data_catalog.json >/dev/null
      - name: Guardar catálogo científico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations/senamhi_open_data_catalog.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: actualizar catálogo histórico SENAMHI datos abiertos"
          git pull --rebase origin main
          git push
