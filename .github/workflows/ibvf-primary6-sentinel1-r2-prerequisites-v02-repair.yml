name: IBVF - PRIMARY6 Sentinel-1 R2 prerequisite repair v0.2

on:
  push:
    branches: [agent/independent-basin-validation-map]
    paths:
      - '.github/workflows/ibvf-primary6-sentinel1-r2-prerequisites-v02-repair.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-sentinel1-r2-prerequisites-v02-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata-only prerequisite runtime
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
          sudo apt-get update
          sudo apt-get install -y proj-bin proj-data
          python -m py_compile scripts/ibvf_sentinel1_r2_freeze_prerequisites.py scripts/ibvf_sentinel1_r2_orbit_resolver_v02.py scripts/ibvf_primary6_sentinel1_r2_prerequisites.py scripts/ibvf_primary6_sentinel1_r2_prerequisites_v02.py
      - name: Verify globally frozen overlap correction predates R2 science
        run: |
          python - <<'PY'
          import json
          d=json.load(open('site/data/validation/ibvf_primary6_sentinel1_poeorb_overlap_resolution_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['decision_timing']['made_before_primary6_r2_science_pixels_read'] is True
          assert d['decision_timing']['sar_pre_post_response_read'] is False
          assert d['decision_timing']['territorial_outcomes_used'] is False
          assert d['frozen_selection_rule']['if_multiple_candidates']=='SELECT_UNIQUE_MAXIMUM_FILE_CREATION_TIMESTAMP'
          assert d['frozen_selection_rule']['same_rule_for_all_primary6_units_seasons_and_windows'] is True
          assert d['frozen_selection_rule']['per_case_tuning_allowed'] is False
          PY
      - name: Freeze 2015-2016 and 2016-2017 prerequisites using identical rule
        run: |
          mkdir -p artifacts/ibvf
          for spec in '2015_2016 2015-2016' '2016_2017 2016-2017'; do
            set -- $spec; file=$1; season=$2
            python scripts/ibvf_primary6_sentinel1_r2_prerequisites_v02.py \
              --r2-entry "site/data/validation/ibvf_primary6_sentinel1_r2_entry_${file}_v01.json" \
              --base-prereq-contract site/data/validation/cashahuacra_sentinel1_r2_prerequisites_contract.json \
              --output "artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_${file}_v01.json"
          done
      - name: Fail-closed scientific guards for both seasons
        run: |
          python - <<'PY'
          import json
          expected={'2015_2016':(18,0),'2016_2017':(16,2)}
          rule='LATEST_CREATION_TIMESTAMP_AMONG_AUX_POEORB_FILES_WHOSE_VALIDITY_COVERS_FROZEN_ACQUISITION_UTC'
          for file,(ready,missing) in expected.items():
            p=f'artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_{file}_v01.json'
            d=json.load(open(p,encoding='utf-8'))
            assert d['schema_version']=='irfen-ibvf-primary6-sentinel1-r2-prerequisites-v0.2'
            assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
            assert d['production_use'] is False and d['production_ready'] is False
            assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
            assert d['territorial_activation_evidence_blinded'] is True
            assert d['compatible_windows_expected']==ready and d['compatible_windows_prerequisites_pass']==ready
            assert d['missing_windows_expected']==missing and d['missing_windows_preserved']==missing
            assert d['vertical_transform_resource']['status']=='PASS'
            assert d['same_orbit_quality_class']=='AUX_POEORB' and d['automatic_unhashed_orbit_download_allowed'] is False
            assert all(x['status']=='PASS_EXACT_AUX_POEORB_BOTH_DATES_SHA256_FROZEN' for x in d['entries'])
            assert all(x['status']=='MISSING_COMPATIBLE_PAIR_RETAINED_NO_R2_EXECUTION' for x in d['missing_entries'])
            for x in d['entries']:
              for side in ('pre','post'):
                o=x['precise_orbits'][side]
                assert o['status']=='PASS' and o['selection_rule']==rule
                assert o['selection_uses_science_values'] is False and o['selection_uses_outcomes'] is False
                assert o['zip_sha256'] and o['inner_eof_sha256'] and o['selected_creation_utc']
            assert d['r2_execution_performed'] is False and d['r2_science_pixels_read'] is False
            assert d['r3_common_support_computed'] is False and d['r4_features_computed'] is False
            assert d['territorial_outcomes_read'] is False and d['known_event_dates_read'] is False
            assert d['case_control_assignment_performed'] is False
            assert d['activation_inference_allowed'] is False and d['modeling_allowed'] is False
            assert d['status']=='PASS_ALL_R2_PREREQUISITES_FROZEN_NO_SCIENCE_VALUES'
            print(file,ready,missing,d['r2_prerequisite_identity_sha256'])
          PY
      - name: Archive only validated prerequisite manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json site/data/validation/
          cp artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2016_2017_v01.json site/data/validation/
          git add site/data/validation/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json site/data/validation/ibvf_primary6_sentinel1_r2_prerequisites_2016_2017_v01.json
          git commit -m 'IBVF: archive validated PRIMARY6 R2 prerequisites 2015-2017'
          git push origin HEAD:agent/independent-basin-validation-map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibvf-primary6-r2-prerequisite-repair-${{ github.sha }}
          path: artifacts/ibvf/*.json
          if-no-files-found: warn
          retention-days: 30
