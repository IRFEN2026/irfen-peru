name: IBVF - Cashahuacra snap positional sensitivity

on:
  pull_request:
    paths:
      - 'scripts/ibvf_cashahuacra_dem_snap.py'
      - 'scripts/ibvf_cashahuacra_nearest_channel_snap.py'
      - 'scripts/ibvf_cashahuacra_snap_sensitivity.py'
      - '.github/workflows/ibvf-cashahuacra-snap-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positional-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hydrologic dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'rasterio>=1.3,<2' 'requests>=2.31,<3' 'pysheds>=0.4,<0.5' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Validate scripts
        run: python -m py_compile scripts/ibvf_cashahuacra_dem_snap.py scripts/ibvf_cashahuacra_nearest_channel_snap.py scripts/ibvf_cashahuacra_snap_sensitivity.py
      - name: Run predeclared positional sensitivity
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_cashahuacra_snap_sensitivity.py \
            --output artifacts/ibvf/cashahuacra_snap_positional_sensitivity.json
      - name: Scientific guardrails
        run: |
          python - <<'PY'
          import json
          p='artifacts/ibvf/cashahuacra_snap_positional_sensitivity.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False
          assert d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['contract']['target_basin_area_used'] is False
          assert d['contract']['historical_candidate_area_used_for_selection'] is False
          assert d['contract']['territorial_activation_evidence_used'] is False
          assert d['contract']['operational_threshold_used'] is False
          assert d['contract']['conditioning_sensitivity_is_separate_gate'] is True
          print({'status':d.get('secondary_sensitivity_status'),'half_pixel_exact':d.get('half_pixel_exact_cell_stable'),'one_pixel':d.get('one_pixel_diagnostics'),'conditioning':d.get('conditioning_sensitivity_status')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-cashahuacra-snap-sensitivity-${{ github.sha }}
          path: artifacts/ibvf/cashahuacra_snap_positional_sensitivity.json
          if-no-files-found: error
          retention-days: 30
