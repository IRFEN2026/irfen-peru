name: PR193 - Canonical climate mirror repair

on:
  push:
    branches:
      - agent/full-territorial-map-inventory-20260921
    paths:
      - .github/workflows/repair-climate-mirror-pr193.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'IRFEN2026/irfen-peru' && github.actor == 'IRFEN2026'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild the existing canonical JSON mirror without changing sources
        run: |
          set -euo pipefail
          python -m pip install jsonschema
          python scripts/build_phase2_climate_evidence.py
          python scripts/validate_phase2_climate_evidence.py
      - name: Commit only the canonical JSON to the same branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/full-territorial-map-inventory-20260921'
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          allowed = {'site/data/phase2/climate_evidence_normalized_v0_1.json'}
          assert changed <= allowed, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/phase2/climate_evidence_normalized_v0_1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize canonical climate JSON with committed event evidence'
          git push origin HEAD:agent/full-territorial-map-inventory-20260921
