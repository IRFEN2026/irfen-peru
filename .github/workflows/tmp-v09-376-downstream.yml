name: TMP 376 downstream simulation (removed next commit)
on:
  push:
    branches: [v09/senamhi-free-outcome-and-piura]
    paths: [.github/workflows/tmp-v09-376-downstream.yml]
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: One post-reactivation run of both collectors, HTTP intercepted (no network, SENAMHI never called)
        run: python .github/tmp/sim376.py 2>&1 | grep -E "HTTP calls|hosts" | sed 's/^/::notice title=sim::/'
      - name: Deploy build chain + regression + scorecard on the simulated outputs
        shell: bash
        run: |
          set +e
          for s in build_historical_replay build_phase2_event_reanalysis build_lambayeque_hydrologic_units build_phase2_catalog build_phase2_spatial_observation_contracts build_phase2_climate_evidence build_phase2_climate_matrix build_lima_east_hazard_decomposition build_piura_reference_model build_ana_catacaos_segments build_map_layer_catalog build_experimental_state; do
            python scripts/$s.py > /dev/null 2> err.txt || echo "::warning title=build::$s failed: $(tail -1 err.txt)"
          done
          python scripts/run_v08_regression_tests.py > reg.txt 2>&1; rc=$?; echo "::notice title=regression::exit=$rc"; tail -4 reg.txt | tr '\n' ' ' | sed 's/^/::notice title=regression-tail::/'; echo
          python - <<'PY'
          import json
          r=json.load(open('site/data/test_report.json'))
          print("::notice title=report-keys::" + ",".join(list(r)[:20]))
          items = r.get('checks') or r.get('results') or r.get('tests') or []
          if isinstance(items, dict): items = [dict(name=k, ok=v) for k, v in items.items()]
          bad=[c for c in items if isinstance(c,dict) and (c.get('ok') is False or c.get('passed') is False or c.get('status') in ('FAIL','failed'))]
          print(f"::notice title=regression-detail::{len(items)} checks, {len(bad)} failed: " + "; ".join(str(c.get('name') or c.get('id')) for c in bad[:15]))
          PY
          python scripts/build_v08_scorecard.py > /dev/null && echo "::notice title=scorecard::ok" || echo "::error title=scorecard::failed"
          python scripts/build_v08_rc_status.py > /dev/null && echo "::notice title=rc_status::ok" || echo "::error title=rc_status::failed"
# rerun
