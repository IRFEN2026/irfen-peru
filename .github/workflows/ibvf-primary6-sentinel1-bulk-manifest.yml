name: IBVF - PRIMARY6 Sentinel-1 bulk manifest

on:
  push:
    branches: [agent/independent-basin-validation-map]
    paths:
      - 'scripts/ibvf_primary6_sentinel1_bulk_manifest.py'
      - '.github/workflows/ibvf-primary6-sentinel1-bulk-manifest.yml'
      - 'site/data/validation/ibvf_primary6_sentinel1_a4_contract_v01.json'
      - 'site/data/validation/ibvf_primary6_sentinel1_contract_reconciliation_v02.json'
      - 'site/data/validation/ibvf_primary6_sentinel1_r2_projection_amendment_v01.json'
      - 'site/data/validation/ibvf_primary6_s1_r2_graph_family_audit_v01.json'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-sentinel1-bulk-manifest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  freeze-execution-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile deterministic bulk manifest builder
        run: python -m py_compile scripts/ibvf_primary6_sentinel1_bulk_manifest.py
      - name: Freeze 108-window Sentinel-1 execution identity
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_sentinel1_bulk_manifest.py \
            --catalog site/data/validation/ibvf_primary6_selected_a1_catalog.json \
            --a4-contract site/data/validation/ibvf_primary6_sentinel1_a4_contract_v01.json \
            --reconciliation site/data/validation/ibvf_primary6_sentinel1_contract_reconciliation_v02.json \
            --projection-amendment site/data/validation/ibvf_primary6_sentinel1_r2_projection_amendment_v01.json \
            --graph-audit site/data/validation/ibvf_primary6_s1_r2_graph_family_audit_v01.json \
            --output artifacts/ibvf/ibvf_primary6_sentinel1_bulk_manifest_v01.json
      - name: Fail-closed scientific guards
        run: |
          python - <<'PY'
          import json
          p='artifacts/ibvf/ibvf_primary6_sentinel1_bulk_manifest_v01.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['cohort_id']=='PRIMARY6_CHRONOLOGICAL'
          assert d['selected_window_count']==108
          assert d['compatible_pair_count']==104
          assert d['missing_compatible_pair_count']==4
          assert d['unknown_pair_count']==0
          assert d['selected_window_replacement_allowed'] is False
          assert d['compatible_pair_reselection_allowed'] is False
          assert d['missing_pair_imputation_allowed'] is False
          assert d['science_pixels_read'] is False
          assert d['rainfall_values_read'] is False
          assert d['sar_change_values_read'] is False
          assert d['territorial_outcomes_read'] is False
          assert d['known_event_dates_read'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['activation_inference_allowed'] is False
          assert d['modeling_allowed'] is False
          assert len(d['windows'])==108
          assert sum(x['sar_execution_status']=='COMPATIBLE_PAIR_FROZEN_PENDING_R1_R4' for x in d['windows'])==104
          assert sum(x['sar_execution_status']=='MISSING_COMPATIBLE_PAIR_RETAIN_WINDOW_NO_REPLACEMENT_NO_IMPUTATION' for x in d['windows'])==4
          print({k:d[k] for k in ('status','selected_window_count','compatible_pair_count','missing_compatible_pair_count','track_compatible_pair_counts','track_missing_pair_counts','execution_identity_sha256')})
          PY
      - name: Freeze manifest and synchronize research map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/ibvf_primary6_sentinel1_bulk_manifest_v01.json site/data/validation/ibvf_primary6_sentinel1_bulk_manifest_v01.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          m=json.load(open('site/data/validation/ibvf_primary6_sentinel1_bulk_manifest_v01.json',encoding='utf-8'))
          p=Path('site/data/validation/independent_basin_validation_map.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['acquisition_contract']['primary_dataset_seasons_complete']==6
          assert d['acquisition_contract']['primary_dataset_canonical_rows_frozen']==5816
          assert d['acquisition_contract']['full_robustness_seasons_complete']==6
          d['version']='irfen-independent-basin-validation-map-v3.9'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{})
          ac['primary6_sentinel1_bulk_manifest']='site/data/validation/ibvf_primary6_sentinel1_bulk_manifest_v01.json'
          ac['primary6_sentinel1_bulk_manifest_status']=m['status']
          ac['primary6_sentinel1_bulk_execution_identity_sha256']=m['execution_identity_sha256']
          ac['primary6_sentinel1_bulk_selected_window_count']=m['selected_window_count']
          ac['primary6_sentinel1_bulk_compatible_pair_count']=m['compatible_pair_count']
          ac['primary6_sentinel1_bulk_missing_pair_count']=m['missing_compatible_pair_count']
          ac['primary6_sentinel1_bulk_track_compatible_pair_counts']=m['track_compatible_pair_counts']
          ac['primary6_sentinel1_bulk_track_missing_pair_counts']=m['track_missing_pair_counts']
          ac['primary6_sentinel1_bulk_r1_r4_executed']=False
          ac.setdefault('local_validation',{})['github_actions_primary6_sentinel1_bulk_manifest']='PASS_108_BOUND_104_COMPATIBLE_4_MISSING_NO_RESELECTION_NO_OUTCOME'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add \
            site/data/validation/ibvf_primary6_sentinel1_bulk_manifest_v01.json \
            site/data/validation/independent_basin_validation_map.json
          if git diff --cached --quiet; then
            echo 'No scientific freeze change.'
          else
            git commit -m 'IBVF: freeze PRIMARY6 Sentinel-1 bulk execution identity'
            git push origin HEAD:agent/independent-basin-validation-map
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-s1-bulk-manifest-${{ github.sha }}
          path: artifacts/ibvf/*
          if-no-files-found: warn
          retention-days: 30
