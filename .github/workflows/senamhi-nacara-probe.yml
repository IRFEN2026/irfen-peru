name: IRFEN - Probar SENAMHI Puente Nacara numerico v0.8

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches:
      - main
    paths:
      - scripts/probe_senamhi_nacara_numeric.py
      - scripts/archive_senamhi_nacara_numeric_probe.py
      - .github/workflows/senamhi-nacara-probe.yml

permissions:
  contents: write

concurrency:
  group: "senamhi-nacara-numeric-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probar acceso numerico SENAMHI PHISIS
        run: python scripts/probe_senamhi_nacara_numeric.py

      - name: Archivar disponibilidad y lecturas TEST_ONLY
        run: python scripts/archive_senamhi_nacara_numeric_probe.py

      - name: Validar seguridad cientifica
        run: |
          test -s site/data/hydrology/senamhi_nacara_numeric_probe.json
          test -s site/data/hydrology/senamhi_nacara_numeric_archive.json
          python -m json.tool site/data/hydrology/senamhi_nacara_numeric_probe.json >/dev/null
          python -m json.tool site/data/hydrology/senamhi_nacara_numeric_archive.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/hydrology/senamhi_nacara_numeric_probe.json').read_text())
          assert p.get('production_use') is False
          assert p.get('production_ready') is False
          assert p.get('integration_mode') == 'TEST_ONLY'
          assert (p.get('scientific_gate') or {}).get('status') in {
              'TEST_ONLY_NUMERIC_CHANNEL_FOUND',
              'AUTOMATIC_NUMERIC_ACCESS_UNRESOLVED',
          }
          if p.get('numeric_river_state_available'):
              r=p.get('reading') or {}
              assert r.get('station_id') == '47E0415A'
              assert r.get('unit') == 'm3/s'
              assert r.get('variable') == 'CAUDAL'
              assert float(r.get('value')) >= 0
              assert r.get('official_reference_red_use') == 'SOURCE_METADATA_ONLY_NOT_IRFEN_THRESHOLD'
          else:
              assert p.get('reading') is None
          a=json.loads(Path('site/data/hydrology/senamhi_nacara_numeric_archive.json').read_text())
          assert a.get('production_use') is False
          assert a.get('production_ready') is False
          assert a.get('integration_mode') == 'TEST_ONLY'
          assert (a.get('scientific_gate') or {}).get('hydraulic_transfer_to_catacaos_validated') is False
          assert (a.get('scientific_gate') or {}).get('official_threshold_promoted_to_irfen') is False
          assert 'never zero' in (a.get('scientific_gate') or {}).get('missing_data_rule','')
          print('Probe SENAMHI confinado correctamente a descubrimiento')
          PY

      - name: Guardar evidencia
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/hydrology/senamhi_nacara_numeric_probe.json \
            site/data/hydrology/senamhi_nacara_numeric_archive.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "IRFEN v0.8: actualizar probe SENAMHI Puente Nacara"
          git pull --rebase origin main
          git push origin HEAD:main
