name: TMP capture ANA 2016-2017 quebradas document (source snapshot; removed next commit)
on:
  push:
    branches: [data/v09-ana2017-coastal-points-20261030]
    paths: [.github/workflows/tmp-ana2017-capture.yml, scripts/v09_ana2017_source_capture.py]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q pypdf==6.19.0
      - run: python scripts/v09_ana2017_source_capture.py
      - name: Commit the source snapshot (text + record) to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/sources/ana2017_complementacion_quebradas
          git commit -q -m "Source snapshot: ANA 2016-2017 complementación (page text + download record)"
          git push -q origin HEAD:data/v09-ana2017-coastal-points-20261030
