name: TMP capture ANA 2016-2017 quebradas document (source snapshot; removed next commit)
on:
  push:
    branches: [data/v09-ana2017-coastal-points-20261030]
    paths: [.github/workflows/tmp-ana2017-capture.yml, scripts/v09_ana2017_table_ocr.py]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q pypdf==6.19.0
      - run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa >/dev/null
          pip install -q opencv-python-headless==4.10.0.84 numpy
          tesseract --version | head -1; tesseract --list-langs
      - run: python scripts/v09_ana2017_table_ocr.py --lang spa --jobs 4
      - name: Commit the source snapshot (text + record) to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/sources/ana2017_complementacion_quebradas/ocr_tables.json
          git commit -q -m "Raw cell-wise OCR of the ten coastal ANA 2016-2017 tables (Tesseract spa, two reads per numeric cell)"
          git push -q origin HEAD:data/v09-ana2017-coastal-points-20261030
