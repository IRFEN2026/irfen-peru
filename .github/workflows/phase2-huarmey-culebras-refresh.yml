name: Phase2 Huarmey Culebras map refresh

on:
  push:
    branches:
      - phase2-huarmey-culebras-replay-20260923

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase2-huarmey-culebras-replay-20260923
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild map catalog from bounded sources
        run: python scripts/build_map_layer_catalog.py
      - name: Run focused scientific guards
        run: |
          python scripts/build_map_layer_catalog.py --check-only
          python -m unittest tests.test_phase2_discovery_map_components tests.test_phase2_huarmey_culebras_discovery_contract -v
      - name: Commit generated catalog only
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code -- scripts/build_map_layer_catalog.py scripts/build_map_layer_catalog_core.py site/data/phase2 tests || true
          if git diff --quiet -- site/data/map_layers.json; then
            echo 'No map catalog drift to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/map_layers.json
          git diff --cached --name-only | grep -qx 'site/data/map_layers.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Regenerate Huarmey Culebras map catalog'
          git push origin HEAD:phase2-huarmey-culebras-replay-20260923
