name: PR bootstrap Acari Canete official basin geometry

on:
  pull_request:
    paths:
      - .github/workflows/pr197-bootstrap-acari-canete-geometry.yml
      - scripts/probe_acari_canete_official_geometry.py
      - tests/test_phase2_acari_canete_geometry.py

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce explicit Phase-2 contract guards in generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/probe_acari_canete_official_geometry.py')
          s=p.read_text(encoding='utf-8')
          old='    source_ids = list(updated.get("official_source_ids") or [])\n'
          new='    updated["test_mode"] = "TEST_ONLY"\n    updated["production_ready"] = False\n    updated["operational_alerting_enabled"] = False\n    source_ids = list(updated.get("official_source_ids") or [])\n'
          if old not in s:
              raise SystemExit('generator guard insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Freeze official ANA source snapshots and bounded basin-context geometries
        run: |
          python scripts/probe_acari_canete_official_geometry.py --refresh-source
      - name: Update spatial-observation expectations without promoting geometry
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/validate_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          start='SANTA_ID = "lima_este_santa_eulalia_rimac"\n'
          end='EXPECTED_SUBUNITS = {\n'
          i=s.index(start); j=s.index(end,i)
          constants=(
              'SANTA_ID = "lima_este_santa_eulalia_rimac"\n'
              'LURIN_ID = "lima_este_lurin_cieneguilla"\n'
              'MOTUPE_ID = "lambayeque_motupe_la_leche_pitipo"\n'
              'ACARI_ID = "arequipa_acari_san_agustin"\n'
              'CANETE_ID = "lima_sur_canete"\n'
              'LAMBAYEQUE_PARENT_ID = "lambayeque_chongoyape_oyotun_zana"\n'
          )
          s=s[:i]+constants+s[j:]
          s=s.replace(
              'if present != {SANTA_ID, LURIN_ID, MOTUPE_ID}:',
              'if present != {SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID}:'
          )
          s=s.replace(
              'for cid in (SANTA_ID, LURIN_ID, MOTUPE_ID):',
              'for cid in (SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID):'
          )
          map_start='    expected_status = {\n'
          map_end='    for cid in expected_ids:\n'
          i=s.index(map_start); j=s.index(map_end,i)
          status=(
              '    expected_status = {\n'
              '        SANTA_ID: "SUBUNIT_RESEARCH_ONLY",\n'
              '        LURIN_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n'
              '        MOTUPE_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n'
              '        ACARI_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n'
              '        CANETE_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n'
              '        LAMBAYEQUE_PARENT_ID: "SUBUNIT_RESEARCH_ONLY",\n'
              '    }\n'
          )
          s=s[:i]+status+s[j:]
          s=s.replace('"non_catchment_geometry_only_count": 2,\n        "blocked_missing_geometry_count": 14,', '"non_catchment_geometry_only_count": 4,\n        "blocked_missing_geometry_count": 12,')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('self.assertEqual(summary["non_catchment_geometry_only_count"], 2)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 14)', 'self.assertEqual(summary["non_catchment_geometry_only_count"], 4)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 12)')
          marker='    def test_lurin_corridor_is_not_sampling_catchment(self):\n'
          extra='    def test_acari_and_canete_basin_contexts_do_not_complete_compound_candidates(self):\n        for candidate_id in ("arequipa_acari_san_agustin", "lima_sur_canete"):\n            row = self.by_id[candidate_id]\n            self.assertEqual(row["geometry_asset_status"], "PARTIAL")\n            self.assertEqual(row["geometry_data_presence"], "PRESENT")\n            self.assertEqual(row["spatial_contract_status"], "NON_CATCHMENT_GEOMETRY_ONLY")\n            self.assertFalse(row["candidate_wide_sampling_ready"])\n            self.assertEqual(row["subunit_contracts"], [])\n\n'
          if extra not in s:
              s=s.replace(marker,extra+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate deterministic Phase-2 and map artifacts
        run: |
          python scripts/build_phase2_catalog.py
          python scripts/build_map_layer_catalog.py
          python scripts/build_phase2_climate_matrix.py
          python scripts/build_phase2_spatial_observation_contracts.py
      - name: Validate frozen replay and fail-closed guardrails
        run: |
          python scripts/probe_acari_canete_official_geometry.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python scripts/validate_phase2_spatial_observation_contracts.py
          python -m unittest tests.test_phase2_acari_canete_geometry tests.test_phase2_spatial_observation_contracts tests.test_phase2_climate_matrix -v
      - name: Persist only validated scientific artifacts
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/probe_acari_canete_official_geometry.py \
            scripts/validate_phase2_spatial_observation_contracts.py \
            tests/test_phase2_spatial_observation_contracts.py \
            config/phase2_candidate_inventory_v0_1.json \
            config/phase2_candidate_inventory_v0_2.json \
            site/data/phase2/sources/acari_canete_hydrologic_context \
            site/data/phase2/geometries/arequipa_acari_san_agustin_acari_basin_context.geojson \
            site/data/phase2/geometries/arequipa_acari_san_agustin_geometry_validation.json \
            site/data/phase2/geometries/lima_sur_canete_canete_basin_context.geojson \
            site/data/phase2/geometries/lima_sur_canete_geometry_validation.json \
            site/data/validation/phase2_zone_contracts/arequipa_acari_san_agustin.json \
            site/data/validation/phase2_zone_contracts/lima_sur_canete.json \
            site/data/phase2/catalog.json \
            site/data/map_layers.json \
            site/data/phase2/climate_conditioned_activation_matrix_v0_1.json \
            site/data/phase2/spatial_observation_contracts_v0_1.json
          if git diff --cached --quiet; then
            echo "No bootstrap changes to persist."
            exit 0
          fi
          git commit -m "Freeze official Acari and Canete basin context geometry"
          git push origin "HEAD:${BRANCH}"
