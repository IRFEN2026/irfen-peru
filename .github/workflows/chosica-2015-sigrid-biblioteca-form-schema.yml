name: IRFEN - Chosica 2015 SIGRID biblioteca form schema

on:
  pull_request:
    paths:
      - config/chosica_2015_sigrid_biblioteca_form_discovery_contract_v0_1.json
      - scripts/discover_chosica_2015_sigrid_biblioteca_form_schema.py
      - .github/workflows/chosica-2015-sigrid-biblioteca-form-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-form-schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_sigrid_biblioteca_form_discovery_contract_v0_1.json
            scripts/discover_chosica_2015_sigrid_biblioteca_form_schema.py
            .github/workflows/chosica-2015-sigrid-biblioteca-form-schema.yml
      - name: Assert forbidden scientific files absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
      - name: Discover only frozen biblioteca form infrastructure
        run: |
          set -euo pipefail
          mkdir -p artifacts
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/discover_chosica_2015_sigrid_biblioteca_form_schema.py \
            --contract config/chosica_2015_sigrid_biblioteca_form_discovery_contract_v0_1.json \
            --output artifacts/chosica_2015_sigrid_biblioteca_form_schema_v0_1.json \
            | tee artifacts/sigrid_biblioteca_form_schema_summary.json
      - name: Enforce infrastructure-only boundary
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/chosica_2015_sigrid_biblioteca_form_schema_v0_1.json');d=json.loads(p.read_text(encoding='utf-8'))
          g={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          assert d['status']=='PASS_SIGRID_BIBLIOTECA_FORM_SCHEMA_DISCOVERY'
          assert d['guards']==g
          assert d['classification']=='INFRASTRUCTURE_ONLY_NOT_TERRITORIAL_EVIDENCE'
          assert d['forms_submitted'] is False and d['linked_routes_followed'] is False
          assert d['candidate_territorial_evidence_read'] is False and d['control_labels_assigned'] is False
          assert d['sealed_target_unblind_allowed'] is False
          assert d['visible_text_retained'] is False and d['input_values_retained'] is False
          assert d['option_values_or_labels_retained'] is False and d['document_metadata_retained'] is False
          text=p.read_text(encoding='utf-8').lower()
          for token in ('pedregal','quirio','carossio','carosio','rayos de sol','cashahuacra','la libertad','a6680','official_outcome_evidence'):
              assert token not in text,token
          for f in d.get('forms',[]):
              assert f['action'].startswith('https://sigrid.cenepred.gob.pe/') and '?' not in f['action'] and '#' not in f['action']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-sigrid-biblioteca-form-schema
          path: |
            artifacts/chosica_2015_sigrid_biblioteca_form_schema_v0_1.json
            artifacts/sigrid_biblioteca_form_schema_summary.json
          if-no-files-found: error
