name: IRFEN - Archivar fuentes oficiales para revisión en sombra v0.8

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Jornada UTC ya cerrada que se debe recapturar (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    # Cuatro intentos acotados sobre la misma jornada UTC cerrada. El archivo
    # conserva como máximo cinco capturas diarias y nunca clasifica el resultado.
    - cron: "25 0,6,12,18 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/archive_official_outcome_sources.py
      - .github/workflows/official-outcome-evidence.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: "official-outcome-evidence"
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Capturar fuentes oficiales posteriores al cierre UTC
        shell: bash
        env:
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${SNAPSHOT_DATE:-}" ]]; then
            [[ "$SNAPSHOT_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
            args+=(--snapshot-date "$SNAPSHOT_DATE")
          fi
          python scripts/archive_official_outcome_sources.py "${args[@]}"

      - name: Validar contrato conservador
        run: |
          test -s site/data/validation/official_outcome_evidence.json
          python -m json.tool site/data/validation/official_outcome_evidence.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data/validation/official_outcome_evidence.json').read_text())
          assert d.get('status') == 'OFFICIAL_SOURCE_SNAPSHOT_ARCHIVE'
          assert d.get('production_use') is False
          assert d.get('production_ready') is False
          assert d.get('decision_use') == 'HUMAN_REVIEW_INPUT_ONLY'
          assert d.get('records')
          for record in d['records']:
              for capture in record.get('captures',[]):
                  assert capture.get('counts_toward_closeout') is False
                  assert capture.get('outcome_label') is None
                  assert capture.get('production_use') is False
                  assert len(capture.get('sources',[])) == 3
                  indeci=next(
                      source for source in capture.get('sources',[])
                      if source.get('source_id') == 'indeci_emergencies'
                  )
                  pagination=(indeci.get('summary') or {}).get('pagination') or {}
                  if (
                      capture.get('captured_at') == d.get('updated_at')
                      and indeci.get('capture_status') != 'SOURCE_UNREACHABLE'
                  ):
                      assert pagination.get('captured_pages',0) >= 1
                  if pagination:
                      assert pagination.get('coverage_status') in {
                          'COMPLETE_BOUNDED_NAVIGATION_CAPTURE',
                          'PARTIAL_UNKNOWN_NOT_ZERO',
                      }
                      assert pagination.get('missing_match_is_none') is False
                  for source in capture.get('supplemental_sources',[]):
                      alignment=(source.get('summary') or {}).get('snapshot_date_alignment')
                      if alignment != 'TARGET_DATE_PRESENT':
                          assert source.get('unknown_not_zero') is True
          print('Archivo oficial para revisión en sombra OK:', d.get('record_count'))
          PY

      - name: Guardar evidencia sin clasificar
        shell: bash
        run: |
          set -euo pipefail
          path="site/data/validation/official_outcome_evidence.json"
          candidate="$(mktemp)"
          retry_dir=""
          cleanup() {
            if [ -n "$retry_dir" ]; then
              git worktree remove --force "$retry_dir" >/dev/null 2>&1 || true
            fi
            rm -f -- "$candidate"
          }
          trap cleanup EXIT
          cp -- "$path" "$candidate"
          candidate_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          validated_main="$(git rev-parse HEAD)"

          if git diff --quiet "$validated_main" -- "$path"; then
            echo "Sin cambios."
            exit 0
          fi

          # Reintentar solo si main avanzó en archivos ajenos al archivo
          # validado. Un cambio concurrente del mismo archivo aborta sin
          # sobrescribir capturas científicas ni usar force-push.
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            if ! git diff --quiet "$validated_main" origin/main -- "$path"; then
              remote_sha="$(git show "origin/main:$path" | sha256sum | awk '{print $1}')"
              if [ "$remote_sha" = "$candidate_sha" ]; then
                echo "La evidencia candidata ya fue persistida por otra ejecución."
                exit 0
              fi
              echo "ERROR: la evidencia remota cambió después de la validación; no se sobrescribe." >&2
              exit 1
            fi

            retry_dir="$(mktemp -d)"
            git worktree add --detach "$retry_dir" origin/main
            cp -- "$candidate" "$retry_dir/$path"
            if (
              cd "$retry_dir"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- "$path"
              git commit -m "IRFEN v0.8: archivar fuentes oficiales de resultado"
              git push origin HEAD:main
            ); then
              git worktree remove --force "$retry_dir"
              retry_dir=""
              echo "Evidencia oficial persistida sin sobrescritura concurrente."
              exit 0
            fi

            git worktree remove --force "$retry_dir"
            retry_dir=""
            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: main siguió avanzando durante cuatro intentos acotados." >&2
              exit 1
            fi
            echo "Carrera de fast-forward en intento ${attempt}/4; reintento sin force-push."
            sleep "$((attempt * 2))"
          done

      - name: Publicar el archivo actualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          EXPECTED_SHA="$(git rev-parse origin/main)"
          gh workflow run publish-committed-data.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$EXPECTED_SHA"
