name: IBVF - PRIMARY6 blind Landsat A4 optical preflight

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'site/data/validation/ibvf_primary6_landsat_a4_optical_contract.json'
      - 'site/data/validation/ibvf_a5_optical_slot_amendment_v02.json'
      - 'scripts/ibvf_primary6_landsat_a4_optical_preflight.py'
      - '.github/workflows/ibvf-primary6-landsat-a4-optical-preflight.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-landsat-a4-optical-preflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constrained geospatial dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'rasterio>=1.3,<2'
      - name: Compile blind optical preflight
        run: python -m py_compile scripts/ibvf_primary6_landsat_a4_optical_preflight.py
      - name: Execute deterministic first-pair optical CVA preflight
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_landsat_a4_optical_preflight.py \
            --repo-root . \
            --output artifacts/ibvf/ibvf_primary6_landsat_a4_optical_preflight.json
      - name: Scientific fail-closed guards
        run: |
          python - <<'PY'
          import json, math
          p='artifacts/ibvf/ibvf_primary6_landsat_a4_optical_preflight.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert d['cohort_id']=='PRIMARY6_CHRONOLOGICAL'
          assert d['status'] if 'status' in d else d['primary_feature']['status']
          status=d.get('status',d.get('primary_feature',{}).get('status'))
          assert status=='PASS_BLIND_OPTICAL_CVA_PREFLIGHT_PRIMARY_VALUE_COMPUTED_NO_OUTCOME'
          assert d['preflight_window']['unit_id']=='huaycoloro'
          assert d['preflight_window']['season_id']=='2014-2015'
          assert d['preflight_window']['date_local']=='2014-09-02'
          assert d['primary_feature']['id']=='A4_OPTICAL_CVA_MEDIAN_MAGNITUDE_SR'
          assert d['primary_feature']['a5_slot']=='A4_OPTICAL_CHANGE_PRIMARY'
          assert isinstance(d['primary_feature']['value'],(int,float)) and math.isfinite(d['primary_feature']['value'])
          assert d['common_valid_pixel_count']>0
          assert 0 < d['common_valid_fraction_of_aoi'] <= 1
          assert d['resampling_performed'] is False
          assert d['reprojection_performed'] is False
          assert d['interpolation_performed'] is False
          assert d['selected_window_replaced'] is False
          assert d['pair_reselected'] is False
          assert d['territorial_outcome_fields_read'] is False
          assert d['known_event_dates_read'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['activation_inference_allowed'] is False
          assert d['modeling_allowed'] is False
          assert d['bulk_execution_allowed'] is True
          for side in ('pre_scene','post_scene'):
            assert len(d[side]['native_array_sha256'])==8
            assert d[side]['scene_valid_pixel_count']>0
          print({'status':status,'common_valid_pixel_count':d['common_valid_pixel_count'],'primary_feature':d['primary_feature']})
          PY
      - name: Freeze successful preflight and synchronize research map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/ibvf_primary6_landsat_a4_optical_preflight.json site/data/validation/ibvf_primary6_landsat_a4_optical_preflight.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          rp=Path('site/data/validation/ibvf_primary6_landsat_a4_optical_preflight.json')
          r=json.loads(rp.read_text(encoding='utf-8'))
          mp=Path('site/data/validation/independent_basin_validation_map.json')
          d=json.loads(mp.read_text(encoding='utf-8'))
          for x in (r,d):
            assert x['deployment_status']=='RESEARCH_ONLY'
            assert x['test_only'] is True
            assert x['production_use'] is False and x['production_ready'] is False
            assert x['operational_alerting_enabled'] is False
            assert x['uses_operational_event_none_labels'] is False
            assert x['territorial_activation_evidence_blinded'] is True
            assert x['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert r['primary_feature']['status']=='PASS_BLIND_OPTICAL_CVA_PREFLIGHT_PRIMARY_VALUE_COMPUTED_NO_OUTCOME'
          d['version']='irfen-independent-basin-validation-map-v3.4'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{})
          ac['primary6_landsat_a4_optical_contract']='site/data/validation/ibvf_primary6_landsat_a4_optical_contract.json'
          ac['a5_optical_slot_amendment']='site/data/validation/ibvf_a5_optical_slot_amendment_v02.json'
          ac['primary6_landsat_a4_optical_preflight']='site/data/validation/ibvf_primary6_landsat_a4_optical_preflight.json'
          ac['primary6_landsat_a4_optical_preflight_status']=r['primary_feature']['status']
          ac['primary6_landsat_a4_primary_feature']='A4_OPTICAL_CVA_MEDIAN_MAGNITUDE_SR'
          ac['primary6_landsat_a4_bulk_execution_allowed']=True
          ac['primary6_landsat_a4_bulk_execution_complete']=False
          ac['primary6_landsat_a4_selected_pair_target']=108
          ac['primary6_landsat_a4_selected_pairs_processed']=1
          ac['primary6_landsat_a4_no_resampling']=True
          ac['primary6_landsat_a4_territorial_outcomes_read']=False
          for c in d.get('cases',[]):
            if c.get('unit_id') in {'huaycoloro','san_ildefonso','shingolay'}:
              c['remote_sensing_status']='A1_COMPLETE_S1_PAIR_104_OF_108_GLOBAL_LANDSAT_108_PAIRS_SELECTED_A4_OPTICAL_CVA_PREREGISTERED_PREFLIGHT_PASS_BULK_PENDING'
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
          mp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add site/data/validation/ibvf_primary6_landsat_a4_optical_preflight.json site/data/validation/independent_basin_validation_map.json
          if git diff --cached --quiet; then
            echo 'No scientific preflight/map change to commit.'
          else
            git commit -m 'IBVF: freeze blind PRIMARY6 Landsat A4 optical preflight'
            git push origin HEAD:agent/independent-basin-validation-map
          fi
      - name: Upload blind optical preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-landsat-a4-optical-preflight-${{ github.sha }}
          path: artifacts/ibvf/ibvf_primary6_landsat_a4_optical_preflight.json
          if-no-files-found: warn
          retention-days: 30
