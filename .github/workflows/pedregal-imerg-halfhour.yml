name: IRFEN - Pedregal IMERG 30 min

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/analyze_pedregal_imerg_halfhour.py
      - site/data/calibration/pedregal_ana_validation.json
      - site/data/watersheds/chosica_local_candidate_sets.geojson
      - .github/workflows/pedregal-imerg-halfhour.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests shapely
      - run: python scripts/analyze_pedregal_imerg_halfhour.py
      - run: |
          test -s site/data/calibration/pedregal_2015_imerg_halfhour.json
          python -m json.tool site/data/calibration/pedregal_2015_imerg_halfhour.json >/dev/null
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/calibration/pedregal_2015_imerg_halfhour.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: update Pedregal half-hourly event analysis"
          git pull --rebase origin main
          git push
