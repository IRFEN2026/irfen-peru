name: PR196 regenerate dependent artifacts

on:
  pull_request:
    paths:
      - .github/workflows/pr196-regenerate-dependent-artifacts.yml
      - config/phase2_candidate_inventory_v0_2.json
      - site/data/validation/phase2_zone_contracts/lambayeque_motupe_la_leche_pitipo.json
      - scripts/build_phase2_catalog.py
      - scripts/build_phase2_climate_matrix.py
      - scripts/build_phase2_spatial_observation_contracts.py

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Patch hard-coded spatial expectations for the new bounded Motupe context
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/validate_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('LURIN_ID = "lima_este_lurin_cieneguilla"\nLAMBAYEQUE_PARENT_ID', 'LURIN_ID = "lima_este_lurin_cieneguilla"\nMOTUPE_ID = "lambayeque_motupe_la_leche_pitipo"\nLAMBAYEQUE_PARENT_ID')
          s=s.replace('if present != {SANTA_ID, LURIN_ID}:', 'if present != {SANTA_ID, LURIN_ID, MOTUPE_ID}:')
          s=s.replace('for cid in (SANTA_ID, LURIN_ID):', 'for cid in (SANTA_ID, LURIN_ID, MOTUPE_ID):')
          s=s.replace('LURIN_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        LAMBAYEQUE_PARENT_ID', 'LURIN_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        MOTUPE_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        LAMBAYEQUE_PARENT_ID')
          s=s.replace('"non_catchment_geometry_only_count": 1,\n        "blocked_missing_geometry_count": 15,', '"non_catchment_geometry_only_count": 2,\n        "blocked_missing_geometry_count": 14,')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('self.assertEqual(summary["non_catchment_geometry_only_count"], 1)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 15)', 'self.assertEqual(summary["non_catchment_geometry_only_count"], 2)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 14)')
          marker='    def test_lurin_corridor_is_not_sampling_catchment(self):\n'
          extra='    def test_motupe_basin_context_does_not_complete_compound_candidate(self):\n        motupe = self.by_id["lambayeque_motupe_la_leche_pitipo"]\n        self.assertEqual(motupe["geometry_asset_status"], "PARTIAL")\n        self.assertEqual(motupe["geometry_data_presence"], "PRESENT")\n        self.assertEqual(motupe["spatial_contract_status"], "NON_CATCHMENT_GEOMETRY_ONLY")\n        self.assertFalse(motupe["candidate_wide_sampling_ready"])\n        self.assertEqual(motupe["subunit_contracts"], [])\n\n'
          if extra not in s:
              s=s.replace(marker, extra+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate deterministic dependent artifacts
        run: |
          python scripts/build_phase2_climate_matrix.py
          python scripts/build_phase2_spatial_observation_contracts.py
      - name: Validate patched scientific expectations
        run: |
          python scripts/validate_phase2_spatial_observation_contracts.py
          python -m unittest tests.test_phase2_spatial_observation_contracts tests.test_phase2_climate_matrix -v
      - name: Package exact files for branch update
        run: |
          mkdir -p artifacts/scripts artifacts/tests artifacts/site/data/phase2
          cp scripts/validate_phase2_spatial_observation_contracts.py artifacts/scripts/
          cp tests/test_phase2_spatial_observation_contracts.py artifacts/tests/
          cp site/data/phase2/climate_conditioned_activation_matrix_v0_1.json artifacts/site/data/phase2/
          cp site/data/phase2/spatial_observation_contracts_v0_1.json artifacts/site/data/phase2/
      - uses: actions/upload-artifact@v4
        with:
          name: pr196-dependent-artifacts
          path: artifacts
          if-no-files-found: error
