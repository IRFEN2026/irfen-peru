name: IRFEN - Phase2 Cañete deterministic canonicalize

on:
  pull_request:
    paths:
      - .github/workflows/phase2-canete-canonicalize-tmp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific dependencies
        run: pip install -r requirements.txt
      - name: Canonicalize deterministic Acarí/Cañete artifacts
        run: python scripts/probe_acari_canete_official_geometry.py
      - name: Rebuild map catalog after canonicalization
        run: python scripts/build_map_layer_catalog.py
      - name: Verify deterministic replay
        run: |
          python scripts/probe_acari_canete_official_geometry.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python tests/test_phase2_canete_jacayita_faja_context.py
      - name: Commit canonicalized artifacts
        run: |
          if git diff --quiet; then
            echo 'No canonicalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/validation/phase2_zone_contracts/lima_sur_canete.json site/data/map_layers.json
          git commit -m 'Phase2: canonicalize Cañete component-layer contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
