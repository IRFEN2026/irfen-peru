name: IBVF - Multipista manifest guardrails

# Evaluate the files touched by each research-branch push, not the cumulative
# diff of the long-lived PR. This prevents unrelated scientific commits from
# re-running this guardrail on every PR synchronize event.
on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'site/data/validation/independent_basin_validation_map.json'
      - 'site/data/validation/cashahuacra_sentinel1_r2_contract.json'
      - 'site/data/validation/ibvf_parallel_window_pool_contract.json'
      - 'site/expansion.html'
      - 'scripts/ibvf_validate_case_manifest.py'
      - 'scripts/ibvf_validate_protocol_contracts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validators
        run: |
          python -m py_compile scripts/ibvf_validate_case_manifest.py scripts/ibvf_validate_protocol_contracts.py
      - name: Enforce scientific/non-operational map contract
        run: python scripts/ibvf_validate_case_manifest.py site/data/validation/independent_basin_validation_map.json
      - name: Enforce preregistered R2 and multipista A0 contracts
        run: |
          python scripts/ibvf_validate_protocol_contracts.py \
            --r2 site/data/validation/cashahuacra_sentinel1_r2_contract.json \
            --pool site/data/validation/ibvf_parallel_window_pool_contract.json
