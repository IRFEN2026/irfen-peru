name: TMP one-off capture-ledger QA snapshot (catalog metadata only; removed next commit)
on:
  push:
    branches: [v09/capture-ledger-v0-1]
    paths: [.github/workflows/tmp-v09-capture-ledger-snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Catalog-only ledger for 2026-10-13 to 2026-10-20 (no granule or scan downloads)
        run: |
          python scripts/v09_capture_ledger.py run --from 2026-10-13T00:00:00Z --to 2026-10-20T00:00:00Z --out data/v09/capture_ledger/snapshots/20261013T0000Z_20261020T0000Z
          python - <<'PY'
          import json
          d = json.load(open("data/v09/capture_ledger/snapshots/20261013T0000Z_20261020T0000Z/ledger_v0_1.json"))
          m = json.load(open("data/v09/capture_ledger/snapshots/20261013T0000Z_20261020T0000Z/requests.json"))
          bad = [r for r in m["requests"] if not r["ok"]]
          print(f"::notice title=ledger summary::{json.dumps(d['summary'], sort_keys=True)}")
          print(f"::notice title=ledger requests::total={len(m['requests'])} not_ok={len(bad)} first_errors={[(r['request_id'], r['error']) for r in bad[:5]]}")
          for prod in d["summary"]:
              rows = [r for r in d["intervals"] if r["product"] == prod and r["state"] not in ("CAPTURED", "MISSING_RETRYING")]
              print(f"::notice title=ledger {prod} non-captured-non-listed::" + " | ".join(f"{r['interval_start_utc']} {r['state']}: {r['reason'][:90]}" for r in rows[:12]))
          PY
      - name: Commit the frozen snapshot (raw catalog responses + SHA-256 + ledger)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/capture_ledger/snapshots/20261013T0000Z_20261020T0000Z
          git commit -q -m "Capture-ledger QA snapshot 2026-10-13..2026-10-20: NASA CMR + NOAA S3 catalog responses (metadata only) and ledger"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
