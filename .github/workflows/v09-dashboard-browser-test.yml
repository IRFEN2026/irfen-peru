name: IRFEN v0.9 - Prueba de navegador del panel (reloj simulado, TEST_ONLY)

on:
  pull_request:
    paths:
      - site/v09/**
      - site/data/v09/**
      - tests/test_v09_dashboard_browser.py
      - tests/test_v09_demo_summary.py
      - qa/replay_tools/test_v09_continuity_evidence.py
      - scripts/v09_build_territory_bundle.py
      - scripts/v09_territory_independent_qa.py
      - scripts/v09_pages_publication_gate.py
      - config/v09_territory_quebradas_v0_1.json
      - tests/test_v09_territory.py
      - tests/test_v09_territory_independent_qa.py
      - site/v08-territorial.js
      - tests/test_v08_recent_advances.py
      - .github/workflows/v09-dashboard-browser-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v09-dashboard-browser-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar Playwright y Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Panel en navegador con reloj simulado (sin recargar)
        run: python -m unittest -v tests/test_v09_dashboard_browser.py tests/test_v09_demo_summary.py 2>&1 | tee browser.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Probar cobertura IMERG verificada y ausencia de falsos estados verdes (sin red; incluye navegador)
        run: |
          python -m unittest -v qa/replay_tools/test_v09_continuity_evidence.py 2>&1 | tee continuity.log; test "${PIPESTATUS[0]}" -eq 0
          grep -q "^OK$" continuity.log
          if grep -q "skipped" continuity.log; then echo "::error::a continuity/coverage test was skipped"; exit 1; fi
        shell: bash
      - name: Comprobar que la prueba de navegador no se omitió
        run: |
          grep -q "^OK$" browser.log
          if grep -q "skipped" browser.log; then echo "::error::the browser test was skipped"; exit 1; fi

      - name: Regenerar paquete territorial SOLO en el runner para evitar QA sobre paquete obsoleto
        run: |
          python scripts/v09_build_territory_bundle.py
          python scripts/v09_build_territory_bundle.py --check
      - name: Visor territorial (costa norte / Rímac), Playwright real
        run: python -m unittest -v tests/test_v09_territory.py 2>&1 | tee territory.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Verificar navegación territorial no omitida
        run: |
          grep -q "test_navigation_both_regions .* ok$" territory.log
          grep -A1 "test_data_update_keeps_state_and_old_data_is_never_zero" territory.log | grep -q "ok$"
          if grep -q "skipped" territory.log; then echo "::error::territory tests skipped"; exit 1; fi
      - name: QA científica independiente, solo lectura
        run: python scripts/v09_territory_independent_qa.py
