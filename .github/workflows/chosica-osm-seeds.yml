name: IRFEN - Semillas auxiliares Chosica

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/discover_chosica_osm_search_seeds.py
      - .github/workflows/chosica-osm-seeds.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/discover_chosica_osm_search_seeds.py
      - run: |
          test -s site/data/calibration/chosica_osm_search_seeds.json
          python -m json.tool site/data/calibration/chosica_osm_search_seeds.json >/dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/calibration/chosica_osm_search_seeds.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: update auxiliary Chosica search seeds"
          git pull --rebase origin main
          git push
