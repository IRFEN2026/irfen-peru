name: IRFEN - Construir descomposición de peligros Lima Este

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_lima_east_hazard_decomposition.py
      - .github/workflows/lima-east-hazard-decomposition.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/build_lima_east_hazard_decomposition.py
      - run: |
          test -s site/data/hazard_models/lima_east_decomposition.json
          python -m json.tool site/data/hazard_models/lima_east_decomposition.json >/dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/hazard_models/lima_east_decomposition.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: update Lima east hazard decomposition"
          git pull --rebase origin main
          git push
