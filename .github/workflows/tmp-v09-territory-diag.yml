name: TMP v0.9 territory reproducibility diagnostic (removed next commit)
on:
  push:
    branches: [v09/territorial-map-v0-1]
    paths: [.github/workflows/tmp-v09-territory-diag.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-ci-test.txt
      - name: Standalone build diff
        if: always()
        run: |
          python - <<'PY'
          import importlib.util, json
          s = importlib.util.spec_from_file_location("t", "scripts/v09_build_territory_bundle.py"); T = importlib.util.module_from_spec(s); s.loader.exec_module(T)
          a = T.build(); b = json.loads(T.OUT.read_text())
          print("::notice title=inputs_changed::", T.inputs_changed(b["inputs"]))
          diffs = []
          def walk(x, y, p):
              if len(diffs) > 15: return
              if type(x) != type(y): diffs.append(f"{p}: {type(x).__name__} {str(x)[:120]} != {type(y).__name__} {str(y)[:120]}"); return
              if isinstance(x, dict):
                  for k in sorted(set(x) | set(y)):
                      if k not in x or k not in y: diffs.append(f"{p}.{k}: missing {'new' if k not in x else 'committed'}")
                      else: walk(x[k], y[k], f"{p}.{k}")
              elif isinstance(x, list):
                  if len(x) != len(y): diffs.append(f"{p}: len {len(x)} != {len(y)}")
                  for i, (u, v) in enumerate(zip(x, y)): walk(u, v, f"{p}[{i}]")
              elif x != y: diffs.append(f"{p}: {str(x)[:150]} != {str(y)[:150]}")
          for k in a:
              if k != "built_at_utc": walk(a[k], b.get(k), k)
          print("::notice title=diffs::" + ("%0A".join(diffs) or "none"))
          PY
      - name: Same test under pytest alone and after the full suite order
        run: |
          python -m pytest tests/test_v09_territory.py -q -rfE 2>&1 | tail -5 | sed 's/^/::notice title=alone::/'
          python -m pytest tests/ -q -rfE -p no:cacheprovider > full.log 2>&1 || true
          grep -n "test_guards_and_reproducible\|^E \|Error\|FAIL" full.log | grep -v "ENOENT\|errno\|syscall" | head -40 | sed 's/^/::notice title=full::/'
          python -m pytest tests/ -q --collect-only 2>/dev/null | grep -n "test_v09_territory" | head -2 | sed 's/^/::notice title=order::/'
          git status --short | head -20 | sed 's/^/::notice title=dirty::/'
      - name: Build diff after the full suite
        if: always()
        run: |
          python - <<'PY'
          import importlib.util, json
          s = importlib.util.spec_from_file_location("t", "scripts/v09_build_territory_bundle.py"); T = importlib.util.module_from_spec(s); s.loader.exec_module(T)
          a = T.build(); b = json.loads(T.OUT.read_text())
          print("::notice title=inputs_changed_after::", T.inputs_changed(b["inputs"]))
          diffs = []
          def walk(x, y, p):
              if len(diffs) > 15: return
              if type(x) != type(y): diffs.append(f"{p}: {type(x).__name__} {str(x)[:120]} != {type(y).__name__} {str(y)[:120]}"); return
              if isinstance(x, dict):
                  for k in sorted(set(x) | set(y)):
                      if k not in x or k not in y: diffs.append(f"{p}.{k}: missing {'new' if k not in x else 'committed'}")
                      else: walk(x[k], y[k], f"{p}.{k}")
              elif isinstance(x, list):
                  if len(x) != len(y): diffs.append(f"{p}: len {len(x)} != {len(y)}")
                  for i, (u, v) in enumerate(zip(x, y)): walk(u, v, f"{p}[{i}]")
              elif x != y: diffs.append(f"{p}: {str(x)[:150]} != {str(y)[:150]}")
          for k in a:
              if k != "built_at_utc": walk(a[k], b.get(k), k)
          print("::notice title=diffs_after::" + ("%0A".join(diffs) or "none"))
          PY
