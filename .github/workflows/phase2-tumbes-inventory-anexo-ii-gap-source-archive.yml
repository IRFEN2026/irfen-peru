name: IRFEN - Phase2 Tumbes inventory Anexo II gap source archive

on:
  pull_request:
    paths:
      - config/phase2_tumbes_inventory_anexo_ii_gap_capture_seeds_v0_1.json
      - config/phase2_tumbes_inventory_anexo_ii_gap_v0_1.json
      - config/phase2_national_inventory_completeness_audit_v0_1.json
      - scripts/archive_phase2_tumbes_inventory_gap_sources.py
      - scripts/validate_phase2_tumbes_inventory_anexo_ii_gap.py
      - tests/test_phase2_tumbes_inventory_anexo_ii_gap.py
      - data/phase2/source_archive/tumbes_inventory_anexo_ii_gap/**
      - .github/workflows/phase2-tumbes-inventory-anexo-ii-gap-source-archive.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-tumbes-inventory-anexo-ii-gap-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  archive-official-sources:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Refuse any copy of this archive inside the published site/
        run: |
          if [[ -n "$(find site -path '*tumbes_inventory_anexo_ii_gap*' -print -quit)" ]]; then
            echo "::error title=PUBLIC_ARCHIVE::original sources must stay outside site/ (GitHub Pages artifact)"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded parsing dependencies
        run: python -m pip install --disable-pip-version-check pypdf pytest
      - name: Capture missing supplements (seed contract changed), otherwise verify offline
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=data/phase2/source_archive/tumbes_inventory_anexo_ii_gap/archive_manifest_v0_1.json
          SEEDS=config/phase2_tumbes_inventory_anexo_ii_gap_capture_seeds_v0_1.json
          current="$(sha256sum "$SEEDS" | awk '{print $1}')"
          recorded=""
          if [[ -f "$MANIFEST" ]]; then
            recorded="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("seeds_sha256",""))' "$MANIFEST")"
          fi
          if [[ "$recorded" != "$current" ]]; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
            if ! python scripts/archive_phase2_tumbes_inventory_gap_sources.py --capture-supplements > capture.log 2>&1; then
              cat capture.log
              python -c 'import sys; t=open("capture.log").read()[-6000:]; print("::error title=CAPTURE_FAILED::" + t.replace("%","%25").replace("\r","").replace("\n","%0A"))'
              exit 1
            fi
            cat capture.log
            python - <<'PY'
          import json
          m = json.load(open("data/phase2/source_archive/tumbes_inventory_anexo_ii_gap/archive_manifest_v0_1.json"))
          for r in m["records"]:
              print("::notice title=SUPPLEMENT_ROUTES::" + json.dumps({k: r.get(k) for k in ("document_id", "status", "served_by_route", "sha256", "page_count", "terms_found", "route_attempts")}, ensure_ascii=False).replace("%", "%25"))
          PY
          else
            echo "capture=false" >> "$GITHUB_OUTPUT"
          fi
          python scripts/archive_phase2_tumbes_inventory_gap_sources.py
          rm -f capture.log
      - name: Verify offline replay leaves the archive unchanged
        if: steps.mode.outputs.capture == 'false'
        run: git diff --exit-code -- data/phase2/source_archive/tumbes_inventory_anexo_ii_gap
      - name: Run fail-closed gap validator and tests
        if: steps.mode.outputs.capture == 'false'
        run: |
          if [[ -f scripts/validate_phase2_tumbes_inventory_anexo_ii_gap.py ]]; then
            python scripts/validate_phase2_tumbes_inventory_anexo_ii_gap.py
            python -m pytest tests/test_phase2_tumbes_inventory_anexo_ii_gap.py -q
          fi
        shell: bash
      - name: Commit captured bytes, hashes and text extractions once
        if: steps.mode.outputs.capture == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/phase2/source_archive/tumbes_inventory_anexo_ii_gap
          if git diff --cached --quiet; then
            echo "No archive changes to persist"
          else
            git commit -m "Archive official sources for the Tumbes inventory Anexo II gap (bytes + SHA-256)"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
