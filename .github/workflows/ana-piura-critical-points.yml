name: IRFEN - Descubrir puntos críticos ANA Piura 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ana-piura-critical-points.yml
      - scripts/discover_ana_piura_critical_points.py

permissions:
  contents: write

concurrency:
  group: ana-piura-critical-points
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pypdf openpyxl

      - name: Descubrir fichas ANA Piura 2026
        run: python scripts/discover_ana_piura_critical_points.py

      - name: Validar índice
        run: |
          test -s site/data/hydrology/ana_piura_critical_points_2026.json
          python -m json.tool site/data/hydrology/ana_piura_critical_points_2026.json >/dev/null

      - name: Guardar índice científico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/hydrology/ana_piura_critical_points_2026.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: actualizar puntos críticos ANA Piura 2026"
          git pull --rebase origin main
          git push
