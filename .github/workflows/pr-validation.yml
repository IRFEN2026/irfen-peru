name: IRFEN - Validar pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "pr-validation-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar pull request
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci-test.txt

      - name: Demostrar rechazo atómico de latest.json DEMO
        shell: bash
        run: |
          set -euo pipefail
          cp site/data/forecast/imerg_verification_history.json /tmp/demo-history.json
          cp /tmp/demo-history.json /tmp/demo-history.before.json
          if python scripts/update_imerg_verification_history.py \
            --source site/data/latest.json --history /tmp/demo-history.json
          then
            echo "ERROR: latest.json DEMO fue aceptado como evidencia científica" >&2
            exit 1
          fi
          cmp /tmp/demo-history.before.json /tmp/demo-history.json
          echo "DEMO_REJECTED_WITHOUT_MUTATION"

      - name: Demostrar restauración durable sin GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/restore_imerg_verification_history.py \
            --durable site/data/forecast/imerg_verification_history.json \
            --pages-candidate /tmp/pages-intentionally-unavailable.json \
            --destination /tmp/restored-from-git.json \
            --receipt /tmp/restored-from-git.receipt.json
          cmp site/data/forecast/imerg_verification_history.json /tmp/restored-from-git.json
          python - <<'PY'
          import json
          receipt=json.load(open('/tmp/restored-from-git.receipt.json',encoding='utf-8'))
          assert receipt['restoration_mode']=='GIT_VERSIONED_DURABLE_RESTORE'
          assert receipt['pages_candidate']['status']=='UNAVAILABLE'
          assert receipt['scientific_fallback_used'] is False
          print('GIT_DURABLE_RESTORE_OK')
          PY

      - name: Hidratar evidencia transitoria publicada
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irfen2026.github.io/irfen-peru/data"
          files=(
            "latest.json"
            "experimental_state.json"
            "test_report.json"
            "forecast/archive.json"
            "forecast/historical_daily.json"
            "forecast/verification.json"
            "calibration/historical_replay.json"
            "hydrology/piura_reference_model.json"
            "hydrology/ana_catacaos_critical_segments_2026.geojson"
            "hydrology/ana_catacaos_critical_segments_2026_validation.json"
            "hydrology/glofas_catacaos_current.json"
          )
          for file in "${files[@]}"; do
            mkdir -p "site/data/$(dirname "$file")"
            curl -fsSL --connect-timeout 10 --max-time 35 --retry 3 --retry-all-errors \
              "$BASE/$file?pr=${{ github.event.pull_request.number }}-${{ github.run_id }}" \
              -o "site/data/$file"
          done
          cp site/data/forecast/verification.json /tmp/previous-verification.json
          history="forecast/imerg_verification_history.json"
          cp "site/data/$history" /tmp/imerg_verification_history.git-versioned.json
          if curl -fsSL --connect-timeout 10 --max-time 35 --retry 3 --retry-all-errors \
            "$BASE/$history?pr=${{ github.event.pull_request.number }}-${{ github.run_id }}" \
            -o "/tmp/imerg_verification_history.pages-candidate.json"
          then
            echo "Réplica Pages descargada; debe preservar todo el ledger durable."
          else
            echo "Pages no disponible; se restaurará el histórico versionado en Git."
          fi
          python scripts/restore_imerg_verification_history.py \
            --durable /tmp/imerg_verification_history.git-versioned.json \
            --pages-candidate /tmp/imerg_verification_history.pages-candidate.json \
            --destination "site/data/$history" \
            --receipt /tmp/imerg_verification_history.restore-receipt.json

      - name: Reconstruir verificación desde el histórico científico dedicado
        run: python scripts/verify_geos_against_imerg.py --previous-verification /tmp/previous-verification.json

      - name: Ejecutar pruebas focalizadas de intake externo
        run: |
          python -m unittest discover -s tests -p 'test_external_evidence_intake.py' -v
          python scripts/build_external_evidence_intake_index.py --check
          python -m json.tool config/external_evidence_package.schema.v1.json >/dev/null
          python -m json.tool site/data/validation/external_evidence_intake_index.json >/dev/null

      - name: Ejecutar puertas científicas v0.8
        run: |
          python scripts/build_lambayeque_hydrologic_units.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python scripts/validate_scientific_assets.py
          python scripts/validate_pedregal_clean_room.py

      - name: Verificar colección pytest contra manifest
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${PR_BASE_SHA}"
          if git show "${PR_BASE_SHA}:config/phase2_test_collection_manifest.json" \
              > /tmp/base_phase2_test_collection_manifest.json 2>/dev/null; then
            python scripts/verify_phase2_test_collection.py \
              --base-manifest /tmp/base_phase2_test_collection_manifest.json
          else
            echo "Base sin manifest previo; se valida HEAD contra la colección real."
            python scripts/verify_phase2_test_collection.py
          fi

      - name: Ejecutar pruebas unitarias v0.8
        # pytest ejecuta tanto unittest.TestCase como funciones test_* de
        # estilo pytest; `unittest discover` omitía estas últimas en silencio.
        run: python -m pytest tests/ -v -rfE --junitxml="${RUNNER_TEMP}/pytest-junit.xml"

      - name: Publicar resultado exacto de pytest (diagnóstico, no cambia el veredicto)
        if: ${{ !cancelled() }}
        run: python scripts/report_pytest_junit_annotations.py "${RUNNER_TEMP}/pytest-junit.xml"

      - name: Ejecutar regresión y scorecard v0.8
        # Se ejecuta aunque falle pytest (diagnóstico); el job sigue fallando.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_v08_regression_tests.py
          python scripts/build_v08_scorecard.py
          python scripts/build_v08_rc_status.py
          python -m json.tool site/data/test_report.json >/dev/null
          python -m json.tool site/data/v08_scorecard.json >/dev/null
          python -m json.tool site/data/v08_rc_status.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('site/data/v08_rc_status.json',encoding='utf-8'))
          assert d.get('production_use') is False
          assert d.get('operational_alerting_enabled') is False
          assert (d.get('phase2') or {}).get('operational_candidates') == 0
          PY
