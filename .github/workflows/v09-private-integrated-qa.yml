name: IRFEN v0.9 - Integración privada de mapa (TEST_ONLY)
on:
  push:
    branches:
      - integration/v09-territory-private-map-20261022
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v09-private-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout rama privada no publicada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias científicas y pruebas
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-ci-test.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Copiar exclusivamente el estado reciente de lluvia de main (sin ejecutar capturadores)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show FETCH_HEAD:data/v09/surveillance/zone_rain_state_v0_1.json > data/v09/surveillance/zone_rain_state_v0_1.json
          git show FETCH_HEAD:config/v09_public_demo_v0_1.json > config/v09_public_demo_v0_1.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("data/v09/surveillance/zone_rain_state_v0_1.json").read_text())
          g=json.loads(Path("config/v09_public_demo_v0_1.json").read_text())
          assert not g.get("publish_v09_dashboard") and not g.get("publish_v09_territory")
          assert len(s["zones"])==22
          print("Read-only main rain evaluated at", s["evaluated_at_utc"])
          PY
      - name: Construir paquete cartográfico reproducible
        run: |
          python scripts/v09_build_territory_bundle.py
          python scripts/v09_build_territory_bundle.py --check
      - name: Recolección real de pruebas y manifiesto forward-only (en rama aislada)
        run: |
          python scripts/verify_phase2_test_collection.py --write-manifest
          python scripts/verify_phase2_test_collection.py
      - name: QA científica independiente de geometrías y datos
        run: python scripts/v09_territory_independent_qa.py
      - name: Suite territorial, publicación cerrada y cobertura IMERG
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests/test_v09_territory.py tests/test_v09_territory_independent_qa.py tests/test_v09_pages_publication_gate.py qa/replay_tools/test_v09_continuity_evidence.py 2>&1 | tee "$RUNNER_TEMP/integrated.log"
          grep -q "^OK$" "$RUNNER_TEMP/integrated.log"
          if grep -q "skipped" "$RUNNER_TEMP/integrated.log"; then echo "::error::integration tests skipped"; exit 1; fi
      - name: Navegación de los dos mapas en Chromium, sin exponer un sitio
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests/test_v09_dashboard_browser.py tests/test_v09_demo_summary.py 2>&1 | tee "$RUNNER_TEMP/browser.log"
          grep -q "^OK$" "$RUNNER_TEMP/browser.log"
          if grep -q "skipped" "$RUNNER_TEMP/browser.log"; then echo "::error::browser tests skipped"; exit 1; fi
      - name: Comprobar interruptores y conservar paquete SOLO en rama de integración
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("config/v09_public_demo_v0_1.json").read_text())
          t=json.loads(Path("site/data/v09/territory_v0_1.json").read_text())
          assert not c.get("publish_v09_dashboard") and not c.get("publish_v09_territory")
          assert t["deployment_status"]=="RESEARCH_ONLY" and t["test_mode"]=="TEST_ONLY"
          assert t["production_use"] is False and t["map_publishable"] is False
          assert t["operational_alerting_enabled"] is False
          assert len(t["zone_rain"])==22
          print("INTEGRATED_PRIVATE_QA_PASS")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/v09/territory_v0_1.json data/v09/surveillance/zone_rain_state_v0_1.json config/phase2_test_collection_manifest.json
          if git diff --cached --quiet; then echo "No bundle change"; exit 0; fi
          git commit -m "research: freeze tested v0.9 integrated private map snapshot (TEST_ONLY)"
          BR="integration/v09-territory-private-map-20261022"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BR"
            if ! git rebase -q "origin/$BR"; then
              git rebase --abort || true
              echo "::error::Real conflict while preserving integrated snapshot; refusing overwrite"; exit 1
            fi
            if git push -q origin "HEAD:$BR"; then echo "Frozen bundle pushed (non-force)"; exit 0; fi
            sleep $((attempt * 2))
          done
          echo "::error::Non-fast-forward persists after 4 bounded retries"; exit 1
