name: IRFEN v0.9 - Integración privada de mapa (TEST_ONLY)
on:
  push:
    branches:
      - integration/v09-territory-private-map-20261022
    paths:
      - .github/workflows/v09-private-integrated-qa.yml
      - site/v09/**
      - scripts/v09_build_territory_bundle.py
      - scripts/v09_territory_independent_qa.py
      - scripts/v09_pages_publication_gate.py
      - tests/test_v09_territory.py
      - tests/test_v09_territory_independent_qa.py
      - tests/test_v09_pages_publication_gate.py
      - qa/replay_tools/test_v09_continuity_evidence.py
  workflow_dispatch:
# Read-only by design: the QA rebuilds and checks artifacts, it never commits to the branch. A bot commit would
# become the PR head and GitHub would hold every pull_request workflow of #403 as `action_required`.
permissions:
  contents: read
concurrency:
  group: v09-private-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout rama privada no publicada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias científicas y pruebas
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-ci-test.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Copiar exclusivamente el estado reciente de lluvia de main (sin ejecutar capturadores)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show FETCH_HEAD:data/v09/surveillance/zone_rain_state_v0_1.json > data/v09/surveillance/zone_rain_state_v0_1.json
          git show FETCH_HEAD:config/v09_public_demo_v0_1.json > config/v09_public_demo_v0_1.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("data/v09/surveillance/zone_rain_state_v0_1.json").read_text())
          g=json.loads(Path("config/v09_public_demo_v0_1.json").read_text())
          assert not g.get("publish_v09_dashboard") and not g.get("publish_v09_territory")
          assert len(s["zones"])==22
          print("Read-only main rain evaluated at", s["evaluated_at_utc"])
          PY
      - name: Construir paquete cartográfico reproducible
        run: |
          python scripts/v09_build_territory_bundle.py
          python scripts/v09_build_territory_bundle.py --check
      - name: Manifiesto pytest verificado (sin reescribirlo; si cambia, se regenera en un commit humano revisable)
        run: python scripts/verify_phase2_test_collection.py
      - name: QA científica independiente de geometrías y datos
        run: python scripts/v09_territory_independent_qa.py
      - name: Suite territorial, publicación cerrada y cobertura IMERG
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests/test_v09_territory.py tests/test_v09_territory_independent_qa.py tests/test_v09_pages_publication_gate.py qa/replay_tools/test_v09_continuity_evidence.py 2>&1 | tee "$RUNNER_TEMP/integrated.log"
          grep -q "^OK$" "$RUNNER_TEMP/integrated.log"
          if grep -q "skipped" "$RUNNER_TEMP/integrated.log"; then echo "::error::integration tests skipped"; exit 1; fi
      - name: Navegación de los dos mapas en Chromium, sin exponer un sitio
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests/test_v09_dashboard_browser.py tests/test_v09_demo_summary.py 2>&1 | tee "$RUNNER_TEMP/browser.log"
          grep -q "^OK$" "$RUNNER_TEMP/browser.log"
          if grep -q "skipped" "$RUNNER_TEMP/browser.log"; then echo "::error::browser tests skipped"; exit 1; fi
      - name: Comprobar interruptores y comparar con el paquete confirmado (sin commits)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          c=json.loads(Path("config/v09_public_demo_v0_1.json").read_text())
          t=json.loads(Path("site/data/v09/territory_v0_1.json").read_text())
          assert not c.get("publish_v09_dashboard") and not c.get("publish_v09_territory")
          assert t["deployment_status"]=="RESEARCH_ONLY" and t["test_mode"]=="TEST_ONLY"
          assert t["production_use"] is False and t["production_ready"] is False and t["map_publishable"] is False
          assert t["operational_alerting_enabled"] is False and t["public_alerting"] is False and t["activation_gate"]=="BLOCKED"
          assert t["missing_data_rule"]=="UNKNOWN_NOT_LOW_RISK" and t["decision_thresholds"] is None and t["hydraulic_factors"] is None
          assert len(t["zone_rain"])==22
          committed=json.loads(subprocess.run(["git","show","HEAD:site/data/v09/territory_v0_1.json"],capture_output=True,check=True).stdout)
          same = {k:v for k,v in committed.items() if k!="built_at_utc"} == {k:v for k,v in t.items() if k!="built_at_utc"}
          print("::notice title=V09_PRIVATE_QA::" + ("rebuilt bundle equals the committed one" if same else
                "rebuilt from newer main rain state; the committed bundle is older (refresh it in a reviewable human commit if needed)"))
          print("INTEGRATED_PRIVATE_QA_PASS")
          PY
          git diff --quiet -- . ':!site/data/v09/territory_v0_1.json' ':!data/v09/surveillance/zone_rain_state_v0_1.json' ':!config/v09_public_demo_v0_1.json' \
            || { echo "::error::the QA modified tracked files other than the rebuilt artifacts"; git diff --stat; exit 1; }
      - name: Conservar el paquete reconstruido como artefacto de la ejecución (no como commit)
        uses: actions/upload-artifact@v4
        with:
          name: v09-private-map-${{ github.sha }}
          path: |
            site/data/v09/territory_v0_1.json
            data/v09/surveillance/zone_rain_state_v0_1.json
            ${{ runner.temp }}/integrated.log
            ${{ runner.temp }}/browser.log
          retention-days: 14
          if-no-files-found: error
