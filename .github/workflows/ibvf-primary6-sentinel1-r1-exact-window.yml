name: IBVF - PRIMARY6 Sentinel-1 R1 exact-window progression

on:
  push:
    branches: [agent/independent-basin-validation-map]
    paths:
      - 'scripts/ibvf_primary6_sentinel1_r1_exact_window.py'
      - '.github/workflows/ibvf-primary6-sentinel1-r1-exact-window.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-sentinel1-r1-exact-window
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  huaycoloro-next-chronological-compatible:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen R1 dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2'
      - name: Compile exact-window executor and unchanged R1
        run: python -m py_compile scripts/ibvf_primary6_sentinel1_r1_exact_window.py scripts/ibvf_primary6_sentinel1_freeze_selected.py scripts/ibvf_sentinel1_r1_radiometric.py
      - name: Execute next chronological compatible window after frozen Huaycoloro pilot
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_sentinel1_r1_exact_window.py \
            --catalog site/data/validation/ibvf_primary6_selected_a1_catalog.json \
            --partition site/data/validation/ibvf_primary6_sentinel1_execution_partition_v01.json \
            --a4-contract site/data/validation/ibvf_primary6_sentinel1_a4_contract_v01.json \
            --unit huaycoloro \
            --date-local 2014-12-21 \
            --basin site/data/watersheds/huaycoloro_watershed.geojson \
            --output-freeze artifacts/ibvf/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_freeze_v01.json \
            --output-r1 artifacts/ibvf/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_v01.json
      - name: Fail-closed blind exact-window guards
        run: |
          python - <<'PY'
          import json
          f=json.load(open('artifacts/ibvf/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_freeze_v01.json',encoding='utf-8'))
          r=json.load(open('artifacts/ibvf/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_v01.json',encoding='utf-8'))
          for d in (f,r):
            assert d['deployment_status']=='RESEARCH_ONLY'
            assert d['test_only'] is True
            assert d['production_use'] is False and d['production_ready'] is False
            assert d['operational_alerting_enabled'] is False
            assert d['uses_operational_event_none_labels'] is False
            assert d['territorial_activation_evidence_blinded'] is True
            assert d['territorial_outcomes_read'] is False
            assert d['known_event_dates_read'] is False
            assert d['activation_inference_allowed'] is False
            assert d['modeling_allowed'] is False
          assert f['case_id']=='primary6_huaycoloro_2014-12-21'
          assert f['season_id']=='2014-2015'
          assert f['engineering_pilot_only'] is False
          assert f['freeze_status']=='ALL_REQUESTED_ASSETS_SHA256_FROZEN'
          assert f['all_assets_downloaded_at_most_once'] is True
          assert f['cached_bytes_reused_for_r1'] is True
          assert f['selected_window_changed'] is False
          assert f['compatible_pair_changed'] is False
          assert f['replacement_window_allowed'] is False
          assert f['pair_reselection_allowed'] is False
          assert f['case_control_role_assigned'] is False
          assert r['r1_status']=='COMPLETE_BOTH_DATES_NO_COMPARISON'
          assert r['single_download_cache_mode'] is True
          assert r['comparison_performed'] is False
          assert r['terrain_correction_performed'] is False
          assert r['common_support_established'] is False
          assert r['interpretation_forbidden'] is True
          assert r['case_control_assignment_performed'] is False
          print('PASS_EXACT_WINDOW_HUAYCOLORO_2014_12_21_R1')
          PY
      - name: Upload exact-window R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-s1-r1-exact-window-${{ github.sha }}
          path: artifacts/ibvf/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Freeze exact-window evidence and synchronize research map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_freeze_v01.json site/data/validation/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_freeze_v01.json
          cp artifacts/ibvf/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_v01.json site/data/validation/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_v01.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('site/data/validation/independent_basin_validation_map.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          r=json.load(open('site/data/validation/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_v01.json',encoding='utf-8'))
          assert r['r1_status']=='COMPLETE_BOTH_DATES_NO_COMPARISON'
          d['version']='irfen-independent-basin-validation-map-v3.13'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{})
          completed=[
            'primary6_huaycoloro_2014-11-25',
            'primary6_shingolay_2014-11-19',
            'primary6_san_ildefonso_2014-10-19',
            'primary6_huaycoloro_2014-12-21',
          ]
          ac['primary6_sentinel1_r1_completed_window_ids']=completed
          ac['primary6_sentinel1_r1_completed_compatible_windows']=len(completed)
          ac['primary6_sentinel1_r1_target_compatible_windows']=104
          ac['primary6_sentinel1_r1_progress']='4/104'
          ac['primary6_sentinel1_bulk_r1_complete']=False
          ac['primary6_sentinel1_next_exact_window']='huaycoloro 2015-01-10 unless an earlier frozen compatible window remains unprocessed in deterministic partition order'
          ac.setdefault('local_validation',{})['github_actions_primary6_sentinel1_r1_exact_window']='PASS_HUAYCOLORO_2014_12_21_SINGLE_DOWNLOAD_CACHE_NO_OUTCOME'
          for c in d.get('cases',[]):
            if c.get('unit_id')=='huaycoloro':
              c['remote_sensing_status']='S1_PRIMARY6_R1_2_OF_34_HUAYCOLORO_COMPATIBLE_WINDOWS_COMPLETE_R2_R4_PENDING_NO_OUTCOME'
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add \
            site/data/validation/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_freeze_v01.json \
            site/data/validation/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_v01.json \
            site/data/validation/independent_basin_validation_map.json
          git commit -m 'IBVF: freeze next exact PRIMARY6 Sentinel-1 R1 window'
          git push origin HEAD:agent/independent-basin-validation-map
