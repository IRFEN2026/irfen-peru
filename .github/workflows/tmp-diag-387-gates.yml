name: TMP diagnose v0.8 scientific gates for #387 merge vs main (read-only, no commits)
on:
  push:
    branches: [diag/387-scientific-gates-20261019]
    paths: [.github/workflows/tmp-diag-387-gates.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-ci-test.txt
      - name: Hydrate published transient evidence (same list as pr-validation)
        shell: bash
        run: |
          BASE="https://irfen2026.github.io/irfen-peru/data"
          for file in latest.json experimental_state.json test_report.json forecast/archive.json forecast/historical_daily.json forecast/verification.json calibration/historical_replay.json hydrology/piura_reference_model.json hydrology/ana_catacaos_critical_segments_2026.geojson hydrology/ana_catacaos_critical_segments_2026_validation.json hydrology/glofas_catacaos_current.json; do
            mkdir -p "site/data/$(dirname "$file")" hyd/$(dirname "$file")
            curl -fsSL --connect-timeout 10 --max-time 35 --retry 3 --retry-all-errors "$BASE/$file?diag=${{ github.run_id }}" -o "hyd/$file" && cp "hyd/$file" "site/data/$file" || echo "::warning::hydrate failed $file"
          done
          git worktree add -q ../mainwt origin/main
          (cd hyd && find . -type f -exec cp --parents {} ../../mainwt/site/data/ \;)
      - name: Run each gate on PR merge and on main; report as annotations
        shell: bash
        run: |
          set +e
          git fetch -q origin "+refs/pull/387/merge:refs/remotes/pr387merge" && git worktree add -q ../prwt refs/remotes/pr387merge && (cd hyd && find . -type f -exec cp --parents {} ../../prwt/site/data/ \;)
          echo "::notice title=states::PR=$(git -C ../prwt rev-parse --short HEAD) MAIN=$(git -C ../mainwt rev-parse --short HEAD)"
          gates=("scripts/build_lambayeque_hydrologic_units.py --check-only" "scripts/build_phase2_catalog.py --check-only" "scripts/build_map_layer_catalog.py --check-only" "scripts/validate_scientific_assets.py" "scripts/validate_pedregal_clean_room.py")
          for where in PR MAIN; do
            dir=../prwt; [ "$where" = MAIN ] && dir=../mainwt
            for g in "${gates[@]}"; do
              out=$(cd "$dir" && python $g 2>&1); rc=$?
              msg=$(echo "$out" | grep -vE '^[[:space:]]*$' | tail -8 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900)
              if [ $rc -ne 0 ]; then echo "::error title=$where rc=$rc ${g%% *}::$msg"; else echo "::notice title=$where OK ${g%% *}::$(echo "$out" | tail -1 | cut -c1-200)"; fi
            done
          done
      - name: Exact diff of map_layers.json vs rebuilt catalog (PR and MAIN), as annotations
        shell: bash
        run: |
          set +e
          cat > /tmp/mapdiff.py <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import build_map_layer_catalog as b
          import build_map_layer_catalog_core as core
          cur = b.comparable(core.load_json(core.OUT_PATH)); new = b.comparable(b.build_catalog())
          out = []
          def walk(a, c, path):
              if type(a) != type(c): out.append(f"{path}: type {type(a).__name__}->{type(c).__name__}"); return
              if isinstance(a, dict):
                  for k in sorted(set(a) | set(c)):
                      if k not in a: out.append(f"{path}.{k}: ADDED {json.dumps(c[k], ensure_ascii=False)[:160]}")
                      elif k not in c: out.append(f"{path}.{k}: REMOVED {json.dumps(a[k], ensure_ascii=False)[:160]}")
                      else: walk(a[k], c[k], f"{path}.{k}")
              elif isinstance(a, list):
                  if len(a) != len(c): out.append(f"{path}: len {len(a)}->{len(c)}")
                  for i, (x, y) in enumerate(zip(a, c)):
                      walk(x, y, f"{path}[{i}]")
              elif a != c: out.append(f"{path}: {json.dumps(a, ensure_ascii=False)[:120]} -> {json.dumps(c, ensure_ascii=False)[:120]}")
          walk(cur, new, "$")
          print(len(out)); print("\n".join(out[:25]))
          PY
          for where in PR MAIN; do
            dir=../prwt; [ "$where" = MAIN ] && dir=../mainwt
            res=$(cd "$dir" && python /tmp/mapdiff.py 2>&1 | head -26)
            n=$(echo "$res" | head -1)
            echo "::warning title=$where map_layers diff count::$n"
            echo "$res" | tail -n +2 | while IFS= read -r line; do echo "::warning title=$where diff::$(echo "$line" | sed 's/%/%25/g' | cut -c1-600)"; done
            for f in hyd/hydrology/*; do echo "::notice title=hydrated::$f $(sha256sum "$f" | cut -c1-16) $(stat -c %s "$f")"; done
          done
      - name: Confirm cause - versions and the bytes rewritten by build_lambayeque_hydrologic_units --check-only
        shell: bash
        run: |
          set +e
          echo "::warning title=versions::$(python -c 'import shapely,pyproj,numpy,sys;print(sys.version.split()[0],"shapely",shapely.__version__,"geos",shapely.geos_version_string,"pyproj",pyproj.__version__,"proj",pyproj.proj_version_str,"numpy",numpy.__version__)')"
          cd ../mainwt
          F=site/data/phase2/geometries/lambayeque_chongoyape_oyotun_official_critical_reaches_review_only.geojson
          git checkout -q -- .
          echo "::warning title=before::$(sha256sum $F | cut -c1-64) (committed)"
          python scripts/build_lambayeque_hydrologic_units.py --check-only >/dev/null 2>&1; echo "::warning title=after check-only::$(sha256sum $F | cut -c1-64)"
          echo "::warning title=files rewritten by check-only::$(git status --porcelain | tr '\n' ' ' | cut -c1-600)"
          python - "$F" <<'PY'
          import json, subprocess, sys
          f = sys.argv[1]
          old = json.loads(subprocess.run(["git", "show", "HEAD:" + f], capture_output=True, text=True).stdout)
          new = json.load(open(f))
          diffs = []
          for i, (a, b) in enumerate(zip(old["features"], new["features"])):
              if a != b:
                  ca, cb = a["geometry"]["coordinates"], b["geometry"]["coordinates"]
                  if ca != cb:
                      diffs.append(f"feature {i}: {json.dumps(ca)[:150]} -> {json.dumps(cb)[:150]}")
                  else:
                      ks = [k for k in set(a["properties"]) | set(b["properties"]) if a["properties"].get(k) != b["properties"].get(k)]
                      diffs.append(f"feature {i}: properties differ {ks[:5]}")
          print(f"::warning title=geojson diff::{len(diffs)} of {len(old['features'])} features differ")
          for d in diffs[:3]:
              print(f"::warning title=geojson sample::{d}")
          PY
