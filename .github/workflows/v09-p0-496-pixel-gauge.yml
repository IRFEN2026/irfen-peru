name: "IRFEN P0 496 - offline point-pixel safeguards"
on:
  push:
    branches:
      - research/v09-p0-496-point-pixel-qc-20261106
  pull_request:
    paths:
      - scripts/v09_p0_496_pixel_gauge_audit.py
      - tests/test_v09_p0_496_pixel_gauge_audit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p 'test_v09_p0_496_pixel_gauge_audit.py' -v
