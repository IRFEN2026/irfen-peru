name: IRFEN - Probar acceso ISAAC v0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/probe_isaac_access.py
      - .github/workflows/isaac-probe.yml

permissions:
  contents: write

concurrency:
  group: "isaac-access-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Resolver acceso ISAAC de forma acotada
        run: python scripts/probe_isaac_access.py

      - name: Validar contrato de seguridad
        run: |
          test -s site/data/stations/isaac_access_probe.json
          python -m json.tool site/data/stations/isaac_access_probe.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data/stations/isaac_access_probe.json').read_text())
          assert d.get('production_use') is False
          assert d.get('production_ready') is False
          assert d.get('status') in {
              'STRUCTURED_CHANNEL_CANDIDATE_FOUND',
              'PUBLIC_PLATFORM_REACHED_NO_OBVIOUS_STRUCTURED_CHANNEL',
              'OFFICIAL_SHORTLINK_NOT_REACHABLE_FROM_GITHUB',
          }
          assert 'Do not continue blind endpoint enumeration' in d.get('stop_rule','')
          print('ISAAC bounded probe:', d.get('status'))
          PY

      - name: Guardar evidencia
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations/isaac_access_probe.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "IRFEN v0.8: registrar acceso ISAAC"
          git pull --rebase origin main
          git push origin HEAD:main
