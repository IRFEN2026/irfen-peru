name: IRFEN - Independent map QA (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/map-independent-qa.yml
      - scripts/build_map_layer_catalog.py
      - scripts/build_map_semantic_layers.py
      - site/data/map_layers.json
      - site/v08-territorial.js
      - site/v08-experimental.js
      - tests/**
      - docs/PHASE2_MAP_LAYER_MODEL.md

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==9.0.3
      - name: Hydrate transient published evidence used by repository tests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irfen2026.github.io/irfen-peru/data"
          files=(
            "latest.json"
            "experimental_state.json"
            "test_report.json"
            "forecast/archive.json"
            "forecast/historical_daily.json"
            "forecast/verification.json"
            "calibration/historical_replay.json"
            "hydrology/piura_reference_model.json"
            "hydrology/ana_catacaos_critical_segments_2026.geojson"
            "hydrology/ana_catacaos_critical_segments_2026_validation.json"
            "hydrology/glofas_catacaos_current.json"
          )
          for file in "${files[@]}"; do
            mkdir -p "site/data/$(dirname "$file")"
            curl -fsSL --connect-timeout 10 --max-time 35 --retry 3 --retry-all-errors               "$BASE/$file?qa=${{ github.run_id }}" -o "site/data/$file"
          done

      - name: Build canonical map catalog from hydrated sources
        run: python scripts/build_map_layer_catalog.py

      - name: Persist canonical generated map catalog to Draft branch when needed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/map_layers.json; then
            echo "map_layers.json already canonical"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/map_layers.json
            git commit -m "Map semantics: persist canonical catalog after hydration"
            git push origin HEAD:"refs/heads/${{ github.head_ref }}"
          fi

      - name: Upload canonical generated map catalog
        uses: actions/upload-artifact@v4
        with:
          name: map-layers-canonical
          path: site/data/map_layers.json
          retention-days: 7

      - name: Canonical map builder check
        run: python scripts/build_map_layer_catalog.py --check-only
      - name: Map-focused pytest
        run: |
          python -m pytest -q             tests/test_map_semantic_consolidation.py             tests/test_map_layer_catalog.py             tests/test_phase2_discovery_map_catalog.py             tests/test_v08_territorial_inventory.py             tests/test_phase2_canete_jacayita_faja_context.py
      - name: Full pytest suite
        run: python -m pytest tests/ -v
