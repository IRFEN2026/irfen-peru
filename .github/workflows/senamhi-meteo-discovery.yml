name: IRFEN - Descubrir fuentes meteorológicas SENAMHI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/senamhi-meteo-discovery.yml
      - scripts/discover_senamhi_meteo_sources.py

permissions:
  contents: write

concurrency:
  group: senamhi-meteo-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests
      - name: Descubrir rutas públicas
        run: python scripts/discover_senamhi_meteo_sources.py
      - name: Validar resultado
        run: |
          test -s site/data/stations/senamhi_source_discovery.json
          python -m json.tool site/data/stations/senamhi_source_discovery.json >/dev/null
      - name: Guardar descubrimiento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations/senamhi_source_discovery.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: actualizar descubrimiento SENAMHI meteorológico"
          git pull --rebase origin main
          git push
