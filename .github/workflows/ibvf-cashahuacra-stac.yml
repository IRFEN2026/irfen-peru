name: IBVF - Cashahuacra STAC research

on:
  pull_request:
    paths:
      - 'scripts/ibvf_stac_inventory.py'
      - 'scripts/ibvf_landsat_aoi_qa.py'
      - 'scripts/ibvf_cashahuacra_dem_snap.py'
      - 'scripts/ibvf_cashahuacra_nearest_channel_snap.py'
      - 'site/data/validation/cashahuacra_stac_probe.json'
      - 'site/data/validation/independent_basin_validation_map.json'
      - '.github/workflows/ibvf-cashahuacra-stac.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cashahuacra-stac:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific QA dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'rasterio>=1.3,<2' 'pystac-client>=0.8,<1' 'planetary-computer>=1,<2' 'requests>=2.31,<3' 'pysheds>=0.4,<0.5' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Validate research scripts
        run: python -m py_compile scripts/ibvf_stac_inventory.py scripts/ibvf_landsat_aoi_qa.py scripts/ibvf_cashahuacra_dem_snap.py scripts/ibvf_cashahuacra_nearest_channel_snap.py
      - name: Query Earth Search STAC
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_stac_inventory.py \
            --case-id cashahuacra_2015-03-23 \
            --bbox=-76.70,-11.95,-76.64,-11.84 \
            --start 2015-02-15T00:00:00Z \
            --end 2015-05-15T23:59:59Z \
            --event-date 2015-03-23 \
            --limit 500 \
            --output artifacts/ibvf/cashahuacra_stac_inventory.json
      - name: Resolve Landsat byte transport fallback without changing Earth Search identity
        run: |
          python - <<'PY'
          import copy, json
          import planetary_computer
          import pystac_client
          src='artifacts/ibvf/cashahuacra_stac_inventory.json'
          dst='artifacts/ibvf/cashahuacra_stac_inventory_transport.json'
          d=json.load(open(src,encoding='utf-8')); out=copy.deepcopy(d)
          coll=next(c for c in out['collections'] if c['collection']=='landsat-c2-l2')
          target_dates={'2015-03-18','2015-04-19'}
          catalog=pystac_client.Client.open('https://planetarycomputer.microsoft.com/api/stac/v1',modifier=planetary_computer.sign_inplace)
          resolved=[]
          for item in coll.get('items',[]):
              if str(item.get('datetime',''))[:10] not in target_dates: continue
              pc_items=list(catalog.search(collections=['landsat-c2-l2'],ids=[item['id']]).items())
              if len(pc_items)!=1: raise RuntimeError(f"Planetary Computer mirror lookup {item['id']} returned {len(pc_items)} items")
              pc=pc_items[0]
              for key in ('qa_pixel','qa_radsat','qa_aerosol'):
                  if key not in pc.assets: raise RuntimeError(f"Mirror missing {key} for {item['id']}")
                  item['assets'][key]['href']=pc.assets[key].href
                  item['assets'][key]['byte_transport']='PLANETARY_COMPUTER_SIGNED_MIRROR'
              resolved.append(item['id'])
          out['byte_transport_overlay']={'identity_catalog':'EARTH_SEARCH_STAC','fallback_host':'MICROSOFT_PLANETARY_COMPUTER','reason':'USGS_AWS_DIRECT_S3_HTTPS_RETURNED_403_WITHOUT_REQUESTER_PAYS_CREDENTIALS','same_landsat_collection2_item_ids_required':True,'resolved_item_ids':sorted(resolved),'scientific_identity_changed':False}
          json.dump(out,open(dst,'w',encoding='utf-8'),indent=2,ensure_ascii=False)
          print(out['byte_transport_overlay'])
          PY
      - name: Measure Landsat QA inside reference AOI
        run: |
          python scripts/ibvf_landsat_aoi_qa.py \
            --inventory artifacts/ibvf/cashahuacra_stac_inventory_transport.json \
            --geojson site/data/phase2/geometries/w1_santa_eulalia_rimac.geojson \
            --selector-property unit_id \
            --selector-value cashahuacra \
            --date 2015-03-18 \
            --date 2015-04-19 \
            --download-dir artifacts/ibvf/landsat-qa-raw \
            --output artifacts/ibvf/cashahuacra_landsat_aoi_qa.json
      - name: Retain original radial DEM snap audit
        run: |
          python scripts/ibvf_cashahuacra_dem_snap.py \
            --output artifacts/ibvf/cashahuacra_dem_snap.json \
            --basin-output artifacts/ibvf/cashahuacra_stable_basin_legacy_gate.geojson
      - name: Test predeclared nearest-same-channel snap rule
        run: |
          python scripts/ibvf_cashahuacra_nearest_channel_snap.py \
            --output artifacts/ibvf/cashahuacra_nearest_channel_snap.json \
            --basin-output artifacts/ibvf/cashahuacra_stable_basin_v03.geojson
      - name: Guardrails
        run: |
          python - <<'PY'
          import json
          paths=['artifacts/ibvf/cashahuacra_stac_inventory.json','artifacts/ibvf/cashahuacra_landsat_aoi_qa.json','artifacts/ibvf/cashahuacra_dem_snap.json','artifacts/ibvf/cashahuacra_nearest_channel_snap.json']
          for p in paths:
              d=json.load(open(p,encoding='utf-8'))
              assert d['deployment_status']=='RESEARCH_ONLY'
              assert d['test_only'] is True
              assert d['production_use'] is False
              assert d['production_ready'] is False
              assert d['operational_alerting_enabled'] is False
              assert d['uses_operational_event_none_labels'] is False
          inv=json.load(open(paths[0],encoding='utf-8'))
          qa=json.load(open(paths[1],encoding='utf-8'))
          dem=json.load(open(paths[2],encoding='utf-8'))
          near=json.load(open(paths[3],encoding='utf-8'))
          assert near['contract']['target_basin_area_used'] is False
          assert near['contract']['territorial_activation_evidence_used'] is False
          print([(x['collection'],x.get('transport_status'),x.get('item_count')) for x in inv['collections']])
          print('LANDSAT',qa['completeness_status'])
          print('DEM_RADIAL',dem['snap_status'],dem.get('max_selected_outlet_cluster_distance_m'))
          print('DEM_NEAREST',near['snap_status'],near.get('nearest_same_channel'),near.get('selected_outlet'),near.get('morphometry_status'),near.get('morphometry'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-cashahuacra-a13-${{ github.sha }}
          path: |
            artifacts/ibvf/cashahuacra_stac_inventory.json
            artifacts/ibvf/cashahuacra_stac_inventory_transport.json
            artifacts/ibvf/cashahuacra_landsat_aoi_qa.json
            artifacts/ibvf/cashahuacra_dem_snap.json
            artifacts/ibvf/cashahuacra_nearest_channel_snap.json
            artifacts/ibvf/cashahuacra_stable_basin_legacy_gate.geojson
            artifacts/ibvf/cashahuacra_stable_basin_v03.geojson
          if-no-files-found: warn
          retention-days: 30
