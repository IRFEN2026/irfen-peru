name: IRFEN - Chosica 2015 candidate Landsat 7 QA

on:
  pull_request:
    paths:
      - config/chosica_2015_candidate_landsat7_asset_inventory_freeze_record_v0_1.json
      - config/chosica_2015_candidate_landsat7_qa_contract_v0_1.json
      - scripts/evaluate_chosica_2015_candidate_landsat7_qa.py
      - .github/workflows/chosica-2015-candidate-landsat7-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_candidate_landsat7_qa_contract_v0_1.json
            scripts/evaluate_chosica_2015_candidate_landsat7_qa.py
            .github/workflows/chosica-2015-candidate-landsat7-qa.yml
      - name: Assert forbidden scientific paths absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09_b.json
      - name: Download exact frozen clean-room inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources/inventory sources/geometry artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10180217499/zip" > /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d sources/inventory
          test "$(sha256sum sources/inventory/chosica_2015_candidate_landsat7_asset_inventory_v0_1.json | cut -d' ' -f1)" = "f10c4442ffe6bb12992b342e78140eb89f0e5db95abd2ab05304d8f399952cda"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10171108859/zip" > /tmp/geometry.zip
          unzip -q /tmp/geometry.zip -d sources/geometry
          test "$(sha256sum sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson | cut -d' ' -f1)" = "9a23644c191c88fb66722b368773251051b4098ddd74e4d5861c3a37dbfbb1ca"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frozen QA runtime
        run: pip install 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2' 'planetary-computer>=1,<2'
      - name: Execute preregistered QA only
        run: |
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/evaluate_chosica_2015_candidate_landsat7_qa.py \
            --contract config/chosica_2015_candidate_landsat7_qa_contract_v0_1.json \
            --inventory sources/inventory/chosica_2015_candidate_landsat7_asset_inventory_v0_1.json \
            --geometry sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson \
            --output artifacts/chosica_2015_candidate_landsat7_qa_v0_1.json
      - name: Enforce QA-only clean-room guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_candidate_landsat7_qa_v0_1.json',encoding='utf-8'))
          assert d['status']=='PASS_LANDSAT7_CANDIDATE_QA_GATE'
          assert d['usable_candidate_count']>=1
          assert d['candidate_count']==7
          assert d['full_file_sha512_completed_before_any_raster_read'] is True
          assert d['qa_raster_read'] is True
          assert d['reflectance_asset_bytes_read'] is False
          assert d['mirror_no_change_can_confirm_control'] is False
          for k in ('surface_signal_observed','outcome_evidence_read','target_names_or_ids_read','a6680_read','contaminated_adjudication_used','scene_selection_modified','candidate_selection_modified','candidate_ranking_modified','free_web_search_used','control_labels_assigned','sealed_target_unblind_allowed'):
              assert d[k] is False, k
          assert d['guards']=={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chosica-2015-candidate-landsat7-qa
          path: artifacts/chosica_2015_candidate_landsat7_qa_v0_1.json
          if-no-files-found: warn
