name: IBVF - PRIMARY6 blind Landsat A4 optical bulk

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'scripts/ibvf_primary6_landsat_a4_optical_track.py'
      - '.github/workflows/ibvf-primary6-landsat-a4-optical-bulk.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-landsat-a4-optical-bulk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        unit: [huaycoloro, san_ildefonso, shingolay]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constrained geospatial dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'rasterio>=1.3,<2'
      - name: Compile frozen optical implementation
        run: python -m py_compile scripts/ibvf_primary6_landsat_a4_optical_preflight.py scripts/ibvf_primary6_landsat_a4_optical_track.py
      - name: Execute all frozen selected pairs for track
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_landsat_a4_optical_track.py \
            --repo-root . \
            --unit '${{ matrix.unit }}' \
            --output 'artifacts/ibvf/ibvf_primary6_landsat_a4_optical_${{ matrix.unit }}.json'
      - name: Track fail-closed guards
        run: |
          python - <<'PY'
          import json, os
          u=os.environ['UNIT']; p=f'artifacts/ibvf/ibvf_primary6_landsat_a4_optical_{u}.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert d['unit_id']==u and d['selected_window_count']==d['retained_window_count']==36
          assert d['selected_windows_replaced'] is False and d['pairs_reselected'] is False
          assert d['resampling_performed'] is False and d['reprojection_performed'] is False and d['interpolation_performed'] is False
          assert d['territorial_outcome_fields_read'] is False and d['known_event_dates_read'] is False
          assert d['case_control_assignment_performed'] is False and d['activation_inference_allowed'] is False and d['modeling_allowed'] is False
          assert len(d['rows'])==36
          assert all(r['case_control_role']=='UNASSIGNED' for r in d['rows'])
          assert all(r['selected_window_replaced'] is False and r['pair_reselected'] is False for r in d['rows'])
          assert d['numeric_primary_feature_count']+d['unknown_or_missing_count']==36
          assert d['status']=='PASS_TRACK_EXECUTION_COMPLETE_ALL_SELECTED_WINDOWS_RETAINED_NO_OUTCOME'
          if u=='huaycoloro': assert d['preflight_crosscheck']['status']=='PASS_EXACT_PRIMARY_VALUE_AND_COMMON_MASK_REPRODUCED'
          print({'unit':u,'status_counts':d['status_counts'],'numeric':d['numeric_primary_feature_count']})
          PY
        env:
          UNIT: ${{ matrix.unit }}
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-optical-${{ matrix.unit }}-${{ github.sha }}
          path: artifacts/ibvf/ibvf_primary6_landsat_a4_optical_${{ matrix.unit }}.json
          if-no-files-found: error
          retention-days: 30

  finalize:
    needs: track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ibvf-primary6-optical-*-${{ github.sha }}
          path: artifacts/ibvf/tracks
          merge-multiple: true
      - name: Consolidate blind optical A4 evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          def csha(x): return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          units=['huaycoloro','san_ildefonso','shingolay']; docs=[]; rows=[]
          for u in units:
            p=Path(f'artifacts/ibvf/tracks/ibvf_primary6_landsat_a4_optical_{u}.json'); d=json.loads(p.read_text(encoding='utf-8')); docs.append(d); rows.extend(d['rows'])
            assert d['unit_id']==u and len(d['rows'])==36
            for k,v in {'deployment_status':'RESEARCH_ONLY','production_use':False,'production_ready':False,'operational_alerting_enabled':False,'uses_operational_event_none_labels':False,'territorial_activation_evidence_blinded':True}.items(): assert d[k]==v
          rows=sorted(rows,key=lambda r:(r['unit_id'],r['season_id'],r['date_local']))
          assert len(rows)==108 and len({(r['unit_id'],r['season_id'],r['date_local']) for r in rows})==108
          counts={}
          for r in rows: counts[r['status']]=counts.get(r['status'],0)+1
          numeric=sum(r['A4_OPTICAL_CHANGE_PRIMARY'] is not None for r in rows); unknown=108-numeric
          out={'schema_version':'irfen-ibvf-primary6-landsat-a4-optical-global-v0.1','generated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'framework':'IRFEN Independent Basin Validation Framework','deployment_status':'RESEARCH_ONLY','test_only':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False,'uses_operational_event_none_labels':False,'territorial_activation_evidence_blinded':True,'serious_modeling_gate':'CLOSED_MINIMUM_DATASET_NOT_REACHED','cohort_id':'PRIMARY6_CHRONOLOGICAL','selected_pair_target':108,'processed_selected_pair_count':108,'all_selected_windows_retained':True,'selected_windows_replaced':False,'pairs_reselected':False,'numeric_primary_feature_count':numeric,'unknown_or_missing_count':unknown,'status_counts':counts,'territorial_outcome_fields_read':False,'known_event_dates_read':False,'case_control_assignment_performed':False,'activation_inference_allowed':False,'modeling_allowed':False,'track_reports':[{ 'unit_id':d['unit_id'],'rows_canonical_sha256':d['rows_canonical_sha256'],'numeric_primary_feature_count':d['numeric_primary_feature_count'],'unknown_or_missing_count':d['unknown_or_missing_count']} for d in docs],'rows':rows,'rows_canonical_sha256':csha(rows),'status':'PASS_BLIND_OPTICAL_A4_ALL_108_SELECTED_WINDOWS_EXECUTED_RETAINED_NO_OUTCOME'}
          Path('artifacts/ibvf/ibvf_primary6_landsat_a4_optical_global.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print({'status':out['status'],'numeric':numeric,'unknown_or_missing':unknown,'status_counts':counts})
          PY
      - name: Freeze reports and synchronize scientific map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          for u in huaycoloro san_ildefonso shingolay; do cp "artifacts/ibvf/tracks/ibvf_primary6_landsat_a4_optical_${u}.json" "site/data/validation/ibvf_primary6_landsat_a4_optical_${u}.json"; done
          cp artifacts/ibvf/ibvf_primary6_landsat_a4_optical_global.json site/data/validation/ibvf_primary6_landsat_a4_optical_global.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          gp=Path('site/data/validation/ibvf_primary6_landsat_a4_optical_global.json'); g=json.loads(gp.read_text(encoding='utf-8'))
          mp=Path('site/data/validation/independent_basin_validation_map.json'); d=json.loads(mp.read_text(encoding='utf-8'))
          for x in (g,d):
            assert x['deployment_status']=='RESEARCH_ONLY' and x['production_use'] is False and x['production_ready'] is False
            assert x['operational_alerting_enabled'] is False and x['uses_operational_event_none_labels'] is False and x['territorial_activation_evidence_blinded'] is True
          d['version']='irfen-independent-basin-validation-map-v3.5'; d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{}); ac['primary6_landsat_a4_optical_global_report']='site/data/validation/ibvf_primary6_landsat_a4_optical_global.json'; ac['primary6_landsat_a4_bulk_execution_complete']=True; ac['primary6_landsat_a4_selected_pairs_processed']=108; ac['primary6_landsat_a4_numeric_primary_feature_count']=g['numeric_primary_feature_count']; ac['primary6_landsat_a4_unknown_or_missing_count']=g['unknown_or_missing_count']; ac['primary6_landsat_a4_status']=g['status']; ac['primary6_landsat_a4_territorial_outcomes_read']=False
          by={}
          for r in g['rows']: by.setdefault(r['unit_id'],[]).append(r)
          for c in d.get('cases',[]):
            u=c.get('unit_id')
            if u in by:
              n=sum(r['A4_OPTICAL_CHANGE_PRIMARY'] is not None for r in by[u]); miss=36-n
              c['remote_sensing_status']=f'A1_COMPLETE_LANDSAT_A4_OPTICAL_CVA_{n}_OF_36_NUMERIC_{miss}_UNKNOWN_OR_MISSING_S1_GLOBAL_104_OF_108_PAIR_COMPATIBLE'
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
          mp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add site/data/validation/ibvf_primary6_landsat_a4_optical_*.json site/data/validation/independent_basin_validation_map.json
          if git diff --cached --quiet; then echo 'No optical bulk/map change to commit.'; else git commit -m 'IBVF: freeze blind PRIMARY6 Landsat A4 optical bulk'; git push origin HEAD:agent/independent-basin-validation-map; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-optical-global-${{ github.sha }}
          path: artifacts/ibvf/ibvf_primary6_landsat_a4_optical_global.json
          if-no-files-found: error
          retention-days: 30
