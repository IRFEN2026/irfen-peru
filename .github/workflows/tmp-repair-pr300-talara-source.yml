name: TEMP - repair PR300 Talara source binding

on:
  push:
    branches:
      - phase2-north-coast-local-gaps-20260924

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: phase2-north-coast-local-gaps-20260924
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Remove unresolved alias and refresh generated map catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/phase2_north_coast_discovery_inventory_v0_1.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          rows = {row['discovery_id']: row for row in doc['discovery_units']}
          talara = rows['piura_talara_parinas_local_ravines']
          bad = 'INDECI-TALARA-2017-HISTORICAL-CONTEXT'
          sources = talara['official_source_ids']
          if bad not in sources:
              raise SystemExit('expected unresolved Talara source alias is absent; refuse silent mutation')
          talara['official_source_ids'] = [sid for sid in sources if sid != bad]
          if len(talara['official_source_ids']) < 2:
              raise SystemExit('fail-closed: Talara would have fewer than two official sources')
          catalog = doc.get('source_catalog', {})
          unresolved = [sid for sid in talara['official_source_ids'] if sid not in catalog]
          if unresolved:
              raise SystemExit(f'fail-closed: Talara still has unresolved source ids: {unresolved}')
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(talara['official_source_ids'])
          PY
          python scripts/build_map_layer_catalog.py
      - name: Commit repair and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-repair-pr300-talara-source.yml
          git add config/phase2_north_coast_discovery_inventory_v0_1.json site/data/map_layers.json
          git diff --cached --check
          git commit -m "phase2: repair Talara official source binding"
          git push origin HEAD:phase2-north-coast-local-gaps-20260924
