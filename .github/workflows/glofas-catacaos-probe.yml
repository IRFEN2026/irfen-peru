name: IRFEN - Probar GloFAS Catacaos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_glofas_catacaos_wms.py
      - .github/workflows/glofas-catacaos-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python scripts/probe_glofas_catacaos_wms.py
      - run: |
          test -s site/data/hydrology/glofas_catacaos_probe.json
          python -m json.tool site/data/hydrology/glofas_catacaos_probe.json >/dev/null
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/hydrology/glofas_catacaos_probe.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: record GloFAS Catacaos proxy test"
          git pull --rebase origin main
          git push
