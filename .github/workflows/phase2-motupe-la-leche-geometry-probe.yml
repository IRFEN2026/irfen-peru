name: IRFEN - Phase2 Motupe La Leche geometry probe

on:
  pull_request:
    paths:
      - scripts/probe_motupe_la_leche_official_geometry.py
      - site/data/validation/phase2_research_evidence/la_leche_pacora_pitipo_official_context_1998_2025.json
      - .github/workflows/phase2-motupe-la-leche-geometry-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe bounded ANA hydrologic geometry
        run: |
          python scripts/probe_motupe_la_leche_official_geometry.py --out-dir artifacts/motupe-la-leche
      - name: Enforce Phase-2 research guards
        run: |
          python - <<'PY'
          import json
          p='artifacts/motupe-la-leche/motupe_la_leche_official_geometry_probe.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='PASS_OFFICIAL_BASIN_GEOMETRY_IDENTITY_PROBE'
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_mode']=='TEST_ONLY'
          assert d['production_use'] is False
          assert d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['activation_gate']=='BLOCKED'
          assert d['missing_data_rule']=='UNKNOWN_NOT_LOW_RISK'
          assert d['decision_thresholds'] is None
          assert d['hydraulic_factors'] is None
          assert d['watercourse_geometry_materialized'] is False
          assert d['separate_la_leche_basin_geometry_materialized'] is False
          assert d['pitipo_hydrologic_geometry_materialized'] is False
          assert str(d['basin']['properties']['CODIGO']) == '137772'
          assert d['basin']['properties']['NOMBRE'] == 'Cuenca Motupe'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-motupe-la-leche-official-geometry-probe
          path: artifacts/motupe-la-leche
          if-no-files-found: error
