name: IBVF - PRIMARY6 Landsat QA finalize recovered evidence

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - '.github/workflows/ibvf-primary6-landsat-qa-finalize-recovered.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-landsat-qa-finalize-recovered
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/agent/independent-basin-validation-map'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install merge dependency closure
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'rasterio>=1.3,<2'
      - name: Download already-recovered track evidence from immutable source run
        uses: actions/download-artifact@v4
        with:
          pattern: ibvf-primary6-lqa-recovered-*-e74f8dafe5b39c7daef4052365a00c185dbaf084
          path: artifacts/ibvf/track-results
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33348616688
      - name: Merge global QA completeness without re-requesting any scene
        run: |
          test "$(find artifacts/ibvf/track-results -maxdepth 1 -name 'ibvf_primary6_landsat_qa_*.json' | wc -l)" -eq 3
          python -m py_compile scripts/ibvf_primary6_landsat_qa_merge.py scripts/ibvf_primary6_landsat_qa_preflight.py
          python scripts/ibvf_primary6_landsat_qa_merge.py \
            --repo-root . \
            --input-dir artifacts/ibvf/track-results \
            --output artifacts/ibvf/ibvf_primary6_landsat_qa_global.json
      - name: Global scientific fail-closed guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ibvf/ibvf_primary6_landsat_qa_global.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert d['cohort_id']=='PRIMARY6_CHRONOLOGICAL'
          assert d['track_count']==3 and d['selected_window_count']==108
          assert d['required_unique_unit_scene_count']==737
          assert d['qa_measured_unit_scene_count']==737
          assert d['qa_unknown_unit_scene_count']==0
          assert d['global_qa_complete'] is True
          assert d['pair_choice_allowed_by_qa_completeness'] is True
          assert d['pair_choice_performed'] is False
          assert d['selected_window_replaced'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['territorial_outcome_fields_read'] is False and d['known_event_dates_read'] is False
          assert d['activation_inference_allowed'] is False and d['modeling_allowed'] is False
          assert d['transport_failure_is_missing_science'] is False
          by={x['unit_id']:x for x in d['track_reports']}
          assert set(by)=={'huaycoloro','san_ildefonso','shingolay'}
          assert by['huaycoloro']['qa_measured_scene_count']==214 and by['huaycoloro']['qa_unknown_scene_count']==0
          assert by['san_ildefonso']['qa_measured_scene_count']==321 and by['san_ildefonso']['qa_unknown_scene_count']==0
          assert by['shingolay']['qa_measured_scene_count']==202 and by['shingolay']['qa_unknown_scene_count']==0
          print({k:d[k] for k in ('status','required_unique_unit_scene_count','qa_measured_unit_scene_count','qa_unknown_unit_scene_count','global_qa_complete')})
          PY
      - name: Freeze recovered evidence and synchronize research map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/track-results/ibvf_primary6_landsat_qa_*.json site/data/validation/
          cp artifacts/ibvf/ibvf_primary6_landsat_qa_global.json site/data/validation/ibvf_primary6_landsat_qa_global.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          gp=Path('site/data/validation/ibvf_primary6_landsat_qa_global.json'); g=json.loads(gp.read_text(encoding='utf-8'))
          mp=Path('site/data/validation/independent_basin_validation_map.json'); d=json.loads(mp.read_text(encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert g['global_qa_complete'] is True and g['qa_measured_unit_scene_count']==737 and g['qa_unknown_unit_scene_count']==0
          d['version']='irfen-independent-basin-validation-map-v3.2'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac=d.setdefault('acquisition_contract',{})
          ac['primary6_landsat_qa_recovery_contract']='site/data/validation/ibvf_primary6_landsat_qa_recovery_contract.json'
          ac['primary6_landsat_qa_global_report']='site/data/validation/ibvf_primary6_landsat_qa_global.json'
          ac['primary6_landsat_qa_global_status']=g['status']
          ac['primary6_landsat_required_unique_unit_scene_count']=737
          ac['primary6_landsat_qa_measured_unit_scene_count']=737
          ac['primary6_landsat_qa_unknown_unit_scene_count']=0
          ac['primary6_landsat_qa_bulk_complete']=True
          ac['primary6_landsat_pair_choice_allowed_by_qa_completeness']=True
          ac['primary6_landsat_pair_choice_performed']=False
          ac['primary6_landsat_recovery_source_run_id']=33348616688
          ac['primary6_landsat_recovery_source_sha']='e74f8dafe5b39c7daef4052365a00c185dbaf084'
          by={x['unit_id']:x for x in g['track_reports']}
          for c in d.get('cases',[]):
            u=c.get('unit_id')
            if u in by:
              x=by[u]
              c['landsat_qa_stage']=f"QA_COMPLETE_{x['qa_measured_scene_count']}_OF_{x['required_unique_scene_count']}_UNKNOWN_0_PAIR_CHOICE_ALLOWED_NOT_EXECUTED"
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
              c['case_control_role']='UNASSIGNED'
          mp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add site/data/validation/ibvf_primary6_landsat_qa_*.json site/data/validation/independent_basin_validation_map.json
          if git diff --cached --quiet; then
            echo 'No freeze/map change to commit.'
          else
            git commit -m 'IBVF: finalize PRIMARY6 Landsat QA recovered evidence'
            git push origin HEAD:agent/independent-basin-validation-map
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-lqa-finalized-${{ github.sha }}
          path: |
            artifacts/ibvf/track-results/*.json
            artifacts/ibvf/ibvf_primary6_landsat_qa_global.json
          if-no-files-found: error
          retention-days: 30
