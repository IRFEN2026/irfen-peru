name: IRFEN - Phase2 Viru official geometry freeze

on:
  pull_request:
    paths:
      - site/data/validation/phase2_discovery_contracts/lalibertad_viru.json
      - site/data/validation/phase2_discovery_packages/lalibertad_viru.json
      - scripts/probe_phase2_viru_official_geometry.py
      - tests/test_phase2_viru_official_geometry.py
      - tests/test_phase2_viru_discovery_package.py
      - .github/workflows/phase2-viru-official-geometry-freeze.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Freeze exact official ANA Viru source or replay frozen source
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_viru_137714.geojson
          if [[ -f "$SOURCE" ]]; then
            python scripts/probe_phase2_viru_official_geometry.py
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            ok=false
            for attempt in 1 2 3; do
              if python scripts/probe_phase2_viru_official_geometry.py --refresh-source; then
                ok=true
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep $((attempt * 15))
              fi
            done
            [[ "$ok" == "true" ]] || { echo "ANA Viru source fetch failed after 3 bounded attempts" >&2; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild research map catalog
        run: python scripts/build_map_layer_catalog.py
      - name: Enforce Viru scientific guards
        run: python -m pytest -q tests/test_phase2_viru_official_geometry.py tests/test_phase2_viru_discovery_package.py
      - name: Verify generated map catalog
        run: python scripts/build_map_layer_catalog.py --check-only
      - name: Commit frozen official source and bounded research geometry
        if: steps.freeze.outputs.changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_viru_137714.geojson \
            site/data/phase2/geometries/lalibertad_viru_basin_context.geojson \
            site/data/phase2/geometries/lalibertad_viru_geometry_validation.json \
            site/data/validation/phase2_discovery_contracts/lalibertad_viru.json \
            site/data/validation/phase2_discovery_packages/lalibertad_viru.json \
            site/data/map_layers.json
          git diff --cached --quiet && exit 0
          git commit -m "Freeze official ANA Viru basin context"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
