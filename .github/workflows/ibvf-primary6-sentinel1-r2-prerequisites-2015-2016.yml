name: IBVF - PRIMARY6 Sentinel-1 R2 prerequisites 2015-2016

on:
  push:
    branches: [agent/independent-basin-validation-map]
    paths:
      - '.github/workflows/ibvf-primary6-sentinel1-r2-prerequisites-2015-2016.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-sentinel1-r2-prerequisites-2015-2016
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  freeze-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata prerequisite runtime
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
          sudo apt-get update
          sudo apt-get install -y proj-bin proj-data
          python -m py_compile scripts/ibvf_sentinel1_r2_freeze_prerequisites.py scripts/ibvf_sentinel1_r2_orbit_resolver_v02.py scripts/ibvf_primary6_sentinel1_r2_prerequisites.py scripts/ibvf_primary6_sentinel1_r2_prerequisites_v02.py
      - name: Verify frozen science-independent POEORB overlap rule
        run: |
          python - <<'PY'
          import json
          d=json.load(open('site/data/validation/ibvf_primary6_sentinel1_poeorb_overlap_resolution_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['decision_timing']['made_before_primary6_r2_science_pixels_read'] is True
          assert d['decision_timing']['sar_pre_post_response_read'] is False
          assert d['decision_timing']['territorial_outcomes_used'] is False
          assert d['frozen_selection_rule']['if_multiple_candidates']=='SELECT_UNIQUE_MAXIMUM_FILE_CREATION_TIMESTAMP'
          assert d['frozen_selection_rule']['same_rule_for_all_primary6_units_seasons_and_windows'] is True
          assert d['frozen_selection_rule']['per_case_tuning_allowed'] is False
          PY
      - name: Freeze exact vertical and AUX_POEORB prerequisites
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_sentinel1_r2_prerequisites_v02.py \
            --r2-entry site/data/validation/ibvf_primary6_sentinel1_r2_entry_2015_2016_v01.json \
            --base-prereq-contract site/data/validation/cashahuacra_sentinel1_r2_prerequisites_contract.json \
            --output artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json
      - name: Fail-closed scientific guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['season_id']=='2015-2016'
          assert d['compatible_windows_expected']==18 and d['compatible_windows_prerequisites_pass']==18
          assert d['missing_windows_expected']==0 and d['missing_windows_preserved']==0
          assert d['vertical_transform_resource']['status']=='PASS'
          assert d['same_orbit_quality_class']=='AUX_POEORB'
          assert d['automatic_unhashed_orbit_download_allowed'] is False
          assert all(x['status']=='PASS_EXACT_AUX_POEORB_BOTH_DATES_SHA256_FROZEN' for x in d['entries'])
          for x in d['entries']:
            for side in ('pre','post'):
              o=x['precise_orbits'][side]
              assert o['status']=='PASS'
              assert o['selection_rule']=='LATEST_CREATION_TIMESTAMP_AMONG_AUX_POEORB_FILES_WHOSE_VALIDITY_COVERS_FROZEN_ACQUISITION_UTC'
              assert o['selection_uses_science_values'] is False and o['selection_uses_outcomes'] is False
              assert o['zip_sha256'] and o['inner_eof_sha256']
          assert d['r2_execution_performed'] is False and d['r2_science_pixels_read'] is False
          assert d['r3_common_support_computed'] is False and d['r4_features_computed'] is False
          assert d['territorial_outcomes_read'] is False and d['known_event_dates_read'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['activation_inference_allowed'] is False and d['modeling_allowed'] is False
          assert d['status']=='PASS_ALL_R2_PREREQUISITES_FROZEN_NO_SCIENCE_VALUES'
          print({'status':d['status'],'windows':18,'unique_orbits':d['unique_acquisition_orbit_resources_checked'],'identity':d['r2_prerequisite_identity_sha256']})
          PY
      - name: Archive prerequisite manifest only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json site/data/validation/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json
          git add site/data/validation/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json
          git commit -m 'IBVF: archive 2015-2016 PRIMARY6 R2 prerequisites'
          git push origin HEAD:agent/independent-basin-validation-map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibvf-primary6-sentinel1-r2-prerequisites-2015-2016-${{ github.sha }}
          path: artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2015_2016_v01.json
          if-no-files-found: warn
          retention-days: 30
