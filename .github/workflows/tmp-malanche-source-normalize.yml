name: IRFEN - Normalizar fuente upstream Malanche

on:
  push:
    branches:
      - agent/malanche-2023-validation-closeout-v0.1

permissions:
  contents: write

concurrency:
  group: malanche-upstream-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Alinear inventario fuente v0.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/phase2_candidate_inventory_v0_1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          matches=[c for c in d.get('candidates',[]) if c.get('candidate_id')=='lima_sur_malanche']
          assert len(matches)==1
          c=matches[0]
          src=list(c.get('official_sources') or [])
          if 'SENAMHI-MALANCHE-2024' not in src:
              src.append('SENAMHI-MALANCHE-2024')
          c['official_sources']=src
          assert set(c['official_sources'])=={'INGEMMET-A7743','SENAMHI-MALANCHE-2024'}
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY

      - name: Reconstruir derivados canónicos
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_lambayeque_hydrologic_units.py
          python scripts/build_phase2_catalog.py
          python scripts/build_map_layer_catalog.py

      - name: Verificar invariantes y reproducibilidad
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_lambayeque_hydrologic_units.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python -m unittest discover -s tests -p 'test_phase2_onboarding.py' -v
          python -m unittest discover -s tests -p 'test_map_layer_catalog.py' -v
          python - <<'PY'
          import json
          for path in ['config/phase2_candidate_inventory_v0_1.json','config/phase2_candidate_inventory_v0_2.json']:
              d=json.load(open(path,encoding='utf-8'))
              c=next(x for x in d['candidates'] if x['candidate_id']=='lima_sur_malanche')
              assert set(c['official_sources'])=={'INGEMMET-A7743','SENAMHI-MALANCHE-2024'}
          c=json.load(open('site/data/validation/phase2_zone_contracts/lima_sur_malanche.json',encoding='utf-8'))
          assert c['contract_status']=='DRAFT'
          assert set(c['official_source_ids'])=={'INGEMMET-A7743','SENAMHI-MALANCHE-2024'}
          assert c['validation']['activation_gate']=='BLOCKED'
          assert c['decision_thresholds'] is None
          assert c['production_use'] is False
          assert c['assets']['geometry']['status']=='PARTIAL' and c['assets']['geometry']['path'] is None
          assert c['assets']['historical_events']['status']=='PARTIAL'
          case=json.load(open('site/data/validation/phase2_case_validations/lima_sur_malanche_2023.json',encoding='utf-8'))
          assert case['event_reference']['observed_discharge_m3s'] is None
          assert case['event_reference']['discharge_evidence_class']=='MODELLED_EVENT_RECONSTRUCTION_NOT_OBSERVED_GAUGE'
          assert case['production_use'] is False and case['production_ready'] is False
          assert case['operational_alerting_enabled'] is False
          PY

      - name: Guardar y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-malanche-source-normalize.yml
          git config user.name "IRFEN research automation"
          git config user.email "actions@users.noreply.github.com"
          git add config/phase2_candidate_inventory_v0_1.json config/phase2_candidate_inventory_v0_2.json site/data/phase2/catalog.json site/data/map_layers.json .github/workflows/tmp-malanche-source-normalize.yml
          git commit -m "Normalize Malanche official source in Phase 2 inventory source of truth"
          git push origin HEAD:${{ github.ref_name }}
