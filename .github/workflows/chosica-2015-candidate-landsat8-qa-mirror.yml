name: IRFEN - Chosica 2015 candidate Landsat 8 QA mirror

on:
  pull_request:
    paths:
      - config/chosica_2015_candidate_landsat8_qa_contract_v0_1.json
      - config/chosica_2015_candidate_landsat8_qa_transport_overlay_v0_1.json
      - config/chosica_2015_candidate_landsat8_transport_mirror_freeze_record_v0_1.json
      - scripts/evaluate_chosica_2015_candidate_landsat8_qa_mirror.py
      - .github/workflows/chosica-2015-candidate-landsat8-qa-mirror.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qa-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_candidate_landsat8_qa_contract_v0_1.json
            config/chosica_2015_candidate_landsat8_qa_transport_overlay_v0_1.json
            config/chosica_2015_candidate_landsat8_transport_mirror_freeze_record_v0_1.json
            scripts/evaluate_chosica_2015_candidate_landsat8_qa_mirror.py
            .github/workflows/chosica-2015-candidate-landsat8-qa-mirror.yml
      - name: Assert forbidden scientific paths absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_blinding_incident_2026_09_09_b.json
      - name: Verify frozen QA scientific contract Git blob
        run: |
          set -euo pipefail
          test "$(git hash-object config/chosica_2015_candidate_landsat8_qa_contract_v0_1.json)" = "09f520240cad71663057166e4ada7ee972b1e094"
      - name: Download exact frozen clean-room inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sources/inventory sources/geometry sources/mirror artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10172288298/zip" > /tmp/inventory.zip
          unzip -q /tmp/inventory.zip -d sources/inventory
          test "$(sha256sum sources/inventory/chosica_2015_candidate_landsat8_asset_inventory_v0_1.json | cut -d' ' -f1)" = "524e298aa313dffc0df2445e4f44cf7769c2fc0730d49bba7ff64cc8848b0659"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10171108859/zip" > /tmp/geometry.zip
          unzip -q /tmp/geometry.zip -d sources/geometry
          test "$(sha256sum sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson | cut -d' ' -f1)" = "9a23644c191c88fb66722b368773251051b4098ddd74e4d5861c3a37dbfbb1ca"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10178934551/zip" > /tmp/mirror.zip
          unzip -q /tmp/mirror.zip -d sources/mirror
          test "$(sha256sum sources/mirror/chosica_2015_candidate_landsat8_transport_mirror_v0_3.json | cut -d' ' -f1)" = "db4a7a1f8bbb4a90c69d17dabdf0e1d6a1f4355e0b939724747a0a96a41ea4d1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frozen QA runtime dependencies
        run: pip install 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2'
      - name: Run unchanged QA science through checksum-locked mirror transport
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/evaluate_chosica_2015_candidate_landsat8_qa_mirror.py \
            --overlay config/chosica_2015_candidate_landsat8_qa_transport_overlay_v0_1.json \
            --scientific-contract config/chosica_2015_candidate_landsat8_qa_contract_v0_1.json \
            --inventory sources/inventory/chosica_2015_candidate_landsat8_asset_inventory_v0_1.json \
            --mirror sources/mirror/chosica_2015_candidate_landsat8_transport_mirror_v0_3.json \
            --geometry sources/geometry/chosica_2015_cleanroom_candidate_geometries_v0_1.geojson \
            --output artifacts/chosica_2015_candidate_landsat8_qa_mirror_v0_1.json
      - name: Enforce exact-byte and clean-room guards
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/chosica_2015_candidate_landsat8_qa_mirror_v0_1.json'))
          assert d['status']=='PASS_LANDSAT8_CANDIDATE_QA_GATE'
          assert d['transport_mirror_role']=='TRANSPORT_ONLY_NOT_SCIENTIFIC_SOURCE'
          assert d['qa_pixel_asset_checksum_verified_all'] is True
          assert d['qa_pixel_raster_read'] is True
          assert d['reflectance_asset_bytes_read'] is False
          assert all(x['checksum_verified_before_raster_read'] is True for x in d['asset_provenance'].values())
          for k in ('outcome_evidence_read','target_names_or_ids_read','a6680_read','contaminated_adjudication_used','scene_selection_modified','candidate_selection_modified','candidate_ranking_modified','free_web_search_used','control_labels_assigned','sealed_target_unblind_allowed'):
            assert d[k] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chosica-2015-candidate-landsat8-qa-mirror
          path: artifacts/chosica_2015_candidate_landsat8_qa_mirror_v0_1.json
          if-no-files-found: warn
