name: IRFEN - Publicar datos experimentales archivados

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Commit exacto con la evidencia archivada que se debe publicar"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-committed-data.yml

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Serializa con update-and-deploy sin cancelar su suite científica/unitaria.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio actualizado
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Verificar commit solicitado
        if: ${{ inputs.expected_sha != '' }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"

      - name: Conservar activos transitorios del ultimo deployment
        shell: bash
        run: |
          set -e
          BASE="https://irfen2026.github.io/irfen-peru/data"
          files=(
            "latest.json"
            "experimental_state.json"
            "test_report.json"
            "forecast/verification.json"
            "calibration/historical_replay.json"
            "hydrology/piura_reference_model.json"
            "hydrology/ana_catacaos_critical_segments_2026.geojson"
            "hydrology/ana_catacaos_critical_segments_2026_validation.json"
            "hydrology/glofas_catacaos_current.json"
          )
          for file in "${files[@]}"; do
            mkdir -p "site/data/$(dirname "$file")"
            curl -fsSL --connect-timeout 10 --max-time 35 --retry 3 \
              "$BASE/$file?t=${GITHUB_RUN_ID}" -o "site/data/$file"
          done

      - name: Recalcular scorecard con la evidencia mas reciente
        run: python scripts/build_v08_scorecard.py

      - name: Activar paneles científicos v0.8
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('site/index.html')
          html=path.read_text(encoding='utf-8')
          tags=[
              '<script src="v08-experimental.js"></script>',
              '<script src="v08-forecast.js"></script>',
              '<script src="v08-simulator.js"></script>',
              '<script src="v08-health.js"></script>',
              '<script src="v08-readiness.js"></script>'
          ]
          for tag in tags:
              if tag not in html:
                  html=html.replace('</body>',tag+'\n</body>')
          path.write_text(html,encoding='utf-8')
          PY

      - name: Validar contrato antes de publicar
        shell: bash
        run: |
          test -s site/index.html
          test -s site/v08-experimental.js
          test -s site/v08-forecast.js
          test -s site/v08-simulator.js
          test -s site/v08-health.js
          test -s site/v08-readiness.js
          test -s site/data/latest.json
          test -s site/data/experimental_state.json
          test -s site/data/test_report.json
          test -s site/data/calibration/imerg_early_live_probe.json
          test -s site/data/calibration/imerg_early_live_archive.json
          test -s site/data/hydrology/senamhi_nacara_numeric_archive.json
          test -s site/data/validation/shadow_runs.json
          test -s site/data/v08_scorecard.json
          python -m json.tool site/data/experimental_state.json >/dev/null
          python -m json.tool site/data/test_report.json >/dev/null
          python -m json.tool site/data/calibration/imerg_early_live_archive.json >/dev/null
          python -m json.tool site/data/hydrology/senamhi_nacara_numeric_archive.json >/dev/null
          python -m json.tool site/data/validation/shadow_runs.json >/dev/null
          python -m json.tool site/data/v08_scorecard.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('site/data/experimental_state.json').read_text())
          tests=json.loads(Path('site/data/test_report.json').read_text())
          score=json.loads(Path('site/data/v08_scorecard.json').read_text())
          nacara=json.loads(Path('site/data/hydrology/senamhi_nacara_numeric_archive.json').read_text())
          assert state.get('production_use') is False
          assert state.get('production_ready') is False
          assert tests.get('status') == 'PASS'
          assert int(tests.get('failed',1)) == 0
          assert score.get('production_use') is False
          assert score.get('production_ready') is False
          assert score.get('current_milestone_pct') in {0,25,50,75,100}
          assert nacara.get('production_use') is False
          assert nacara.get('production_ready') is False
          assert nacara.get('integration_mode') == 'TEST_ONLY'
          assert nacara.get('station',{}).get('id') == '47E0415A'
          assert nacara.get('scientific_gate',{}).get('hydraulic_transfer_to_catacaos_validated') is False
          assert nacara.get('scientific_gate',{}).get('official_threshold_promoted_to_irfen') is False
          assert 'never zero' in nacara.get('scientific_gate',{}).get('missing_data_rule','')
          html=Path('site/index.html').read_text(encoding='utf-8')
          for script in (
              'v08-experimental.js',
              'v08-forecast.js',
              'v08-simulator.js',
              'v08-health.js',
              'v08-readiness.js',
          ):
              assert script in html, f'Falta {script} en index antes de publicar'
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar sitio web
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Publicar IRFEN
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verificar activos publicados
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irfen2026.github.io/irfen-peru"
          mkdir -p /tmp/irfen-published
          freshness_ok=false
          for attempt in 1 2 3 4 5 6; do
            query="t=${GITHUB_RUN_ID}&attempt=${attempt}"
            if curl -fsSL --retry 3 "$BASE/?$query" >/dev/null \
              && curl -fsSL --retry 3 "$BASE/data/calibration/imerg_early_live_archive.json?$query" -o /tmp/irfen-published/imerg.json \
              && curl -fsSL --retry 3 "$BASE/data/hydrology/senamhi_nacara_numeric_archive.json?$query" -o /tmp/irfen-published/nacara.json \
              && curl -fsSL --retry 3 "$BASE/data/validation/shadow_runs.json?$query" -o /tmp/irfen-published/shadow.json \
              && curl -fsSL --retry 3 "$BASE/data/v08_scorecard.json?$query" -o /tmp/irfen-published/scorecard.json \
              && python - <<'PY'
          import json
          from pathlib import Path

          pairs = (
              ('site/data/calibration/imerg_early_live_archive.json', '/tmp/irfen-published/imerg.json', 'updated_at'),
              ('site/data/hydrology/senamhi_nacara_numeric_archive.json', '/tmp/irfen-published/nacara.json', 'generated_at'),
              ('site/data/validation/shadow_runs.json', '/tmp/irfen-published/shadow.json', 'updated_at'),
              ('site/data/v08_scorecard.json', '/tmp/irfen-published/scorecard.json', 'generated_at'),
          )
          for expected_path, published_path, freshness_key in pairs:
              expected = json.loads(Path(expected_path).read_text(encoding='utf-8'))
              published = json.loads(Path(published_path).read_text(encoding='utf-8'))
              assert published.get(freshness_key) == expected.get(freshness_key), (
                  f'{published_path}: {freshness_key} publicado no corresponde al artefacto desplegado'
              )

          expected_imerg = json.loads(Path(pairs[0][0]).read_text(encoding='utf-8'))
          published_imerg = json.loads(Path(pairs[0][1]).read_text(encoding='utf-8'))
          expected_probe = (expected_imerg.get('summary') or {}).get('latest_probe_generated_at')
          published_probe = (published_imerg.get('summary') or {}).get('latest_probe_generated_at')
          assert published_probe == expected_probe, 'Pages sirve una corrida IMERG distinta de la desplegada'

          expected_nacara = json.loads(Path(pairs[1][0]).read_text(encoding='utf-8'))
          published_nacara = json.loads(Path(pairs[1][1]).read_text(encoding='utf-8'))
          expected_nacara_probe = (expected_nacara.get('summary') or {}).get('latest_probe_generated_at')
          published_nacara_probe = (published_nacara.get('summary') or {}).get('latest_probe_generated_at')
          assert published_nacara_probe == expected_nacara_probe, 'Pages sirve un archivo SENAMHI distinto del desplegado'
          print('PUBLICATION FRESHNESS OK')
          PY
            then
              freshness_ok=true
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "GitHub Pages no sirvió el artefacto exacto tras $attempt verificaciones." >&2
              exit 1
            fi
            sleep 10
          done
          test "$freshness_ok" = true

      - name: Ordenar smoke test completo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if gh workflow run live-smoke-test.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              exit 0
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "No se pudo ordenar el smoke test tras $attempt intentos." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
