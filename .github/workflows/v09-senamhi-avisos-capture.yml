name: IRFEN v0.9 - Capturar avisos SENAMHI (via INDECI/COEN) TEST_ONLY

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - v09/senamhi-avisos-capture-v0-1
    paths:
      - scripts/v09_senamhi_avisos.py
      - scripts/v09_aviso_zone_crossing.py
      - config/v09_north_surveillance_zones_v0_1.json
      - scripts/v09_zone_rain_engine.py
      - scripts/v09_build_dashboard_data.py
      - config/v09_senamhi_avisos_contract_v0_1.json
      - .github/workflows/v09-senamhi-avisos-capture.yml

permissions:
  contents: write

concurrency:
  group: v09-senamhi-avisos-capture-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: |
          python -m pip install --disable-pip-version-check pypdf==6.19.0 pdfplumber==0.11.10
          command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null; } || echo "::warning::pdftotext unavailable; pypdf fallback"
      - name: Restore live check log (Actions cache; checks between snapshots)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/v09_live
          key: v09-avisos-live-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v09-avisos-live-${{ github.ref_name }}-
      - name: Capture (failures are recorded in source_health, never read as 'no avisos')
        id: capture
        env:
          V09_LIVE_DIR: ${{ runner.temp }}/v09_live
        run: |
          python -c "import pdfplumber" || echo "::warning::pdfplumber unavailable: department/province table will degrade to free text"
          python scripts/v09_senamhi_avisos.py --capture | tee capture.log
          echo "::notice title=V09_AVISOS_CAPTURE::$(tail -1 capture.log | sed 's/%/%25/g')"
      - name: Save live check log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/v09_live
          key: v09-avisos-live-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify archive, hashes and guards
        run: python scripts/v09_senamhi_avisos.py
      - name: Cross avisos with surveillance zones (written only when it changes)
        run: |
          python scripts/v09_aviso_zone_crossing.py
          python scripts/v09_aviso_zone_crossing.py --check
      - name: Rain engine and dashboard bundle (written only when they change)
        run: |
          python scripts/v09_zone_rain_engine.py
          python scripts/v09_zone_rain_engine.py --check
          python scripts/v09_build_dashboard_data.py
      - name: Persist (idempotent, bounded retries)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/senamhi_avisos data/v09/surveillance site/data/v09
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "IRFEN v0.9: avisos SENAMHI via INDECI/COEN (TEST_ONLY) - ${{ steps.capture.outputs.snapshot_reason }}"
          BR="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BR"
            if ! git rebase -q "origin/$BR"; then git rebase --abort || true; echo "Real conflict; not overwriting" >&2; exit 1; fi
            if git push -q origin "HEAD:$BR"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
