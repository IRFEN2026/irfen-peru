name: IRFEN - Phase2 linked local activation packages

on:
  pull_request:
    paths:
      - config/phase2_local_activation_hierarchy_v0_1.json
      - site/data/validation/phase2_zone_contracts/**
      - site/data/validation/phase2_registered_unit_packages/**
      - site/data/phase2/sources/**
      - scripts/validate_phase2_linked_local_activation_packages.py
      - tests/test_phase2_chancay_huaral_local_activation.py
      - .github/workflows/phase2-linked-local-activation-packages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linked-local-units:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate linked local-unit packages fail closed
        run: python scripts/validate_phase2_linked_local_activation_packages.py
      - name: Run Chancay-Huaral hierarchy regression tests
        run: python -m pytest -q tests/test_phase2_chancay_huaral_local_activation.py
