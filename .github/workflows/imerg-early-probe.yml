name: IRFEN - Probar IMERG Early subdiario v0.8

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches:
      - main
    paths:
      - scripts/probe_imerg_early_live.py
      - scripts/archive_imerg_early_probe.py
      - .github/workflows/imerg-early-probe.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: "imerg-early-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar IMERG Early 30 min vía Earthdata
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: timeout --signal=TERM --kill-after=10s 300s python scripts/probe_imerg_early_live.py

      - name: Archivar latencia, continuidad y ventanas
        run: python scripts/archive_imerg_early_probe.py

      - name: Validar resultado
        run: |
          test -s site/data/calibration/imerg_early_live_probe.json
          test -s site/data/calibration/imerg_early_live_archive.json
          python -m json.tool site/data/calibration/imerg_early_live_probe.json >/dev/null
          python -m json.tool site/data/calibration/imerg_early_live_archive.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/calibration/imerg_early_live_probe.json').read_text())
          a=json.loads(Path('site/data/calibration/imerg_early_live_archive.json').read_text())
          assert p.get('production_use') is False
          assert p.get('production_ready') is False
          assert p.get('status') in {
              'EARLY_HALFHOURLY_SOURCE_AVAILABLE',
              'SOURCE_TEMPORARILY_UNREACHABLE',
              'NO_RECENT_GRANULES',
              'NO_DOWNLOADED_GRANULES',
          }
          gate=p.get('scientific_gate',{}).get('status')
          assert gate in {'SOURCE_CONNECTIVITY_ONLY','SOURCE_TEMPORARILY_UNAVAILABLE'}
          if gate == 'SOURCE_TEMPORARILY_UNAVAILABLE':
              assert p.get('stale') is True
              assert p.get('scientific_gate',{}).get('last_valid_retained_for_archive') is True
          if p.get('status') == 'EARLY_HALFHOURLY_SOURCE_AVAILABLE':
              assert p.get('search_window_hours') == 12
              assert 1 <= int(p.get('granules_downloaded',0)) <= 4
              assert int(p.get('missing_granules_in_search_window',0)) >= 0
          assert a.get('production_use') is False
          assert a.get('production_ready') is False
          assert a.get('scientific_gate',{}).get('status') == 'ACCUMULATING_LATENCY_AND_CONTINUITY_EVIDENCE'
          assert a.get('scientific_gate',{}).get('rolling_windows_are_test_only') is True
          print('Puertas de seguridad IMERG Early OK:', p.get('status'))
          PY

      - name: Guardar evidencia del probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/calibration/imerg_early_live_probe.json \
            site/data/calibration/imerg_early_live_archive.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "IRFEN v0.8: actualizar evidencia IMERG Early"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Ordenar publicación del archivo actualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          EXPECTED_SHA="$(git rev-parse origin/main)"
          gh workflow run publish-committed-data.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$EXPECTED_SHA"
