name: IRFEN - Probar IMERG Early subdiario v0.8

on:
  workflow_dispatch:
  schedule:
    - cron: "18,48 * * * *"
  push:
    branches:
      - main
    paths:
      - scripts/probe_imerg_early_live.py
      - scripts/archive_imerg_early_probe.py
      - scripts/phase2_subunit_sampling.py
      - scripts/update_phase2_subunit_imerg_late.py
      - scripts/build_phase2_subunit_rainfall_evidence.py
      - scripts/validate_phase2_subunit_rainfall_evidence.py
      - scripts/build_phase2_event_reanalysis.py
      - site/data/phase2/spatial_observation_contracts_v0_1.json
      - site/data/validation/phase2_event_intake/**
      - .github/workflows/imerg-early-probe.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: "imerg-early-probe"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar IMERG Early 30 min vía Earthdata
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: timeout --signal=TERM --kill-after=10s 300s python scripts/probe_imerg_early_live.py

      - name: Archivar latencia, continuidad y ventanas
        run: python scripts/archive_imerg_early_probe.py

      - name: Actualizar IMERG Late diario de subunidades Phase-2
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: timeout --signal=TERM --kill-after=10s 240s python scripts/update_phase2_subunit_imerg_late.py --days 12

      - name: Consolidar lluvia observada de subunidades Phase-2
        run: python scripts/build_phase2_subunit_rainfall_evidence.py

      - name: Construir reanálisis fail-closed de eventos Phase 2
        run: python scripts/build_phase2_event_reanalysis.py

      - name: Regenerar y validar espejo climatico Phase-2
        run: |
          python scripts/build_phase2_climate_evidence.py
          python scripts/validate_phase2_climate_evidence.py

      - name: Validar lluvia observada de subunidades Phase-2
        run: python scripts/validate_phase2_subunit_rainfall_evidence.py

      - name: Validar resultado
        run: |
          test -s site/data/calibration/imerg_early_live_probe.json
          test -s site/data/calibration/imerg_early_live_archive.json
          test -s site/data/phase2/event_reanalysis.json
          test -s site/data/phase2/subunit_imerg_late_v0_1.json
          test -s site/data/phase2/subunit_rainfall_evidence_v0_1.json
          python -m json.tool site/data/calibration/imerg_early_live_probe.json >/dev/null
          python -m json.tool site/data/calibration/imerg_early_live_archive.json >/dev/null
          python -m json.tool site/data/phase2/event_reanalysis.json >/dev/null
          python -m json.tool site/data/phase2/subunit_imerg_late_v0_1.json >/dev/null
          python -m json.tool site/data/phase2/subunit_rainfall_evidence_v0_1.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/calibration/imerg_early_live_probe.json').read_text())
          a=json.loads(Path('site/data/calibration/imerg_early_live_archive.json').read_text())
          r=json.loads(Path('site/data/phase2/event_reanalysis.json').read_text())
          assert p.get('production_use') is False
          assert p.get('production_ready') is False
          assert p.get('status') in {
              'EARLY_HALFHOURLY_SOURCE_AVAILABLE',
              'SOURCE_TEMPORARILY_UNREACHABLE',
              'NO_RECENT_GRANULES',
              'NO_DOWNLOADED_GRANULES',
          }
          gate=p.get('scientific_gate',{}).get('status')
          assert gate in {'SOURCE_CONNECTIVITY_ONLY','SOURCE_TEMPORARILY_UNAVAILABLE'}
          if gate == 'SOURCE_TEMPORARILY_UNAVAILABLE':
              assert p.get('stale') is True
              assert p.get('scientific_gate',{}).get('last_valid_retained_for_archive') is True
          if p.get('status') == 'EARLY_HALFHOURLY_SOURCE_AVAILABLE':
              assert p.get('search_window_hours') == 12
              mode=p.get('download_mode')
              limit=int(p.get('bounded_download_limit',0))
              reserved=int(p.get('research_event_reserved_slots',0))
              assert mode in {
                  'NORMAL_CONTINUITY',
                  'VERIFIED_RESEARCH_EVENT_BACKFILL',
                  'PHASE2_SUBUNIT_CONTINUITY_BACKFILL',
              }
              if mode == 'VERIFIED_RESEARCH_EVENT_BACKFILL':
                  assert limit == 8
                  assert reserved == 6
              elif mode == 'PHASE2_SUBUNIT_CONTINUITY_BACKFILL':
                  assert limit == 8
                  assert reserved == 0
              else:
                  assert limit == 4
                  assert reserved == 2
              assert 1 <= int(p.get('granules_downloaded',0)) <= limit
              assert int(p.get('missing_granules_in_search_window',0)) >= 0
          assert a.get('production_use') is False
          assert a.get('production_ready') is False
          assert a.get('scientific_gate',{}).get('status') == 'ACCUMULATING_LATENCY_AND_CONTINUITY_EVIDENCE'
          assert a.get('scientific_gate',{}).get('rolling_windows_are_test_only') is True
          assert r.get('production_use') is False
          assert r.get('deployment_status') == 'RESEARCH_ONLY'
          assert r.get('guardrails',{}).get('missing_data_is_not_low_risk') is True
          assert r.get('guardrails',{}).get('meteorological_reference_is_not_hazard_model_validation') is True
          assert int(r.get('summary',{}).get('operational_activations',-1)) == 0
          s=json.loads(Path('site/data/phase2/subunit_rainfall_evidence_v0_1.json').read_text())
          assert s.get('deployment_status') == 'RESEARCH_ONLY'
          assert s.get('production_use') is False
          assert s.get('production_ready') is False
          assert s.get('operational_alerting_enabled') is False
          assert s.get('activation_gate') == 'BLOCKED'
          assert s.get('decision_thresholds') is None
          assert int((s.get('summary') or {}).get('research_subunit_count',-1)) == 4
          assert int((s.get('summary') or {}).get('candidate_wide_rainfall_outputs',-1)) == 0
          assert int((s.get('summary') or {}).get('operational_activations',-1)) == 0
          print('Puertas de seguridad IMERG Early + Phase-2 subunits OK:', p.get('status'))
          PY

      - name: Guardar evidencia del probe
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$(mktemp -d)"
          worktree=""
          cleanup() {
            if [ -n "$worktree" ]; then
              git worktree remove --force "$worktree" >/dev/null 2>&1 || true
            fi
            rm -rf "$candidate_dir"
          }
          trap cleanup EXIT

          cp site/data/calibration/imerg_early_live_probe.json "$candidate_dir/probe.json"
          cp site/data/phase2/subunit_imerg_late_v0_1.json "$candidate_dir/late.json"

          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            worktree="$(mktemp -d)"
            git worktree add --detach "$worktree" origin/main

            cp "$candidate_dir/probe.json" \
              "$worktree/site/data/calibration/imerg_early_live_probe.json"

            python - "$candidate_dir/late.json" \
              "$worktree/site/data/phase2/subunit_imerg_late_v0_1.json" <<'PY'
          import json
          import shutil
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          candidate = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def stamp(row):
              value = row.get("generated_at")
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)
              try:
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.astimezone(timezone.utc)
              except Exception:
                  return datetime.min.replace(tzinfo=timezone.utc)

          fresh = load(candidate)
          current = load(destination)
          fresh_available = fresh.get("status") == "OBSERVATION_DATA_AVAILABLE"
          current_available = current.get("status") == "OBSERVATION_DATA_AVAILABLE"

          copy_fresh = (
              fresh_available and not current_available
              or fresh_available == current_available and stamp(fresh) > stamp(current)
          )
          if copy_fresh:
              shutil.copy2(candidate, destination)
              print("IMERG Late candidato seleccionado para persistencia.")
          else:
              print("Se conserva IMERG Late más fuerte/reciente ya presente en main.")
          PY

            (
              cd "$worktree"
              python scripts/archive_imerg_early_probe.py
              python scripts/build_phase2_event_reanalysis.py
              python scripts/build_phase2_climate_evidence.py
              python scripts/validate_phase2_climate_evidence.py
              python scripts/build_phase2_subunit_rainfall_evidence.py
              python scripts/validate_phase2_subunit_rainfall_evidence.py

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add \
                site/data/calibration/imerg_early_live_probe.json \
                site/data/calibration/imerg_early_live_archive.json \
                site/data/phase2/event_reanalysis.json \
                site/data/phase2/climate_evidence_normalized_v0_1.json \
                site/data/phase2/subunit_imerg_late_v0_1.json \
                site/data/phase2/subunit_rainfall_evidence_v0_1.json

              if git diff --cached --quiet; then
                echo "La evidencia reconstruida ya coincide con main."
                exit 0
              fi

              git commit -m "IRFEN v0.8: actualizar evidencia IMERG Early"
              git push origin HEAD:main
            ) && {
              git worktree remove --force "$worktree"
              worktree=""
              echo "Evidencia IMERG fusionada sobre el main remoto más reciente."
              exit 0
            }

            git worktree remove --force "$worktree"
            worktree=""
            if [ "$attempt" -eq 4 ]; then
              echo "No fue posible persistir evidencia IMERG tras 4 carreras acotadas." >&2
              exit 1
            fi
            echo "Main avanzó durante persistencia (intento $attempt/4); se reconstruirá sobre el nuevo main." >&2
            sleep $((attempt * 3))
          done

      - name: Ordenar publicación del archivo actualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          EXPECTED_SHA="$(git rev-parse origin/main)"
          gh workflow run publish-committed-data.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$EXPECTED_SHA"
