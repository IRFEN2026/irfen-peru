name: IRFEN - Bootstrap manifest de colección pytest (temporal)

# Workflow TEMPORAL de la rama ci/pytest-collection-gate-v0-4.  Sólo existe
# para medir la colección pytest real en un runner de CI (el sandbox de
# desarrollo no tiene pytest ni PyPI) y commitear el manifest generado.  Sólo
# escribe si el manifest NO existe todavía; nunca regenera uno existente.  Se
# elimina de la rama antes de pedir revisión.

on:
  push:
    branches:
      - ci/pytest-collection-gate-v0-4

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci-test.txt
      - name: Generar manifest sólo si falta y medir la suite real
        shell: bash
        run: |
          set -euo pipefail
          if [ -f config/phase2_test_collection_manifest.json ]; then
            echo "Manifest ya presente: no se regenera."
            exit 0
          fi
          set +e
          python -m pytest --collect-only -q --continue-on-collection-errors tests > /tmp/collect-out.txt 2>&1
          crc=$?
          python scripts/verify_phase2_test_collection.py --write-manifest > /tmp/write-out.txt 2>&1
          wrc=$?
          cat /tmp/write-out.txt | tail -20
          python -m pytest tests/ -q -rfE --junitxml=/tmp/pytest-junit.xml > /tmp/pytest-out.txt 2>&1
          rc=$?
          set -e
          tail -40 /tmp/pytest-out.txt
          python - "$rc" "$crc" "$wrc" <<'PY'
          import json, platform, sys, xml.etree.ElementTree as ET
          rc, crc, wrc = (int(x) for x in sys.argv[1:4])
          root = ET.parse('/tmp/pytest-junit.xml').getroot()
          suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
          tot = {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
          bad = []
          for case in root.iter('testcase'):
              for tag in ('failure', 'error'):
                  el = case.find(tag)
                  if el is not None:
                      bad.append({
                          'node': f"{case.get('classname')}::{case.get('name')}",
                          'kind': tag,
                          'message': (el.get('message') or '')[:400],
                      })
          skipped = []
          for case in root.iter('testcase'):
              el = case.find('skipped')
              if el is not None:
                  skipped.append({'node': f"{case.get('classname')}::{case.get('name')}",
                                  'message': (el.get('message') or '')[:200]})
          out = {'pytest_returncode': rc, 'collect_returncode': crc, 'write_manifest_returncode': wrc,
                 'collect_tail': open('/tmp/collect-out.txt', encoding='utf-8', errors='replace').read()[-4000:],
                 'write_manifest_out': open('/tmp/write-out.txt', encoding='utf-8', errors='replace').read()[-3000:], 'python_version': platform.python_version(),
                 'totals': tot, 'failures_and_errors': bad, 'skipped': skipped,
                 'tail': open('/tmp/pytest-out.txt', encoding='utf-8', errors='replace').read()[-6000:]}
          json.dump(out, open('ci_bootstrap_pytest_report.json', 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          print(json.dumps(tot))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_bootstrap_pytest_report.json
          [ -f config/phase2_test_collection_manifest.json ] && git add config/phase2_test_collection_manifest.json
          git commit -m "CI: manifest de colección pytest generado en runner (bootstrap, run ${GITHUB_RUN_ID})"
          git push
