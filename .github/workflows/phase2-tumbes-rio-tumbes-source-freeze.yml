name: IRFEN - Rio Tumbes official discovery freeze

on:
  pull_request:
    paths:
      - site/data/phase2/sources/tumbes_rio_tumbes_official_evidence_v0_1.json
      - site/data/validation/phase2_discovery_packages/tumbes_rio_tumbes.json
      - site/data/validation/phase2_discovery_contracts/tumbes_rio_tumbes.json
      - scripts/probe_tumbes_rio_tumbes_official_geometry.py
      - tests/test_phase2_tumbes_rio_tumbes_discovery.py
      - .github/workflows/phase2-tumbes-rio-tumbes-source-freeze.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Freeze official ANA source once or replay frozen source
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f site/data/phase2/sources/tumbes_rio_tumbes_geometry/source_inventory.json ]]; then
            python scripts/probe_tumbes_rio_tumbes_official_geometry.py --check-only
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/probe_tumbes_rio_tumbes_official_geometry.py --refresh-source
            python scripts/build_map_layer_catalog.py
            python scripts/probe_tumbes_rio_tumbes_official_geometry.py --check-only
            python scripts/build_map_layer_catalog.py --check-only
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce focused scientific guards
        run: python -m pytest -q tests/test_phase2_tumbes_rio_tumbes_discovery.py
      - name: Commit frozen source and derived research artifacts
        if: steps.freeze.outputs.changed == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/phase2/sources/tumbes_rio_tumbes_geometry \
            site/data/phase2/geometries/tumbes_rio_tumbes_basin_context.geojson \
            site/data/phase2/geometries/tumbes_rio_tumbes_geometry_validation.json \
            site/data/phase2/event_footprints/tumbes_rio_tumbes_observed_inundation_20230428.geojson \
            site/data/phase2/event_footprints/tumbes_rio_tumbes_observed_inundation_20230428_validation.json \
            site/data/phase2/event_footprints/tumbes_rio_tumbes_observed_inundation_20230504.geojson \
            site/data/phase2/event_footprints/tumbes_rio_tumbes_observed_inundation_20230504_validation.json \
            site/data/validation/phase2_discovery_contracts/tumbes_rio_tumbes.json \
            site/data/validation/phase2_discovery_packages/tumbes_rio_tumbes.json \
            site/data/map_layers.json
          git diff --cached --quiet && exit 0
          git commit -m "Freeze official ANA Rio Tumbes basin and 2023 event geometry"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
