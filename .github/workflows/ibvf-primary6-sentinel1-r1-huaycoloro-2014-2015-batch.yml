name: IBVF - PRIMARY6 Sentinel-1 R1 Huaycoloro 2014-2015 batch

on:
  push:
    branches: [agent/independent-basin-validation-map]
    paths:
      - '.github/workflows/ibvf-primary6-sentinel1-r1-huaycoloro-2014-2015-batch.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-primary6-sentinel1-r1-huaycoloro-2014-2015-batch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  r1:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        date_local: ['2015-01-10', '2015-03-02', '2015-03-23']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen R1 dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'requests>=2.31,<3' 'rasterio>=1.3,<2'
      - name: Compile exact-window executor and unchanged R1
        run: python -m py_compile scripts/ibvf_primary6_sentinel1_r1_exact_window.py scripts/ibvf_primary6_sentinel1_freeze_selected.py scripts/ibvf_sentinel1_r1_radiometric.py
      - name: Execute exact preassigned Huaycoloro window
        env:
          DATE_LOCAL: ${{ matrix.date_local }}
        run: |
          mkdir -p artifacts/ibvf
          DATE_TAG="${DATE_LOCAL}"
          python scripts/ibvf_primary6_sentinel1_r1_exact_window.py \
            --catalog site/data/validation/ibvf_primary6_selected_a1_catalog.json \
            --partition site/data/validation/ibvf_primary6_sentinel1_execution_partition_v01.json \
            --a4-contract site/data/validation/ibvf_primary6_sentinel1_a4_contract_v01.json \
            --unit huaycoloro \
            --date-local "$DATE_LOCAL" \
            --basin site/data/watersheds/huaycoloro_watershed.geojson \
            --output-freeze "artifacts/ibvf/ibvf_primary6_huaycoloro_${DATE_TAG}_s1_r1_freeze_v01.json" \
            --output-r1 "artifacts/ibvf/ibvf_primary6_huaycoloro_${DATE_TAG}_s1_r1_v01.json"
      - name: Fail-closed per-window guards
        env:
          DATE_LOCAL: ${{ matrix.date_local }}
        run: |
          python - <<'PY'
          import json, os
          date=os.environ['DATE_LOCAL']
          f=json.load(open(f'artifacts/ibvf/ibvf_primary6_huaycoloro_{date}_s1_r1_freeze_v01.json',encoding='utf-8'))
          r=json.load(open(f'artifacts/ibvf/ibvf_primary6_huaycoloro_{date}_s1_r1_v01.json',encoding='utf-8'))
          for d in (f,r):
            assert d['deployment_status']=='RESEARCH_ONLY'
            assert d['test_only'] is True
            assert d['production_use'] is False and d['production_ready'] is False
            assert d['operational_alerting_enabled'] is False
            assert d['uses_operational_event_none_labels'] is False
            assert d['territorial_activation_evidence_blinded'] is True
            assert d['territorial_outcomes_read'] is False
            assert d['known_event_dates_read'] is False
            assert d['activation_inference_allowed'] is False
            assert d['modeling_allowed'] is False
          assert f['case_id']==f'primary6_huaycoloro_{date}'
          assert f['season_id']=='2014-2015'
          assert f['freeze_status']=='ALL_REQUESTED_ASSETS_SHA256_FROZEN'
          assert f['all_assets_downloaded_at_most_once'] is True
          assert f['cached_bytes_reused_for_r1'] is True
          assert f['selected_window_changed'] is False
          assert f['compatible_pair_changed'] is False
          assert f['replacement_window_allowed'] is False
          assert f['pair_reselection_allowed'] is False
          assert f['case_control_role_assigned'] is False
          assert r['r1_status']=='COMPLETE_BOTH_DATES_NO_COMPARISON'
          assert r['single_download_cache_mode'] is True
          assert r['comparison_performed'] is False
          assert r['terrain_correction_performed'] is False
          assert r['common_support_established'] is False
          assert r['interpretation_forbidden'] is True
          assert r['case_control_assignment_performed'] is False
          print({'date':date,'freeze':f['freeze_status'],'r1':r['r1_status']})
          PY
      - name: Upload per-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibvf-primary6-huaycoloro-r1-${{ matrix.date_local }}-${{ github.sha }}
          path: artifacts/ibvf/*.json
          if-no-files-found: warn
          retention-days: 30

  freeze:
    needs: r1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - name: Download successful batch evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ibvf-primary6-huaycoloro-r1-*-${{ github.sha }}
          path: artifacts/ibvf
          merge-multiple: true
      - name: Verify complete fixed Huaycoloro 2014-2015 compatible set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          new_dates=('2015-01-10','2015-03-02','2015-03-23')
          for date in new_dates:
            f=Path(f'artifacts/ibvf/ibvf_primary6_huaycoloro_{date}_s1_r1_freeze_v01.json')
            r=Path(f'artifacts/ibvf/ibvf_primary6_huaycoloro_{date}_s1_r1_v01.json')
            assert f.exists() and r.exists(), date
            fj=json.loads(f.read_text(encoding='utf-8'))
            rj=json.loads(r.read_text(encoding='utf-8'))
            assert fj['season_id']=='2014-2015'
            assert fj['freeze_status']=='ALL_REQUESTED_ASSETS_SHA256_FROZEN'
            assert rj['r1_status']=='COMPLETE_BOTH_DATES_NO_COMPARISON'
            assert rj['comparison_performed'] is False
          # Already frozen compatible windows for this shard must also exist.
          assert Path('site/data/validation/ibvf_primary6_huaycoloro_s1_r1_pilot_v01.json').exists()
          assert Path('site/data/validation/ibvf_primary6_huaycoloro_2014-12-21_s1_r1_v01.json').exists()
          part=json.load(open('site/data/validation/ibvf_primary6_sentinel1_execution_partition_v01.json',encoding='utf-8'))
          shard=next(s for s in part['shards'] if s['shard_id']=='huaycoloro__2014_2015')
          assert shard['compatible_pair_window_count']==5
          assert shard['missing_compatible_pair_count']==1
          missing=[w for w in shard['windows'] if w['sar_execution_status'].startswith('MISSING_COMPATIBLE_PAIR')]
          assert len(missing)==1 and missing[0]['date_local']=='2014-09-02'
          assert part['selected_window_replacement_allowed'] is False
          assert part['compatible_pair_reselection_allowed'] is False
          assert part['missing_pair_imputation_allowed'] is False
          assert part['territorial_outcomes_read'] is False
          print('PASS_HUAYCOLORO_2014_2015_R1_5_OF_5_COMPATIBLE_ONE_MISSING_PRESERVED')
          PY
      - name: Freeze batch evidence and synchronize research map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          for date in 2015-01-10 2015-03-02 2015-03-23; do
            cp "artifacts/ibvf/ibvf_primary6_huaycoloro_${date}_s1_r1_freeze_v01.json" "site/data/validation/ibvf_primary6_huaycoloro_${date}_s1_r1_freeze_v01.json"
            cp "artifacts/ibvf/ibvf_primary6_huaycoloro_${date}_s1_r1_v01.json" "site/data/validation/ibvf_primary6_huaycoloro_${date}_s1_r1_v01.json"
          done
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('site/data/validation/independent_basin_validation_map.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY'
          assert d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          ac=d.setdefault('acquisition_contract',{})
          prior=ac.get('primary6_sentinel1_r1_completed_window_ids') or []
          expected_prior={
            'primary6_huaycoloro_2014-11-25',
            'primary6_shingolay_2014-11-19',
            'primary6_san_ildefonso_2014-10-19',
            'primary6_huaycoloro_2014-12-21',
          }
          assert expected_prior.issubset(set(prior)), prior
          new=[
            'primary6_huaycoloro_2015-01-10',
            'primary6_huaycoloro_2015-03-02',
            'primary6_huaycoloro_2015-03-23',
          ]
          completed=list(dict.fromkeys(prior+new))
          assert len(completed)==7, completed
          d['version']='irfen-independent-basin-validation-map-v3.14'
          d['generated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ac['primary6_sentinel1_r1_completed_window_ids']=completed
          ac['primary6_sentinel1_r1_completed_compatible_windows']=7
          ac['primary6_sentinel1_r1_target_compatible_windows']=104
          ac['primary6_sentinel1_r1_progress']='7/104'
          ac['primary6_sentinel1_bulk_r1_complete']=False
          ac['primary6_sentinel1_huaycoloro_2014_2015_r1_status']='PASS_ALL_5_COMPATIBLE_WINDOWS_R1_COMPLETE_1_MISSING_PRESERVED_NO_REPLACEMENT'
          ac['primary6_sentinel1_huaycoloro_r1_completed_compatible_windows']=5
          ac['primary6_sentinel1_huaycoloro_r1_target_compatible_windows']=34
          ac['primary6_sentinel1_next_exact_window']='huaycoloro 2015-09-10 in deterministic partition order'
          ac.setdefault('local_validation',{})['github_actions_primary6_sentinel1_r1_huaycoloro_2014_2015_batch']='PASS_5_OF_5_COMPATIBLE_R1_ONE_MISSING_PRESERVED_NO_OUTCOME'
          for c in d.get('cases',[]):
            if c.get('unit_id')=='huaycoloro':
              c['remote_sensing_status']='S1_PRIMARY6_R1_5_OF_34_HUAYCOLORO_COMPATIBLE_WINDOWS_COMPLETE_FIRST_SEASON_5_OF_5_R2_R4_PENDING_NO_OUTCOME'
              c['blind_status']='TERRITORIAL_EVIDENCE_SEALED'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add site/data/validation/ibvf_primary6_huaycoloro_2015-01-10_s1_r1_freeze_v01.json \
            site/data/validation/ibvf_primary6_huaycoloro_2015-01-10_s1_r1_v01.json \
            site/data/validation/ibvf_primary6_huaycoloro_2015-03-02_s1_r1_freeze_v01.json \
            site/data/validation/ibvf_primary6_huaycoloro_2015-03-02_s1_r1_v01.json \
            site/data/validation/ibvf_primary6_huaycoloro_2015-03-23_s1_r1_freeze_v01.json \
            site/data/validation/ibvf_primary6_huaycoloro_2015-03-23_s1_r1_v01.json \
            site/data/validation/independent_basin_validation_map.json
          git commit -m 'IBVF: freeze Huaycoloro 2014-2015 PRIMARY6 R1 compatible set'
          git push origin HEAD:agent/independent-basin-validation-map
