name: IRFEN v0.9 - Archivar límites provinciales referenciales INEI (TEST_ONLY)

on:
  workflow_dispatch:
  push:
    branches:
      - v09/territorial-crossing-v0-1
    paths:
      - scripts/v09_archive_admin_boundaries.py
      - scripts/v09_build_zone_admin_overlay.py
      - .github/workflows/v09-admin-boundaries-archive.yml

permissions:
  contents: write

concurrency:
  group: v09-admin-boundaries-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"
      - name: Archive referential INEI provinces (SERFOR service) with provenance and SHA-256
        run: python scripts/v09_archive_admin_boundaries.py
      - name: Build the basin x province overlay (fails closed on CRS, invalid geometry or provenance)
        run: |
          B=$(python -c "import json;print(json.load(open('data/v09/admin_boundaries/latest.json'))['path'])")
          P=$(python -c "import json;print(json.load(open('data/v09/admin_boundaries/latest.json'))['provenance'])")
          python scripts/v09_build_zone_admin_overlay.py --boundaries "$B" --provenance "$P" | tee overlay.log
          echo "::notice title=V09_OVERLAY::$(tr '\n' ' ' < overlay.log | cut -c1-3500)"
      - name: Regenerate and check the aviso-zone crossing
        run: |
          python scripts/v09_aviso_zone_crossing.py
          python scripts/v09_aviso_zone_crossing.py --check
      - name: Persist (bot commit, bounded retries)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/admin_boundaries data/v09/zone_admin_overlay_v0_1.json data/v09/surveillance
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "IRFEN v0.9: archivar límites provinciales referenciales INEI y superposición con cuencas (TEST_ONLY)"
          BR="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BR"
            if ! git rebase -q "origin/$BR"; then git rebase --abort || true; echo "Real conflict; not overwriting" >&2; exit 1; fi
            if git push -q origin "HEAD:$BR"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
