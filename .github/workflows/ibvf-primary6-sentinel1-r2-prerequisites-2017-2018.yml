name: IBVF - PRIMARY6 Sentinel-1 R2 prerequisites 2017-2018

on:
  push:
    branches: [agent/independent-basin-validation-map]
    paths:
      - '.github/workflows/ibvf-primary6-sentinel1-r2-prerequisites-2017-2018.yml'
      - 'scripts/ibvf_sentinel1_r2_freeze_prerequisites.py'
      - 'scripts/ibvf_sentinel1_r2_orbit_resolver_v02.py'
      - 'scripts/ibvf_primary6_sentinel1_r2_prerequisites.py'
      - 'scripts/ibvf_primary6_sentinel1_r2_prerequisites_v02.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata prerequisite runtime
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
          sudo apt-get update
          sudo apt-get install -y proj-bin proj-data
      - name: Verify frozen outcome-free orbit rule
        run: |
          python - <<'PY'
          import json
          d=json.load(open('site/data/validation/ibvf_primary6_sentinel1_poeorb_overlap_resolution_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['decision_timing']['sar_pre_post_response_read'] is False
          assert d['decision_timing']['territorial_outcomes_used'] is False
          assert d['frozen_selection_rule']['same_rule_for_all_primary6_units_seasons_and_windows'] is True
          assert d['frozen_selection_rule']['per_case_tuning_allowed'] is False
          PY
      - name: Freeze exact vertical and AUX_POEORB prerequisites
        continue-on-error: true
        run: |
          mkdir -p artifacts/ibvf
          python scripts/ibvf_primary6_sentinel1_r2_prerequisites_v02.py \
            --r2-entry site/data/validation/ibvf_primary6_sentinel1_r2_entry_2017_2018_v01.json \
            --base-prereq-contract site/data/validation/cashahuacra_sentinel1_r2_prerequisites_contract.json \
            --output artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2017_2018_v01.json
      - name: Diagnose blocked prerequisites without relaxing gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2017_2018_v01.json')
          if not p.exists():
              raise SystemExit('diagnostic manifest was not produced')
          d=json.loads(p.read_text(encoding='utf-8'))
          blocked=[]
          for row in d.get('entries',[]):
              for side in ('pre','post'):
                  o=row['precise_orbits'][side]
                  if o.get('status')!='PASS':
                      blocked.append({
                          'case_id':row['case_id'],
                          'side':side,
                          'acquisition_utc':o.get('acquisition_utc'),
                          'status':o.get('status'),
                          'scientific_data_status':o.get('scientific_data_status'),
                          'directory_url':o.get('directory_url'),
                          'covering_count':o.get('covering_count'),
                          'covering_files':o.get('covering_files'),
                          'covering_creation_utc':o.get('covering_creation_utc'),
                          'selected_filename':o.get('selected_filename'),
                          'selected_creation_utc':o.get('selected_creation_utc'),
                          'error':o.get('error'),
                      })
          print(json.dumps({
              'manifest_status':d.get('status'),
              'compatible_windows_expected':d.get('compatible_windows_expected'),
              'compatible_windows_prerequisites_pass':d.get('compatible_windows_prerequisites_pass'),
              'blocked_orbit_sides':blocked,
          },indent=2,ensure_ascii=False))
          PY
      - name: Enforce blind fail-closed guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2017_2018_v01.json',encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['season_id']=='2017-2018'
          assert d['compatible_windows_expected']==18 and d['compatible_windows_prerequisites_pass']==18
          assert d['missing_windows_expected']==0 and d['missing_windows_preserved']==0
          assert d['vertical_transform_resource']['status']=='PASS'
          assert d['same_orbit_quality_class']=='AUX_POEORB'
          assert d['automatic_unhashed_orbit_download_allowed'] is False
          assert all(x['status']=='PASS_EXACT_AUX_POEORB_BOTH_DATES_SHA256_FROZEN' for x in d['entries'])
          assert d['r2_execution_performed'] is False and d['r2_science_pixels_read'] is False
          assert d['r3_common_support_computed'] is False and d['r4_features_computed'] is False
          assert d['territorial_outcomes_read'] is False and d['known_event_dates_read'] is False
          assert d['case_control_assignment_performed'] is False
          assert d['activation_inference_allowed'] is False and d['modeling_allowed'] is False
          assert d['status']=='PASS_ALL_R2_PREREQUISITES_FROZEN_NO_SCIENCE_VALUES'
          PY
      - name: Archive prerequisite manifest only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          cp artifacts/ibvf/ibvf_primary6_sentinel1_r2_prerequisites_2017_2018_v01.json site/data/validation/
          git add site/data/validation/ibvf_primary6_sentinel1_r2_prerequisites_2017_2018_v01.json
          git commit -m 'IBVF: archive 2017-2018 PRIMARY6 R2 prerequisites'
          git push origin HEAD:agent/independent-basin-validation-map
