name: PR198 bootstrap Asia Omas official basin geometry

on:
  pull_request:
    paths:
      - .github/workflows/pr198-bootstrap-asia-omas-geometry.yml
      - scripts/probe_asia_omas_official_geometry.py
      - tests/test_phase2_asia_omas_geometry.py

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Synchronize with current main before touching shared Phase-2 artifacts
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Freeze official ANA Omas source and bounded basin-context geometry
        run: python scripts/probe_asia_omas_official_geometry.py --refresh-source
      - name: Update fail-closed spatial and map expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/validate_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CANETE_ID = "lima_sur_canete"\nLAMBAYEQUE_PARENT_ID', 'CANETE_ID = "lima_sur_canete"\nASIA_ID = "lima_sur_asia_omas"\nLAMBAYEQUE_PARENT_ID')
          s=s.replace('{SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID}', '{SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID, ASIA_ID}')
          s=s.replace('for cid in (SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID):', 'for cid in (SANTA_ID, LURIN_ID, MOTUPE_ID, ACARI_ID, CANETE_ID, ASIA_ID):')
          s=s.replace('CANETE_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        LAMBAYEQUE_PARENT_ID', 'CANETE_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        ASIA_ID: "NON_CATCHMENT_GEOMETRY_ONLY",\n        LAMBAYEQUE_PARENT_ID')
          s=s.replace('"non_catchment_geometry_only_count": 4,\n        "blocked_missing_geometry_count": 12,', '"non_catchment_geometry_only_count": 5,\n        "blocked_missing_geometry_count": 11,')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('self.assertEqual(summary["non_catchment_geometry_only_count"], 4)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 12)', 'self.assertEqual(summary["non_catchment_geometry_only_count"], 5)\n        self.assertEqual(summary["blocked_missing_geometry_count"], 11)')
          marker='    def test_lurin_corridor_is_not_sampling_catchment(self):\n'
          extra='    def test_asia_omas_basin_context_does_not_resolve_local_ravines(self):\n        row = self.by_id["lima_sur_asia_omas"]\n        self.assertEqual(row["geometry_asset_status"], "PARTIAL")\n        self.assertEqual(row["geometry_data_presence"], "PRESENT")\n        self.assertEqual(row["spatial_contract_status"], "NON_CATCHMENT_GEOMETRY_ONLY")\n        self.assertFalse(row["candidate_wide_sampling_ready"])\n        self.assertEqual(row["subunit_contracts"], [])\n\n'
          if extra not in s:
              s=s.replace(marker,extra+marker)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_asia_omas_research_context.py')
          s=p.read_text(encoding='utf-8')
          old='''        self.assertEqual(assets["geometry"]["status"], "PARTIAL")\n        self.assertIsNone(assets["geometry"]["path"])\n'''
          new='''        self.assertEqual(assets["geometry"]["status"], "PARTIAL")\n        self.assertEqual(assets["geometry"]["path"], "site/data/phase2/geometries/lima_sur_asia_omas_omas_basin_context.geojson")\n        document = json.loads((ROOT / assets["geometry"]["path"]).read_text(encoding="utf-8"))\n        self.assertEqual(len(document["features"]), 1)\n        props = document["features"][0]["properties"]\n        self.assertEqual(props["official_hydrologic_unit_code"], "1375512")\n        self.assertEqual(props["official_hydrologic_unit_name"], "Cuenca Omas")\n        self.assertFalse(props["local_asia_ravines_geometry_resolved"])\n        self.assertFalse(props["coastal_fans_geometry_resolved"])\n        self.assertFalse(props["event_2024_assigned_to_named_watercourse"])\n        self.assertFalse(props["counts_as_complete_candidate_geometry"])\n'''
          if old not in s:
              raise SystemExit('Asia legacy geometry assertions not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_map_layer_catalog.py')
          s=p.read_text(encoding='utf-8')
          needle='            "lima_sur_canete",\n        }'
          replacement='            "lima_sur_canete",\n            "lima_sur_asia_omas",\n        }'
          if needle not in s:
              raise SystemExit('map eligible-set insertion point not found')
          s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate deterministic Phase-2 and map artifacts
        run: |
          python scripts/build_phase2_catalog.py
          python scripts/build_map_layer_catalog.py
          python scripts/build_phase2_climate_matrix.py
          python scripts/build_phase2_spatial_observation_contracts.py
      - name: Validate bounded geometry and affected scientific contracts
        run: |
          python scripts/probe_asia_omas_official_geometry.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python scripts/validate_phase2_spatial_observation_contracts.py
          python -m unittest \
            tests.test_phase2_asia_omas_geometry \
            tests.test_asia_omas_research_context \
            tests.test_phase2_spatial_observation_contracts \
            tests.test_phase2_climate_matrix \
            tests.test_map_layer_catalog -v
      - name: Persist only validated Asia-Omas research artifacts
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            scripts/probe_asia_omas_official_geometry.py \
            scripts/validate_phase2_spatial_observation_contracts.py \
            tests/test_phase2_asia_omas_geometry.py \
            tests/test_asia_omas_research_context.py \
            tests/test_phase2_spatial_observation_contracts.py \
            tests/test_map_layer_catalog.py \
            config/phase2_candidate_inventory_v0_1.json \
            config/phase2_candidate_inventory_v0_2.json \
            site/data/phase2/sources/asia_omas_hydrologic_context \
            site/data/phase2/geometries/lima_sur_asia_omas_omas_basin_context.geojson \
            site/data/phase2/geometries/lima_sur_asia_omas_geometry_validation.json \
            site/data/validation/phase2_zone_contracts/lima_sur_asia_omas.json \
            site/data/phase2/catalog.json \
            site/data/map_layers.json \
            site/data/phase2/climate_conditioned_activation_matrix_v0_1.json \
            site/data/phase2/spatial_observation_contracts_v0_1.json
          if git diff --cached --quiet; then
            echo "No validated Asia-Omas artifacts to persist."
          else
            git commit -m "Freeze official Omas basin context geometry"
          fi
          git push origin "HEAD:${BRANCH}"
