name: IBVF Cashahuacra Sentinel-1 A4 R1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ibvf_sentinel1_r1_radiometric.py'
      - 'site/data/validation/cashahuacra_sentinel1_a4_contract.json'
      - 'site/data/validation/cashahuacra_sentinel1_freeze.json'
      - 'site/data/watersheds/cashahuacra_ibvf_two_point_v03.geojson'
      - '.github/workflows/ibvf-cashahuacra-s1-r1.yml'

permissions:
  contents: read

jobs:
  r1-native-radiometric:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<2' 'rasterio>=1.3,<2' 'requests>=2.31,<3'
      - name: Static guard
        run: |
          python -m py_compile scripts/ibvf_sentinel1_r1_radiometric.py
          python - <<'PY'
          import json
          p='site/data/validation/cashahuacra_sentinel1_a4_contract.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['production_use'] is False
          assert d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          print('A4 contract guardrails: PASS')
          PY
      - name: Execute A4 R1 with frozen inputs
        run: |
          mkdir -p /tmp/ibvf-s1-r1
          python scripts/ibvf_sentinel1_r1_radiometric.py --freeze site/data/validation/cashahuacra_sentinel1_freeze.json --basin site/data/watersheds/cashahuacra_ibvf_two_point_v03.geojson --output /tmp/ibvf-s1-r1/cashahuacra_sentinel1_r1.json | tee /tmp/ibvf-s1-r1/summary.log
      - name: Verify no comparison or operational interpretation
        run: |
          python - <<'PY'
          import json
          p='/tmp/ibvf-s1-r1/cashahuacra_sentinel1_r1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['production_use'] is False
          assert d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False
          assert d['uses_operational_event_none_labels'] is False
          assert d['comparison_performed'] is False
          assert d['terrain_correction_performed'] is False
          assert d['common_support_established'] is False
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          print('R1 scientific separation: PASS')
          PY
      - name: Upload reproducible R1 report
        uses: actions/upload-artifact@v4
        with:
          name: cashahuacra-sentinel1-a4-r1
          path: /tmp/ibvf-s1-r1/
          if-no-files-found: error
          retention-days: 30
