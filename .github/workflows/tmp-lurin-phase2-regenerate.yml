name: tmp-lurin-phase2-regenerate

on:
  push:
    branches:
      - agent/lurin-research-closeout-v0.2

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lurin-research-closeout-v0.2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate Phase-2 catalog and self-remove
        run: |
          python scripts/build_phase2_catalog.py
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          rm .github/workflows/tmp-lurin-phase2-regenerate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/phase2/catalog.json .github/workflows/tmp-lurin-phase2-regenerate.yml
          git commit -m 'Lurín: regenerate Phase-2 catalog after partial geometry'
          git push origin HEAD:agent/lurin-research-closeout-v0.2
