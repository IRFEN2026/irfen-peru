name: IRFEN - Phase2 Mala official basin geometry

on:
  pull_request:
    paths:
      - scripts/finalize_mala_official_basin.py
      - scripts/validate_phase2_spatial_observation_contracts.py
      - tests/test_phase2_mala_geometry.py
      - site/data/phase2/sources/mala_hydrologic_context/**
      - site/data/phase2/geometries/lima_sur_mala_*.geojson
      - site/data/phase2/geometries/lima_sur_mala_geometry_validation.json
      - site/data/validation/phase2_zone_contracts/lima_sur_mala.json
      - site/data/phase2/catalog.json
      - site/data/phase2/spatial_observation_contracts_v0_1.json
      - site/data/map_layers.json
      - .github/workflows/phase2-mala-official-basin-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-official-mala-basin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify frozen ANA source, PARTIAL geometry and fail-closed guards
        run: |
          python scripts/finalize_mala_official_basin.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python scripts/validate_phase2_spatial_observation_contracts.py
          python -m unittest tests.test_phase2_mala_geometry
          git diff --check
      - name: Emit audit manifest
        run: |
          mkdir -p artifacts
          python scripts/finalize_mala_official_basin.py --check-only > artifacts/lima_sur_mala_geometry_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-mala-official-basin-geometry
          path: artifacts/
          if-no-files-found: error
