name: IRFEN - Phase2 Mala official basin bootstrap

on:
  pull_request:
    paths:
      - scripts/bootstrap_mala_official_basin.py
      - scripts/finalize_mala_official_basin.py
      - tests/test_phase2_mala_geometry.py
      - site/data/phase2/sources/mala_hydrologic_context/**
      - site/data/phase2/geometries/lima_sur_mala_*.geojson
      - site/data/phase2/geometries/lima_sur_mala_geometry_validation.json
      - site/data/validation/phase2_zone_contracts/lima_sur_mala.json
      - site/data/phase2/catalog.json
      - site/data/map_layers.json
      - .github/workflows/phase2-mala-official-basin-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-official-mala-basin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch and freeze official ANA Cuenca Mala geometry when absent
        run: |
          if [ -f site/data/phase2/sources/mala_hydrologic_context/ana_cuenca_mala_137552.geojson ]; then
            python scripts/finalize_mala_official_basin.py --check-only
          else
            python scripts/finalize_mala_official_basin.py --materialize
          fi
      - name: Validate Phase-2 contracts, map catalog and Mala guards
        run: |
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python scripts/finalize_mala_official_basin.py --check-only
          python -m unittest tests.test_phase2_mala_geometry
          git diff --check
      - name: Commit deterministic research assets to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              site/data/phase2/sources/mala_hydrologic_context/ana_cuenca_mala_137552.geojson \
              site/data/phase2/sources/mala_hydrologic_context/source_inventory.json \
              site/data/phase2/geometries/lima_sur_mala_mala_basin_context.geojson \
              site/data/phase2/geometries/lima_sur_mala_geometry_validation.json \
              site/data/validation/phase2_zone_contracts/lima_sur_mala.json \
              site/data/phase2/catalog.json \
              site/data/map_layers.json
            git commit -m "Phase2: freeze Mala official basin research layer"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Emit audit manifest
        run: |
          mkdir -p artifacts
          python scripts/finalize_mala_official_basin.py --check-only > artifacts/lima_sur_mala_geometry_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-mala-official-basin-bootstrap
          path: artifacts/
          if-no-files-found: error
