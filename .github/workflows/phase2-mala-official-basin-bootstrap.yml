name: IRFEN - Phase2 Mala official basin geometry

on:
  pull_request:
    paths:
      - scripts/finalize_mala_official_basin.py
      - scripts/validate_phase2_spatial_observation_contracts.py
      - tests/test_phase2_mala_geometry.py
      - tests/test_phase2_spatial_observation_contracts.py
      - tests/test_map_layer_catalog.py
      - site/data/phase2/sources/mala_hydrologic_context/**
      - site/data/phase2/geometries/lima_sur_mala_*.geojson
      - site/data/phase2/geometries/lima_sur_mala_geometry_validation.json
      - site/data/validation/phase2_zone_contracts/lima_sur_mala.json
      - site/data/phase2/catalog.json
      - site/data/phase2/spatial_observation_contracts_v0_1.json
      - site/data/phase2/climate_conditioned_activation_matrix_v0_1.json
      - site/data/map_layers.json
      - .github/workflows/phase2-mala-official-basin-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-official-mala-basin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Synchronize bounded deterministic fixtures for new Mala geometry presence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_phase2_spatial_observation_contracts.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('summary["non_catchment_geometry_only_count"], 8)', 'summary["non_catchment_geometry_only_count"], 9)')
          s=s.replace('summary["blocked_missing_geometry_count"], 8)', 'summary["blocked_missing_geometry_count"], 7)')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_map_layer_catalog.py')
          s=p.read_text(encoding='utf-8')
          marker='            "lima_sur_canete",\n'
          addition='            "lima_sur_mala",\n'
          if addition not in s:
              if marker not in s:
                  raise SystemExit('FAIL_CLOSED: map eligible set anchor missing')
              s=s.replace(marker, marker+addition, 1)
          p.write_text(s,encoding='utf-8')
          PY
          python scripts/build_phase2_climate_matrix.py
      - name: Validate Phase-2 contracts, matrices, spatial contracts, map catalog and Mala guards
        run: |
          python scripts/finalize_mala_official_basin.py --check-only
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python scripts/validate_phase2_spatial_observation_contracts.py
          python scripts/validate_phase2_climate_matrix.py
          python -m unittest \
            tests.test_phase2_mala_geometry \
            tests.test_phase2_spatial_observation_contracts \
            tests.test_phase2_climate_matrix \
            tests.test_map_layer_catalog -v
          git diff --check
      - name: Commit deterministic cross-cutting updates to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              tests/test_phase2_spatial_observation_contracts.py \
              tests/test_map_layer_catalog.py \
              site/data/phase2/climate_conditioned_activation_matrix_v0_1.json
            git commit -m "Phase2: synchronize Mala research geometry fixtures"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Emit audit manifest
        run: |
          mkdir -p artifacts
          python scripts/finalize_mala_official_basin.py --check-only > artifacts/lima_sur_mala_geometry_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-mala-official-basin-geometry
          path: artifacts/
          if-no-files-found: error
