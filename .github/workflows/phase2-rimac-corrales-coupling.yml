name: IRFEN - Phase2 Corrales static coupling

on:
  push:
    branches:
      - phase2-rimac-corrales-static-coupling
  pull_request:
    paths:
      - "config/phase2_rimac_corrales_coupling_v0_1.json"
      - "site/data/phase2/geometries/rimac_corrales_coupling_nodes_v0_1.geojson"
      - "tests/test_phase2_rimac_corrales_coupling.py"
      - ".github/workflows/phase2-rimac-corrales-coupling.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run bounded Corrales coupling tests
        run: python -m unittest discover -s tests -p 'test_phase2_rimac_corrales_coupling.py' -v
