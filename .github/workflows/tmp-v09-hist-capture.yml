name: TMP historical flood validation sources (PECHP, EMSR199, IMERG Final daily; round 2 — missing months and absent days, one bounded retry)
on:
  push:
    branches: [research/v09-piura-2017-flood-validation-20261031]
    paths: [.github/workflows/tmp-v09-hist-capture.yml]
permissions:
  contents: write
concurrency: {group: tmp-v09-hist, cancel-in-progress: false}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt && pip install -q pypdf==6.19.0 && sudo apt-get install -y -q poppler-utils >/dev/null
      - name: PECHP monthly hydrometeorological reports (gob.pe; robots respected)
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/v09_hist_sources_capture.py --stage pechp
      - name: Text layers of the PDFs (two independent extractors, no interpretation)
        if: always()
        continue-on-error: true
        run: |
          d=data/v09/sources/historical_floods/pechp
          for f in $d/*.pdf; do [ -f "$f" ] || continue
            pdftotext -layout "$f" "${f%.pdf}.pdftotext_layout.txt"
            python -c "import sys,pypdf;r=pypdf.PdfReader(sys.argv[1]);open(sys.argv[2],'w').write('\n\f'.join((p.extract_text() or '') for p in r.pages))" "$f" "${f%.pdf}.pypdf.txt"
            echo "::notice title=pdf::$(basename $f) pages=$(pdfinfo "$f" | awk '/Pages/{print $2}') chars=$(wc -c < "${f%.pdf}.pdftotext_layout.txt")"
          done
      - name: Copernicus EMS EMSR199 metadata and vector packages
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/v09_hist_sources_capture.py --stage emsr
      - name: IMERG Final V07 daily (antecedent + episode + control seasons)
        timeout-minutes: 45
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: >
          python scripts/v09_imerg_final_daily_capture.py --budget-s 2400
          --period 2016-12-01:2017-04-30 --period 2017-12-01:2018-04-30 --period 2015-12-01:2016-04-30
      - name: Commit whatever was captured
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/sources/historical_floods data/v09/research/historical || true
          git diff --cached --quiet && { echo "::warning::nothing captured"; exit 0; }
          echo "::notice title=captured::$(git diff --cached --stat | tail -1)"
          git commit -q -m "Research snapshot: PECHP reports, EMSR199 products and IMERG Final daily for the Piura 2017 flood validation"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
