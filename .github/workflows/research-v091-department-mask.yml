name: "IRFEN research · auditoría de la máscara departamental IGN para SILVIA (RESEARCH_ONLY)"
on:
  push:
    branches: [research/v091-scientific-audit-20261109]
    paths: [.github/workflows/research-v091-department-mask.yml, scripts/v091_audit_department_mask.py]
permissions:
  contents: write
jobs:
  mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pyshp "shapely>=2,<3"
      - name: Descargar (una vez) y auditar; no se versiona el shapefile
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/dep.zip" "https://www.datosabiertos.gob.pe/sites/default/files/DEPARTAMENTOS_LIMITES.zip"
          python scripts/v091_audit_department_mask.py "$RUNNER_TEMP/dep.zip" data/v09/research/audit/department_mask_ign_audit_v0_1.json
      - name: Guardar solo el informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v09/research/audit/department_mask_ign_audit_v0_1.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Research: audit report of the IGN department mask candidate (run $GITHUB_RUN_ID)"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
