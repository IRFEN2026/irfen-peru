name: IRFEN - Construir cuenca Huaycoloro v0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build_huaycoloro_dem.py
      - .github/workflows/build-huaycoloro-v08.yml

permissions:
  contents: write

concurrency:
  group: huaycoloro-v08
  cancel-in-progress: false

jobs:
  build-watershed:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias cientificas
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" requests rasterio pysheds shapely pyproj

      - name: Construir subcuenca candidata Huaycoloro
        run: python scripts/build_huaycoloro_dem.py

      - name: Validar archivos y resultado
        shell: bash
        run: |
          test -s site/data/watersheds/huaycoloro_watershed.geojson
          test -s site/data/watersheds/huaycoloro_validation.json
          test -s site/data/watersheds/huaycoloro_validation_context.json
          python -m json.tool site/data/watersheds/huaycoloro_validation.json >/dev/null
          cat site/data/watersheds/huaycoloro_validation.json

      - name: Guardar resultados en repositorio
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/watersheds/huaycoloro_watershed.geojson
          git add site/data/watersheds/huaycoloro_validation.json
          git add site/data/watersheds/huaycoloro_validation_context.json
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "IRFEN v0.8: subcuenca Huaycoloro con Copernicus DEM"
          git pull --rebase origin main
          git push origin HEAD:main
