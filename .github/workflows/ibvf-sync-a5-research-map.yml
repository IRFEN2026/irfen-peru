name: IBVF - Sync A5 to research map

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'scripts/ibvf_sync_a5_to_research_map.py'
      - '.github/workflows/ibvf-sync-a5-research-map.yml'
  workflow_dispatch:

concurrency:
  group: ibvf-sync-a5-research-map
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/independent-basin-validation-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile synchronizer
        run: python -m py_compile scripts/ibvf_sync_a5_to_research_map.py
      - name: Synchronize frozen A5 status
        run: python scripts/ibvf_sync_a5_to_research_map.py
      - name: Guard map remains non-operational and blinded
        run: |
          python - <<'PY'
          import json
          p='site/data/validation/independent_basin_validation_map.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          c=[x for x in d['cases'] if x.get('case_id')=='cashahuacra_2015-03-23'][0]
          assert c['framework_stage']=='A5_BLIND_FEATURE_VECTOR_FROZEN_NO_UNBLIND_SERIOUS_MODELING_BLOCKED'
          assert c['a5_status']=='PASS_A5_BLIND_FEATURE_VECTOR_HASHED_WITH_EXPLICIT_MISSING_NO_UNBLIND_NO_MODELING'
          assert c['case_control_role']=='UNASSIGNED_BLIND'
          assert c['activation_inference_allowed'] is False and c['modeling_allowed'] is False
          print({'stage':c['framework_stage'],'a5':c['a5_status'],'modeling_gate':d['serious_modeling_gate']})
          PY
      - name: Commit map mirror on research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/independent-basin-validation-map
          git add site/data/validation/independent_basin_validation_map.json
          if git diff --cached --quiet; then
            echo 'No map mirror change.'
          else
            git commit -m 'IBVF: mirror frozen Cashahuacra A5 status to research map'
            git push origin HEAD:agent/independent-basin-validation-map
          fi
