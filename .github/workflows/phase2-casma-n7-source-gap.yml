name: IRFEN - Phase2 Casma N7 geometry source gap

on:
  pull_request:
    paths:
      - config/phase2_casma_n7_geometry_source_gap_v0_1.json
      - config/phase2_casma_minam_n7_recovery_contract_v0_1.json
      - scripts/recover_phase2_casma_minam_n7.py
      - site/data/phase2/source_assessments/casma_minam_recovery_gate_adjudication_v0_1.json
      - site/data/validation/phase2_discovery_packages/ancash_casma_sechin_yautan.json
      - tests/test_phase2_casma_n7_geometry_source_gap.py
      - tests/test_phase2_casma_minam_all_nine_live_qa.py
      - tests/test_phase2_casma_minam_live_recovery_gate.py
      - tests/test_phase2_casma_minam_no_ci_area_exception.py
      - tests/test_recover_phase2_casma_minam_n7.py
      - tests/test_phase2_casma_minam_n7_capture_mechanism.py
      - tests/test_phase2_casma_gate_b_documentary_review.py
      - site/data/phase2/source_assessments/casma_gate_b_documentary_evidence_review_v0_1.json
      - data/phase2/source_archive/casma_minam_n7/**
      - site/data/phase2/geometries/ancash_casma_n7_minam_official_v0_1.geojson
      - site/data/phase2/source_assessments/casma_minam_n7_recovery_manifest_v0_1.json
      - .github/workflows/phase2-casma-n7-source-gap.yml
  workflow_dispatch:

# Write access is used only by the one-shot bootstrap step below, which commits
# the Gate A capture to the pull-request head branch. Nothing is pushed to main
# and nothing is merged.
permissions:
  contents: write

concurrency:
  group: phase2-casma-n7-source-gap-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  CASMA_ARCHIVE: data/phase2/source_archive/casma_minam_n7
  CASMA_GEOMETRY: site/data/phase2/geometries/ancash_casma_n7_minam_official_v0_1.geojson
  CASMA_MANIFEST: site/data/phase2/source_assessments/casma_minam_n7_recovery_manifest_v0_1.json

jobs:
  validate-fail-closed-source-gap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate Casma N7 public geometry source gap
        run: python -m pytest -q tests/test_phase2_casma_n7_geometry_source_gap.py
      - name: Validate Casma Gate A/B separation and capture mechanism
        run: |
          python -m pytest -q \
            tests/test_phase2_casma_minam_no_ci_area_exception.py \
            tests/test_recover_phase2_casma_minam_n7.py \
            tests/test_phase2_casma_minam_n7_capture_mechanism.py \
            tests/test_phase2_casma_gate_b_documentary_review.py
      - name: Bootstrap Gate A capture once, or replay the frozen capture offline
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$CASMA_MANIFEST" ]]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            python scripts/recover_phase2_casma_minam_n7.py --refresh
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            python scripts/recover_phase2_casma_minam_n7.py
          fi
      - name: Verify raw bytes independently of the Python replay
        shell: bash
        run: |
          set -euo pipefail
          (cd "$CASMA_ARCHIVE" && sha256sum --strict -c SHA256SUMS)
      - name: Verify offline replay does not mutate frozen bytes
        if: steps.mode.outputs.bootstrap == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover_phase2_casma_minam_n7.py
          git diff --exit-code -- "$CASMA_ARCHIVE" "$CASMA_GEOMETRY" "$CASMA_MANIFEST"
      - name: Commit the one-shot Gate A capture to the pull-request branch
        if: steps.mode.outputs.bootstrap == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$HEAD_REF" || "$HEAD_REF" == "main" || "$HEAD_REF" == "$DEFAULT_BRANCH" ]]; then
            echo "REFUSING_TO_PUSH_TO_DEFAULT_BRANCH head_ref=$HEAD_REF" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASMA_ARCHIVE" "$CASMA_GEOMETRY" "$CASMA_MANIFEST"
          if git diff --cached --quiet; then
            echo "No Gate A capture changes to persist"
          else
            git commit -m "Phase2 Casma: freeze Gate A MINAM N7 raw capture (Gate B unchanged)"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
      - name: Upload Gate A source capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: casma-n7-gate-a-source-capture-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            data/phase2/source_archive/casma_minam_n7/**
            site/data/phase2/geometries/ancash_casma_n7_minam_official_v0_1.geojson
            site/data/phase2/source_assessments/casma_minam_n7_recovery_manifest_v0_1.json
      - name: Re-run universal local activation hierarchy gate
        run: python scripts/validate_phase2_local_activation_hierarchy.py
