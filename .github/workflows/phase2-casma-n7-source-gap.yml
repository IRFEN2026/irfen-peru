name: IRFEN - Phase2 Casma N7 geometry source gap

on:
  pull_request:
    paths:
      - config/phase2_casma_n7_geometry_source_gap_v0_1.json
      - config/phase2_casma_minam_n7_recovery_contract_v0_1.json
      - scripts/recover_phase2_casma_minam_n7.py
      - site/data/phase2/source_assessments/casma_minam_recovery_gate_adjudication_v0_1.json
      - site/data/validation/phase2_discovery_packages/ancash_casma_sechin_yautan.json
      - tests/test_phase2_casma_n7_geometry_source_gap.py
      - tests/test_phase2_casma_minam_all_nine_live_qa.py
      - tests/test_phase2_casma_minam_live_recovery_gate.py
      - tests/test_phase2_casma_minam_no_ci_area_exception.py
      - tests/test_recover_phase2_casma_minam_n7.py
      - .github/workflows/phase2-casma-n7-source-gap.yml

permissions:
  contents: read

jobs:
  validate-fail-closed-source-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate Casma N7 public geometry source gap
        run: python -m pytest -q tests/test_phase2_casma_n7_geometry_source_gap.py
      - name: Validate Casma Gate A/B separation
        run: |
          python -m pytest -q \
            tests/test_phase2_casma_minam_no_ci_area_exception.py \
            tests/test_recover_phase2_casma_minam_n7.py
      - name: Capture current institutional Casma N7 source bytes
        run: python scripts/recover_phase2_casma_minam_n7.py --refresh
      - name: Verify immutable Gate A capture
        run: python scripts/recover_phase2_casma_minam_n7.py
      - name: Upload Gate A source capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: casma-n7-gate-a-source-capture-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/phase2/source_archive/casma_minam_n7/**
            site/data/phase2/geometries/ancash_casma_n7_minam_official_v0_1.geojson
            site/data/phase2/source_assessments/casma_minam_n7_recovery_manifest_v0_1.json
      - name: Re-run universal local activation hierarchy gate
        run: python scripts/validate_phase2_local_activation_hierarchy.py
