name: IRFEN - Evaluar regla de prueba San Ildefonso v0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build_san_ildefonso_test_rule.py
      - site/data/calibration/san_ildefonso_imerg_halfhour_events.json
      - .github/workflows/san-ildefonso-test-rule.yml

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Construir regla histórica TEST_ONLY
        run: python scripts/build_san_ildefonso_test_rule.py

      - name: Validar puerta científica
        run: |
          test -s site/data/calibration/san_ildefonso_test_rule.json
          python -m json.tool site/data/calibration/san_ildefonso_test_rule.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/data/calibration/san_ildefonso_test_rule.json').read_text())
          assert p.get('production_use') is False
          assert p.get('production_ready') is False
          rule=p.get('candidate_test_rule') or {}
          assert rule.get('mode') == 'TEST_ONLY'
          assert rule.get('operational_alert') is False
          assert rule.get('thresholds_modified_in_production') is False
          assert (p.get('decision_gate') or {}).get('can_use_for_production') is False
          print('Regla San Ildefonso confinada correctamente a TEST_ONLY')
          PY

      - name: Guardar evaluación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/calibration/san_ildefonso_test_rule.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "IRFEN v0.8: actualizar regla de prueba San Ildefonso"
          git pull --rebase origin main
          git push origin HEAD:main
