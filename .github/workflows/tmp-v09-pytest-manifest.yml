name: TMP v0.9 regenerate pytest collection manifest (removed next commit)
on:
  push:
    branches: [inventory/national-identity-query-v0-1]
    paths: [.github/workflows/tmp-v09-pytest-manifest.yml]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-24.04
    env:
      IRFEN_REQUIRE_JSONSCHEMA: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-ci-test.txt
      - name: Read-only - field-level diff of Pages map_layers.json / phase2 catalog vs committed main
        shell: bash
        run: |
          set +e
          git fetch -q origin main
          cat > /tmp/jd.py <<'PY'
          import json, sys, collections
          a, b = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          out = []
          def walk(x, y, p):
              if type(x) != type(y): out.append((p, "type")); return
              if isinstance(x, dict):
                  for k in set(x) | set(y):
                      if k not in x or k not in y: out.append((f"{p}.{k}", "added/removed"))
                      else: walk(x[k], y[k], f"{p}.{k}")
              elif isinstance(x, list):
                  if len(x) != len(y): out.append((p, f"len {len(x)}->{len(y)}"))
                  for i, (u, v) in enumerate(zip(x, y)): walk(u, v, f"{p}[]")
              elif x != y: out.append((p, f"{json.dumps(x)[:60]} -> {json.dumps(y)[:60]}"))
          walk(a, b, "$")
          c = collections.Counter(p for p, _ in out)
          print(f"{len(out)} differences; by path: " + " ; ".join(f"{k} x{n}" for k, n in c.most_common(12)))
          print("examples: " + " ; ".join(f"{p}: {d}" for p, d in out[:4]))
          PY
          for f in map_layers.json phase2/catalog.json; do
            curl -fsSL --max-time 40 --retry 3 "https://irfen2026.github.io/irfen-peru/data/$f?chk=${{ github.run_id }}" -o /tmp/pub.json
            git show origin/main:site/data/$f > /tmp/main.json
            python /tmp/jd.py /tmp/main.json /tmp/pub.json | while IFS= read -r l; do echo "::warning title=pages diff $f::$(echo "$l" | sed 's/%/%25/g' | cut -c1-1500)"; done
          done
      - run: python scripts/verify_phase2_test_collection.py --write-manifest
      - run: python -m pytest tests/test_phase2_national_inventory_query.py tests/test_phase2_national_inventory_completeness_audit.py -q -rs --junitxml=j.xml || { python scripts/report_pytest_junit_annotations.py j.xml; exit 1; }
      - name: Commit the regenerated manifest (real collection on the pinned runner)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/phase2_test_collection_manifest.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Regenerate pytest collection manifest on the pinned runner (#389 national inventory query over main with #391)"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
