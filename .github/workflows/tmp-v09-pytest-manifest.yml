name: TMP v0.9 regenerate pytest collection manifest (removed next commit)
on:
  push:
    branches: [inventory/completeness-reconciliation-v0-1-20261026]
    paths: [.github/workflows/tmp-v09-pytest-manifest.yml]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-24.04
    env:
      IRFEN_REQUIRE_JSONSCHEMA: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-ci-test.txt
      - run: python scripts/verify_phase2_test_collection.py --write-manifest
      - run: python -m pytest tests/test_phase2_inventory_completeness_reconcile.py tests/test_phase2_national_inventory_completeness_audit.py tests/test_phase2_national_inventory_query.py -q -rs --junitxml=j.xml || { python scripts/report_pytest_junit_annotations.py j.xml; exit 1; }
      - name: Commit the regenerated manifest (real collection on the pinned runner)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/phase2_test_collection_manifest.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Regenerate pytest collection manifest on the pinned runner (QA #6428929895 fail-closed evidence tests)"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
