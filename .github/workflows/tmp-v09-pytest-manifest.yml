name: TMP v0.9 regenerate pytest collection manifest (removed next commit)
on:
  push:
    branches: [ui/map-panels-v0-1]
    paths: [.github/workflows/tmp-v09-pytest-manifest.yml]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-24.04
    env:
      IRFEN_REQUIRE_JSONSCHEMA: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-ci-test.txt
      - name: Read-only - Pages published artefacts vs committed main (no effect on the manifest)
        shell: bash
        run: |
          set +e
          git fetch -q origin main
          for f in phase2/geometries/lambayeque_chongoyape_oyotun_official_critical_reaches_review_only.geojson map_layers.json phase2/geometries/lambayeque_hydrologic_migration_validation.json phase2/catalog.json; do
            curl -fsSL --max-time 40 --retry 3 "https://irfen2026.github.io/irfen-peru/data/$f?chk=${{ github.run_id }}" -o /tmp/pub 2>/dev/null; rc=$?
            pub=$([ $rc = 0 ] && sha256sum /tmp/pub | cut -c1-64 || echo FETCH_FAILED_$rc); repo=$(git show origin/main:site/data/$f | sha256sum | cut -c1-64)
            echo "::warning title=pages vs main::$([ "$pub" = "$repo" ] && echo MATCH || echo DIFFER) $f published=$pub main=$repo"
          done
          rm -f /tmp/pub; git checkout -q -- . 2>/dev/null
      - run: python scripts/verify_phase2_test_collection.py --write-manifest
      - run: python -m pytest tests/test_v08_map_panels.py tests/test_v08_weather_layers.py tests/test_v08_recent_advances.py tests/test_v09_demo_summary.py tests/test_lambayeque_check_only_integrity.py -q -rs --junitxml=j.xml || { python scripts/report_pytest_junit_annotations.py j.xml; exit 1; }
      - name: Commit the regenerated manifest (real collection on the pinned runner)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/phase2_test_collection_manifest.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Regenerate pytest collection manifest on the pinned runner (#387 map UX over main with #391)"
          for i in 1 2 3; do git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
