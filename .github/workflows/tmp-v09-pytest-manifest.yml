name: TMP v0.9 regenerate pytest collection manifest (removed next commit)
on:
  push:
    branches: [v09/senamhi-avisos-capture-v0-1]
    paths: [.github/workflows/tmp-v09-pytest-manifest.yml]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    env:
      IRFEN_REQUIRE_JSONSCHEMA: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-ci-test.txt
      - run: python scripts/verify_phase2_test_collection.py --write-manifest
      - run: python -m pytest tests/test_v09_senamhi_avisos.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: config/phase2_test_collection_manifest.json
