name: IRFEN - Normalizar Malanche RESEARCH_ONLY

on:
  push:
    branches:
      - agent/malanche-2023-validation-closeout-v0.1

permissions:
  contents: write

concurrency:
  group: malanche-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar rama
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Alinear inventario oficial de Malanche
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/phase2_candidate_inventory_v0_2.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          matches=[c for c in d.get('candidates',[]) if c.get('candidate_id')=='lima_sur_malanche']
          assert len(matches)==1
          c=matches[0]
          sources=list(c.get('official_sources') or [])
          if 'SENAMHI-MALANCHE-2024' not in sources:
              sources.append('SENAMHI-MALANCHE-2024')
          c['official_sources']=sources
          assert set(c['official_sources'])=={'INGEMMET-A7743','SENAMHI-MALANCHE-2024'}
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY

      - name: Regenerar catálogos canónicos
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_phase2_catalog.py
          python scripts/build_map_layer_catalog.py

      - name: Verificar consistencia focalizada
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_phase2_catalog.py --check-only
          python scripts/build_map_layer_catalog.py --check-only
          python -m unittest discover -s tests -p 'test_phase2_onboarding.py' -v
          python -m unittest discover -s tests -p 'test_map_layer_catalog.py' -v
          python - <<'PY'
          import json
          c=json.load(open('site/data/validation/phase2_zone_contracts/lima_sur_malanche.json',encoding='utf-8'))
          assert c['contract_status']=='DRAFT'
          assert c['deployment_status']=='RESEARCH_ONLY'
          assert c['production_use'] is False
          assert c['alerting_enabled'] is False
          assert c['decision_thresholds'] is None
          assert c['validation']['activation_gate']=='BLOCKED'
          assert c['assets']['geometry']['status']=='PARTIAL'
          assert c['assets']['geometry']['path'] is None
          assert c['assets']['historical_events']['status']=='PARTIAL'
          case=json.load(open('site/data/validation/phase2_case_validations/lima_sur_malanche_2023.json',encoding='utf-8'))
          assert case['case_status']=='CLOSED_RESEARCH_VALIDATION_CASE'
          assert case['test_only'] is True
          assert case['production_use'] is False
          assert case['production_ready'] is False
          assert case['operational_alerting_enabled'] is False
          assert case['activation_gate']=='BLOCKED'
          assert case['event_reference']['observed_discharge_m3s'] is None
          assert case['event_reference']['discharge_evidence_class']=='MODELLED_EVENT_RECONSTRUCTION_NOT_OBSERVED_GAUGE'
          assert case['rainfall_reference']['threshold_policy']=='REFERENCE_ONLY_NO_OPERATIONAL_THRESHOLD_TRANSFER'
          PY

      - name: Confirmar cambios y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-malanche-normalize.yml
          git config user.name "IRFEN research automation"
          git config user.email "actions@users.noreply.github.com"
          git add config/phase2_candidate_inventory_v0_2.json site/data/phase2/catalog.json site/data/map_layers.json .github/workflows/tmp-malanche-normalize.yml
          if git diff --cached --quiet; then
            echo "No hay cambios por confirmar"
            exit 0
          fi
          git commit -m "Normalize Malanche research inputs and canonical catalogs"
          git push origin HEAD:${{ github.ref_name }}
