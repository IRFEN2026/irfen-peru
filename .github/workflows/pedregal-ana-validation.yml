name: IRFEN - Validar Pedregal ANA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/validate_pedregal_ana_control.py
      - site/data/watersheds/chosica_local_candidate_sets.geojson
      - .github/workflows/pedregal-ana-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyproj
      - run: python scripts/validate_pedregal_ana_control.py
      - run: |
          test -s site/data/calibration/pedregal_ana_validation.json
          python -m json.tool site/data/calibration/pedregal_ana_validation.json >/dev/null
      - name: Guardar validación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/calibration/pedregal_ana_validation.json
          git diff --cached --quiet || git commit -m "IRFEN v0.8: update Pedregal ANA validation"
          git pull --rebase origin main
          git push
