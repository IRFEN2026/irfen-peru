name: IRFEN - Phase2 Chao Huamanzaña official child geometry freeze

on:
  pull_request:
    paths:
      - site/data/validation/phase2_discovery_contracts/lalibertad_chao_huamanzaña_chorobal.json
      - site/data/validation/phase2_discovery_packages/lalibertad_chao_huamanzaña_chorobal.json
      - site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_huamanzana_137712.geojson
      - site/data/phase2/geometries/lalibertad_huamanzaña_basin_context.geojson
      - site/data/phase2/geometries/lalibertad_huamanzaña_basin_context_validation.json
      - scripts/probe_phase2_chao_huamanzana_official_geometry.py
      - scripts/verify_phase2_chao_huamanzana_official_geometry.py
      - tests/test_phase2_chao_huamanzana_geometry.py
      - site/data/map_layers.json
      - .github/workflows/phase2-chao-huamanzana-official-geometry-freeze.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-or-verify-huamanazana-child:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bootstrap exact ANA Huamanzaña geometry only when source is absent
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_huamanzana_137712.geojson
          if [[ ! -f "$SOURCE" ]]; then
            python scripts/probe_phase2_chao_huamanzana_official_geometry.py --refresh-source
            python scripts/build_map_layer_catalog.py
          fi
      - name: Replay frozen child geometry fail-closed
        run: python scripts/verify_phase2_chao_huamanzana_official_geometry.py
      - name: Enforce Chao child scientific guards
        run: python -m pytest -q tests/test_phase2_chao_huamanzana_geometry.py
      - name: Verify research map catalog
        run: python scripts/build_map_layer_catalog.py --check-only
      - name: Persist first successful exact-source freeze to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/validation/phase2_discovery_contracts/lalibertad_chao_huamanzaña_chorobal.json \
            site/data/validation/phase2_discovery_packages/lalibertad_chao_huamanzaña_chorobal.json \
            site/data/phase2/sources/north_coast_discovery_geometry/ana_lalibertad_huamanzana_137712.geojson \
            site/data/phase2/geometries/lalibertad_huamanzaña_basin_context.geojson \
            site/data/phase2/geometries/lalibertad_huamanzaña_basin_context_validation.json \
            site/data/map_layers.json
          git commit -m "Phase2: freeze exact ANA Huamanzaña child context"
          git push origin HEAD:${{ github.head_ref }}
