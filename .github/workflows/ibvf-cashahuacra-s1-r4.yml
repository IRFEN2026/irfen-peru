name: IBVF Cashahuacra Sentinel-1 R4 blind change metrics

on:
  push:
    branches:
      - agent/independent-basin-validation-map
    paths:
      - 'scripts/ibvf_sentinel1_r4_change.py'
      - 'site/data/validation/cashahuacra_sentinel1_r4_contract.json'
      - '.github/workflows/ibvf-cashahuacra-s1-r4.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  execute-r4-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded R4 dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<2' 'rasterio>=1.3,<2'
          python -m py_compile scripts/ibvf_sentinel1_r4_change.py

      - name: Verify preregistration and locate exact R3 artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          c=json.load(open('site/data/validation/cashahuacra_sentinel1_r4_contract.json',encoding='utf-8'))
          r3=json.load(open('site/data/validation/cashahuacra_sentinel1_r3.json',encoding='utf-8'))
          for d in (c,r3):
              assert d['deployment_status']=='RESEARCH_ONLY'
              assert d['production_use'] is False and d['production_ready'] is False
              assert d['operational_alerting_enabled'] is False
              assert d['uses_operational_event_none_labels'] is False
              assert d['territorial_activation_evidence_blinded'] is True
              assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert c['execution_status']=='PREREGISTERED_NOT_EXECUTED_NO_RADIOMETRIC_DIFFERENCE_READ'
          assert c['activation_inference_allowed'] is False
          assert r3['status']=='PASS_R3_COMMON_SUPPORT_R4_ALLOWED_BY_SPATIAL_SUPPORT_ONLY'
          assert r3['common_support_gate_pass'] is True and r3['common_support_fraction']>=0.95
          assert r3['radiometric_difference_statistics_computed'] is False
          assert r3['r4_difference_computed'] is False and r3['activation_inference_allowed'] is False
          print('R4 preregistration integrity: PASS')
          PY
          ARCHIVE_COMMIT=$(git log -1 --format=%H -- site/data/validation/cashahuacra_sentinel1_r3.json)
          TRIGGER_SHA=$(git rev-parse "${ARCHIVE_COMMIT}^")
          ARTIFACT_NAME="cashahuacra-sentinel1-r2-r3-${TRIGGER_SHA}"
          export ARTIFACT_NAME TRIGGER_SHA
          echo "R3 archive commit: ${ARCHIVE_COMMIT}"
          echo "Expected source artifact: ${ARTIFACT_NAME}"
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" -f name="${ARTIFACT_NAME}" -f per_page=100 > /tmp/artifacts.json
          python - <<'PY' > /tmp/source.env
          import json,os
          name=os.environ['ARTIFACT_NAME']
          d=json.load(open('/tmp/artifacts.json'))
          a=[x for x in d.get('artifacts',[]) if x.get('name')==name and not x.get('expired')]
          if len(a)!=1:
              raise SystemExit(f'expected exactly one non-expired artifact {name}, got {len(a)}')
          x=a[0]
          run=x.get('workflow_run') or {}
          if not run.get('id'):
              raise SystemExit('source artifact has no workflow_run id')
          if run.get('head_sha') and run.get('head_sha') != os.environ['TRIGGER_SHA']:
              raise SystemExit(f'artifact head SHA mismatch: {run.get("head_sha")} != {os.environ["TRIGGER_SHA"]}')
          print('artifact_id='+str(x['id']))
          print('run_id='+str(run['id']))
          print('artifact_name='+name)
          print('trigger_sha='+os.environ['TRIGGER_SHA'])
          PY
          cat /tmp/source.env
          while IFS='=' read -r k v; do echo "$k=$v" >> "$GITHUB_OUTPUT"; done < /tmp/source.env

      - name: Download exact frozen R3 bounded evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: /tmp/ibvf-r4-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Resolve frozen crop paths and execute preregistered R4
        run: |
          set -euo pipefail
          PRE=$(find /tmp/ibvf-r4-source -type f -name 'cashahuacra_pre_r2_basin_crop.tif' -print -quit)
          POST=$(find /tmp/ibvf-r4-source -type f -name 'cashahuacra_post_r2_basin_crop.tif' -print -quit)
          MASK=$(find /tmp/ibvf-r4-source -type f -name 'cashahuacra_r3_common_support_mask.tif' -print -quit)
          test -n "$PRE" && test -n "$POST" && test -n "$MASK"
          mkdir -p /tmp/ibvf-r4
          python scripts/ibvf_sentinel1_r4_change.py \
            --contract site/data/validation/cashahuacra_sentinel1_r4_contract.json \
            --r3-report site/data/validation/cashahuacra_sentinel1_r3.json \
            --pre "$PRE" \
            --post "$POST" \
            --common-mask "$MASK" \
            --delta-output /tmp/ibvf-r4/cashahuacra_delta_gamma0_db.tif \
            --factor2-mask-output /tmp/ibvf-r4/cashahuacra_factor2_change_mask.tif \
            --report-output /tmp/ibvf-r4/cashahuacra_sentinel1_r4.json \
            | tee /tmp/ibvf-r4/r4-summary.log

      - name: Validate blind R4 output fail-closed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ibvf-r4/cashahuacra_sentinel1_r4.json',encoding='utf-8'))
          assert d['status']=='PASS_R4_BLIND_SAR_FEATURE_VECTOR_FROZEN_NO_INFERENCE'
          assert d['deployment_status']=='RESEARCH_ONLY' and d['test_only'] is True
          assert d['production_use'] is False and d['production_ready'] is False
          assert d['operational_alerting_enabled'] is False and d['uses_operational_event_none_labels'] is False
          assert d['territorial_activation_evidence_blinded'] is True
          assert d['serious_modeling_gate']=='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          assert d['r4_difference_computed'] is True
          assert d['r4_is_observational_not_decisional'] is True
          assert d['r4_feature_magnitude_pass_fail_threshold'] is None
          assert d['case_control_role_assigned'] is False
          assert d['territorial_outcome_fields_read'] is False
          assert d['activation_inference_allowed'] is False
          assert d['risk_classification_computed'] is False and d['alert_value_computed'] is False
          expected={'MEDIAN_DELTA_DB','IQR_DELTA_DB','DECREASE_FACTOR2_FRACTION','INCREASE_FACTOR2_FRACTION','LARGEST_FACTOR2_CLUSTER_FRACTION'}
          assert set(d['primary_r4_feature_vector'])==expected
          print('R4 blind-output guardrails: PASS')
          PY

      - name: Archive R4 report and synchronize research map only
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp /tmp/ibvf-r4/cashahuacra_sentinel1_r4.json site/data/validation/cashahuacra_sentinel1_r4.json
          python - <<'PY'
          import json
          from pathlib import Path
          rp=Path('site/data/validation/cashahuacra_sentinel1_r4.json')
          mp=Path('site/data/validation/independent_basin_validation_map.json')
          r4=json.loads(rp.read_text(encoding='utf-8'))
          m=json.loads(mp.read_text(encoding='utf-8'))
          assert m['production_use'] is False and m['production_ready'] is False
          assert m['operational_alerting_enabled'] is False and m['uses_operational_event_none_labels'] is False
          assert m['territorial_activation_evidence_blinded'] is True
          c=next(x for x in m['cases'] if x['case_id']=='cashahuacra_2015-03-23')
          c['framework_stage']='A4_R4_BLIND_SAR_FEATURES_FROZEN_A5_PENDING'
          c['remote_sensing_status']='S1_R2_R3_PASS_R4_BLIND_CHANGE_FEATURES_FROZEN_NO_ACTIVATION_INFERENCE'
          c['sentinel1_r4_path']='data/validation/cashahuacra_sentinel1_r4.json'
          c['sentinel1_r4_status']=r4['status']
          c['sentinel1_r4_primary_metrics']=r4['primary_r4_feature_vector']
          c['sentinel1_r4_activation_inference_allowed']=False
          m.setdefault('acquisition_contract',{})['sentinel1_r4_contract']='site/data/validation/cashahuacra_sentinel1_r4_contract.json'
          m['acquisition_contract']['sentinel1_r4_report']='site/data/validation/cashahuacra_sentinel1_r4.json'
          m['acquisition_contract']['sentinel1_r4_status']=r4['status']
          m['serious_modeling_gate']='CLOSED_MINIMUM_DATASET_NOT_REACHED'
          mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/validation/cashahuacra_sentinel1_r4.json site/data/validation/independent_basin_validation_map.json
          if ! git diff --cached --quiet; then
            git commit -m 'IBVF: archive Cashahuacra blind Sentinel-1 R4 features'
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Upload bounded R4 scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashahuacra-sentinel1-r4-${{ github.sha }}
          path: |
            /tmp/ibvf-r4/cashahuacra_sentinel1_r4.json
            /tmp/ibvf-r4/cashahuacra_delta_gamma0_db.tif
            /tmp/ibvf-r4/cashahuacra_factor2_change_mask.tif
            /tmp/ibvf-r4/r4-summary.log
          if-no-files-found: warn
          retention-days: 30
