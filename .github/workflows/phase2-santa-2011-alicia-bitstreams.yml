name: IRFEN - Phase2 Santa 2011 ALICIA bitstreams

on:
  pull_request:
    paths:
      - site/data/phase2/source_assessments/santa_2011_*.json
      - scripts/freeze_phase2_santa_2011_alicia_bitstreams.py
      - tests/test_phase2_santa_2011_*.py
      - .github/workflows/phase2-santa-2011-alicia-bitstreams.yml
  push:
    branches:
      - phase2/santa-2011-alicia-integration-v0-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Santa 2011 contract tests (stdlib unittest)
        run: python -m unittest discover -s tests -p 'test_phase2_santa_2011_*.py' -v

  freeze-official-source-bytes:
    # Network to ANA may be unavailable; that yields SOURCE_ACCESS_UNAVAILABLE,
    # never a negative.  A size/MD5 mismatch fails the job (fail-closed).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Freeze ANA ALICIA bitstreams (ORIGINAL PDF + extracted text)
        run: python scripts/freeze_phase2_santa_2011_alicia_bitstreams.py --out santa_2011_alicia_freeze_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: santa-2011-alicia-freeze-receipt
          path: santa_2011_alicia_freeze_receipt.json
          if-no-files-found: warn
