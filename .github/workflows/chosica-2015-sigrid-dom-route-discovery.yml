name: IRFEN - Chosica 2015 SIGRID DOM route discovery

on:
  pull_request:
    paths:
      - config/chosica_2015_portal_endpoint_discovery_contract_v0_2.json
      - scripts/discover_chosica_2015_sigrid_dom_routes.py
      - .github/workflows/chosica-2015-sigrid-dom-route-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-dom-routes-without-following:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config/chosica_2015_portal_endpoint_discovery_contract_v0_2.json
            scripts/discover_chosica_2015_sigrid_dom_routes.py
            .github/workflows/chosica-2015-sigrid-dom-route-discovery.yml
      - name: Assert forbidden scientific files absent
        run: |
          set -euo pipefail
          test ! -e site/data/validation/official_outcome_evidence.json
          test ! -e config/chosica_2015_control_adjudication_contamination_registry_v0_1.json
          test ! -e config/chosica_2015_multibasin_validation_set_v0_1.json
      - name: Parse URL-bearing attributes from exact root only
        run: |
          set -euo pipefail
          mkdir -p artifacts
          env -i PATH="$PATH" HOME=/tmp LANG=C.UTF-8 python -I scripts/discover_chosica_2015_sigrid_dom_routes.py \
            --contract config/chosica_2015_portal_endpoint_discovery_contract_v0_2.json \
            --output artifacts/chosica_2015_sigrid_dom_routes_v0_2.json | tee artifacts/sigrid_dom_route_summary.json
      - name: Enforce infrastructure-only stage boundary
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/chosica_2015_sigrid_dom_routes_v0_2.json');d=json.loads(p.read_text(encoding='utf-8'))
          g={'RESEARCH_ONLY':True,'TEST_ONLY':True,'production_use':False,'production_ready':False,'operational_alerting_enabled':False}
          assert d['status']=='PASS_INFRASTRUCTURE_ONLY_SIGRID_DOM_ROUTE_DISCOVERY' and d['guards']==g
          assert d['classification']=='INFRASTRUCTURE_ONLY_NOT_TERRITORIAL_EVIDENCE'
          assert d['routes_followed'] is False and d['linked_content_read'] is False
          assert d['candidate_territorial_evidence_read'] is False and d['control_labels_assigned'] is False
          assert d['sealed_target_unblind_allowed'] is False
          assert d['routes']==sorted(d['routes'],key=lambda x:(x['attribute'],x['url']))
          assert all(x['attribute'] in ('a.href','form.action','script.src') and x['url'].startswith('https://sigrid.cenepred.gob.pe/') for x in d['routes'])
          text=p.read_text(encoding='utf-8').lower()
          for token in ('pedregal','quirio','carossio','carosio','rayos de sol','cashahuacra','la libertad','a6680','official_outcome_evidence'):
              assert token not in text,token
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chosica-2015-sigrid-dom-routes
          path: |
            artifacts/chosica_2015_sigrid_dom_routes_v0_2.json
            artifacts/sigrid_dom_route_summary.json
          if-no-files-found: error
